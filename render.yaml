# Render blueprint: the live server (Kotak live data + paper orders) for the phone.
# The EOD scan is built by the GitHub Action (.github/workflows/daily.yml) and read from SCAN_URL, so this
# server never contacts NSE (which refuses many cloud IPs). Real orders need a SEBI-whitelisted static IP,
# which Render's free tier does not give: keep PAPER=true here.
# Free tier: sleeps after 15 min without visits (first open ~50 s); its disk is wiped on every restart. The paper
# ledger is mirrored to the repo's paper-state branch (LEDGER_GITHUB_TOKEN) and restored on start.
services:
  - type: web
    name: fo-scanner
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-server.txt
    startCommand: uvicorn server.app:app --host 0.0.0.0 --port $PORT
    buildFilter:                     # the nightly scan commit must not redeploy (and wipe the paper ledger)
      ignoredPaths:
        - docs/**
        - data/scan.json
        - data/event_patterns.json
        - data/live_snapshots/**
        - "**/*.md"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: PUBLIC_ACCESS            # true: no login (paper orders only); false: user "user" + APP_PASSWORD
        value: "false"
      - key: APP_PASSWORD             # the login password (Render dashboard; also a GitHub secret for live-snapshot.yml)
        sync: false
      - key: KOTAK_CONSUMER_KEY       # from your .env; entered in the Render dashboard, never committed
        sync: false
      - key: SCAN_URL                 # https://raw.githubusercontent.com/<you>/fo-scanner/main/data/scan.json
        sync: false
      - key: DATA_PROVIDER
        value: kotak
      - key: ORDERS
        value: "true"
      - key: BROKER
        value: none
      - key: PAPER
        value: "true"
      - key: ALLOW_LOTTERY
        value: "false"
      - key: RISK_PER_TRADE_PCT       # DECISIONS.md position limits: a long option's premium <= 6 % of capital
        value: "6"
      - key: MAX_OPEN_POSITIONS
        value: "3"
      - key: DAILY_LOSS_HALT_PCT
        value: "2"
      - key: LEDGER_GITHUB_TOKEN      # fine-grained token, this repo only, Contents read/write (Render dashboard):
        sync: false                   # the paper account is mirrored to the paper-state branch and survives restarts
      - key: LEDGER_GITHUB_REPO
        value: sherwingm/project-f-0
      - key: ANTHROPIC_API_KEY        # optional: the plain-language reading and the evidence verdict
        sync: false
