  // ---- explainable scanner: why this stock is (or is not) in the results, from the scan's own conditions and the
  //      numbers they were tested on. Nothing here is generated text: every line is a condition, a value and a rule.
  function gauge(c, x) {
    const M = METRICS[c.m]; if (M.kind !== "num" || x == null || blank(c.a)) return "";
    const abs = c.op === "absge" || c.op === "absle", val = abs ? Math.abs(x) : x;
    const pts = [val, +c.a, 0].concat(c.op === "between" && !blank(c.b) ? [+c.b] : []);
    let lo = Math.min(...pts), hi = Math.max(...pts); const pad = (hi - lo) * 0.12 || 1; lo -= pad; hi += pad;
    const at = y => (100 * (y - lo) / (hi - lo)).toFixed(1);
    const ok = testCond(c, BY[sel], view(BY[sel])).ok;
    return `<div class="gauge" aria-hidden="true"><i class="${ok ? "ok" : "no"}" style="width:${at(val)}%"></i><b style="left:${at(+c.a)}%"></b>${c.op === "between" && !blank(c.b) ? `<b style="left:${at(+c.b)}%"></b>` : ""}</div>`;
  }
  function whyHtml(s) {
    const v = view(s), e = evalScan(s, v), f = freshness(), ch = chainOf(s), blind = blindFor(s);
    const inUni = uni !== "watchlist" || pins.has(s.symbol), inSym = !symQ || s.symbol.includes(symQ) || (s.name || "").toUpperCase().includes(symQ);
    const listed = e.ok && inUni && inSym, act = e.act, pass = act.filter(r => r.ok), fail = act.filter(r => !r.ok);
    const line = r => `${METRICS[r.c.m].name} ${r.val == null ? "has no value" : "is " + METRICS[r.c.m].fmt(r.val)} (rule: ${ruleText(r.c)})`;
    let say;
    if (!act.length) say = `This scan has no active conditions, so every ${uni === "watchlist" ? "watchlist" : "F&amp;O"} stock is listed.`;
    else if (e.ok && scan.logic === "any") say = `Listed because ${pass.length} of ${act.length} conditions hold, and any one is enough: ${pass.map(r => esc(line(r))).join("; ")}.`;
    else if (e.ok) say = `Listed because ${act.length === 1 ? "its one condition holds" : `all ${act.length} conditions hold`}: ${pass.map(r => esc(line(r))).join("; ")}.`;
    else if (scan.logic === "any") say = `Not listed: none of the ${act.length} conditions holds. ${fail.map(r => esc(line(r))).join("; ")}.`;
    else say = `Not listed: ${fail.length} of ${act.length} condition${act.length === 1 ? "" : "s"} fail${fail.length === 1 ? "s" : ""}: ${fail.map(r => esc(line(r))).join("; ")}.${pass.length ? ` Passing: ${pass.map(r => esc(METRICS[r.c.m].name)).join(", ")}.` : ""}`;
    if (e.ok && !inUni) say += " It is not in your watchlist, which this view is limited to.";
    if (e.ok && !inSym) say += ` The symbol filter “${esc(symQ)}” hides it from the table.`;
    const idle = e.rs.filter(r => r.idle);
    const srcTag = M => M.live ? (v.live ? `<small>live ${esc(v.time)}</small>` : `<small>close ${esc(meta.as_of)}</small>`) : `<small>scan</small>`;
    const rows = e.rs.map(r => {
      const M = METRICS[r.c.m], res = r.idle ? `<span class="res na">not applied</span>` : r.missing ? `<span class="res na">no data</span>` : r.ok ? `<span class="res ok">✓ pass</span>` : `<span class="res no">✗ fail</span>`;
      return `<tr><td class="l" title="${esc(M.about || "")}">${esc(M.name)}${srcTag(M)}</td><td><b>${r.val == null ? "—" : esc(M.fmt(r.val))}</b>${gauge(r.c, r.val)}</td><td class="l">${esc(ruleText(r.c))}</td><td>${res}</td></tr>`;
    }).join("");
    let h = `<div class="whyhead"><span class="${listed ? "verdict-ok" : "verdict-no"}">${listed ? "✓ In the results" : e.ok ? "• Matches, but hidden" : "✗ Not in the results"}</span><span>Scan <b>${esc(scanTitle())}</b> · ${act.length > 1 ? (scan.logic === "any" ? "any condition" : "all conditions") : act.length ? "1 condition" : "no conditions"}</span></div>
      <p class="whysum">${say}${idle.length ? ` <span class="muted">${idle.length} condition${idle.length === 1 ? " has" : "s have"} no number yet and ${idle.length === 1 ? "is" : "are"} not applied.</span>` : ""}</p>`;
    if (rows) h += `<table class="ct"><thead><tr><th class="l">Condition</th><th>Value</th><th class="l">Rule</th><th>Result</th></tr></thead><tbody>${rows}</tbody></table>`;
    // the numbers behind the conditions, with their own references
    const q = v.q || {};
    h += `<h3>Supporting data</h3><div class="kvg">
      ${kvCell("Price", fmtPx(v.ltp), `${signed(v.chg)} (${pct(v.pct)}) vs prev close ${fmtPx(v.live ? q.prev_close : s.prev_close)}`, dirClass(v.pct))}
      ${kvCell("Volume", compact(v.vol), `${ratio(v.vr)} the 20-day average of ${compact(s.avg_volume_20d)}${v.live ? ", pro rata" : ""}`)}
      ${kvCell("Futures OI", compact(v.live && q.fut_oi != null ? q.fut_oi : s.fut_oi), `${pct(v.oi)} vs ${v.live ? "the last close" : "prev " + compact(s.fut_oi_prev)}`, dirClass(v.oi))}
      ${kvCell("PCR", num(v.pcr), `put OI ${compact(s.put_oi)} ÷ call OI ${compact(s.call_oi)}${v.live && q.live_pcr != null ? " (live PCR)" : ""}`)}
      ${ch ? kvCell("Max pain", fmtStrike(ch.max_pain), `expiry ${esc(ch.expiry)} · price ${pct(METRICS.mp.get(s, v))} from it`) + kvCell("OI walls", `${fmtStrike(ch.max_put_oi_strike)} / ${fmtStrike(ch.max_call_oi_strike)}`, "highest put OI (support) / call OI (resistance)") : kvCell("Strikes", "—", s.chain_problem ? esc(s.chain_problem) : "no strike table")}
    </div>`;
    const nr = nextResults(s);
    h += `<div class="actions" style="margin-top:8px">${ch ? `<button class="btn" type="button" data-oc="${esc(s.symbol)}">Open options chain</button>` : ""}<button class="btn" type="button" data-tabgo="overview">Full overview</button>${nr != null ? `<span class="count" style="align-self:center">Results in ${nr} session${nr === 1 ? "" : "s"}</span>` : ""}</div>`;
    // the scanner's own label: its rule and the reasons it printed for this stock
    h += `<h3>Scanner label</h3>` + (blind ? `<p class="count">Hidden in call mode until you make your call (header above).</p>`
      : `<p class="whyhead"><span class="pill ${LABELS[s.label] || "u"}">${esc(s.label || "Unclassified")}</span>${livePill(s)}</p><div class="why"><ul>${(s.reasons || []).map(r => "<li>" + esc(r) + "</li>").join("")}</ul></div>
        <p class="src">Label rule thresholds in this build: volume above <b>${TH.volume_above ?? 1}×</b> its <b>${TH.volume_window_days ?? 20}-day</b> average counts as heavy; PCR below <b>${PCR_LO}</b> reads bullish and above <b>${PCR_HI}</b> bearish; price and futures OI direction give the build-up type.</p>`);
    // where the numbers came from and how old they are
    const srcs = meta.sources || {};
    h += `<h3>Data and freshness</h3><p class="src"><span class="fresh${f.stale ? " stale" : ""}"><span class="dot${f.live ? (f.stale ? " stale" : " on") : f.stale ? " stale" : ""}"></span><b>${v.live ? `Live quote ${esc(v.time)} IST` : `Closing data of ${esc(meta.as_of_label)}`}</b>${f.stale ? " · stale: " + esc(f.why) : ""}</span><br>
      ${v.live ? `Polled ${esc(LIVE.updated_at || "")} IST from ${esc(SERVER.live_source || "the broker feed")}; values marked “close” come from the nightly scan.` : `Scan built ${esc(meta.generated_at_ist || "—")}.${SERVER.live ? " Live quotes replace these from 09:15 IST." : ""}`}<br>
      ${srcs.prices_volume ? `Prices and volume: ${esc(srcs.prices_volume)}.<br>` : ""}${srcs.oi_pcr ? `OI and PCR: ${esc(srcs.oi_pcr)}.<br>` : ""}${srcs.strikes ? `Strikes: ${esc(srcs.strikes)}.` : ""}</p>`;
    return h;
  }
  function kvCell(label, value, sub = "", cls = "") { return `<div><small>${label}</small><b class="${cls}">${value}</b>${sub ? `<em>${sub}</em>` : ""}</div>`; }
  function overviewHtml(s) {
    const v = view(s), q = v.q;
    let h = "";
    if (q) {
      const tot = (q.buy_qty || 0) + (q.sell_qty || 0), bp = tot ? Math.round(100 * (q.buy_qty || 0) / tot) : null;
      const atpGap = q.atp && q.ltp ? (q.ltp / q.atp - 1) * 100 : null;
      const rng = q.wk52_high && q.wk52_low && q.wk52_high > q.wk52_low ? Math.min(100, Math.max(0, 100 * (q.ltp - q.wk52_low) / (q.wk52_high - q.wk52_low))) : null;
      h += `<h3>Live · ${esc(v.time)} IST</h3><div class="kvg">
        ${kvCell("LTP", fmtPx(q.ltp), `${signed(v.chg)} (${pct(q.chg_pct)})`, dirClass(q.chg_pct))}
        ${kvCell("Avg traded price", fmtPx(q.atp), atpGap != null ? `LTP ${atpGap >= 0 ? "above" : "below"} ATP by ${Math.abs(atpGap).toFixed(2)}%` : "", "")}
        ${kvCell("Open", fmtPx(q.open))}${kvCell("Prev close", fmtPx(q.prev_close))}
        ${kvCell("High", fmtPx(q.high), "", "up")}${kvCell("Low", fmtPx(q.low), "", "down")}
        ${kvCell("Volume today", compact(q.volume), q.live_volume_ratio != null ? `${ratio(q.live_volume_ratio)} the 20-day average, pro rata to the time of day` : "")}
        ${kvCell("Last traded qty", inr(q.ltq))}
        ${kvCell("Total buy qty", compact(q.buy_qty))}${kvCell("Total sell qty", compact(q.sell_qty))}
      </div>`;
      if (bp != null) h += `<div class="meter split" title="buy ${bp}% / sell ${100 - bp}%"><i style="width:${bp}%"></i></div><p class="count" style="margin:3px 0 0">Order book: ${bp}% buy · ${100 - bp}% sell quantity</p>`;
      if (rng != null) h += `<h3>52-week range</h3><div class="range"><i style="left:${rng}%"></i></div><div style="display:flex;justify-content:space-between" class="count mono"><span>${fmtPx(q.wk52_low)}</span><span>${fmtPx(q.wk52_high)}</span></div>`;
      if (q.lower_circuit || q.upper_circuit) h += `<p class="count">Circuit band ${fmtPx(q.lower_circuit)} – ${fmtPx(q.upper_circuit)}</p>`;
      if (q.fut_oi != null || q.live_pcr != null || q.live_label) {
        h += `<h3>Open interest &amp; PCR</h3><div class="kvg">
          ${kvCell("Open interest", compact(q.fut_oi), q.fut_oi_chg_pct != null ? `${pct(q.fut_oi_chg_pct)} vs close · all expiries` : "", dirClass(q.fut_oi_chg_pct))}
          ${kvCell("PCR", num(q.live_pcr != null ? q.live_pcr : s.pcr), q.live_pcr != null ? `live${q.pcr_ts ? " · " + esc(q.pcr_ts) : ""}` : "last close")}
          ${kvCell("Live label", q.live_label ? esc(q.live_label) : "—", "same rule as the EOD label, on live inputs")}</div>`;
      }
      const dp = q.depth;
      if (dp && (dp.bid || []).length) {
        const mx = Math.max(1, ...dp.bid.map(x => x[1]), ...(dp.ask || []).map(x => x[1]));
        const rows = Array.from({ length: 5 }, (_, i) => { const b = dp.bid[i], a = (dp.ask || [])[i];
          return `<tr><td class="bq" style="--w:${b ? Math.round(100 * b[1] / mx) : 0}%">${b ? inr(b[1]) : ""}</td><td class="up">${b ? fmtPx(b[0]) : ""}</td><td class="down">${a ? fmtPx(a[0]) : ""}</td><td class="aq" style="--w:${a ? Math.round(100 * a[1] / mx) : 0}%">${a ? inr(a[1]) : ""}</td></tr>`; }).join("");
        h += `<h3>Market depth</h3><table class="depth"><thead><tr><th>Bid qty</th><th>Bid</th><th>Ask</th><th>Ask qty</th></tr></thead><tbody>${rows}</tbody></table>`;
      }
    } else if (SERVER.live) h += `<p class="count">Live quotes start at 09:15 IST; below are the last session's closing numbers.</p>`;
    h += `<h3>Closing data · ${esc(meta.as_of_label)}</h3><div class="kvg">
      ${kvCell("Close", fmtPx(s.close), "prev " + fmtPx(s.prev_close) + " (" + esc(s.prev_date || "") + ")")}
      ${kvCell("Price change", pct(s.price_change_pct), "close vs previous close", dirClass(s.price_change_pct))}
      ${kvCell("Volume", compact(s.volume), "20-day avg " + compact(s.avg_volume_20d))}
      ${kvCell("Volume ratio", ratio(s.volume_ratio), "volume ÷ its 20-day average")}
      ${kvCell("Open interest", compact(s.fut_oi), s.fut_oi_prev != null ? "prev " + compact(s.fut_oi_prev) : "")}
      ${kvCell("OI change", pct(s.oi_change_pct), "all expiries combined", dirClass(s.oi_change_pct))}
      ${kvCell("Call OI / Put OI", `${compact(s.call_oi)} / ${compact(s.put_oi)}`)}
      ${kvCell("PCR", num(s.pcr), "put OI ÷ call OI")}</div>`;
    h += blindFor(s) ? `<h3>Label hidden</h3><p class="count">Make your call above the chart first; the label and its reasons appear after.</p>`
      : `<h3>Why “${esc(s.label)}”</h3><div class="why"><ul>${(s.reasons || []).map(r => "<li>" + esc(r) + "</li>").join("")}</ul></div>`;
    return h;
  }

  function optionsHtml(s, chain) {
    if (!chain) return `<p class="levels">${s.chain_problem ? "Strike table unavailable for this stock: " + esc(s.chain_problem) + "." : meta.chain_available === false ? "Strike tables could not be built for this session (" + esc(meta.chain_status || "") + "); OI, PCR and labels are unaffected." : meta.fo_available ? "No options data for this stock." : "Strike-level data needs the F&O bhavcopy, which is not in this build."}</p>`;
    const live = !!chain.live_at, spot = view(s).ltp;
    const val = (r, t, k) => r[`${t}_live_${k}`] != null ? r[`${t}_live_${k}`] : null;
    const leg1 = (r, t) => {
      const px = val(r, t, "ltp") ?? r[`${t}_close`], ch = val(r, t, "chg_pct"), oi = val(r, t, "oi") ?? r[`${t}_oi`];
      const doi = live ? val(r, t, "oi_chg") : r[`${t}_oi_chg`], vol = val(r, t, "vol") ?? r[`${t}_vol`];
      return { px, ch, oi, doi, vol };
    };
    const rows = chain.strikes.map(r => {
      const c = leg1(r, "ce"), p = leg1(r, "pe"), k = r.strike;
      const hiC = k === chain.max_call_oi_strike, hiP = k === chain.max_put_oi_strike;
      return `<tr class="${k === chain.atm ? "atm" : ""} ${spot != null && k < spot ? "itm-c" : ""} ${spot != null && k > spot ? "itm-p" : ""}">
        <td class="c${hiC ? " hi" : ""}">${compact(c.oi)}<small>${c.doi != null ? signedCompact(c.doi) : ""}</small></td>
        <td class="c">${compact(c.vol)}</td>
        <td class="c"><span class="lp" data-leg="CE:${k}" title="Chart ${fmtStrike(k)} CE">${fmtPx(c.px)}</span><small class="${dirClass(c.ch)}">${c.ch != null ? pct(c.ch) : ""}</small></td>
        <td class="k${SERVER.orders ? " ok-k" : ""}"${SERVER.orders ? ` data-trade="CE" data-strike="${k}" title="Order at strike ${fmtStrike(k)} (call or put)" role="button" tabindex="0"` : ""}>${fmtStrike(k)}</td>
        <td class="p"><span class="lp" data-leg="PE:${k}" title="Chart ${fmtStrike(k)} PE">${fmtPx(p.px)}</span><small class="${dirClass(p.ch)}">${p.ch != null ? pct(p.ch) : ""}</small></td>
        <td class="p">${compact(p.vol)}</td>
        <td class="p${hiP ? " hi" : ""}">${compact(p.oi)}<small>${p.doi != null ? signedCompact(p.doi) : ""}</small></td></tr>`;
    }).join("");
    const note = chain.one_sided_strikes ? `<p class="levels">${chain.one_sided_strikes} strike${chain.one_sided_strikes === 1 ? " is" : "s are"} listed on one side only in NSE's file; the missing side shows 0 OI and no price.</p>` : "";
    return `<p class="levels">Expiry <b>${esc(chain.expiry)}</b> · ${live ? `live <b>${esc(chain.live_at)}</b>` : "closing prices"} · highest call OI <b>${fmtStrike(chain.max_call_oi_strike)}</b> (read as resistance) · highest put OI <b>${fmtStrike(chain.max_put_oi_strike)}</b> (support) · max pain <b>${fmtStrike(chain.max_pain)}</b> · ATM <b>${fmtStrike(chain.atm)}</b>. Tap a price to chart that option${SERVER.orders ? "; tap a strike to prepare an order" : ""}.</p>${note}
      ${chain.live_error ? `<p class="err">Live option prices unavailable: ${esc(chain.live_error)}</p>` : ""}
      <div class="oc-wrap"><table class="oc"><thead><tr><th>Call OI<small>Δ OI</small></th><th>Vol</th><th>Call LTP<small>% chg</small></th><th class="k">Strike</th><th>Put LTP<small>% chg</small></th><th>Vol</th><th>Put OI<small>Δ OI</small></th></tr></thead><tbody>${rows}</tbody></table></div>
      <p class="count">Shaded: in the money. ${live ? "Δ OI vs the last close; % change vs each option's previous close." : "Δ OI as reported in the closing bhavcopy."}</p>`;
  }
  async function fetchChain(s) {
    try {
      CHAIN[s.symbol] = await getJson(`/api/chain/${encodeURIComponent(s.symbol)}`);
      if (sel === s.symbol) { renderLegs(); if (tab === "options" || tab === "why") renderTab(); }
      if (curView === "options" && ocSym === s.symbol) renderOptionsView();
    } catch (e) { /* keep the EOD chain */ }
  }

  function ago(ts) {
    if (!ts) return "";
    const m = Math.round((Date.now() / 1000 - ts) / 60);
    return m < 1 ? "just now" : m < 60 ? m + " min ago" : m < 1440 ? Math.round(m / 60) + " h ago" : Math.round(m / 1440) + " d ago";
  }
  function newsHtml(s) {
    const ev = s.events || { last_10: [], upcoming: [], analyst_view: [] };
    let h = "";
    if (SERVER.live) {
      const n = NEWS[s.symbol];
      h += `<h3>Headlines</h3>`;
      if (!n) h += `<p class="count">Loading headlines…</p>`;
      else if (n.error) h += `<p class="err">News unavailable: ${esc(n.error)}</p>`;
      else if (!n.items.length) h += `<p class="count">No headlines in the last 7 days.</p>`;
      else h += `<ul class="nl">${n.items.map(i => `<li><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title)}</a><small>${esc(i.source)} · ${esc(ago(i.ts))}</small></li>`).join("")}</ul>
        <p class="count">News headlines (Google News, last 7 days, fetched ${esc(n.fetched_at)}). News is not a filing and feeds no label. <button class="chip" type="button" data-newsrefresh>Refresh</button></p>`;
    } else h += `<p class="count">Live headlines appear on the live server. Exchange filings for this stock are below.</p>`;
    const up = (ev.upcoming || []).map(u => `<li>${esc(u.type)} in ${u.sessions} session${u.sessions === 1 ? "" : "s"} · ${esc(u.date)}${u.subject ? `<small>${esc(u.subject.slice(0, 140))}</small>` : ""}</li>`).join("");
    if (up) h += `<h3>Coming up</h3><ul class="nl">${up}</ul>`;
    const fl = (ev.last_10 || []).map(e => `<li>${e.url ? `<a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.subject || e.type)}</a>` : esc(e.subject || e.type)}<small>${esc(e.type)}${e.subtype ? " / " + esc(e.subtype) : ""} · ${esc(e.event_date)}${e.value_cr ? " · ₹" + inr(e.value_cr) + " cr" : ""} · ${esc(e.source || "")}</small></li>`).join("");
    h += `<h3>Exchange filings, last 10 sessions</h3>${fl ? `<ul class="nl">${fl}</ul>` : `<p class="count">None classified in the last 10 sessions.</p>`}`;
    const an = (ev.analyst_view || []).map(a => `<li><a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.subject)}</a><small>${esc(a.label)}</small></li>`).join("");
    if (an) h += `<h3>Analyst views</h3><ul class="nl">${an}</ul>`;
    if (SERVER.verdict) h += `<h3>AI news check</h3><p class="count">"Weigh the evidence" (Signals tab) has Claude search the last 10 days of news and weigh it against the numbers.</p>`;
    return h;
  }
  async function fetchNews(s) {
    try { NEWS[s.symbol] = await getJson(`/api/news/${encodeURIComponent(s.symbol)}`); }
    catch (e) { NEWS[s.symbol] = { error: e.message, items: [] }; }
    if (sel === s.symbol && tab === "news") renderTab();
  }

  function resultsHtml(s) {
    const f = s.financials, up = ((s.events || {}).upcoming || []).find(u => u.type === "results" || u.type === "results_date");
    let h = up ? `<p class="levels">Next results: <b>${esc(up.date)}</b> (in ${up.sessions} session${up.sessions === 1 ? "" : "s"})</p>` : "";
    if (!f || !f.quarters || !f.quarters.length) return h + `<p class="count">No quarterly numbers for this stock in this build yet (they come from NSE's XBRL filings, refreshed nightly).</p>`;
    const qn = p => { const d = new Date(p + "T00:00:00Z"), m = d.getUTCMonth() + 1, y = d.getUTCFullYear(); const fq = m === 6 ? 1 : m === 9 ? 2 : m === 12 ? 3 : 4; return `Q${fq} FY${String(m <= 3 ? y : y + 1).slice(2)}`; };
    const chg = (v, lbl) => v == null ? `<em class="flat">${lbl} —</em>` : typeof v === "string" ? `<em class="flat" title="the earlier figure is zero or a loss">${lbl} n/m</em>`
      : `<em><span class="chgc ${dirClass(v)}">${lbl} ${Math.abs(v) > 999 ? (v > 0 ? ">+999" : "<−999") : (v > 0 ? "+" : "") + v.toFixed(1)}%</span></em>`;
    const row = (name, key, unit) => `<tr><td>${name}<em class="muted">${unit}</em></td>${f.quarters.map(q => `<td>${q[key] == null ? "—" : key === "eps" ? q[key].toFixed(2) : inr(Math.round(q[key]))}${chg(q[key + "_qoq"], "QoQ")}${chg(q[key + "_yoy"], "YoY")}</td>`).join("")}</tr>`;
    h += `<h3>Last ${f.quarters.length} quarters · ${esc(f.basis)}</h3>
      <div style="overflow-x:auto"><table class="res"><thead><tr><th></th>${f.quarters.map(q => `<th>${qn(q.period)}<br><small>${esc(q.period)}</small></th>`).join("")}</tr></thead>
      <tbody>${row("Revenue", "revenue", "₹ crore")}${row("Net profit", "net_profit", "₹ crore")}${row("EPS", "eps", "₹ basic")}</tbody></table></div>
      <p class="count">From NSE's XBRL results filings (${esc(f.basis)}). Revenue is revenue from operations (banks: interest earned). QoQ vs the quarter before, YoY vs the same quarter a year earlier. EPS is not adjusted for bonus issues or splits, so its change can jump when the share count changes. Updated ${esc(f.updated || "—")}.</p>`;
    return h;
  }

  function signalsHtml(s) {
    if (blindFor(s)) return `<h3>Label hidden</h3><p class="count">Make your call above the chart first; the verdict and its votes appear after.</p>`;
    return `${verdictCard(s)}
      ${SERVER.commentary ? `<div class="section"><h3>Plain-language reading</h3><button class="btn" type="button" data-explain="${s.symbol}">Explain these numbers</button><div class="commentary" id="c-${s.symbol}"></div></div>` : ""}
      ${SERVER.verdict ? `<div class="section"><h3>Evidence verdict (numbers + news)</h3><button class="btn" type="button" data-verdict="${s.symbol}">Weigh the evidence</button><div class="commentary verdict" id="v-${s.symbol}"></div></div>` : ""}
      ${SERVER.orders && s.chain ? `<div class="actions"><button class="btn" type="button" data-trade="CE" data-strike="${(CHAIN[s.symbol] || s.chain).atm}">Buy ${esc(s.symbol)} call</button><button class="btn" type="button" data-trade="PE" data-strike="${(CHAIN[s.symbol] || s.chain).atm}">Buy ${esc(s.symbol)} put</button></div>` : ""}`;
  }

  // ---- verdict card: deterministic, computed at build time (scanner/verdict_rules.py); identical
  //      with or without any AI. The optional "Weigh the evidence" AI summary renders BELOW it.
  function verdictCard(s) {
    const v = s.verdict; if (!v) return "";
    const ev = s.events || { today: [], last_10: [], upcoming: [], analyst_view: [], flags: {} };
    const pat = meta.event_patterns || {};
    const cls = v.lean === "bullish" ? "b" : v.lean === "bearish" ? "r" : "n";
    const patLine = t => {
      const p = pat[t]; if (!p || !p.count) return "";
      return ` <small>pattern over ${p.count} cases: pre ${sgnpct(p.pre)}, day ${sgnpct(p.day)}, post ${sgnpct(p.post)}</small>`;
    };
    const evLines = [];
    for (const u of ev.upcoming) evLines.push(`<li>${esc(u.type)} in ${u.sessions} session${u.sessions === 1 ? "" : "s"} (${esc(u.date)})${patLine(u.type)}</li>`);
    for (const e of ev.last_10) evLines.push(`<li>${esc(e.type)}${e.subtype ? " / " + esc(e.subtype) : ""} [${esc(e.bucket)}] ${esc(e.event_date)}${e.value_cr ? " · ₹" + inr(e.value_cr) + " cr" : ""}${patLine(e.type)}</li>`);
    const analyst = ev.analyst_view.map(a => `<li><a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.subject.slice(0, 90))}</a> <small>${esc(a.label)}</small></li>`).join("");
    const filings = ev.last_10.filter(e => e.url).slice(0, 6).map(e => `<a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.type)} ${esc(e.event_date)}</a>`).join(" · ");
    const m = s.model;
    return `<div class="section verdictcard"><h3>Verdict (computed by fixed rules, not advice)</h3>
      <p class="vhead"><span class="pill ${cls}">Lean: ${esc(v.lean)}</span> <b>confidence ${esc(v.confidence)}</b>
        <small>votes — data ${sgn0(v.votes.data)}, model ${sgn0(v.votes.model)}, events ${sgn0(v.votes.events)} (score ${v.events_score})</small></p>
      <div class="vrows">
        <div><b>Data</b><span>${esc(s.label)} · price ${pct(s.price_change_pct)} · vol ${ratio(s.volume_ratio)} · OI ${pct(s.oi_change_pct)} · PCR ${num(s.pcr)}</span></div>
        <div><b>Events</b><span>${evLines.length ? `<ul class="vlist">${evLines.join("")}</ul>` : "none in the last 10 sessions"}</span></div>
        <div><b>Model</b><span>${m ? `p(up) ${num(m.p_up)} · p(down) ${num(m.p_down)} · p(flat) ${num(m.p_flat)} <small>out-of-sample Brier ${num(m.oos_brier)} vs base rate ${m.base_brier != null ? num(m.base_brier) : "—"} (lower is better; the base rate always predicts the class shares) · vote weight ${v.votes.model_weight != null ? v.votes.model_weight : 1}${v.votes.model_weight === 0 ? ` (would have voted ${sgn0(v.votes.model_raw)})` : ""} · trained through ${esc(m.trained_through)}</small>${s.model_top_decile ? ` <small class="topdec">top decile of today's p(${s.model_top_decile === "both" ? "up) and p(down" : esc(s.model_top_decile)}) · display only, not a vote</small>` : ""}` : "no model in this build"}</span></div>
        <div><b>Analyst</b><span>${analyst ? `<ul class="vlist">${analyst}</ul>` : "no analyst views (tier-3 news) in the last 5 sessions"}</span></div>
        <div><b>News</b><span>${filings || "no filing links in the window"}</span></div>
      </div></div>`;
  }
  function sgnpct(v) { return v == null ? "—" : (v > 0 ? "+" : "") + v + "%"; }
  function sgn0(v) { return v > 0 ? "+1" : v < 0 ? "−1" : "0"; }

  async function explain(s, btn) {
    const box = $("#c-" + CSS.escape(s.symbol)); btn.disabled = true; btn.textContent = "Reading the numbers…";
    try {
      const r = await fetch(`/api/commentary/${encodeURIComponent(s.symbol)}`, auth); const j = await r.json();
      if (!r.ok) throw new Error(j.error || r.status);
      box.innerHTML = esc(j.text) + `<small>${j.ai ? "Written by AI (" + esc(j.model) + ") from the numbers above. Descriptive only: it does not tell you what to trade." : "Deterministic summary (AI reading unavailable)."}</small>`;
      btn.remove();
    } catch (e) { box.innerHTML = `<span class="err">Could not get a reading: ${esc(e.message)}</span>`; btn.disabled = false; btn.textContent = "Explain these numbers"; }
  }

  async function verdict(s, btn, refresh) {
    const box = $("#v-" + CSS.escape(s.symbol)); btn.disabled = true; btn.textContent = "Searching news and weighing the numbers…";
    try {
      const r = await fetch(`/api/verdict/${encodeURIComponent(s.symbol)}${refresh ? "?refresh=1" : ""}`, auth); const j = await r.json();
      if (!r.ok) throw new Error(j.error || r.status);
      const cls = j.lean === "bullish" ? "b" : j.lean === "bearish" ? "r" : "n";
      const news = (j.news || []).map(n => `<li><a href="${esc(n.url || "#")}" target="_blank" rel="noopener">${esc(n.headline)}</a> <small>${esc(n.source || "")} ${esc(n.date || "")} ${n.direction === "+" ? "▲" : n.direction === "-" ? "▼" : "•"}</small>${n.why ? `<br><small>${esc(n.why)}</small>` : ""}</li>`).join("");
      box.innerHTML = `<p><span class="pill ${cls}">Leans ${esc(j.lean)}</span> <b>${esc(j.confidence)} confidence</b></p>
        <p><b>Data:</b> ${esc(j.data_read)}</p>
        ${news ? `<p><b>News found:</b></p><ul class="news">${news}</ul>` : "<p><b>News:</b> nothing material found in the last 10 days.</p>"}
        <p><b>Weighing it:</b> ${esc(j.reasoning)}</p>
        <p><b>Risks to this read:</b> ${esc(j.risks)}</p>
        <p><b>What would change it:</b> ${esc(j.would_change)}</p>
        <small>${j.deterministic ? "Data-only verdict; the AI assessment was unavailable or discarded." : "AI assessment (" + esc(SERVER.model || "Claude") + ", web search) generated " + esc(j.generated_at || "") + "."} An assessment of evidence for your own judgement, not a trade recommendation. <button class="btn" type="button" data-refresh="${esc(s.symbol)}" style="margin-left:6px">Refresh with latest news</button></small>`;
      box.querySelector("[data-refresh]").addEventListener("click", ev => verdict(s, ev.currentTarget, true));
      btn.remove();
    } catch (e) { box.innerHTML = `<span class="err">Could not get a verdict: ${esc(e.message)}</span>`; btn.disabled = false; btn.textContent = "Weigh the evidence"; }
  }

  // ---- views: the rail on the left picks one; the scanner keeps its table and panel while others are open
  const VIEWS = ["scanner", "options", "analytics", "saved", "alerts", "score", "settings"];
  if (!VIEWS.includes(curView)) curView = "scanner";
  function railState() {
    const cur = curView === "scanner" && uni === "watchlist" ? "watchlist" : curView;
    $$("#rail [data-view]").forEach(b => { if (b.dataset.view === cur) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
  }
  function setView(v, quiet) {
    if (v === "watchlist") { if (uni !== "watchlist") setUni("watchlist", true); v = "scanner"; }
    else if (v === "scanner" && !quiet && curView === "scanner" && uni === "watchlist") setUni("all", true);
    if (!VIEWS.includes(v)) v = "scanner";
    curView = v; store.set("fos_view", v); showScore = v === "score";
    $$(".view").forEach(el => el.classList.toggle("on", el.id === "v-" + v));
    railState(); closePop();
    if (v === "scanner") { renderScan(); if (chart) setTimeout(() => chart.timeScale().fitContent(), 0); }
    else if (v === "options") renderOptionsView();
    else if (v === "analytics") renderAnalytics();
    else if (v === "saved") renderSaved();
    else if (v === "alerts") renderAlertsView();

  function heatmapHtml() {
    const M = { pct: ["% change", v => v.pct, 3], oi: ["OI change %", v => v.oi, 8], vr: ["Volume × avg", v => v.vr != null ? v.vr - 1 : null, 1.5] };
    const [mname, fn, scale] = M[heatMetric];
    const all = stocks.map(s => ({ s, v: view(s) }));
    const weight = x => Math.sqrt(Math.max(1, (x.v.vol || 0) * (x.v.ltp || 0)));
    const wmax = Math.max(...all.map(weight));
    const groups = {};
    all.forEach(x => { const g = sectorName(x.s.sector) || "Other"; (groups[g] = groups[g] || []).push(x); });
    const color = val => {
      if (val == null) return "background:var(--surface)";
      const k = Math.min(1, Math.abs(val) / scale), p = Math.round(12 + 70 * k);
      return `background:color-mix(in srgb, var(${val >= 0 ? "--bull" : "--bear"}) ${p}%, var(--surface))`;
    };
    const fmtV = val => heatMetric === "vr" ? (val == null ? "—" : ratio(val + 1)) : pct(val);

      const pv = st.preview, canPlace = pv && pv.token;
      sheet.innerHTML = `<h2>${esc(contract)}</h2><p class="sub">Lot size ${s.lot_size ?? "?"} · reference ₹${inr(refPrice())} · <span class="badge ${SERVER.paper ? "paper" : "live"}">${SERVER.paper ? "PAPER" : "LIVE BROKER"}</span></p>
        <div class="field"><label>Buy</label><div class="seg2"><button type="button" class="buy" data-i="CE" aria-pressed="${st.instrument === "CE"}">Call (CE) ${fmtStrike(st.strike)}</button><button type="button" class="sell" data-i="PE" aria-pressed="${st.instrument === "PE"}">Put (PE) ${fmtStrike(st.strike)}</button></div><p class="count" style="margin:4px 0 0">Options only: you buy a call or a put. Close an open position from Orders.</p></div>
        <div class="field"><label>Lots (max ${maxLots()}${capNote()}) · quantity ${inr(qty)}</label><div class="stepper"><button type="button" data-d="-1" aria-label="fewer lots">−</button><b>${st.lots}</b><button type="button" data-d="1" aria-label="more lots">+</button></div></div>
        <div class="field"><label>Order type</label><div class="seg2"><button type="button" data-t="MARKET" aria-pressed="${st.order_type === "MARKET"}">Market</button><button type="button" data-t="LIMIT" aria-pressed="${st.order_type === "LIMIT"}">Limit</button></div></div>
        ${st.order_type === "LIMIT" ? `<div class="field"><label>Limit price ₹${SERVER.paper ? " (a cap on the fill; paper orders never rest)" : ""}</label><input class="num" id="px" type="number" inputmode="decimal" step="0.05" value="${st.price ?? refPrice() ?? ""}"></div>` : ""}
        ${SERVER.paper ? `<div class="field"><label>Stop ₹ (${stopNeed()}; the exit fills at the next poll's book, not at this price)</label><input class="num" id="stopPx" type="number" inputmode="decimal" step="0.05" value="${st.stop ?? ""}"></div>` : ""}
        ${pv ? (pv.review ? paperReviewHtml(pv) : `<div class="review">${kv("Contract", esc(pv.tradingsymbol))}${kv("Quantity", `${inr(pv.quantity)} (${st.lots} × ${pv.lot_size})`)}
          ${kv("Notional", money(pv.notional))}${kv("Est. margin", pv.estimated_margin != null ? money(pv.estimated_margin) : "not available")}${kv("Orders today", `${pv.orders_today} of ${pv.max_orders_per_day}`)}</div>`)
          + (!SERVER.paper ? `<label class="chk"><input type="checkbox" id="ack" ${st.ack ? "checked" : ""}> I understand this sends a real ${st.side} order for ${inr(pv.quantity)} units to my broker account, and that F&O losses can exceed the capital invested.</label>` : "") : ""}
        ${st.err ? `<p class="err">${esc(st.err)}</p>` : ""}
        <div class="actions">${pv ? (canPlace ? `<button class="btn ${SERVER.paper ? "primary" : "danger"}" type="button" id="place" ${!SERVER.paper && !st.ack ? "disabled" : ""}>${SERVER.paper ? (pv.review && pv.review.queued ? "Queue paper order" : "Place paper order") : "Place real order"}</button>` : "") + `<button class="btn" type="button" id="back">Edit</button>` : `<button class="btn primary" type="button" id="review">Review order</button>`}<button class="btn" type="button" id="cancel">Cancel</button></div>`;
      const reset = () => { st.preview = null; st.err = ""; };
      sheet.querySelectorAll("[data-i]").forEach(b => b.addEventListener("click", () => { st.instrument = b.dataset.i; st.price = null; reset(); draw(); }));
      sheet.querySelectorAll("[data-side]").forEach(b => b.addEventListener("click", () => { st.side = b.dataset.side; reset(); draw(); }));
      sheet.querySelectorAll("[data-d]").forEach(b => b.addEventListener("click", () => { st.lots = Math.min(maxLots(), Math.max(1, st.lots + Number(b.dataset.d))); reset(); draw(); }));
      sheet.querySelectorAll("[data-t]").forEach(b => b.addEventListener("click", () => { st.order_type = b.dataset.t; reset(); draw(); }));
      const px = $("#px", sheet); if (px) px.addEventListener("input", () => { st.price = Number(px.value); st.preview = null; });
      const sp = $("#stopPx", sheet); if (sp) sp.addEventListener("input", () => { st.stop = sp.value === "" ? null : Number(sp.value); st.preview = null; });
      const ack = $("#ack", sheet); if (ack) ack.addEventListener("change", () => { st.ack = ack.checked; $("#place", sheet).disabled = !st.ack; });
      $("#cancel", sheet).addEventListener("click", () => bg.remove());
      const back = $("#back", sheet); if (back) back.addEventListener("click", () => { reset(); draw(); });
      const review = $("#review", sheet); if (review) review.addEventListener("click", () => submit("/api/order/preview"));
      const place = $("#place", sheet); if (place) place.addEventListener("click", () => submit("/api/order"));
    }
    function body() {
      return { symbol: s.symbol, instrument: st.instrument, expiry: s.chain.expiry, strike: st.instrument === "FUT" ? null : st.strike, side: st.side, lots: st.lots,
               order_type: st.order_type, price: st.order_type === "LIMIT" ? (st.price ?? refPrice()) : null, stop: SERVER.paper ? st.stop : null };
    }
    async function submit(url) {
      st.err = "";
      if (st.order_type === "LIMIT") { const v = $("#px", sheet); if (v) st.price = Number(v.value); }
      const sv = $("#stopPx", sheet); if (sv) st.stop = sv.value === "" ? null : Number(sv.value);
      try {
        const payload = body(); if (url === "/api/order") payload.token = st.preview.token;
        const j = await getJson(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
        if (url === "/api/order") { st.done = j; refreshPaperBar(); }
        else { st.preview = j; const cap = j.review && j.review.risk && j.review.risk.max_lots; st.riskCap = cap != null ? cap : null; }
      } catch (e) { st.err = e.message; }
      draw();
    }
    draw(); document.body.appendChild(bg);
  }

  function paperSummaryLine(sm) {
    return `Equity ${money(sm.equity)} on ${money(sm.capital)} · day ${money(sm.day_pnl)} · week ${money(sm.week_pnl)} · drawdown ${sm.drawdown_pct}% · open margin ${money(sm.open_margin)}`;
  }

  // The paper account at a glance in the top bar, and the drawdown banner when it applies.
  async function refreshPaperBar() {
    if (!(SERVER.orders && SERVER.paper)) return;
    try {
      const sm = await getJson("/api/paper/summary");
      try {
        const pos = await getJson("/api/paper/positions"); let n = 0;
        pos.filter(x => x.rule).forEach(x => x.rule.arms.forEach(a => { if (!(ARMS[x.symbol] || {})[a]) n++; markArms(x.symbol, a, "rule trade in the paper account"); }));
        if (n) { renderList(); renderHeader(); }
      } catch (e) { /* badges from the forward test only */ }
      const b = $("#paperbar"); b.hidden = false; b.innerHTML = `<span class="badge paper">PAPER</span> Equity <b>${money(sm.equity)}</b> · day <b class="${dirClass(sm.day_pnl)}">${money(sm.day_pnl)}</b>`;
      b.title = paperSummaryLine(sm).replace(/<[^>]+>/g, "");
      const n = $("#ddnotice"); n.hidden = !sm.drawdown_review; if (sm.drawdown_review) n.innerHTML = `<b>Review labels and sizing.</b> ${esc(sm.drawdown_review_message)}`;
    } catch (e) { /* the page works without it */ }
  }
  refreshPaperBar();

  // ---- formatting
  function pct(v) { return v == null ? "—" : (v > 0 ? "+" : "") + v.toFixed(2) + "%"; }
  function ratio(v) { return v == null ? "—" : v.toFixed(2) + "×"; }
  function num(v) { return v == null ? "—" : v.toFixed(2); }
  function inr(v) { return v == null ? "—" : Number(v).toLocaleString("en-IN", { maximumFractionDigits: 2 }); }
  function fmtPx(v) { return v == null ? "—" : Number(v).toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function signed(v) { return v == null ? "—" : (v > 0 ? "+" : v < 0 ? "−" : "") + fmtPx(Math.abs(v)); }
  function compact(v) {
    if (v == null) return "—"; const a = Math.abs(v), sg = v < 0 ? "−" : "";
    return a >= 1e7 ? sg + (a / 1e7).toFixed(2) + " Cr" : a >= 1e5 ? sg + (a / 1e5).toFixed(2) + " L" : a >= 1e3 ? sg + (a / 1e3).toFixed(1) + "K" : sg + Math.round(a);
  }
  function sectorName(x) {          // "nifty oil & gas" -> "Oil & Gas"
    return x ? x.replace(/^nifty\s+/i, "").replace(/\b([a-z])/g, c => c.toUpperCase()).replace(/\bIt\b/, "IT").replace(/\bPsu\b/, "PSU").replace(/\bFmcg\b/, "FMCG") : "";
  }
  function fmtD(d) { return d ? new Date(d + "T00:00:00").toLocaleDateString("en-GB", { day: "2-digit", month: "short" }) : "—"; }
  function signedCompact(v) { return v == null ? "" : (v > 0 ? "+" : "") + compact(v); }
  function fmtStrike(v) { return v == null ? "—" : (Number.isInteger(v) ? v : v.toFixed(2)); }
  function dirClass(v) { return v == null || v === 0 ? "flat" : v > 0 ? "up" : "down"; }
  function esc(t) { return String(t ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

  // ---- links (kept in the address bar): #RELIANCE, #RELIANCE/options (a panel tab), #options/RELIANCE, #watchlist,
  //      #movers, #heatmap, #saved, #alerts, #score, #settings; #arma, #armb, #paper open the dashboard
  function setHash() {
    let h = curView === "scanner" ? (uni === "watchlist" ? "watchlist" : "") + (sel ? (uni === "watchlist" ? "/" : "") + encodeURIComponent(sel) + (tab !== "why" ? "/" + tab : "") : "")
      : curView === "options" ? "options/" + encodeURIComponent(ocSym || "") : curView === "analytics" ? anTab : curView;
    try { history.replaceState(null, "", "#" + h); } catch (e) { /* file:// */ }
  }
  function fromHash() {
    const parts = decodeURIComponent(location.hash.slice(1)).split("/").filter(Boolean);
    let [a, b, c] = parts; if (!a) return false;
    const al = a.toLowerCase();
    if (["arma", "armb", "paper"].includes(al)) { goHome("#" + al); return true; }
    if (al === "movers" || al === "heatmap") { anTab = al; if (sel) select(sel, false, false); setView("analytics"); return true; }
    if (["saved", "alerts", "score", "settings"].includes(al)) { if (sel) select(sel, false, false); setView(al); return true; }
    if (al === "options") { if (sel) select(sel, false, false); openOptions((b || "").toUpperCase() || sel); return true; }
    if (al === "watchlist" || al === "scanner") { setUni(al === "watchlist" ? "watchlist" : "all", true); setView("scanner", true); [a, b] = [b, c]; if (!a) { if (sel) select(sel, false, false); return true; } }
    const sym = a.toUpperCase(); if (!BY[sym]) return false;
    if (b && TABS.some(t => t[0] === b.toLowerCase())) tab = b.toLowerCase();
    select(sym); return true;
  }
  addEventListener("hashchange", fromHash);
  const _select = select;
  select = function (sym, keepLeg, open) { _select(sym, keepLeg, open); setHash(); };
  const _setTab = setTab;
  setTab = function (k) { _setTab(k); setHash(); };
  const S2 = SERVER.orders || SERVER.live ? "/s2" : "s2.html";
  $("#navHome").href = HOME; $("#brandMark").href = HOME; $("#navS2").href = S2;

  // ---- start
  saveAlerts(); renderTabs(); renderScan();
  $("#expandBtn").setAttribute("aria-pressed", document.body.dataset.panel === "wide");
  $("#expandBtn").textContent = document.body.dataset.panel === "wide" ? "⇔ Narrow" : "⇔ Widen";
  setView(curView, true);
  if (!fromHash()) { if (sel) select(sel, false, false); else render(); }
  railState();
})();
</script>
</body>
</html>
