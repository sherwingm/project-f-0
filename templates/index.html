<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>F&amp;O EOD scan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#E9EDF2; --surface:#FFFFFF; --ink:#1A2430; --muted:#5B6773; --line:#D5DBE2; --line-strong:#B9C2CC;
  --bull:#157A57; --bull-soft:#DCEFE6; --bear:#B0362E; --bear-soft:#F6E0DD;
  --neutral:#6F7A86; --neutral-soft:#E6E9ED; --unc:#8A6D2B; --unc-soft:#F5EBD3;
  --accent:#24456F; --accent-ink:#FFFFFF; --focus:#2F6FD6;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#131B26; --surface:#1B2533; --ink:#EAF0F6; --muted:#98A6B5; --line:#2C3A4B; --line-strong:#3E4E62;
    --bull:#4CC38A; --bull-soft:#173427; --bear:#F07F76; --bear-soft:#3D1F1D;
    --neutral:#8E9AA8; --neutral-soft:#26303C; --unc:#D9B15C; --unc-soft:#3A2F17;
    --accent:#8FB4E8; --accent-ink:#0F1A2B; --focus:#8FB4E8;
  }
}
:root[data-theme="dark"] {
  --bg:#131B26; --surface:#1B2533; --ink:#EAF0F6; --muted:#98A6B5; --line:#2C3A4B; --line-strong:#3E4E62;
  --bull:#4CC38A; --bull-soft:#173427; --bear:#F07F76; --bear-soft:#3D1F1D;
  --neutral:#8E9AA8; --neutral-soft:#26303C; --unc:#D9B15C; --unc-soft:#3A2F17;
  --accent:#8FB4E8; --accent-ink:#0F1A2B; --focus:#8FB4E8;
}
html { scroll-padding-top:calc(env(safe-area-inset-top,0px) + 56px); }
*, *::before, *::after { box-sizing:inherit; }
body {
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Public Sans",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:15px; line-height:1.45; font-variant-numeric:tabular-nums;
  -webkit-text-size-adjust:100%;
}
button { font:inherit; color:inherit; }
button:focus-visible, input:focus-visible { outline:2px solid var(--focus); outline-offset:2px; }
.wrap { max-width:640px; margin:0 auto; padding:0 12px 168px; }

/* header */
.head { padding:18px 2px 10px; }
.head h1 { font-size:22px; font-weight:700; margin:0; letter-spacing:-0.01em; }
.head #asof { margin:2px 0 0; font-size:15px; font-weight:500; color:var(--ink); }
.head p { margin:4px 0 0; color:var(--muted); font-size:13px; }

/* notice when OI/PCR are missing */
.notice { border:1px solid var(--unc); background:var(--unc-soft); color:var(--ink); border-radius:10px; padding:10px 12px; font-size:13px; margin:8px 0 12px; }
.notice b { color:var(--unc); }

/* summary: the market bar */
.summary { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:12px 12px 10px; margin:6px 0 12px; }
.summary-line { display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:8px; }
.summary-line strong { font-size:16px; }
.summary-line span { color:var(--muted); font-size:13px; }
.bar { display:flex; height:18px; border-radius:6px; overflow:hidden; gap:2px; }
.bar i { display:block; height:100%; }
.bar .b { background:var(--bull); } .bar .r { background:var(--bear); } .bar .n { background:var(--neutral); } .bar .u { background:var(--unc); }
.segs { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:10px; }
.seg { border:1px solid var(--line); background:transparent; border-radius:10px; padding:8px 6px; text-align:left; min-height:56px; cursor:pointer; }
.seg strong { display:block; font-size:20px; line-height:1.1; font-weight:700; }
.seg small { display:block; font-size:12px; color:var(--muted); margin-top:2px; }
.seg[aria-pressed="true"] { border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent); }
.seg.b strong { color:var(--bull); } .seg.r strong { color:var(--bear); } .seg.n strong { color:var(--neutral); } .seg.u strong { color:var(--unc); }

/* controls */
.controls { position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--bg); padding:6px 0 8px; margin:0 -12px; padding-left:12px; padding-right:12px; border-bottom:1px solid var(--line); }
.search { width:100%; padding:11px 12px; border:1px solid var(--line-strong); border-radius:10px; background:var(--surface); color:var(--ink); font-size:16px; }
.search::placeholder { color:var(--muted); }
.sorts { display:flex; gap:6px; margin-top:8px; overflow-x:auto; scrollbar-width:none; padding-bottom:2px; }
.sorts::-webkit-scrollbar { display:none; }
.chip { flex:0 0 auto; border:1px solid var(--line-strong); background:var(--surface); border-radius:999px; padding:8px 12px; font-size:13px; min-height:36px; cursor:pointer; white-space:nowrap; }
.chip[aria-pressed="true"] { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
.count { font-size:13px; color:var(--muted); margin:8px 2px 6px; }

/* rows */
.list { display:flex; flex-direction:column; gap:6px; }
.row { background:var(--surface); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
.row-btn { width:100%; display:block; text-align:left; background:none; border:0; padding:11px 12px; cursor:pointer; }
.l1 { display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
.sym { font-weight:700; font-size:15px; }
.chg { font-weight:700; font-size:15px; }
.l2 { display:flex; align-items:center; gap:10px; margin-top:4px; font-size:13px; color:var(--muted); }
.l2 .m b { color:var(--ink); font-weight:600; }
.l2 .pill { margin-left:auto; }
.pill { display:inline-block; border-radius:999px; padding:2px 9px; font-size:12px; font-weight:600; line-height:1.6; white-space:nowrap; }
.pill.b { background:var(--bull-soft); color:var(--bull); } .pill.r { background:var(--bear-soft); color:var(--bear); }
.pill.n { background:var(--neutral-soft); color:var(--neutral); } .pill.u { background:var(--unc-soft); color:var(--unc); }
.up { color:var(--bull); } .down { color:var(--bear); } .flat { color:var(--muted); }
.row.open { border-color:var(--line-strong); }

/* expanded detail */
.detail { border-top:1px solid var(--line); padding:12px; }
.grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.cell { background:var(--bg); border-radius:10px; padding:8px 10px; }
.cell small { display:block; font-size:12px; color:var(--muted); }
.cell b { display:block; font-size:16px; font-weight:600; margin-top:1px; }
.cell em { display:block; font-style:normal; font-size:12px; color:var(--muted); margin-top:1px; }
.why { margin:12px 0 0; }
.why h3 { font-size:13px; font-weight:600; margin:0 0 6px; color:var(--muted); }
.why ul { margin:0; padding-left:18px; font-size:14px; }
.why li { margin:3px 0; }
.chart { margin-top:12px; }
.chart h3 { font-size:13px; font-weight:600; margin:0 0 6px; color:var(--muted); }
.chart svg { width:100%; height:110px; display:block; }
.chart .axis { display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-top:4px; }
.chart .mm { display:flex; justify-content:space-between; font-size:12px; color:var(--muted); }
.empty { text-align:center; color:var(--muted); padding:32px 8px; }

.news { margin:4px 0 8px; padding-left:18px; } .news li { margin:4px 0; } .news a { color:var(--accent); }
/* call tracking */
.callbar { display:flex; gap:6px; align-items:center; margin:6px 0 8px; flex-wrap:wrap; }
.callbar .chip[aria-pressed="true"] { background:var(--bear); border-color:var(--bear); color:#fff; }
.callbtns { display:flex; gap:6px; margin-left:auto; }
.callbtns button { border:1px solid var(--line-strong); background:var(--surface); border-radius:8px; padding:4px 10px; font-size:12px; font-weight:600; min-height:32px; cursor:pointer; }
.callbtns .b { color:var(--bull); } .callbtns .r { color:var(--bear); } .callbtns .n { color:var(--neutral); }
.yours { margin-left:auto; font-size:12px; color:var(--muted); }
.yours b { color:var(--ink); }
.scoreboard { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin:0 0 12px; font-size:14px; }
.scoreboard h2 { font-size:15px; margin:0 0 6px; }
.scoreboard .stat { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:8px 0; }
.scoreboard .stat div { background:var(--bg); border-radius:10px; padding:8px 10px; }
.scoreboard .stat small { display:block; color:var(--muted); font-size:12px; }
.scoreboard .stat b { font-size:20px; }
.scoreboard table { width:100%; border-collapse:collapse; font-size:12px; margin-top:8px; }
.scoreboard th, .scoreboard td { padding:5px 4px; border-bottom:1px solid var(--line); text-align:left; white-space:nowrap; }
.scoreboard td.ok { color:var(--bull); } .scoreboard td.bad { color:var(--bear); }
.scoreboard select { font:inherit; padding:4px 6px; border-radius:8px; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink); }
.scoreboard .tools { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
.scoreboard .tools .chip { min-height:32px; padding:5px 10px; }
/* AI read-out (descriptive only) */
.readout { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin:0 0 12px; font-size:14px; }
.readout h2 { font-size:13px; font-weight:600; color:var(--muted); margin:0 0 6px; }
.readout p { margin:0 0 8px; } .readout p:last-child { margin:0; }


.verdictcard { border:1px solid var(--line); border-radius:12px; padding:10px 12px; background:var(--bg); }
.verdictcard .vhead { margin:0 0 8px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.verdictcard .vhead small { color:var(--muted); }
.vrows > div { display:flex; gap:8px; padding:3px 0; font-size:13px; }
.vrows > div > b { flex:0 0 56px; color:var(--muted); font-weight:600; }
.vrows > div > span { flex:1; min-width:0; }
.vlist { margin:0; padding-left:16px; }
.vlist li { margin:2px 0; }
.vlist small, .vrows small { color:var(--muted); }
/* live, strikes, commentary, orders */
.livebar { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); margin:6px 0 0; }
.livebar .dot { width:8px; height:8px; border-radius:50%; background:var(--neutral); flex:0 0 auto; }
.livebar .dot.on { background:var(--bull); }
.headrow { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
.btn { border:1px solid var(--line-strong); background:var(--surface); border-radius:10px; padding:9px 12px; font-size:14px; min-height:40px; cursor:pointer; }
.btn.primary { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
.btn.danger { background:var(--bear); color:#fff; border-color:var(--bear); }
.btn[disabled] { opacity:.5; cursor:default; }
.l3 { margin-top:4px; font-size:13px; color:var(--muted); }
.l3 b { color:var(--ink); font-weight:600; }
.section { margin-top:14px; }
.section h3 { font-size:13px; font-weight:600; margin:0 0 6px; color:var(--muted); }
.levels { font-size:13px; color:var(--muted); margin:0 0 8px; line-height:1.5; }
.levels b { color:var(--ink); font-weight:600; }
.strikes { width:100%; border-collapse:collapse; font-size:12px; }
.strikes th { font-weight:500; color:var(--muted); text-align:right; padding:4px 3px; border-bottom:1px solid var(--line); white-space:nowrap; }
.strikes td { text-align:right; padding:5px 3px; border-bottom:1px solid var(--line); white-space:nowrap; }
.strikes th.k, .strikes td.k { text-align:center; font-weight:600; background:var(--bg); }
.strikes tr.atm td.k { outline:2px solid var(--accent); outline-offset:-2px; }
.strikes td.hi-pe { color:var(--bull); font-weight:600; } .strikes td.hi-ce { color:var(--bear); font-weight:600; }
.strikes small { display:block; color:var(--muted); font-size:11px; }
.strikes tr.tap { cursor:pointer; }
.actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
.commentary { font-size:14px; line-height:1.5; margin:8px 0 0; }
.commentary small { display:block; color:var(--muted); font-size:12px; margin-top:6px; }
.sheet-bg { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:20; display:flex; align-items:flex-end; justify-content:center; }
.sheet { background:var(--surface); color:var(--ink); width:100%; max-width:640px; border-radius:16px 16px 0 0; padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px)); max-height:88vh; overflow:auto; }
.sheet h2 { font-size:17px; margin:0 0 4px; }
.sheet .sub { color:var(--muted); font-size:13px; margin:0 0 10px; }
.field { margin:10px 0; }
.field label { display:block; font-size:12px; color:var(--muted); margin-bottom:4px; }
.seg2 { display:flex; border:1px solid var(--line-strong); border-radius:10px; overflow:hidden; }
.seg2 button { flex:1; border:0; background:var(--surface); padding:10px; min-height:42px; cursor:pointer; }
.seg2 button[aria-pressed="true"] { background:var(--accent); color:var(--accent-ink); }
.seg2 button.buy[aria-pressed="true"] { background:var(--bull); color:#fff; } .seg2 button.sell[aria-pressed="true"] { background:var(--bear); color:#fff; }
.stepper { display:flex; align-items:center; gap:10px; }
.stepper button { width:42px; height:42px; border-radius:10px; border:1px solid var(--line-strong); background:var(--surface); font-size:20px; cursor:pointer; }
.stepper b { font-size:18px; min-width:2ch; text-align:center; }
.num { width:100%; padding:10px 12px; border:1px solid var(--line-strong); border-radius:10px; background:var(--surface); color:var(--ink); font-size:16px; }
.review { background:var(--bg); border-radius:10px; padding:10px 12px; font-size:14px; margin:10px 0; }
.review div { display:flex; justify-content:space-between; gap:8px; padding:2px 0; }
.review span:first-child { color:var(--muted); }
.badge { display:inline-block; border-radius:6px; padding:2px 8px; font-size:12px; font-weight:700; }
.badge.paper { background:var(--neutral-soft); color:var(--neutral); } .badge.live { background:var(--bear); color:#fff; }
.err { color:var(--bear); font-size:13px; margin:6px 0; }
.ok { color:var(--bull); font-size:14px; margin:6px 0; }
.chk { display:flex; gap:8px; align-items:flex-start; font-size:13px; margin:8px 0; }
.chk input { width:20px; height:20px; margin:0; }
.olist { font-size:13px; }
.olist .o { border-top:1px solid var(--line); padding:8px 0; display:flex; justify-content:space-between; gap:8px; }
.olist .o span:last-child { text-align:right; color:var(--muted); }
.olist .o span:first-child b, .olist .o span:last-child b { color:var(--ink); }
.olist .o b.up { color:var(--bull); } .olist .o b.down { color:var(--bear); }
.oh { font-size:13px; color:var(--muted); margin:14px 0 4px; }
.reasons { margin:4px 0 8px; padding-left:18px; font-size:13px; color:var(--muted); }
.reasons li { margin:2px 0; }
.err .reasons { color:var(--bear); }
.tag { display:inline-block; font-size:12px; border:1px solid var(--accent); color:var(--accent); border-radius:8px; padding:3px 8px; margin:2px 0 8px; }
.strikes.lv { margin:0 0 10px; }
.strikes.lv td, .strikes.lv th { text-align:left; }
.closebox { padding:0 0 6px; }
.paperbar { flex-wrap:wrap; }
.paperbar b.up { color:var(--bull); } .paperbar b.down { color:var(--bear); }

/* permanent disclaimer */
.disclaimer {
  position:fixed; left:0; right:0; bottom:0; z-index:10;
  background:var(--surface); border-top:2px solid var(--bear);
  padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));
  font-size:12px; line-height:1.4; color:var(--ink);
}
.disclaimer div { max-width:640px; margin:0 auto; }
.disclaimer b { color:var(--bear); }

@media (prefers-reduced-motion: no-preference) {
  .detail { animation:open .16s ease-out; }
  @keyframes open { from { opacity:0; transform:translateY(-4px);} to { opacity:1; transform:none;} }
}
@media (min-width:480px) { .grid { grid-template-columns:repeat(4,1fr); } }
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <div class="headrow">
      <div>
        <h1>F&amp;O scan</h1>
        <p id="asof"></p>
      </div>
      <button class="btn" id="ordersBtn" type="button" hidden>Orders</button>
    </div>
    <p id="built"></p>
    <div class="livebar" id="livebar" hidden><span class="dot" id="livedot"></span><span id="livetext"></span></div>
    <div class="livebar paperbar" id="paperbar" hidden></div>
  </header>

  <div id="notice" class="notice" hidden></div>
  <div id="ddnotice" class="notice" hidden></div>

  <section class="summary" aria-label="Summary">
    <div class="summary-line"><strong id="headline"></strong><span id="universe"></span></div>
    <div class="bar" id="bar" aria-hidden="true"></div>
    <div class="segs" id="segs" role="group" aria-label="Filter by label"></div>
  </section>

  <section class="readout" id="readout" hidden aria-label="Plain-English read-out"></section>

  <div class="controls">
    <input class="search" id="q" type="search" inputmode="search" autocomplete="off" placeholder="Find a symbol" aria-label="Find a symbol">
    <div class="sorts" id="sorts" role="group" aria-label="Sort"></div>
  </div>
  <div class="callbar">
    <button class="chip" type="button" id="callToggle" aria-pressed="false">Call mode</button>
    <button class="chip" type="button" id="scoreToggle" aria-pressed="false">Scoreboard</button>
    <span class="count" id="callHint" style="margin:0"></span>
  </div>
  <section class="scoreboard" id="scoreboard" hidden aria-label="Your calls versus the system"></section>
  <p class="count" id="count" aria-live="polite"></p>

  <div class="list" id="list"></div>
</div>

<footer class="disclaimer" role="note"><div id="disc"></div></footer>

<script id="scoring">
// Honest scoring rules as pure functions, used by the scoreboard below and by tests/test_step8_scoreboard.py (node).
//  - move: the stock's return over h sessions minus the index's over the same sessions (market-adjusted)
//  - a bullish/bearish call is a hit when |move| > threshold and the move is in its direction;
//    smaller moves and neutral calls are shown but not scored
//  - only the first call on a stock in any 3 sessions is scored; later ones are duplicates
//  - beating a coin at N scored calls needs N/2 + 1.645·√N/2 hits (31/50, 59/100, 112/200, 217/400)
const Scoring = (() => {
  const needed = n => n > 0 ? Math.ceil(n / 2 + 1.645 * Math.sqrt(n) / 2) : null;
  const refLine = () => "Hits needed to beat a coin at this N: " + [50, 100, 200, 400].map(n => `${needed(n)}/${n}`).join(", ");
  const weekdaysBetween = (a, b) => {
    const d = new Date(a + "T00:00:00Z"), e = new Date(b + "T00:00:00Z"); let n = 0;
    while (d < e) { d.setUTCDate(d.getUTCDate() + 1); const w = d.getUTCDay(); if (w > 0 && w < 6) n++; }
    return n;
  };
  // sessions the page knows (every stock's chart dates and the index's); weekdays for anything outside them
  function calendar(dateLists) {
    const dates = [...new Set([].concat(...dateLists))].sort(), pos = new Map(dates.map((d, i) => [d, i]));
    return { dates, between: (a, b) => pos.has(a) && pos.has(b) ? pos.get(b) - pos.get(a) : (a <= b ? weekdaysBetween(a, b) : -weekdaysBetween(b, a)) };
  }
  function fwd(dates, closes, d, h) {
    const i = dates.indexOf(d);
    return i < 0 || i + h >= closes.length ? null : { ret: (closes[i + h] / closes[i] - 1) * 100, to: dates[i + h] };
  }
  function indexReturn(index, from, to) {
    if (!index) return null;
    const a = index.dates.indexOf(from), b = index.dates.indexOf(to);
    return a < 0 || b < 0 ? null : (index.closes[b] / index.closes[a] - 1) * 100;
  }
  function adjusted(dates, closes, index, d, h) {
    const f = fwd(dates, closes, d, h); if (!f) return null;
    if (!index) return +f.ret.toFixed(2);
    const ir = indexReturn(index, d, f.to);
    return ir == null ? null : +(f.ret - ir).toFixed(2);
  }
  // items: [{symbol, as_of, dir: "bullish" | "bearish" | anything else, move: adjusted % or null}]
  function score(items, cal, threshold, gap = 3) {
    const last = {}, counts = { dup: 0, small: 0, nodir: 0, pending: 0 };
    let n = 0, hits = 0;
    const rows = items.slice().sort((a, b) => a.as_of.localeCompare(b.as_of) || a.symbol.localeCompare(b.symbol)).map(it => {
      let status;
      if (last[it.symbol] != null && cal.between(last[it.symbol], it.as_of) < gap) status = "dup";
      else {
        last[it.symbol] = it.as_of;
        if (it.dir !== "bullish" && it.dir !== "bearish") status = "nodir";
        else if (it.move == null) status = "pending";
        else if (Math.abs(it.move) <= threshold) status = "small";
        else { n++; const hit = (it.move > 0) === (it.dir === "bullish"); if (hit) hits++; status = hit ? "hit" : "miss"; }
      }
      if (status in counts) counts[status]++;
      return { ...it, status };
    });
    const need = needed(n);
    return { n, hits, accuracy: n ? hits / n : null, needed: need, clears: n ? hits >= need : null, ...counts, rows };
  }
  // naive baseline: "always bullish on the top-k volume-ratio stocks" on every session the page has
  function baseline(stocks, cal, index, h, k = 10) {
    const items = [];
    for (const d of cal.dates) {
      const ranked = [];
      for (const s of stocks) {
        const i = (s.chart_dates || []).indexOf(d);
        const v = i >= 0 && s.chart_volume_ratios ? s.chart_volume_ratios[i] : null;
        if (v != null) ranked.push([v, s]);
      }
      ranked.sort((a, b) => b[0] - a[0] || a[1].symbol.localeCompare(b[1].symbol));
      for (const [, s] of ranked.slice(0, k))
        items.push({ symbol: s.symbol, as_of: d, dir: "bullish", move: adjusted(s.chart_dates, s.chart_closes, index, d, h) });
    }
    return items;
  }
  return { needed, refLine, calendar, fwd, indexReturn, adjusted, score, baseline };
})();

<script>

  // ---- call tracking: your own bullish/bearish/neutral call, made before the label is shown,
  //      scored later against what the price actually did, alongside the system's label.
  const CALLS_KEY = "fos_calls_v1", SETTINGS_KEY = "fos_calls_settings";
  let callMode = false, showScore = false, storageOk = true;
  let calls = [], scoreCfg = { horizon: 3, threshold: 1.0 };
  try { calls = JSON.parse(localStorage.getItem(CALLS_KEY) || "[]"); scoreCfg = Object.assign(scoreCfg, JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}")); }
  catch (e) { storageOk = false; }
  const LEAN = { "Bullish setup": "bullish", "Bearish setup": "bearish", "Neutral": "neutral" };

  const callFor = sym => calls.find(c => c.symbol === sym && c.as_of === meta.as_of);

    if (callFor(s.symbol)) return;

  }
  // forward stock and index returns for each call, stored while the page's history still covers them

  function scoreCalls() {
    let changed = false;
    for (const c of calls) {
      const st = stocks.find(x => x.symbol === c.symbol); if (!st) continue;
      c.rets = c.rets || {}; c.irets = c.irets || {};
      for (const h of [1, 3, 5]) {
        const f = Scoring.fwd(st.chart_dates, st.chart_closes, c.as_of, h); if (!f) continue;
        if (c.rets[h] == null) { c.rets[h] = +f.ret.toFixed(2); changed = true; }
        if (c.irets[h] == null) { const ir = Scoring.indexReturn(IDX, c.as_of, f.to); if (ir != null) { c.irets[h] = +ir.toFixed(2); changed = true; } }
      }
    }
    if (changed) saveCalls();
  }
  // market-adjusted move in %, or null while unknown; raw when this build has no index
  const moveOf = (c, h) => {
    const r = c.rets && c.rets[h]; if (r == null) return null;

  };
  function scoreStats() {
    const h = scoreCfg.horizon, th = scoreCfg.threshold;
    const as = key => calls.map(c => ({ symbol: c.symbol, as_of: c.as_of, dir: c[key], move: moveOf(c, h), c }));
    return { you: Scoring.score(as("call"), CAL, th), sys: Scoring.score(as("system"), CAL, th),
             base: Scoring.score(Scoring.baseline(stocks, CAL, IDX, h), CAL, th),

  }
  function renderScoreboard() {
    const el = $("#scoreboard"); el.hidden = !showScore; if (!showScore) return;
    scoreCalls(); const st = scoreStats(), h = scoreCfg.horizon, th = scoreCfg.threshold;
    const pctOf = (a, b) => b ? Math.round(100 * a / b) + "%" : "—";
    const need = s => !s.n ? "—" : s.needed > s.n ? "N too small" : s.needed + "/" + s.n;
    const line = (name, s) => `<tr><td>${name}</td><td>${s.n}</td><td>${s.hits}</td><td>${pctOf(s.hits, s.n)}</td><td>${need(s)}</td><td class="${s.clears ? "ok" : s.n ? "bad" : ""}">${s.n ? (s.clears ? "yes" : "no") : "—"}</td></tr>`;

    const yours = new Map(st.you.rows.map(r => [r.c, r])), sys = new Map(st.sys.rows.map(r => [r.c, r]));
    const cls = r => r && r.status === "hit" ? "ok" : r && r.status === "miss" ? "bad" : "";
    const rows = calls.slice().reverse().slice(0, 30).map(c => {
      const m = moveOf(c, h), y = yours.get(c), s = sys.get(c);
      return `<tr><td>${esc(c.symbol)}</td><td>${esc(c.as_of.slice(5))}</td><td class="${cls(y)}">${esc(c.call)}</td><td class="${cls(s)}">${esc(c.system || "—")}</td><td>${m == null ? "pending" : (m > 0 ? "+" : "") + m + "%"}</td><td>${esc(STATUS[y.status])}</td></tr>`;
    }).join("");
    el.innerHTML = `<h2>Your calls vs the system</h2>
      <p class="count" style="margin:0">Scored on the ${IDX ? "market-adjusted" : "raw"} move ${h} session${h === 1 ? "" : "s"} later: the stock's return ${IDX ? "minus " + esc(IDX.name) + "'s over the same sessions" : "(this build has no index, so moves are not market-adjusted)"}. A bullish or bearish call is a hit when the move goes its way by more than ±${th}%. Smaller moves and neutral calls are shown but not scored, and only the first call on a stock in any 3 sessions counts. The system's label and the baseline are scored by the same rules.${storageOk ? "" : " Storage is unavailable in this browser, so calls last only for this visit."}</p>
      <div style="overflow-x:auto"><table><thead><tr><th></th><th>Scored</th><th>Hits</th><th>Accuracy</th><th>Needed</th><th>Beats a coin</th></tr></thead><tbody>
        ${line("You", st.you)}${line("System labels", st.sys)}${line("Baseline: always bullish on the top-10 volume-ratio stocks", st.base)}</tbody></table></div>
      <p class="count" style="margin:6px 0 0">${Scoring.refLine()} (N/2 + 1.645·√N/2).</p>
      <p class="count" style="margin:4px 0 0">Calls made ${st.total} · waiting for data ${st.you.pending} · duplicates ${st.you.dup} · moves within ±${th}% ${st.you.small} · neutral ${st.you.nodir} · you agreed with the label on ${pctOf(st.agree, st.total)} of calls, before seeing it. The baseline runs over the ${CAL.dates.length} sessions in this page's history.</p>
      <div id="paperScore"></div>
      <div class="tools"><label>Horizon <select id="hz">${[1,3,5].map(v => `<option value="${v}" ${v === h ? "selected" : ""}>${v} session${v === 1 ? "" : "s"}</option>`).join("")}</select></label>
        <label>Threshold <select id="th">${[0.5,1,2].map(v => `<option value="${v}" ${v === th ? "selected" : ""}>±${v}%</option>`).join("")}</select></label>
        <button class="chip" type="button" id="exportCalls">Export</button><label class="chip" style="cursor:pointer">Import<input type="file" id="importCalls" accept="application/json" hidden></label>
        <button class="chip" type="button" id="clearCalls">Clear all</button></div>
      ${rows ? `<div style="overflow-x:auto"><table><thead><tr><th>Stock</th><th>Date</th><th>You</th><th>System</th><th>Move</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></div>` : "<p class=\"count\">No calls yet. Turn on Call mode, judge a stock from its numbers, then tap Bull, Bear or Neutral.</p>"}`;
    $("#hz").addEventListener("change", e => { scoreCfg.horizon = +e.target.value; saveCalls(); renderScoreboard(); });

    $("#exportCalls").addEventListener("click", () => { const a = document.createElement("a"); a.href = "data:application/json," + encodeURIComponent(JSON.stringify({ calls, scoreCfg }, null, 1)); a.download = "fo-scanner-calls.json"; a.click(); });
    $("#importCalls").addEventListener("change", async e => { try { const j = JSON.parse(await e.target.files[0].text()); const inc = j.calls || j; const have = new Set(calls.map(c => c.symbol + c.as_of)); for (const c of inc) if (!have.has(c.symbol + c.as_of)) calls.push(c); saveCalls(); renderScoreboard(); render(); } catch (err) { alert("Could not read that file"); } });
    $("#clearCalls").addEventListener("click", () => { if (confirm("Delete all recorded calls?")) { calls = []; saveCalls(); renderScoreboard(); render(); } });
    if (SERVER.orders && SERVER.paper) renderPaperScore();
  }
  // second score, from the paper ledger: what the trades made after real fills and charges, per bucket
  async function renderPaperScore() {

      box.innerHTML = `<h2 style="margin-top:12px">Paper trades, realistic net</h2>

        <div style="overflow-x:auto"><table><thead><tr><th>Bucket</th><th>Trades</th><th>Won</th><th>Win rate</th><th>Mean net</th><th>Mean return</th><th>Total net</th><th>Needed</th></tr></thead>

  }
  $("#callToggle").addEventListener("click", e => { callMode = !callMode; e.currentTarget.setAttribute("aria-pressed", callMode); $("#callHint").textContent = callMode ? "Labels hidden until you call each stock" : ""; render(); });
  $("#scoreToggle").addEventListener("click", e => { showScore = !showScore; e.currentTarget.setAttribute("aria-pressed", showScore); renderScoreboard(); });
  scoreCalls();

  const segs = $("#segs");
  const segDefs = [["all", "All", total, ""], ["Bullish setup", "Bullish", sum.bullish, "b"], ["Bearish setup", "Bearish", sum.bearish, "r"], ["Neutral", "Neutral", sum.neutral, "n"]];

    btn.innerHTML =
      `<div class="l1"><span class="sym">${esc(s.symbol)}</span><span class="chg ${dirClass(s.price_change_pct)}">${pct(s.price_change_pct)}</span></div>
       <div class="l2"><span class="m">Vol <b>${ratio(s.volume_ratio)}</b></span><span class="m">OI <b>${pct(s.oi_change_pct)}</b></span><span class="m">PCR <b>${num(s.pcr)}</b></span>${tail}</div>` + liveLine(s);
    btn.querySelectorAll("[data-call]").forEach(b => b.addEventListener("click", ev => { ev.stopPropagation(); recordCall(s, b.dataset.call); }));
    btn.addEventListener("click", () => { openSym = openSym === s.symbol ? null : s.symbol; render(); if (openSym) wrap.scrollIntoView({ block: "nearest" }); });

  // ---- verdict card: deterministic, computed at build time (scanner/verdict_rules.py); identical

    const patLine = t => {
      const p = pat[t]; if (!p || !p.count) return "";
      return ` <small>pattern over ${p.count} cases: pre ${sgnpct(p.pre)}, day ${sgnpct(p.day)}, post ${sgnpct(p.post)}</small>`;
    };
    const evLines = [];
    for (const u of ev.upcoming) evLines.push(`<li>${esc(u.type)} in ${u.sessions} session${u.sessions === 1 ? "" : "s"} (${esc(u.date)})${patLine(u.type)}</li>`);
    for (const e of ev.last_10) evLines.push(`<li>${esc(e.type)}${e.subtype ? " / " + esc(e.subtype) : ""} [${esc(e.bucket)}] ${esc(e.event_date)}${e.value_cr ? " · ₹" + inr(e.value_cr) + " cr" : ""}${patLine(e.type)}</li>`);
    const analyst = ev.analyst_view.map(a => `<li><a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.subject.slice(0, 90))}</a> <small>${esc(a.label)}</small></li>`).join("");
    const filings = ev.last_10.filter(e => e.url).slice(0, 6).map(e => `<a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.type)} ${esc(e.event_date)}</a>`).join(" · ");
    const m = s.model;
    return `<div class="section verdictcard"><h3>Verdict (computed by fixed rules, not advice)</h3>

        <small>votes — data ${sgn0(v.votes.data)}, model ${sgn0(v.votes.model)}, events ${sgn0(v.votes.events)} (score ${v.events_score})</small></p>

        <div><b>Model</b><span>${m ? `p(up) ${num(m.p_up)} · p(down) ${num(m.p_down)} · p(flat) ${num(m.p_flat)} <small>out-of-sample Brier ${num(m.oos_brier)} vs base rate ${m.base_brier != null ? num(m.base_brier) : "—"} (lower is better; the base rate always predicts the class shares) · vote weight ${v.votes.model_weight != null ? v.votes.model_weight : 1}${v.votes.model_weight === 0 ? ` (would have voted ${sgn0(v.votes.model_raw)})` : ""} · trained through ${esc(m.trained_through)}</small>${s.model_top_decile ? ` <small class="topdec">top decile of today's p(${s.model_top_decile === "both" ? "up) and p(down" : esc(s.model_top_decile)}) · display only, not a vote</small>` : ""}` : "no model in this build"}</span></div>
        <div><b>Analyst</b><span>${analyst ? `<ul class="vlist">${analyst}</ul>` : "no analyst views (tier-3 news) in the last 5 sessions"}</span></div>
        <div><b>News</b><span>${filings || "no filing links in the window"}</span></div>
      </div></div>`;
  }
  function sgnpct(v) { return v == null ? "—" : (v > 0 ? "+" : "") + v + "%"; }
  function sgn0(v) { return v > 0 ? "+1" : v < 0 ? "−1" : "0"; }

  function liveLine(s) {
    const q = LIVE.quotes[s.symbol]; if (!q) return "";
    return `<div class="l3">Live <b class="${dirClass(q.chg_pct)}">₹${inr(q.ltp)} ${pct(q.chg_pct)}</b>` +
      (q.fut_oi != null ? ` · fut OI <b>${inr(q.fut_oi)}</b> <b class="${dirClass(q.fut_oi_chg_pct)}">${pct(q.fut_oi_chg_pct)}</b> vs close${q.oi_ts ? " <small>(" + q.oi_ts + ")</small>" : ""}` : "") +
      (q.live_pcr != null ? ` · PCR <b>${num(q.live_pcr)}</b>${q.pcr_ts ? " <small>(" + q.pcr_ts + ")</small>" : ""}` : "") + `</div>`;
  }

  function detailEl(s) {
    const d = document.createElement("div"); d.className = "detail"; d.id = "d-" + s.symbol;
    d.innerHTML = `
      <div class="grid">
        ${cell("Close", "₹" + inr(s.close), "prev ₹" + inr(s.prev_close) + " (" + s.prev_date + ")")}
        ${cell("Price change", pct(s.price_change_pct), "close vs previous close", dirClass(s.price_change_pct))}
        ${cell("Volume", inr(s.volume), "20-day avg " + (s.avg_volume_20d != null ? inr(s.avg_volume_20d) : "—"))}
        ${cell("Volume ratio", ratio(s.volume_ratio), "volume ÷ its 20-day average")}
        ${cell("Futures OI", s.fut_oi != null ? inr(s.fut_oi) : "—", s.fut_oi_prev != null ? "prev " + inr(s.fut_oi_prev) : "not available")}
        ${cell("OI change", pct(s.oi_change_pct), "all expiries combined", dirClass(s.oi_change_pct))}
        ${cell("Options OI", s.call_oi != null ? "C " + inr(s.call_oi) : "—", s.put_oi != null ? "P " + inr(s.put_oi) : "not available")}
        ${cell("PCR", num(s.pcr), "put OI ÷ call OI")}
      </div>
      ${callMode && !callFor(s.symbol) ? `<div class="why"><h3>Label hidden</h3><p class="count" style="margin:0">Make your call on this row first; the label and its reasons appear after.</p></div>` : `<div class="why"><h3>Why “${esc(s.label)}”</h3><ul>${s.reasons.map(r => "<li>" + esc(r) + "</li>").join("")}</ul></div>`}
      <div class="chart"><h3>Close, last ${s.chart_closes.length} sessions</h3>${sparkline(s)}</div>
      ${verdictCard(s)}
      <div class="section" id="strikes-${s.symbol}">${strikesEl(s, s.chain)}</div>
      ${SERVER.commentary ? `<div class="section"><h3>Plain-language reading</h3><button class="btn" type="button" data-explain="${s.symbol}">Explain these numbers</button><div class="commentary" id="c-${s.symbol}"></div></div>` : ""}
      ${SERVER.verdict ? `<div class="section"><h3>Evidence verdict (numbers + news)</h3><button class="btn" type="button" data-verdict="${s.symbol}">Weigh the evidence</button><div class="commentary verdict" id="v-${s.symbol}"></div></div>` : ""}
      ${SERVER.orders && s.chain ? `<div class="actions"><button class="btn" type="button" data-trade="FUT">Order: ${esc(s.symbol)} future</button></div>` : ""}`;
    d.querySelectorAll("[data-explain]").forEach(b => b.addEventListener("click", () => explain(s, b)));
    d.querySelectorAll("[data-verdict]").forEach(b => b.addEventListener("click", () => verdict(s, b, false)));
    d.querySelectorAll("[data-trade]").forEach(b => b.addEventListener("click", () => openSheet(s, "FUT", null)));
    d.querySelectorAll("tr.tap").forEach(tr => tr.addEventListener("click", () => openSheet(s, "CE", Number(tr.dataset.strike))));
    if (s.chain && SERVER.live) refreshChain(s, d);
    return d;
  }

  function strikesEl(s, chain) {
    if (!chain) return `<h3>Strikes</h3><p class="levels">${s.chain_problem ? "Strike table unavailable for this stock: " + esc(s.chain_problem) + "." : meta.chain_available === false ? "Strike tables could not be built for this session (" + esc(meta.chain_status || "") + "); OI, PCR and labels are unaffected." : meta.fo_available ? "No options data for this stock." : "Strike-level data needs the F&O bhavcopy, which is not in this build."}</p>`;
    const live = chain.live_at ? ` · live ${chain.live_at}` : "";
    const rows = chain.strikes.map(r => {
      const isAtm = r.strike === chain.atm, hiCe = r.strike === chain.max_call_oi_strike, hiPe = r.strike === chain.max_put_oi_strike;
      const ceOi = r.ce_live_oi ?? r.ce_oi, peOi = r.pe_live_oi ?? r.pe_oi, cePx = r.ce_live_ltp ?? r.ce_close, pePx = r.pe_live_ltp ?? r.pe_close;
      return `<tr class="${isAtm ? "atm" : ""}${SERVER.orders ? " tap" : ""}" data-strike="${r.strike}">
        <td class="${hiPe ? "hi-pe" : ""}">${inr(peOi)}<small>${sgn(r.pe_oi_chg)}</small></td><td>${inr(pePx)}</td>
        <td class="k">${fmtStrike(r.strike)}</td>
        <td>${inr(cePx)}</td><td class="${hiCe ? "hi-ce" : ""}">${inr(ceOi)}<small>${sgn(r.ce_oi_chg)}</small></td></tr>`;
    }).join("");
    const note = chain.one_sided_strikes ? `<p class="levels" style="color:var(--muted)">${chain.one_sided_strikes} strike${chain.one_sided_strikes === 1 ? " is" : "s are"} listed on one side only in NSE's file; the missing side shows 0 OI and no price.</p>` : "";
    return `<h3>Strikes, expiry ${chain.expiry}${live}</h3>${note}
      <p class="levels">Highest call OI at <b>${fmtStrike(chain.max_call_oi_strike)}</b> (commonly read as a resistance zone) · highest put OI at <b>${fmtStrike(chain.max_put_oi_strike)}</b> (support zone) · max pain <b>${fmtStrike(chain.max_pain)}</b> · ATM <b>${fmtStrike(chain.atm)}</b>. Total put OI ${inr(chain.total_pe_oi)}, call OI ${inr(chain.total_ce_oi)}.${SERVER.orders ? " Tap a strike to prepare an order." : ""}</p>
      <div style="overflow-x:auto"><table class="strikes"><thead><tr><th>Put OI<br><small>Δ OI</small></th><th>Put ₹</th><th class="k">Strike</th><th>Call ₹</th><th>Call OI<br><small>Δ OI</small></th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }

  async function refreshChain(s, d) {
    try {
      const r = await fetch(`/api/chain/${encodeURIComponent(s.symbol)}`, auth); if (!r.ok) return;
      const chain = await r.json(); const el = d.querySelector(`#strikes-${CSS.escape(s.symbol)}`); if (!el) return;
      el.innerHTML = strikesEl(s, chain);
      el.querySelectorAll("tr.tap").forEach(tr => tr.addEventListener("click", () => openSheet(s, "CE", Number(tr.dataset.strike))));
    } catch (e) { /* keep EOD chain */ }
  }

  async function explain(s, btn) {
    const box = $("#c-" + CSS.escape(s.symbol)); btn.disabled = true; btn.textContent = "Reading the numbers…";
    try {
      const r = await fetch(`/api/commentary/${encodeURIComponent(s.symbol)}`, auth); const j = await r.json();
      if (!r.ok) throw new Error(j.error || r.status);
      box.innerHTML = esc(j.text) + `<small>${j.ai ? "Written by AI (" + esc(j.model) + ") from the numbers above. Descriptive only: it does not tell you what to trade." : "Deterministic summary (AI reading unavailable)."}</small>`;
      btn.remove();
    } catch (e) { box.innerHTML = `<span class="err">Could not get a reading: ${esc(e.message)}</span>`; btn.disabled = false; btn.textContent = "Explain these numbers"; }
  }

  async function verdict(s, btn, refresh) {
    const box = $("#v-" + CSS.escape(s.symbol)); btn.disabled = true; btn.textContent = "Searching news and weighing the numbers…";
    try {
      const r = await fetch(`/api/verdict/${encodeURIComponent(s.symbol)}${refresh ? "?refresh=1" : ""}`, auth); const j = await r.json();
      if (!r.ok) throw new Error(j.error || r.status);
      const cls = j.lean === "bullish" ? "b" : j.lean === "bearish" ? "r" : "n";
      const news = (j.news || []).map(n => `<li><a href="${esc(n.url || "#")}" target="_blank" rel="noopener">${esc(n.headline)}</a> <small>${esc(n.source || "")} ${esc(n.date || "")} ${n.direction === "+" ? "▲" : n.direction === "-" ? "▼" : "•"}</small>${n.why ? `<br><small>${esc(n.why)}</small>` : ""}</li>`).join("");
      box.innerHTML = `<p><span class="pill ${cls}">Leans ${esc(j.lean)}</span> <b>${esc(j.confidence)} confidence</b></p>
        <p><b>Data:</b> ${esc(j.data_read)}</p>
        ${news ? `<p><b>News found:</b></p><ul class="news">${news}</ul>` : "<p><b>News:</b> nothing material found in the last 10 days.</p>"}
        <p><b>Weighing it:</b> ${esc(j.reasoning)}</p>
        <p><b>Risks to this read:</b> ${esc(j.risks)}</p>
        <p><b>What would change it:</b> ${esc(j.would_change)}</p>
        <small>${j.deterministic ? "Data-only verdict; the AI assessment was unavailable or discarded." : "AI assessment (" + esc(SERVER.model || "Claude") + ", web search) generated " + esc(j.generated_at || "") + "."} An assessment of evidence for your own judgement, not a trade recommendation. <button class="btn" type="button" data-refresh="${esc(s.symbol)}" style="margin-left:6px">Refresh with latest news</button></small>`;
      box.querySelector("[data-refresh]").addEventListener("click", ev => verdict(s, ev.currentTarget, true));
      btn.remove();
    } catch (e) { box.innerHTML = `<span class="err">Could not get a verdict: ${esc(e.message)}</span>`; btn.disabled = false; btn.textContent = "Weigh the evidence"; }
  }

  // ---- live polling
  async function pollLive() {
    try {
      const r = await fetch("/api/live", auth); if (!r.ok) throw new Error(r.status);
      const j = await r.json(); LIVE = j;
      $("#livebar").hidden = false; $("#livedot").className = "dot" + (j.updated_at && j.market_open ? " on" : "");
      $("#livetext").textContent = j.error ? "Live feed error: " + j.error : j.updated_at ? `Live quotes as of ${j.updated_at} IST${j.market_open ? "" : " (market closed)"}, every ${j.poll_seconds}s` : (j.market_open ? "Waiting for the first live quote…" : "Market closed. Live quotes resume at 09:15 IST.");
      render(); refreshPaperBar();
    } catch (e) { $("#livebar").hidden = false; $("#livetext").textContent = "Live feed unreachable"; }
  }
  if (SERVER.live) { pollLive(); setInterval(pollLive, Math.max(10, SERVER.poll_seconds) * 1000); }

  // ---- orders
  if (SERVER.orders) { $("#ordersBtn").hidden = false; $("#ordersBtn").addEventListener("click", openOrders); }

  const LIQ_PILL = { accept: "b", penalty: "u", lottery: "n", refuse: "r" };
  const FILL_RULE = { normal: "book walk + 1 tick", penalty: "book walk + 1 tick + half spread", lottery: "best level ± 1 tick (lottery)" };
  const kv = (k, v) => `<div><span>${k}</span><span>${v}</span></div>`;
  const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
  const money = v => v == null ? "—" : "₹" + inr(v);
  const getJson = async (url, opts) => { const r = await fetch(url, { ...auth, ...(opts || {}) }); const j = await r.json(); if (!r.ok) throw new Error(j.error || r.status); return j; };

  // The paper engine's review: everything the server checked before it will accept Place.
  function paperReviewHtml(pv) {
    const r = pv.review; if (!r) return "";
    const liq = r.liquidity, f = r.fill, ce = r.charges_entry, rt = r.round_trip_now, k = r.risk;
    let h = r.queued ? `<p class="notice" style="margin:8px 0">${esc(r.queued.message)}</p>` : "";
    h += `<div class="review">${kv("Contract", esc(pv.tradingsymbol))}${kv("Quantity", `${inr(r.qty)} (${r.lots} × ${pv.lot_size})`)}
      ${kv("This order", r.intent === "exit" ? "closes (part of) your open position" : "opens a new position")}
      ${liq ? kv("Liquidity", `<span class="pill ${LIQ_PILL[liq.class] || "n"}">${esc(liq.class)}</span>`) : kv("Liquidity", r.quote_error ? "no quote: " + esc(r.quote_error) : "no live quote")}
      ${liq ? kv("Book", `spread ${liq.spread_pct != null ? liq.spread_pct + "%" : "—"} · visible ${inr(liq.visible_qty)} · strike/contract OI ${liq.oi_lots != null ? inr(liq.oi_lots) + " lots" : "—"}`) : ""}</div>`;
    if (liq && liq.reasons.length) h += `<ul class="reasons">${liq.reasons.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`;
    if (r.bucket === "cheap_near_expiry") h += `<p class="tag"><b>cheap_near_expiry</b> · tracked as its own bucket on the scoreboard</p>`;
    if (f) {
      h += `<div class="review">${kv("Expected fill", `₹${inr(f.price)}${r.queued ? " <small>(estimate from the last quote)</small>" : ""}`)}${kv("Mid", money(f.mid))}
        ${kv("Slippage vs mid", f.slippage_vs_mid != null ? `₹${inr(f.slippage_vs_mid)} a unit (${f.slippage_pct}%), ${money(f.slippage_value)} in all` : "—")}${kv("Fill rule", FILL_RULE[f.mode] || esc(f.mode))}</div>
        <table class="strikes lv"><thead><tr><th>Depth level used ₹</th><th>Quantity</th></tr></thead><tbody>${f.levels.map(l => `<tr><td>${inr(l.price)}${l.overflow ? " <small>beyond the visible depth: worst level + one spread</small>" : ""}</td><td>${inr(l.qty)}</td></tr>`).join("")}</tbody></table>`;
    }
    if (ce) {
      h += `<div class="review">${kv("Charges, this order", `${money(ce.total)} <small>brokerage ${inr(ce.brokerage)} · STT ${inr(ce.stt)} · NSE ${inr(ce.exchange)} · SEBI ${inr(ce.sebi)} · stamp ${inr(ce.stamp)} · GST ${inr(ce.gst)}</small>`)}
        ${r.exit_estimate ? kv("This exit realises", `entry ₹${inr(r.exit_estimate.entry_price)} · both legs' charges ${money(r.exit_estimate.charges_total)} · net <b class="${dirClass(r.exit_estimate.net_pnl)}">${money(r.exit_estimate.net_pnl)}</b>`)
          : rt ? kv("Round trip if closed at once", rt.exit_price != null ? `exit ₹${inr(rt.exit_price)} · charges ${money(rt.charges.total)} · net <b class="${dirClass(rt.net_pnl)}">${money(rt.net_pnl)}</b>` : esc(rt.note || "")) : ""}</div>`;
    }
    if (k) {
      const ks = k.kill_switch;
      h += `<div class="review">${kv("Margin", k.margin != null ? `${money(k.margin)} (${esc(k.margin_source)}) · open + this ${money(k.margin_after)} of ${money(k.margin_cap)} cap` : "—")}
        ${kv("Risk", k.max_loss != null ? `max loss ${money(k.max_loss)} of the ${money(k.cap)} per-trade cap (${k.used_pct}%) · cap allows ${plural(k.max_lots, "lot")}` : `per-trade cap ${money(k.cap)}`)}
        ${kv("Day P&L", `<b class="${dirClass(k.day_pnl)}">${money(k.day_pnl)}</b> · week ${money(k.week_pnl)}`)}
        ${kv("Kill switch", ks.active ? `<b class="down">ON</b> ${esc(ks.reason)}` : `off · halts at ${money(ks.day_limit)} a day, ${money(ks.week_limit)} a week`)}
        ${kv("New positions", `${k.new_positions_today} today · ${k.new_positions_month} this month`)}</div>`;
    } else if (r.intent === "exit") {
      h += `<p class="count" style="margin:4px 0">Closing a position: the loss halts and sizing limits do not apply to exits.</p>`;
    }
    if (r.warnings && r.warnings.length) h += `<ul class="reasons">${r.warnings.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`;
    if (r.blocked.length) h += `<div class="err"><b>The server will not accept this order:</b><ul class="reasons">${r.blocked.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>`;
    return h;
  }

  function openSheet(s, instrument, strike) {
    if (!SERVER.orders || !s.chain) return;
    const st = { instrument, strike, side: "BUY", lots: 1, order_type: SERVER.paper ? "MARKET" : "LIMIT", price: null, stop: null,
                 preview: null, err: "", done: null, ack: false, riskCap: null };
    const bg = document.createElement("div"); bg.className = "sheet-bg"; bg.addEventListener("click", e => { if (e.target === bg) bg.remove(); });
    const sheet = document.createElement("div"); sheet.className = "sheet"; sheet.setAttribute("role", "dialog"); sheet.setAttribute("aria-modal", "true"); bg.appendChild(sheet);
    const q = LIVE.quotes[s.symbol];
    const refPrice = () => {
      if (st.instrument === "FUT") return (q && (q.fut_ltp || q.ltp)) || s.close;
      const row = s.chain.strikes.find(r => r.strike === st.strike); if (!row) return null;
      return st.instrument === "CE" ? (row.ce_live_ltp ?? row.ce_close) : (row.pe_live_ltp ?? row.pe_close);
    };
    const maxLots = () => Math.max(1, Math.min(SERVER.max_lots, st.riskCap ?? SERVER.max_lots));
    const capNote = () => st.riskCap == null ? "" : st.riskCap < 1 ? " · the per-trade risk cap allows none" : ` · per-trade risk cap ${st.riskCap}`;
    const stopNeed = () => st.instrument === "FUT" ? "required for futures" : st.side === "SELL" ? "required for short options" : "optional";
    function draw() {
      const contract = st.instrument === "FUT" ? `${s.symbol} ${s.chain.expiry} future` : `${s.symbol} ${s.chain.expiry} ${fmtStrike(st.strike)} ${st.instrument}`;
      const qty = st.lots * (s.lot_size || 0);
      if (st.done) {
        const d = st.done, queued = d.status === "QUEUED";
        sheet.innerHTML = `<h2>${d.paper ? (queued ? "Paper order queued" : "Paper order " + esc(d.status.toLowerCase())) : "Order sent to broker"}</h2><p class="sub">${esc(contract)}</p>
          <div class="review">${kv("Order id", esc(d.order_id))}${kv("Status", esc(d.status))}${kv("Quantity", inr(d.quantity))}
          ${d.fill_price != null ? kv("Fill price", "₹" + inr(d.fill_price)) : ""}${queued ? kv("Fills", "first poll at or after " + esc((d.fill_after || "").slice(0, 16).replace("T", " ")) + " IST") : ""}
          ${d.charges ? kv("Charges", money(d.charges.total)) : ""}${d.net_pnl != null ? kv("Net P&L", `<b class="${dirClass(d.net_pnl)}">${money(d.net_pnl)}</b>`) : ""}
          ${d.bucket ? kv("Bucket", esc(d.bucket)) : ""}</div>
          <button class="btn primary" type="button" id="closeSheet">Close</button>`;
        $("#closeSheet", sheet).addEventListener("click", () => bg.remove()); return;
      }
      const pv = st.preview, canPlace = pv && pv.token;
      sheet.innerHTML = `<h2>${esc(contract)}</h2><p class="sub">Lot size ${s.lot_size ?? "?"} · reference ₹${inr(refPrice())} · <span class="badge ${SERVER.paper ? "paper" : "live"}">${SERVER.paper ? "PAPER" : "LIVE BROKER"}</span></p>
        ${st.instrument !== "FUT" ? `<div class="field"><label>Option</label><div class="seg2"><button type="button" data-i="CE" aria-pressed="${st.instrument === "CE"}">Call ${fmtStrike(st.strike)}</button><button type="button" data-i="PE" aria-pressed="${st.instrument === "PE"}">Put ${fmtStrike(st.strike)}</button></div></div>` : ""}
        <div class="field"><label>Side</label><div class="seg2"><button type="button" class="buy" data-side="BUY" aria-pressed="${st.side === "BUY"}">Buy</button><button type="button" class="sell" data-side="SELL" aria-pressed="${st.side === "SELL"}">Sell</button></div></div>
        <div class="field"><label>Lots (max ${maxLots()}${capNote()}) · quantity ${inr(qty)}</label><div class="stepper"><button type="button" data-d="-1" aria-label="fewer lots">−</button><b>${st.lots}</b><button type="button" data-d="1" aria-label="more lots">+</button></div></div>
        <div class="field"><label>Order type</label><div class="seg2"><button type="button" data-t="MARKET" aria-pressed="${st.order_type === "MARKET"}">Market</button><button type="button" data-t="LIMIT" aria-pressed="${st.order_type === "LIMIT"}">Limit</button></div></div>
        ${st.order_type === "LIMIT" ? `<div class="field"><label>Limit price ₹${SERVER.paper ? " (a cap on the fill; paper orders never rest)" : ""}</label><input class="num" id="px" type="number" inputmode="decimal" step="0.05" value="${st.price ?? refPrice() ?? ""}"></div>` : ""}
        ${SERVER.paper ? `<div class="field"><label>Stop ₹ (${stopNeed()}; the exit fills at the next poll's book, not at this price)</label><input class="num" id="stopPx" type="number" inputmode="decimal" step="0.05" value="${st.stop ?? ""}"></div>` : ""}
        ${pv ? (pv.review ? paperReviewHtml(pv) : `<div class="review">${kv("Contract", esc(pv.tradingsymbol))}${kv("Quantity", `${inr(pv.quantity)} (${st.lots} × ${pv.lot_size})`)}
          ${kv("Notional", money(pv.notional))}${kv("Est. margin", pv.estimated_margin != null ? money(pv.estimated_margin) : "not available")}${kv("Orders today", `${pv.orders_today} of ${pv.max_orders_per_day}`)}</div>`)
          + (!SERVER.paper ? `<label class="chk"><input type="checkbox" id="ack" ${st.ack ? "checked" : ""}> I understand this sends a real ${st.side} order for ${inr(pv.quantity)} units to my broker account, and that F&O losses can exceed the capital invested.</label>` : "") : ""}
        ${st.err ? `<p class="err">${esc(st.err)}</p>` : ""}
        <div class="actions">${pv ? (canPlace ? `<button class="btn ${SERVER.paper ? "primary" : "danger"}" type="button" id="place" ${!SERVER.paper && !st.ack ? "disabled" : ""}>${SERVER.paper ? (pv.review && pv.review.queued ? "Queue paper order" : "Place paper order") : "Place real order"}</button>` : "") + `<button class="btn" type="button" id="back">Edit</button>` : `<button class="btn primary" type="button" id="review">Review order</button>`}<button class="btn" type="button" id="cancel">Cancel</button></div>`;
      const reset = () => { st.preview = null; st.err = ""; };
      sheet.querySelectorAll("[data-i]").forEach(b => b.addEventListener("click", () => { st.instrument = b.dataset.i; st.price = null; reset(); draw(); }));
      sheet.querySelectorAll("[data-side]").forEach(b => b.addEventListener("click", () => { st.side = b.dataset.side; reset(); draw(); }));
      sheet.querySelectorAll("[data-d]").forEach(b => b.addEventListener("click", () => { st.lots = Math.min(maxLots(), Math.max(1, st.lots + Number(b.dataset.d))); reset(); draw(); }));
      sheet.querySelectorAll("[data-t]").forEach(b => b.addEventListener("click", () => { st.order_type = b.dataset.t; reset(); draw(); }));
      const px = $("#px", sheet); if (px) px.addEventListener("input", () => { st.price = Number(px.value); st.preview = null; });
      const sp = $("#stopPx", sheet); if (sp) sp.addEventListener("input", () => { st.stop = sp.value === "" ? null : Number(sp.value); st.preview = null; });
      const ack = $("#ack", sheet); if (ack) ack.addEventListener("change", () => { st.ack = ack.checked; $("#place", sheet).disabled = !st.ack; });
      $("#cancel", sheet).addEventListener("click", () => bg.remove());
      const back = $("#back", sheet); if (back) back.addEventListener("click", () => { reset(); draw(); });
      const review = $("#review", sheet); if (review) review.addEventListener("click", () => submit("/api/order/preview"));
      const place = $("#place", sheet); if (place) place.addEventListener("click", () => submit("/api/order"));
    }
    function body() {
      return { symbol: s.symbol, instrument: st.instrument, expiry: s.chain.expiry, strike: st.instrument === "FUT" ? null : st.strike, side: st.side, lots: st.lots,
               order_type: st.order_type, price: st.order_type === "LIMIT" ? (st.price ?? refPrice()) : null, stop: SERVER.paper ? st.stop : null };
    }
    async function submit(url) {
      st.err = "";
      if (st.order_type === "LIMIT") { const v = $("#px", sheet); if (v) st.price = Number(v.value); }
      const sv = $("#stopPx", sheet); if (sv) st.stop = sv.value === "" ? null : Number(sv.value);
      try {
        const payload = body(); if (url === "/api/order") payload.token = st.preview.token;
        const j = await getJson(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
        if (url === "/api/order") { st.done = j; refreshPaperBar(); }
        else { st.preview = j; const cap = j.review && j.review.risk && j.review.risk.max_lots; st.riskCap = cap != null ? cap : null; }
      } catch (e) { st.err = e.message; }
      draw();
    }
    draw(); document.body.appendChild(bg);
  }

  async function openOrders() {
    const bg = document.createElement("div"); bg.className = "sheet-bg"; bg.addEventListener("click", e => { if (e.target === bg) bg.remove(); });
    const sheet = document.createElement("div"); sheet.className = "sheet"; sheet.innerHTML = `<h2>Orders & positions</h2><p class="sub">Loading…</p>`; bg.appendChild(sheet); document.body.appendChild(bg);
    if (SERVER.paper) return paperOrders(sheet, bg);
    try {
      const [o, p] = await Promise.all([getJson("/api/orders"), getJson("/api/positions")]);
      sheet.innerHTML = `<h2>Orders & positions</h2><p class="sub"><span class="badge live">LIVE BROKER</span></p>
        <h3 class="oh">Open positions</h3><div class="olist">${p.length ? p.map(x => `<div class="o"><span><b>${esc(x.tradingsymbol)}</b></span><span>${x.quantity > 0 ? "+" : ""}${inr(x.quantity)} @ ₹${inr(x.avg_price)}${x.pnl != null ? " · P&L ₹" + inr(x.pnl) : ""}</span></div>`).join("") : "<div class='o'><span>None</span></div>"}</div>
        <h3 class="oh">Orders</h3><div class="olist">${o.length ? o.slice(0, 50).map(x => `<div class="o"><span><b>${esc(x.tradingsymbol)}</b><br>${esc(x.side)} ${inr(x.quantity)} ${esc(x.order_type)}${x.price ? " @ ₹" + inr(x.price) : ""}</span><span>${esc(x.status)}<br>${esc((x.placed_at || "").slice(0, 16))}</span></div>`).join("") : "<div class='o'><span>None yet</span></div>"}</div>
        <div class="actions"><button class="btn" type="button" id="closeO">Close</button></div>`;
      $("#closeO", sheet).addEventListener("click", () => bg.remove());
    } catch (e) { sheet.innerHTML = `<h2>Orders & positions</h2><p class="err">${esc(e.message)}</p>`; }
  }

  function paperSummaryLine(sm) {
    return `Equity <b>${money(sm.equity)}</b> on ${money(sm.capital)} · day <b class="${dirClass(sm.day_pnl)}">${money(sm.day_pnl)}</b> · week <b class="${dirClass(sm.week_pnl)}">${money(sm.week_pnl)}</b> · drawdown ${sm.drawdown_pct}% · open margin ${money(sm.open_margin)}` +
      (sm.kill_switch ? ` · kill switch ${sm.kill_switch.active ? '<b class="down">ON</b>' : "off"}` : "");
  }

  async function paperOrders(sheet, bg) {
    try {
      const [sm, pos, tr, rf, ords] = await Promise.all([getJson("/api/paper/summary"), getJson("/api/paper/positions"), getJson("/api/paper/trades"), getJson("/api/paper/refusals"), getJson("/api/orders")]);
      const posHtml = pos.map(p => `<div class="o"><span><b>${esc(p.tradingsymbol)}</b> ${p.side === "BUY" ? "long" : "short"} ${plural(p.lots, "lot")} (${inr(p.qty)})
          <br>entry ₹${inr(p.entry.price)} · mark ${p.mark ? "₹" + inr(p.mark.price) + (p.mark.stale ? " <small>(no " + (p.side === "BUY" ? "bid" : "ask") + ")</small>" : "") : "—"}
          <br>stop ${p.stop != null ? "₹" + inr(p.stop) + (p.stop_triggered_at ? " <b class='down'>triggered</b>, exits at the next poll" : "") : "none"} · expiry ${esc(p.expiry)} · T-2 ${esc(p.t2_date)}${p.bucket === "cheap_near_expiry" ? " · <b>cheap_near_expiry</b>" : ""}</span>
          <span><b class="${dirClass(p.unrealised)}">${money(p.unrealised)}</b><br><small>MTM, net of charges</small><br><button class="btn" type="button" data-close="${esc(p.id)}">Close…</button></span></div><div class="closebox" id="cl-${esc(p.id)}"></div>`).join("");
      const trHtml = tr.trades.slice(0, 50).map(t => `<div class="o"><span><b>${esc(t.tradingsymbol)}</b> ${t.side === "BUY" ? "long" : "short"} ${plural(t.lots, "lot")} · ${esc(t.reason)}
          <br>₹${inr(t.entry.price)} → ₹${inr(t.exit.price)} · charges ${money(t.charges_total)} · ${esc(t.bucket)}</span>
          <span><b class="${dirClass(t.net_pnl)}">${money(t.net_pnl)}</b>${t.return_pct != null ? "<br>" + pct(t.return_pct) : ""}<br><small>${esc((t.closed_at || "").slice(0, 16).replace("T", " "))}</small></span></div>`).join("");
      const ordHtml = ords.slice(0, 40).map(x => `<div class="o"><span><b>${esc(x.tradingsymbol)}</b><br>${esc(x.side)} ${inr(x.quantity)} ${esc(x.order_type)}${x.auto ? " · auto " + esc(x.auto) : ""}${x.reason ? "<br><small>" + esc(x.reason) + "</small>" : ""}</span>
          <span>${esc(x.status)}${x.fill_price != null ? " @ ₹" + inr(x.fill_price) : ""}<br>${esc((x.filled_at || x.placed_at || "").slice(0, 16).replace("T", " "))}</span></div>`).join("");
      const refHtml = rf.refusals.map(x => `<div class="o"><span><b>${esc(x.contract || x.symbol)}</b> ${esc(x.side || "")} ${inr(x.qty)}<br><small>${(x.reasons || []).map(esc).join("; ")}</small></span><span>${esc((x.time || "").slice(0, 16).replace("T", " "))}<br><small>${esc(x.stage || "")}</small></span></div>`).join("");
      sheet.innerHTML = `<h2>Paper account</h2><p class="sub"><span class="badge paper">PAPER</span> ${paperSummaryLine(sm)}</p>
        ${sm.kill_switch && sm.kill_switch.active ? `<p class="err">${esc(sm.kill_switch.reason)}</p>` : ""}
        ${sm.drawdown_review ? `<p class="notice">${esc(sm.drawdown_review_message)}</p>` : ""}
        ${sm.queued_orders ? `<p class="count">${plural(sm.queued_orders, "order")} queued for the next session's 09:20 poll.</p>` : ""}
        <h3 class="oh">Open positions (${pos.length})</h3><div class="olist">${posHtml || "<div class='o'><span>None</span></div>"}</div>
        <h3 class="oh">Closed trades (${tr.trades.length}), net of fills and charges</h3><div class="olist">${trHtml || "<div class='o'><span>None yet</span></div>"}</div>
        <h3 class="oh">Refusals: ${rf.count}</h3>${rf.count ? `<button class="btn" type="button" id="showRef">Show the reasons</button><div class="olist" id="refList" hidden>${refHtml}</div>` : "<p class='count'>None: every order so far found enough liquidity.</p>"}
        <h3 class="oh">Order log</h3><div class="olist">${ordHtml || "<div class='o'><span>None yet</span></div>"}</div>
        <div class="actions"><button class="btn" type="button" id="closeO">Close</button></div>`;
      $("#closeO", sheet).addEventListener("click", () => bg.remove());
      const sr = $("#showRef", sheet); if (sr) sr.addEventListener("click", () => { const l = $("#refList", sheet); l.hidden = !l.hidden; sr.textContent = l.hidden ? "Show the reasons" : "Hide the reasons"; });
      sheet.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", () => closePosition(pos.find(p => p.id === b.dataset.close), sheet, bg)));
    } catch (e) { sheet.innerHTML = `<h2>Paper account</h2><p class="err">${esc(e.message)}</p><div class="actions"><button class="btn" type="button" id="closeO">Close</button></div>`; $("#closeO", sheet).addEventListener("click", () => bg.remove()); }
  }

  // Manual exit from the Orders screen: the opposite side of the position's own contract, reviewed first.
  async function closePosition(p, sheet, bg) {
    const box = $("#cl-" + CSS.escape(p.id), sheet); if (!box) return;
    const body = { symbol: p.symbol, instrument: p.instrument, expiry: p.expiry, strike: p.instrument === "FUT" ? null : p.strike,
                   side: p.side === "BUY" ? "SELL" : "BUY", lots: p.lots, order_type: "MARKET", price: null, stop: null };
    box.innerHTML = `<p class="count">Reviewing the exit…</p>`;
    try {
      const pv = await getJson("/api/order/preview", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      box.innerHTML = paperReviewHtml(pv) + `<div class="actions">${pv.token ? `<button class="btn primary" type="button" data-go>${pv.review.queued ? "Queue the exit" : "Place the exit"}</button>` : ""}<button class="btn" type="button" data-no>Cancel</button></div>`;
      box.querySelector("[data-no]").addEventListener("click", () => { box.innerHTML = ""; });
      const go = box.querySelector("[data-go]");
      if (go) go.addEventListener("click", async () => {
        go.disabled = true;
        try { await getJson("/api/order", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ...body, token: pv.token }) }); refreshPaperBar(); paperOrders(sheet, bg); }
        catch (e) { box.insertAdjacentHTML("beforeend", `<p class="err">${esc(e.message)}</p>`); go.disabled = false; }
      });
    } catch (e) { box.innerHTML = `<p class="err">${esc(e.message)}</p>`; }
  }

  // One line under the header: the paper account at a glance, and the drawdown banner when it applies.
  async function refreshPaperBar() {
    if (!(SERVER.orders && SERVER.paper)) return;
    try {
      const sm = await getJson("/api/paper/summary");
      const b = $("#paperbar"); b.hidden = false; b.innerHTML = `<span class="badge paper">PAPER</span> ${paperSummaryLine(sm)}`;
      const n = $("#ddnotice"); n.hidden = !sm.drawdown_review; if (sm.drawdown_review) n.innerHTML = `<b>Review labels and sizing.</b> ${esc(sm.drawdown_review_message)}`;
    } catch (e) { /* the page works without it */ }
  }
  refreshPaperBar();

  function cell(label, value, sub, cls = "") {
    return `<div class="cell"><small>${label}</small><b class="${cls}">${value}</b><em>${sub}</em></div>`;
  }

  function sparkline(s) {
    const v = s.chart_closes, n = v.length, W = 320, H = 100, P = 4;
    const lo = Math.min(...v), hi = Math.max(...v), span = (hi - lo) || 1;
    const x = i => P + (W - 2 * P) * i / (n - 1), y = c => H - P - (H - 2 * P) * (c - lo) / span;
    const pts = v.map((c, i) => `${x(i).toFixed(1)},${y(c).toFixed(1)}`);
    const up = v[n - 1] >= v[0], col = up ? "var(--bull)" : "var(--bear)";
    const iLo = v.indexOf(lo), iHi = v.indexOf(hi);
    return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="30 day close chart, low ${lo} high ${hi}">
        <path d="M${pts[0]} L${pts.slice(1).join(" ")} L${W - P},${H} L${P},${H} Z" fill="${col}" opacity="0.12"/>
        <polyline points="${pts.join(" ")}" fill="none" stroke="${col}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
        <circle cx="${x(n - 1).toFixed(1)}" cy="${y(v[n - 1]).toFixed(1)}" r="3" fill="${col}"/>
      </svg>
      <div class="mm"><span>Low ₹${inr(lo)} (${s.chart_dates[iLo]})</span><span>High ₹${inr(hi)} (${s.chart_dates[iHi]})</span></div>
      <div class="axis"><span>${s.chart_dates[0]}</span><span>${s.chart_dates[n - 1]}</span></div>`;
  }

  // ---- formatting
  function pct(v) { return v == null ? "—" : (v > 0 ? "+" : "") + v.toFixed(2) + "%"; }
  function ratio(v) { return v == null ? "—" : v.toFixed(2) + "×"; }
  function num(v) { return v == null ? "—" : v.toFixed(2); }
  function inr(v) { return v == null ? "—" : Number(v).toLocaleString("en-IN", { maximumFractionDigits: 2 }); }
  function fmtStrike(v) { return v == null ? "—" : (Number.isInteger(v) ? v : v.toFixed(2)); }
  function sgn(v) { return v == null ? "" : (v > 0 ? "+" : "") + inr(v); }
  function dirClass(v) { return v == null || v === 0 ? "flat" : v > 0 ? "up" : "down"; }
  function esc(t) { return String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

  render();
})();
</script>
</body>
</html>
