    }
    if (r.warnings && r.warnings.length) h += `<ul class="reasons">${r.warnings.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`;
    if (r.blocked.length) h += `<div class="err"><b>The server will not accept this order:</b><ul class="reasons">${r.blocked.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>`;
    return h;
  }

  function openSheet(s, instrument, strike) {
    if (!SERVER.orders || !s.chain) return;
    const st = { instrument, strike, side: "BUY", lots: 1, order_type: SERVER.paper ? "MARKET" : "LIMIT", price: null, stop: null,
                 preview: null, err: "", done: null, ack: false, riskCap: null };
    const bg = document.createElement("div"); bg.className = "sheet-bg"; bg.addEventListener("click", e => { if (e.target === bg) bg.remove(); });
    const sheet = document.createElement("div"); sheet.className = "sheet"; sheet.setAttribute("role", "dialog"); sheet.setAttribute("aria-modal", "true"); bg.appendChild(sheet);
    const q = LIVE.quotes[s.symbol];
    const chainNow = CHAIN[s.symbol] || s.chain;
    const refPrice = () => {
      if (st.instrument === "FUT") return (q && (q.fut_ltp || q.ltp)) || s.close;
      const row = chainNow.strikes.find(r => r.strike === st.strike); if (!row) return null;
      return st.instrument === "CE" ? (row.ce_live_ltp ?? row.ce_close) : (row.pe_live_ltp ?? row.pe_close);
    };
    const maxLots = () => Math.max(1, Math.min(SERVER.max_lots, st.riskCap ?? SERVER.max_lots));
    const capNote = () => st.riskCap == null ? "" : st.riskCap < 1 ? " · the per-trade risk cap allows none" : ` · per-trade risk cap ${st.riskCap}`;
    const stopNeed = () => st.instrument === "FUT" ? "required for futures" : st.side === "SELL" ? "required for short options" : "optional";
    function draw() {
      const contract = st.instrument === "FUT" ? `${s.symbol} ${s.chain.expiry} future` : `${s.symbol} ${s.chain.expiry} ${fmtStrike(st.strike)} ${st.instrument}`;
      const qty = st.lots * (s.lot_size || 0);
      if (st.done) {
        const d = st.done, queued = d.status === "QUEUED";
        sheet.innerHTML = `<h2>${d.paper ? (queued ? "Paper order queued" : "Paper order " + esc(d.status.toLowerCase())) : "Order sent to broker"}</h2><p class="sub">${esc(contract)}</p>
          <div class="review">${kv("Order id", esc(d.order_id))}${kv("Status", esc(d.status))}${kv("Quantity", inr(d.quantity))}
          ${d.fill_price != null ? kv("Fill price", "₹" + inr(d.fill_price)) : ""}${queued ? kv("Fills", "first poll at or after " + esc((d.fill_after || "").slice(0, 16).replace("T", " ")) + " IST") : ""}
          ${d.charges ? kv("Charges", money(d.charges.total)) : ""}${d.net_pnl != null ? kv("Net P&L", `<b class="${dirClass(d.net_pnl)}">${money(d.net_pnl)}</b>`) : ""}
</div>
          <button class="btn primary" type="button" id="closeSheet">Close</button>`;
        $("#closeSheet", sheet).addEventListener("click", () => bg.remove()); return;
      }
      const pv = st.preview, canPlace = pv && pv.token;
      sheet.innerHTML = `<h2>${esc(contract)}</h2><p class="sub">Lot size ${s.lot_size ?? "?"} · reference ₹${inr(refPrice())} · <span class="badge ${SERVER.paper ? "paper" : "live"}">${SERVER.paper ? "PAPER" : "LIVE BROKER"}</span></p>
        ${st.instrument !== "FUT" ? `<div class="field"><label>Option</label><div class="seg2"><button type="button" data-i="CE" aria-pressed="${st.instrument === "CE"}">Call ${fmtStrike(st.strike)}</button><button type="button" data-i="PE" aria-pressed="${st.instrument === "PE"}">Put ${fmtStrike(st.strike)}</button></div></div>` : ""}
        <div class="field"><label>Side</label><div class="seg2"><button type="button" class="buy" data-side="BUY" aria-pressed="${st.side === "BUY"}">Buy</button><button type="button" class="sell" data-side="SELL" aria-pressed="${st.side === "SELL"}">Sell</button></div></div>
        <div class="field"><label>Lots (max ${maxLots()}${capNote()}) · quantity ${inr(qty)}</label><div class="stepper"><button type="button" data-d="-1" aria-label="fewer lots">−</button><b>${st.lots}</b><button type="button" data-d="1" aria-label="more lots">+</button></div></div>
        <div class="field"><label>Order type</label><div class="seg2"><button type="button" data-t="MARKET" aria-pressed="${st.order_type === "MARKET"}">Market</button><button type="button" data-t="LIMIT" aria-pressed="${st.order_type === "LIMIT"}">Limit</button></div></div>
        ${st.order_type === "LIMIT" ? `<div class="field"><label>Limit price ₹${SERVER.paper ? " (a cap on the fill; paper orders never rest)" : ""}</label><input class="num" id="px" type="number" inputmode="decimal" step="0.05" value="${st.price ?? refPrice() ?? ""}"></div>` : ""}
        ${SERVER.paper ? `<div class="field"><label>Stop ₹ (${stopNeed()}; the exit fills at the next poll's book, not at this price)</label><input class="num" id="stopPx" type="number" inputmode="decimal" step="0.05" value="${st.stop ?? ""}"></div>` : ""}
        ${pv ? (pv.review ? paperReviewHtml(pv) : `<div class="review">${kv("Contract", esc(pv.tradingsymbol))}${kv("Quantity", `${inr(pv.quantity)} (${st.lots} × ${pv.lot_size})`)}
          ${kv("Notional", money(pv.notional))}${kv("Est. margin", pv.estimated_margin != null ? money(pv.estimated_margin) : "not available")}${kv("Orders today", `${pv.orders_today} of ${pv.max_orders_per_day}`)}</div>`)
          + (!SERVER.paper ? `<label class="chk"><input type="checkbox" id="ack" ${st.ack ? "checked" : ""}> I understand this sends a real ${st.side} order for ${inr(pv.quantity)} units to my broker account, and that F&O losses can exceed the capital invested.</label>` : "") : ""}
        ${st.err ? `<p class="err">${esc(st.err)}</p>` : ""}
        <div class="actions">${pv ? (canPlace ? `<button class="btn ${SERVER.paper ? "primary" : "danger"}" type="button" id="place" ${!SERVER.paper && !st.ack ? "disabled" : ""}>${SERVER.paper ? (pv.review && pv.review.queued ? "Queue paper order" : "Place paper order") : "Place real order"}</button>` : "") + `<button class="btn" type="button" id="back">Edit</button>` : `<button class="btn primary" type="button" id="review">Review order</button>`}<button class="btn" type="button" id="cancel">Cancel</button></div>`;
      const reset = () => { st.preview = null; st.err = ""; };
      sheet.querySelectorAll("[data-i]").forEach(b => b.addEventListener("click", () => { st.instrument = b.dataset.i; st.price = null; reset(); draw(); }));
      sheet.querySelectorAll("[data-side]").forEach(b => b.addEventListener("click", () => { st.side = b.dataset.side; reset(); draw(); }));
      sheet.querySelectorAll("[data-d]").forEach(b => b.addEventListener("click", () => { st.lots = Math.min(maxLots(), Math.max(1, st.lots + Number(b.dataset.d))); reset(); draw(); }));
      sheet.querySelectorAll("[data-t]").forEach(b => b.addEventListener("click", () => { st.order_type = b.dataset.t; reset(); draw(); }));
      const px = $("#px", sheet); if (px) px.addEventListener("input", () => { st.price = Number(px.value); st.preview = null; });
      const sp = $("#stopPx", sheet); if (sp) sp.addEventListener("input", () => { st.stop = sp.value === "" ? null : Number(sp.value); st.preview = null; });
      const ack = $("#ack", sheet); if (ack) ack.addEventListener("change", () => { st.ack = ack.checked; $("#place", sheet).disabled = !st.ack; });
      $("#cancel", sheet).addEventListener("click", () => bg.remove());
      const back = $("#back", sheet); if (back) back.addEventListener("click", () => { reset(); draw(); });
      const review = $("#review", sheet); if (review) review.addEventListener("click", () => submit("/api/order/preview"));
      const place = $("#place", sheet); if (place) place.addEventListener("click", () => submit("/api/order"));
    }
    function body() {
      return { symbol: s.symbol, instrument: st.instrument, expiry: s.chain.expiry, strike: st.instrument === "FUT" ? null : st.strike, side: st.side, lots: st.lots,
               order_type: st.order_type, price: st.order_type === "LIMIT" ? (st.price ?? refPrice()) : null, stop: SERVER.paper ? st.stop : null };
    }
    async function submit(url) {
      st.err = "";
      if (st.order_type === "LIMIT") { const v = $("#px", sheet); if (v) st.price = Number(v.value); }
      const sv = $("#stopPx", sheet); if (sv) st.stop = sv.value === "" ? null : Number(sv.value);
      try {
        const payload = body(); if (url === "/api/order") payload.token = st.preview.token;
        const j = await getJson(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
        if (url === "/api/order") { st.done = j; refreshPaperBar(); }
        else { st.preview = j; const cap = j.review && j.review.risk && j.review.risk.max_lots; st.riskCap = cap != null ? cap : null; }
      } catch (e) { st.err = e.message; }
      draw();
    }
    draw(); document.body.appendChild(bg);
  }

  async function openOrders() {
    const bg = document.createElement("div"); bg.className = "sheet-bg"; bg.addEventListener("click", e => { if (e.target === bg) bg.remove(); });
    const sheet = document.createElement("div"); sheet.className = "sheet"; sheet.innerHTML = `<h2>Orders & positions</h2><p class="sub">Loading…</p>`; bg.appendChild(sheet); document.body.appendChild(bg);
    if (SERVER.paper) return paperOrders(sheet, bg);
    try {
      const [o, p] = await Promise.all([getJson("/api/orders"), getJson("/api/positions")]);
      sheet.innerHTML = `<h2>Orders & positions</h2><p class="sub"><span class="badge live">LIVE BROKER</span></p>
        <h3 class="oh">Open positions</h3><div class="olist">${p.length ? p.map(x => `<div class="o"><span><b>${esc(x.tradingsymbol)}</b></span><span>${x.quantity > 0 ? "+" : ""}${inr(x.quantity)} @ ₹${inr(x.avg_price)}${x.pnl != null ? " · P&L ₹" + inr(x.pnl) : ""}</span></div>`).join("") : "<div class='o'><span>None</span></div>"}</div>
        <h3 class="oh">Orders</h3><div class="olist">${o.length ? o.slice(0, 50).map(x => `<div class="o"><span><b>${esc(x.tradingsymbol)}</b><br>${esc(x.side)} ${inr(x.quantity)} ${esc(x.order_type)}${x.price ? " @ ₹" + inr(x.price) : ""}</span><span>${esc(x.status)}<br>${esc((x.placed_at || "").slice(0, 16))}</span></div>`).join("") : "<div class='o'><span>None yet</span></div>"}</div>
        <div class="actions"><button class="btn" type="button" id="closeO">Close</button></div>`;
      $("#closeO", sheet).addEventListener("click", () => bg.remove());
    } catch (e) { sheet.innerHTML = `<h2>Orders & positions</h2><p class="err">${esc(e.message)}</p>`; }
  }

  function paperSummaryLine(sm) {
    return `Equity <b>${money(sm.equity)}</b> on ${money(sm.capital)} · day <b class="${dirClass(sm.day_pnl)}">${money(sm.day_pnl)}</b> · week <b class="${dirClass(sm.week_pnl)}">${money(sm.week_pnl)}</b> · drawdown ${sm.drawdown_pct}% · open margin ${money(sm.open_margin)}` +
      (sm.kill_switch ? ` · kill switch ${sm.kill_switch.active ? '<b class="down">ON</b>' : "off"}` : "");
  }

  async function paperOrders(sheet, bg) {
    try {
      const [sm, pos, tr, rf, ords] = await Promise.all([getJson("/api/paper/summary"), getJson("/api/paper/positions"), getJson("/api/paper/trades"), getJson("/api/paper/refusals"), getJson("/api/orders")]);
      const posHtml = pos.map(p => `<div class="o"><span><b>${esc(p.tradingsymbol)}</b> ${p.side === "BUY" ? "long" : "short"} ${plural(p.lots, "lot")} (${inr(p.qty)})
          <br>entry ₹${inr(p.entry.price)} · mark ${p.mark ? "₹" + inr(p.mark.price) + (p.mark.stale ? " <small>(no " + (p.side === "BUY" ? "bid" : "ask") + ")</small>" : "") : "—"}${p.mark && p.mark.at ? " <small>at " + esc(p.mark.at.slice(0, 16).replace("T", " ")) + "</small>" : ""}
          <br>stop ${p.stop != null ? "₹" + inr(p.stop) + (p.stop_triggered_at ? " <b class='down'>triggered</b>, exits at the next poll" : "") : "none"} · expiry ${esc(p.expiry)} · T-2 ${esc(p.t2_date)}</span>
          <span><b class="${dirClass(p.unrealised)}">${money(p.unrealised)}</b><br><small>MTM, net of charges</small><br><button class="btn" type="button" data-close="${esc(p.id)}">Close…</button></span></div><div class="closebox" id="cl-${esc(p.id)}"></div>`).join("");
      const trHtml = tr.trades.slice(0, 50).map(t => `<div class="o"><span><b>${esc(t.tradingsymbol)}</b> ${t.side === "BUY" ? "long" : "short"} ${plural(t.lots, "lot")} · ${esc(t.reason)}
          <br>₹${inr(t.entry.price)} → ₹${inr(t.exit.price)} · charges ${money(t.charges_total)}</span>
          <span><b class="${dirClass(t.net_pnl)}">${money(t.net_pnl)}</b>${t.return_pct != null ? "<br>" + pct(t.return_pct) : ""}<br><small>${esc((t.closed_at || "").slice(0, 16).replace("T", " "))}</small></span></div>`).join("");
      const ordHtml = ords.slice(0, 40).map(x => `<div class="o"><span><b>${esc(x.tradingsymbol)}</b><br>${esc(x.side)} ${inr(x.quantity)} ${esc(x.order_type)}${x.auto ? " · auto " + esc(x.auto) : ""}${x.reason ? "<br><small>" + esc(x.reason) + "</small>" : ""}</span>
          <span>${esc(x.status)}${x.fill_price != null ? " @ ₹" + inr(x.fill_price) : ""}<br>${esc((x.filled_at || x.placed_at || "").slice(0, 16).replace("T", " "))}</span></div>`).join("");
      const refHtml = rf.refusals.map(x => `<div class="o"><span><b>${esc(x.contract || x.symbol)}</b> ${esc(x.side || "")} ${inr(x.qty)}<br><small>${(x.reasons || []).map(esc).join("; ")}</small></span><span>${esc((x.time || "").slice(0, 16).replace("T", " "))}<br><small>${esc(x.stage || "")}</small></span></div>`).join("");
      sheet.innerHTML = `<h2>Paper account</h2><p class="sub"><span class="badge paper">PAPER</span> ${paperSummaryLine(sm)}</p>
        ${sm.kill_switch && sm.kill_switch.active ? `<p class="err">${esc(sm.kill_switch.reason)}</p>` : ""}
        ${sm.drawdown_review ? `<p class="notice">${esc(sm.drawdown_review_message)}</p>` : ""}
        ${sm.queued_orders ? `<p class="count">${plural(sm.queued_orders, "order")} queued for the next session's 09:20 poll.</p>` : ""}
        <h3 class="oh">Open positions (${pos.length})</h3><div class="olist">${posHtml || "<div class='o'><span>None</span></div>"}</div>
        <h3 class="oh">Closed trades (${tr.trades.length}), net of fills and charges</h3><div class="olist">${trHtml || "<div class='o'><span>None yet</span></div>"}</div>
        <h3 class="oh">Refusals: ${rf.count}</h3>${rf.count ? `<button class="btn" type="button" id="showRef">Show the reasons</button><div class="olist" id="refList" hidden>${refHtml}</div>` : "<p class='count'>None: every order so far found enough liquidity.</p>"}
        <h3 class="oh">Order log</h3><div class="olist">${ordHtml || "<div class='o'><span>None yet</span></div>"}</div>
        <div class="actions"><button class="btn" type="button" id="closeO">Close</button></div>`;
      $("#closeO", sheet).addEventListener("click", () => bg.remove());
      const sr = $("#showRef", sheet); if (sr) sr.addEventListener("click", () => { const l = $("#refList", sheet); l.hidden = !l.hidden; sr.textContent = l.hidden ? "Show the reasons" : "Hide the reasons"; });
      sheet.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", () => closePosition(pos.find(p => p.id === b.dataset.close), sheet, bg)));
    } catch (e) { sheet.innerHTML = `<h2>Paper account</h2><p class="err">${esc(e.message)}</p><div class="actions"><button class="btn" type="button" id="closeO">Close</button></div>`; $("#closeO", sheet).addEventListener("click", () => bg.remove()); }
  }

  // Manual exit from the Orders screen: the opposite side of the position's own contract, reviewed first.
  async function closePosition(p, sheet, bg) {
    const box = $("#cl-" + CSS.escape(p.id), sheet); if (!box) return;
    const body = { symbol: p.symbol, instrument: p.instrument, expiry: p.expiry, strike: p.instrument === "FUT" ? null : p.strike,
                   side: p.side === "BUY" ? "SELL" : "BUY", lots: p.lots, order_type: "MARKET", price: null, stop: null };
    box.innerHTML = `<p class="count">Reviewing the exit…</p>`;
    try {
      const pv = await getJson("/api/order/preview", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      box.innerHTML = paperReviewHtml(pv) + `<div class="actions">${pv.token ? `<button class="btn primary" type="button" data-go>${pv.review.queued ? "Queue the exit" : "Place the exit"}</button>` : ""}<button class="btn" type="button" data-no>Cancel</button></div>`;
      box.querySelector("[data-no]").addEventListener("click", () => { box.innerHTML = ""; });
      const go = box.querySelector("[data-go]");
      if (go) go.addEventListener("click", async () => {
        go.disabled = true;
        try { await getJson("/api/order", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ...body, token: pv.token }) }); refreshPaperBar(); paperOrders(sheet, bg); }
        catch (e) { box.insertAdjacentHTML("beforeend", `<p class="err">${esc(e.message)}</p>`); go.disabled = false; }
      });
    } catch (e) { box.innerHTML = `<p class="err">${esc(e.message)}</p>`; }
  }

  // The paper account at a glance in the top bar, and the drawdown banner when it applies.
  async function refreshPaperBar() {
    if (!(SERVER.orders && SERVER.paper)) return;
    try {
      const sm = await getJson("/api/paper/summary");
      const b = $("#paperbar"); b.hidden = false; b.innerHTML = `<span class="badge paper">PAPER</span> Equity <b>${money(sm.equity)}</b> · day <b class="${dirClass(sm.day_pnl)}">${money(sm.day_pnl)}</b>`;
      b.title = paperSummaryLine(sm).replace(/<[^>]+>/g, "");
      const n = $("#ddnotice"); n.hidden = !sm.drawdown_review; if (sm.drawdown_review) n.innerHTML = `<b>Review labels and sizing.</b> ${esc(sm.drawdown_review_message)}`;
    } catch (e) { /* the page works without it */ }
  }
  refreshPaperBar();

  // ---- formatting
  function pct(v) { return v == null ? "—" : (v > 0 ? "+" : "") + v.toFixed(2) + "%"; }
  function ratio(v) { return v == null ? "—" : v.toFixed(2) + "×"; }
  function num(v) { return v == null ? "—" : v.toFixed(2); }
  function inr(v) { return v == null ? "—" : Number(v).toLocaleString("en-IN", { maximumFractionDigits: 2 }); }
  function fmtPx(v) { return v == null ? "—" : Number(v).toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function signed(v) { return v == null ? "—" : (v > 0 ? "+" : v < 0 ? "−" : "") + fmtPx(Math.abs(v)); }
  function compact(v) {
    if (v == null) return "—"; const a = Math.abs(v), sg = v < 0 ? "−" : "";
    return a >= 1e7 ? sg + (a / 1e7).toFixed(2) + " Cr" : a >= 1e5 ? sg + (a / 1e5).toFixed(2) + " L" : a >= 1e3 ? sg + (a / 1e3).toFixed(1) + "K" : sg + Math.round(a);
  }
  function sectorName(x) {          // "nifty oil & gas" -> "Oil & Gas"
    return x ? x.replace(/^nifty\s+/i, "").replace(/\b([a-z])/g, c => c.toUpperCase()).replace(/\bIt\b/, "IT").replace(/\bPsu\b/, "PSU").replace(/\bFmcg\b/, "FMCG") : "";
  }
  function signedCompact(v) { return v == null ? "" : (v > 0 ? "+" : "") + compact(v); }
  function fmtStrike(v) { return v == null ? "—" : (Number.isInteger(v) ? v : v.toFixed(2)); }
  function dirClass(v) { return v == null || v === 0 ? "flat" : v > 0 ? "up" : "down"; }
  function esc(t) { return String(t ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

  // ---- links: #RELIANCE, #RELIANCE/options, #movers, #heatmap, #score (kept in the address bar as you browse)
  function fromHash() {
    const [a, b] = decodeURIComponent(location.hash.slice(1)).split("/");
    if (!a) return false;
    if (["movers", "heatmap", "score"].includes(a.toLowerCase())) { if (sel && !chartKey) _select(sel); setBoard(a.toLowerCase()); return true; }
    const sym = a.toUpperCase(); if (!BY[sym]) return false;
    if (b && TABS.some(t => t[0] === b.toLowerCase())) tab = b.toLowerCase();
    select(sym); return true;
  }
  addEventListener("hashchange", fromHash);
  const _select = select;
  select = function (sym, keepLeg) { _select(sym, keepLeg); try { history.replaceState(null, "", "#" + encodeURIComponent(sym) + (tab !== "overview" ? "/" + tab : "")); } catch (e) { /* file:// */ } };
  const _setTab = setTab;
  setTab = function (k) { _setTab(k); try { history.replaceState(null, "", "#" + encodeURIComponent(sel) + (k !== "overview" ? "/" + k : "")); } catch (e) { /* file:// */ } };

  // ---- start
  saveAlerts(); renderSegs(); renderTabs(); renderList();
  if (!fromHash()) { if (sel) select(sel); else render(); if (isPhone()) setMView("list"); }
  navState();
})();
</script>
</body>
