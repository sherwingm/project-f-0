<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>F&amp;O Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root {
  --bg:#0B0F14; --panel:#10151C; --surface:#151B23; --raise:#1B232D; --ink:#E6EDF3; --muted:#8B98A5; --line:#222B36; --line-strong:#33404F;
  --bull:#26A69A; --bull-soft:rgba(38,166,154,.16); --bear:#EF5350; --bear-soft:rgba(239,83,80,.16);
  --neutral:#8B98A5; --neutral-soft:rgba(139,152,165,.16); --unc:#E0B341; --unc-soft:rgba(224,179,65,.16);
  --accent:#4C8DFF; --accent-ink:#FFFFFF; --focus:#4C8DFF; --atp:#F5A623; --star:#F5C542;
  --top:52px; --disc:44px; --nav:0px;
  color-scheme:dark;
}
:root[data-theme="light"] {
  --bg:#EEF1F5; --panel:#FFFFFF; --surface:#FFFFFF; --raise:#F4F6F9; --ink:#141A21; --muted:#5E6B78; --line:#E1E6EC; --line-strong:#C7D0DA;
  --bull:#0F9D76; --bull-soft:rgba(15,157,118,.12); --bear:#D93A3A; --bear-soft:rgba(217,58,58,.10);
  --neutral:#6B7785; --neutral-soft:rgba(107,119,133,.12); --unc:#A47A12; --unc-soft:rgba(164,122,18,.12);
  --accent:#2563EB; --accent-ink:#FFFFFF; --focus:#2563EB; --atp:#C97A00; --star:#D4A20C;
  color-scheme:light;
}
*, *::before, *::after { box-sizing:border-box; }
html, body { height:100%; }
body { margin:0; background:var(--bg); color:var(--ink); font:13px/1.45 Inter,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  font-variant-numeric:tabular-nums; -webkit-text-size-adjust:100%; overflow:hidden; }
button, input, select { font:inherit; color:inherit; }
button { cursor:pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible { outline:2px solid var(--focus); outline-offset:1px; }
.mono, .px, .num-c { font-family:"JetBrains Mono",ui-monospace,Consolas,monospace; }
.up { color:var(--bull); } .down { color:var(--bear); } .flat { color:var(--muted); }
small, .muted { color:var(--muted); }
a { color:var(--accent); }
[hidden] { display:none !important; }

/* ---------- top bar */
.top { height:var(--top); display:flex; align-items:center; gap:10px; padding:0 12px; background:var(--panel); border-bottom:1px solid var(--line); position:relative; z-index:6; }
.brand { font-weight:700; font-size:15px; letter-spacing:.01em; white-space:nowrap; }
.brand i { font-style:normal; color:var(--accent); }
.mkt { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); white-space:nowrap; }
.dot { width:8px; height:8px; border-radius:50%; background:var(--neutral); flex:0 0 auto; }
.dot.on { background:var(--bull); box-shadow:0 0 0 3px var(--bull-soft); }
.dot.err { background:var(--bear); }
.clock { font-family:"JetBrains Mono",monospace; color:var(--ink); }
.tsearch { position:relative; flex:1; max-width:340px; margin-left:auto; }
.tsearch input { width:100%; height:34px; padding:0 34px 0 12px; border-radius:8px; border:1px solid var(--line-strong); background:var(--surface); }
.tsearch kbd { position:absolute; right:8px; top:8px; font:11px "JetBrains Mono",monospace; color:var(--muted); border:1px solid var(--line-strong); border-radius:4px; padding:0 5px; }
.tbtns { display:flex; gap:6px; }
.tb { height:34px; padding:0 11px; border-radius:8px; border:1px solid var(--line-strong); background:var(--surface); white-space:nowrap; display:inline-flex; align-items:center; gap:6px; }
.tb[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
.tb .n { font:11px "JetBrains Mono",monospace; background:var(--bear); color:#fff; border-radius:9px; padding:0 5px; }
.pbar { font-size:12px; color:var(--muted); white-space:nowrap; display:flex; gap:6px; align-items:center; }
.pbar b { color:var(--ink); } .pbar b.up { color:var(--bull); } .pbar b.down { color:var(--bear); }
.notice { border:1px solid var(--unc); background:var(--unc-soft); border-radius:8px; padding:8px 12px; font-size:12px; margin:8px 12px 0; }
.notice b { color:var(--unc); }

/* ---------- terminal grid */
.term { display:grid; grid-template-columns:300px minmax(0,1fr) 400px; height:calc(100dvh - var(--top) - var(--disc)); }
.wl, .center, .side, .board { min-height:0; background:var(--panel); }
.wl { border-right:1px solid var(--line); display:flex; flex-direction:column; }
.center { display:flex; flex-direction:column; min-width:0; }
.side { border-left:1px solid var(--line); display:flex; flex-direction:column; }
.board { grid-column:2 / 4; overflow:auto; padding:14px 16px 24px; display:none; }
body[data-board] .board { display:block; }
body[data-board] .center, body[data-board] .side { display:none; }

/* ---------- watchlist */
.wl-h { padding:8px 10px 6px; border-bottom:1px solid var(--line); }
.wl-tabs { display:flex; gap:4px; overflow-x:auto; scrollbar-width:none; }
.wl-tabs::-webkit-scrollbar { display:none; }
.wt { flex:0 0 auto; border:1px solid transparent; background:none; border-radius:6px; padding:4px 8px; font-size:12px; color:var(--muted); }
.wt b { color:var(--ink); font-weight:600; margin-left:3px; }
.wt[aria-pressed="true"] { background:var(--raise); border-color:var(--line-strong); color:var(--ink); }
.wl-ctl { display:flex; gap:6px; align-items:center; margin-top:6px; }
.wl-ctl select { flex:1; height:28px; border-radius:6px; border:1px solid var(--line-strong); background:var(--surface); padding:0 6px; font-size:12px; }
.chip { border:1px solid var(--line-strong); background:var(--surface); border-radius:6px; padding:3px 8px; font-size:12px; white-space:nowrap; }
.chip[aria-pressed="true"] { background:var(--bear); border-color:var(--bear); color:#fff; }
.wl-list { overflow-y:auto; flex:1; }
.wr { display:grid; grid-template-columns:18px minmax(0,1fr) auto; gap:0 8px; padding:7px 10px 7px 6px; border-bottom:1px solid var(--line); cursor:pointer; align-items:center; }
.wr:hover { background:var(--raise); }
.wr.sel { background:var(--raise); box-shadow:inset 3px 0 0 var(--accent); }
.star { border:0; background:none; padding:0; width:18px; height:18px; color:var(--line-strong); font-size:13px; line-height:18px; }
.star.on { color:var(--star); }
.wn { min-width:0; }
.wn b { font-weight:600; font-size:13px; }
.wn small { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:11px; }
.wp { text-align:right; }
.wp .px { font-size:13px; font-weight:500; display:block; border-radius:3px; padding:0 2px; }
.wp small { font-family:"JetBrains Mono",monospace; font-size:11px; }
.wm { grid-column:2 / 4; display:flex; gap:8px; align-items:center; font-size:11px; color:var(--muted); margin-top:2px; }
.wm .lbl { margin-left:auto; }
.ld { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:4px; vertical-align:middle; }
.ld.b { background:var(--bull); } .ld.r { background:var(--bear); } .ld.n { background:var(--neutral); } .ld.u { background:var(--unc); }
.fl-up { animation:flu .9s ease-out; } .fl-dn { animation:fld .9s ease-out; }
@keyframes flu { from { background:var(--bull-soft); } to { background:transparent; } }
@keyframes fld { from { background:var(--bear-soft); } to { background:transparent; } }
.wl-foot { padding:6px 10px; border-top:1px solid var(--line); font-size:11px; color:var(--muted); }
.empty { text-align:center; color:var(--muted); padding:28px 10px; }

/* ---------- stock header */
.sh { display:flex; gap:14px; align-items:flex-start; padding:10px 14px 8px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
.sh h2 { margin:0; font-size:18px; font-weight:700; display:flex; gap:8px; align-items:center; }
.sh h2 small { font-size:12px; font-weight:400; }
.sh .sub { font-size:12px; color:var(--muted); margin-top:2px; }
.sh .price { margin-left:auto; text-align:right; }
.sh .big { font:600 22px/1.1 "JetBrains Mono",monospace; }
.sh .chg { font:500 13px "JetBrains Mono",monospace; margin-left:8px; }
.sh .tick { font-size:11px; color:var(--muted); margin-top:3px; }
.sh .acts { display:flex; gap:6px; align-items:center; flex-wrap:wrap; width:100%; }
.ib { height:28px; padding:0 9px; border-radius:6px; border:1px solid var(--line-strong); background:var(--surface); font-size:12px; display:inline-flex; align-items:center; gap:5px; }
.ib.on { color:var(--star); border-color:var(--star); }
.ib.go { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
.pill { display:inline-block; border-radius:999px; padding:1px 8px; font-size:11px; font-weight:600; line-height:1.7; white-space:nowrap; }
.pill.b { background:var(--bull-soft); color:var(--bull); } .pill.r { background:var(--bear-soft); color:var(--bear); }
.pill.n { background:var(--neutral-soft); color:var(--neutral); } .pill.u { background:var(--unc-soft); color:var(--unc); }
.pill.live { margin-left:4px; border:1px dashed currentColor; background:transparent; }
.strip { display:flex; gap:0; border-bottom:1px solid var(--line); overflow-x:auto; scrollbar-width:none; }
.strip::-webkit-scrollbar { display:none; }
.strip div { padding:6px 12px; border-right:1px solid var(--line); white-space:nowrap; }
.strip small { display:block; font-size:10px; text-transform:uppercase; letter-spacing:.04em; }
.strip b { font:500 12px "JetBrains Mono",monospace; }
.strip .atp b { color:var(--atp); }

/* ---------- chart */
.ctb { display:flex; gap:6px; align-items:center; padding:6px 12px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
.ctb select { height:28px; border-radius:6px; border:1px solid var(--line-strong); background:var(--surface); padding:0 6px; font-size:12px; max-width:190px; }
.seg { display:inline-flex; border:1px solid var(--line-strong); border-radius:6px; overflow:hidden; }
.seg button { border:0; background:var(--surface); padding:4px 10px; font-size:12px; }
.seg button + button { border-left:1px solid var(--line-strong); }
.seg button[aria-pressed="true"] { background:var(--accent); color:var(--accent-ink); }
.cstat { font-size:11px; color:var(--muted); margin-left:auto; }
.chart-box { position:relative; flex:1; min-height:280px; }
#chart { position:absolute; inset:0; }
.legend { position:absolute; left:10px; top:6px; z-index:3; font:11px "JetBrains Mono",monospace; color:var(--muted); pointer-events:none; display:flex; gap:10px; flex-wrap:wrap; }
.legend b { color:var(--ink); font-weight:500; }
.legend .atp b { color:var(--atp); }
.cmsg { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; padding:20px; color:var(--muted); z-index:4; pointer-events:none; }
.cmsg div { background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:12px 16px; max-width:420px; pointer-events:auto; }

/* ---------- side tabs */
.tabs { display:flex; border-bottom:1px solid var(--line); overflow-x:auto; scrollbar-width:none; }
.tabs::-webkit-scrollbar { display:none; }
.tab { flex:1 0 auto; border:0; background:none; padding:10px 12px; font-size:12px; font-weight:600; color:var(--muted); border-bottom:2px solid transparent; }
.tab[aria-selected="true"] { color:var(--ink); border-bottom-color:var(--accent); }
.tbody { overflow-y:auto; flex:1; padding:12px 14px 20px; }
.tbody h3 { font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:16px 0 8px; font-weight:600; }
.tbody h3:first-child { margin-top:0; }
.kvg { display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--line); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
.kvg div { background:var(--surface); padding:6px 9px; }
.kvg small { display:block; font-size:10px; text-transform:uppercase; letter-spacing:.04em; }
.kvg b { font:500 13px "JetBrains Mono",monospace; }
.kvg em { font-style:normal; font-size:11px; color:var(--muted); display:block; }
.meter { height:6px; border-radius:3px; background:var(--raise); position:relative; margin-top:5px; overflow:hidden; }
.meter i { position:absolute; top:0; bottom:0; left:0; background:var(--bull); }
.meter.split i { background:var(--bull); } .meter.split { background:var(--bear); }
.range { position:relative; height:6px; border-radius:3px; background:linear-gradient(90deg,var(--bear),var(--neutral),var(--bull)); margin:8px 0 3px; opacity:.6; }
.range i { position:absolute; top:-4px; width:3px; height:14px; background:var(--ink); border-radius:2px; transform:translateX(-1px); }
.depth { width:100%; border-collapse:collapse; font:12px "JetBrains Mono",monospace; }
.depth th { font:600 10px Inter,sans-serif; text-transform:uppercase; color:var(--muted); padding:4px 6px; text-align:right; border-bottom:1px solid var(--line); }
.depth td { padding:3px 6px; text-align:right; position:relative; }
.depth td.bq { background:linear-gradient(270deg,var(--bull-soft) var(--w),transparent var(--w)); }
.depth td.aq { background:linear-gradient(90deg,var(--bear-soft) var(--w),transparent var(--w)); }
.why ul { margin:0; padding-left:18px; } .why li { margin:3px 0; }

/* option chain */
.oc-wrap { overflow-x:auto; margin:0 -14px; }
table.oc { width:100%; border-collapse:collapse; font:11.5px "JetBrains Mono",monospace; }
.oc th { font:600 10px Inter,sans-serif; color:var(--muted); text-transform:uppercase; padding:5px 4px; border-bottom:1px solid var(--line); text-align:right; position:sticky; top:0; background:var(--panel); white-space:nowrap; }
.oc td { padding:4px; text-align:right; border-bottom:1px solid var(--line); white-space:nowrap; }
.oc td.k, .oc th.k { text-align:center; background:var(--raise); font-weight:600; color:var(--ink); }
.oc tr.atm td.k { box-shadow:inset 0 0 0 1px var(--accent); }
.oc tr.itm-c td.c, .oc tr.itm-p td.p { background:var(--unc-soft); }
.oc .lp { cursor:pointer; text-decoration:underline dotted; text-underline-offset:3px; }
.oc .lp:hover { color:var(--accent); }
.oc td.ok-k { cursor:pointer; } .oc td.ok-k:hover { color:var(--accent); }
.oc .hi { color:var(--unc); font-weight:600; }
.oc small { display:block; font-size:10px; color:var(--muted); }
.levels { font-size:12px; color:var(--muted); margin:0 0 8px; line-height:1.55; }
.levels b { color:var(--ink); font-weight:600; }

/* news, results */
.nl { list-style:none; margin:0; padding:0; }
.nl li { padding:8px 0; border-bottom:1px solid var(--line); }
.nl a { color:var(--ink); text-decoration:none; font-weight:500; }
.nl a:hover { color:var(--accent); text-decoration:underline; }
.nl small { display:block; margin-top:2px; font-size:11px; }
.res { width:100%; border-collapse:collapse; font:12px "JetBrains Mono",monospace; }
.res th { font:600 10px Inter,sans-serif; text-transform:uppercase; color:var(--muted); text-align:right; padding:6px 5px; border-bottom:1px solid var(--line); }
.res th:first-child, .res td:first-child { text-align:left; font-family:Inter,sans-serif; }
.res td { text-align:right; padding:6px 5px; border-bottom:1px solid var(--line); vertical-align:top; }
.res td em { display:block; font-style:normal; font-size:10.5px; }
.chgc { display:inline-block; padding:0 4px; border-radius:3px; }
.chgc.up { background:var(--bull-soft); } .chgc.down { background:var(--bear-soft); }

/* verdict card, commentary (kept from the EOD page) */
.verdictcard { border:1px solid var(--line); border-radius:10px; padding:10px 12px; background:var(--surface); }
.verdictcard h3 { margin-top:0 !important; }
.verdictcard .vhead { margin:0 0 8px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.vrows > div { display:flex; gap:8px; padding:3px 0; font-size:12px; }
.vrows > div > b { flex:0 0 56px; color:var(--muted); font-weight:600; }
.vrows > div > span { flex:1; min-width:0; }
.vlist { margin:0; padding-left:16px; } .vlist li { margin:2px 0; }
.topdec { color:var(--unc) !important; }
.section { margin-top:14px; }
.commentary { font-size:13px; line-height:1.55; margin:8px 0 0; }
.commentary small { display:block; color:var(--muted); font-size:11px; margin-top:6px; }
.news { margin:4px 0 8px; padding-left:18px; } .news li { margin:4px 0; }
.callbtns { display:inline-flex; gap:4px; }
.callbtns button { border:1px solid var(--line-strong); background:var(--surface); border-radius:6px; padding:3px 9px; font-size:12px; font-weight:600; }
.callbtns .b { color:var(--bull); } .callbtns .r { color:var(--bear); } .callbtns .n { color:var(--neutral); }
.yours { font-size:12px; color:var(--muted); } .yours b { color:var(--ink); }

/* boards: movers, heatmap, scoreboard */
.bh { display:flex; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
.bh h2 { margin:0; font-size:17px; }
.bh .x { margin-left:auto; }
.mv { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:12px; }
.card { background:var(--surface); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
.card h4 { margin:0; padding:9px 12px; font-size:12px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; }
.card h4 small { font-weight:400; }
.mt { width:100%; border-collapse:collapse; font:12px "JetBrains Mono",monospace; }
.mt td { padding:5px 12px; border-bottom:1px solid var(--line); text-align:right; }
.mt td:first-child { text-align:left; font-family:Inter,sans-serif; font-weight:600; }
.mt tr { cursor:pointer; } .mt tr:hover td { background:var(--raise); }
.hm-sec { margin:0 0 12px; }
.hm-sec h4 { margin:0 0 5px; font-size:12px; display:flex; gap:8px; }
.hm-tiles { display:flex; flex-wrap:wrap; gap:3px; }
.hm-t { min-height:52px; border-radius:5px; padding:5px 7px; cursor:pointer; overflow:hidden; border:1px solid var(--line); background:var(--surface); }
.hm-t b { display:block; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.hm-t span { font:11px "JetBrains Mono",monospace; }
.hm-t:hover { outline:2px solid var(--accent); }
.legendbar { display:flex; align-items:center; gap:6px; font-size:11px; color:var(--muted); }
.legendbar i { width:120px; height:8px; border-radius:4px; background:linear-gradient(90deg,var(--bear),var(--surface),var(--bull)); border:1px solid var(--line); }
.scoreboard { background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:12px 14px; font-size:13px; }
.scoreboard h2 { font-size:15px; margin:0 0 6px; }
.scoreboard table { width:100%; border-collapse:collapse; font-size:12px; margin-top:8px; }
.scoreboard th, .scoreboard td { padding:5px 4px; border-bottom:1px solid var(--line); text-align:left; white-space:nowrap; }
.scoreboard td.ok { color:var(--bull); } .scoreboard td.bad { color:var(--bear); }
.scoreboard select { padding:3px 6px; border-radius:6px; border:1px solid var(--line-strong); background:var(--surface); }
.scoreboard .tools { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; align-items:center; }
.count { font-size:12px; color:var(--muted); margin:6px 0; }

/* sheets (orders, alerts) */
.btn { border:1px solid var(--line-strong); background:var(--surface); border-radius:8px; padding:7px 12px; font-size:13px; min-height:34px; }
.btn.primary { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
.btn.danger { background:var(--bear); color:#fff; border-color:var(--bear); }
.btn[disabled] { opacity:.5; cursor:default; }
.actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
.sheet-bg { position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:30; display:flex; align-items:center; justify-content:center; padding:12px; }
.sheet { background:var(--panel); color:var(--ink); width:100%; max-width:560px; border:1px solid var(--line-strong); border-radius:12px; padding:16px; max-height:calc(100dvh - 24px); overflow:auto; box-shadow:0 20px 60px rgba(0,0,0,.4); }
.sheet h2 { font-size:16px; margin:0 0 4px; }
.sheet .sub { color:var(--muted); font-size:12px; margin:0 0 10px; }
.field { margin:10px 0; }
.field label { display:block; font-size:11px; color:var(--muted); margin-bottom:4px; text-transform:uppercase; letter-spacing:.04em; }
.seg2 { display:flex; border:1px solid var(--line-strong); border-radius:8px; overflow:hidden; }
.seg2 button { flex:1; border:0; background:var(--surface); padding:9px; min-height:38px; }
.seg2 button[aria-pressed="true"] { background:var(--accent); color:var(--accent-ink); }
.seg2 button.buy[aria-pressed="true"] { background:var(--bull); color:#fff; } .seg2 button.sell[aria-pressed="true"] { background:var(--bear); color:#fff; }
.stepper { display:flex; align-items:center; gap:10px; }
.stepper button { width:38px; height:38px; border-radius:8px; border:1px solid var(--line-strong); background:var(--surface); font-size:18px; }
.stepper b { font-size:17px; min-width:2ch; text-align:center; }
.num { width:100%; padding:9px 11px; border:1px solid var(--line-strong); border-radius:8px; background:var(--surface); font-size:15px; }

<script id="scoring">
// Honest scoring rules as pure functions, used by the scoreboard below and by tests/test_step8_scoreboard.py (node).
//  - move: the stock's return over h sessions minus the index's over the same sessions (market-adjusted)
//  - a bullish/bearish call is a hit when |move| > threshold and the move is in its direction;
//    smaller moves and neutral calls are shown but not scored
//  - only the first call on a stock in any 3 sessions is scored; later ones are duplicates
//  - beating a coin at N scored calls needs N/2 + 1.645·√N/2 hits (31/50, 59/100, 112/200, 217/400)
const Scoring = (() => {
  const needed = n => n > 0 ? Math.ceil(n / 2 + 1.645 * Math.sqrt(n) / 2) : null;
  const refLine = () => "Hits needed to beat a coin at this N: " + [50, 100, 200, 400].map(n => `${needed(n)}/${n}`).join(", ");
  const weekdaysBetween = (a, b) => {
    const d = new Date(a + "T00:00:00Z"), e = new Date(b + "T00:00:00Z"); let n = 0;
    while (d < e) { d.setUTCDate(d.getUTCDate() + 1); const w = d.getUTCDay(); if (w > 0 && w < 6) n++; }
    return n;
  };
  // sessions the page knows (every stock's chart dates and the index's); weekdays for anything outside them
  function calendar(dateLists) {
    const dates = [...new Set([].concat(...dateLists))].sort(), pos = new Map(dates.map((d, i) => [d, i]));
    return { dates, between: (a, b) => pos.has(a) && pos.has(b) ? pos.get(b) - pos.get(a) : (a <= b ? weekdaysBetween(a, b) : -weekdaysBetween(b, a)) };
  }
  function fwd(dates, closes, d, h) {
    const i = dates.indexOf(d);
    return i < 0 || i + h >= closes.length ? null : { ret: (closes[i + h] / closes[i] - 1) * 100, to: dates[i + h] };
  }
  function indexReturn(index, from, to) {
    if (!index) return null;
    const a = index.dates.indexOf(from), b = index.dates.indexOf(to);
    return a < 0 || b < 0 ? null : (index.closes[b] / index.closes[a] - 1) * 100;
  }
  function adjusted(dates, closes, index, d, h) {
    const f = fwd(dates, closes, d, h); if (!f) return null;
    if (!index) return +f.ret.toFixed(2);
    const ir = indexReturn(index, d, f.to);
    return ir == null ? null : +(f.ret - ir).toFixed(2);
  }
  // items: [{symbol, as_of, dir: "bullish" | "bearish" | anything else, move: adjusted % or null}]
  function score(items, cal, threshold, gap = 3) {
    const last = {}, counts = { dup: 0, small: 0, nodir: 0, pending: 0 };
    let n = 0, hits = 0;
    const rows = items.slice().sort((a, b) => a.as_of.localeCompare(b.as_of) || a.symbol.localeCompare(b.symbol)).map(it => {
      let status;
      if (last[it.symbol] != null && cal.between(last[it.symbol], it.as_of) < gap) status = "dup";
      else {
        last[it.symbol] = it.as_of;
        if (it.dir !== "bullish" && it.dir !== "bearish") status = "nodir";
        else if (it.move == null) status = "pending";
        else if (Math.abs(it.move) <= threshold) status = "small";
        else { n++; const hit = (it.move > 0) === (it.dir === "bullish"); if (hit) hits++; status = hit ? "hit" : "miss"; }
      }
      if (status in counts) counts[status]++;
      return { ...it, status };
    });
    const need = needed(n);
    return { n, hits, accuracy: n ? hits / n : null, needed: need, clears: n ? hits >= need : null, ...counts, rows };
  }
  // naive baseline: "always bullish on the top-k volume-ratio stocks" on every session the page has
  function baseline(stocks, cal, index, h, k = 10) {
    const items = [];
    for (const d of cal.dates) {
      const ranked = [];
      for (const s of stocks) {
        const i = (s.chart_dates || []).indexOf(d);
        const v = i >= 0 && s.chart_volume_ratios ? s.chart_volume_ratios[i] : null;
        if (v != null) ranked.push([v, s]);
      }
      ranked.sort((a, b) => b[0] - a[0] || a[1].symbol.localeCompare(b[1].symbol));
      for (const [, s] of ranked.slice(0, k))
        items.push({ symbol: s.symbol, as_of: d, dir: "bullish", move: adjusted(s.chart_dates, s.chart_closes, index, d, h) });
    }
    return items;
  }
  return { needed, refLine, calendar, fwd, indexReturn, adjusted, score, baseline };
})();
</script>
<script>
const SCAN = /*__SCAN_DATA__*/;
const SERVER = Object.assign({ live: false, orders: false, paper: true, commentary: false, broker: "none", max_lots: 5, poll_seconds: 30 }, /*__SERVER__*/{});
(function () {
  const $ = (s, el = document) => el.querySelector(s);
  const $$ = (s, el = document) => [...el.querySelectorAll(s)];
  const meta = SCAN.meta, stocks = SCAN.stocks, sum = SCAN.summary;
  const BY = Object.fromEntries(stocks.map(s => [s.symbol, s]));
  let LIVE = { quotes: {}, updated_at: null, market_open: false };
  const auth = { credentials: "same-origin" };
  const LABELS = { "Bullish setup": "b", "Bearish setup": "r", "Neutral": "n", "Unclassified": "u" };
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* private mode: in-memory only */ } },
  };
  const isPhone = () => matchMedia("(max-width:1099px)").matches;

  // ---- theme, disclaimer (always rendered, never dismissible), notices
  const theme = store.get("fos_theme", "dark");
  document.documentElement.dataset.theme = theme;
  $("#themeBtn").addEventListener("click", () => {
    const t = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = t; store.set("fos_theme", t); applyChartTheme();
  });
  $("#disc").innerHTML = "<b>Read before using.</b> " + esc(meta.disclaimer);
  const fitDisc = () => document.documentElement.style.setProperty("--disc", $("#discbar").offsetHeight + "px");
  addEventListener("resize", fitDisc); fitDisc();
  if (meta.demo) {
    document.title = "F&O Terminal — DEMO (synthetic OI)";
    const n = $("#notice"); n.hidden = false;
    n.innerHTML = "<b>Demo data.</b> OI, PCR and strikes on this page are synthetic, generated for testing the interface and the order flow. Prices and volumes are real.";
  } else if (meta.fo_available && meta.chain_available === false) {
    const n = $("#notice"); n.hidden = false;
    n.innerHTML = "<b>Strike tables are not in this build</b> (" + esc(meta.chain_status) + "). Futures OI, PCR and the labels are complete and unaffected.";
  } else if (!meta.fo_available) {
    const n = $("#notice"); n.hidden = false;
    n.innerHTML = "<b>OI and PCR are not in this build.</b> Price change and volume ratio are complete for every stock, but NSE's F&O bhavcopy could not be fetched from the build machine (" + esc(meta.fo_status) + "), so no stock is given a setup label: all are Unclassified rather than guessed.";
  }

  // ---- state
  let filter = "all", sortKey = store.get("fos_sort", "pct"), sortDir = store.get("fos_sortdir", -1), query = "";
  let sel = BY[store.get("fos_sel", "")] ? store.get("fos_sel", "") : (stocks[0] || {}).symbol;
  let tab = store.get("fos_tab", "overview"), board = null;
  let tf = store.get("fos_tf", SERVER.live ? "5" : "D"), leg = "stock";
  let pins = new Set(store.get("fos_pins_v1", []));
  let alerts = store.get("fos_alerts_v1", []);
  const CHAIN = {}, NEWS = {}, lastPx = {};

  // ---- numbers as displayed: live when the feed has the stock, else the EOD scan
  function view(s) {
    const q = LIVE.quotes && LIVE.quotes[s.symbol];
    if (q && q.ltp != null)
      return { ltp: q.ltp, chg: q.chg != null ? q.chg : (q.prev_close ? q.ltp - q.prev_close : null), pct: q.chg_pct, vol: q.volume, vr: q.live_volume_ratio,
               oi: q.fut_oi_chg_pct, pcr: q.live_pcr != null ? q.live_pcr : s.pcr, time: (q.ts || "").slice(11, 19), live: true, q };
    return { ltp: s.close, chg: s.close != null && s.prev_close != null ? s.close - s.prev_close : null, pct: s.price_change_pct, vol: s.volume,
             vr: s.volume_ratio, oi: s.oi_change_pct, pcr: s.pcr, time: s.date, live: false, q: null };
  }
  const blindFor = s => callMode && !callFor(s.symbol);

  // ---- clock and market status (IST)
  function istNow() { return new Date(new Date().toLocaleString("en-US", { timeZone: "Asia/Kolkata" })); }
  function istDate() { return new Date().toLocaleDateString("en-CA", { timeZone: "Asia/Kolkata" }); }
  function marketOpenGuess() { const n = istNow(), d = n.getDay(), m = n.getHours() * 60 + n.getMinutes(); return d > 0 && d < 6 && m >= 555 && m <= 930; }
  function tickClock() {
    $("#clock").textContent = new Date().toLocaleTimeString("en-GB", { timeZone: "Asia/Kolkata", hour12: false }) + " IST";
    const open = SERVER.live ? !!LIVE.market_open : marketOpenGuess();
    $("#mktlbl").textContent = SERVER.live ? (LIVE.error ? "Feed error" : open ? "Market open" : "Market closed") : "EOD · " + meta.as_of_label;
    $("#livedot").className = "dot" + (SERVER.live && LIVE.error ? " err" : SERVER.live && open && LIVE.updated_at ? " on" : "");
  }
  tickClock(); setInterval(tickClock, 1000);

  // ---- call tracking: your own bullish/bearish/neutral call, made before the label is shown,
  //      scored later against what the price actually did, alongside the system's label.
  const CALLS_KEY = "fos_calls_v1", SETTINGS_KEY = "fos_calls_settings";
  let callMode = false, showScore = false, storageOk = true;
  let calls = [], scoreCfg = { horizon: 3, threshold: 1.0 };
  try { calls = JSON.parse(localStorage.getItem(CALLS_KEY) || "[]"); scoreCfg = Object.assign(scoreCfg, JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}")); }
  catch (e) { storageOk = false; }
  const LEAN = { "Bullish setup": "bullish", "Bearish setup": "bearish", "Neutral": "neutral" };
  const saveCalls = () => { try { localStorage.setItem(CALLS_KEY, JSON.stringify(calls)); localStorage.setItem(SETTINGS_KEY, JSON.stringify(scoreCfg)); } catch (e) { storageOk = false; } };
  const callFor = sym => calls.find(c => c.symbol === sym && c.as_of === meta.as_of);
  function recordCall(s, call) {
    if (callFor(s.symbol)) return;
    calls.push({ symbol: s.symbol, as_of: meta.as_of, call, system: LEAN[s.label] || null, close: s.close, made_at: new Date().toISOString(), rets: {} });
    saveCalls(); render(); renderScoreboard();
  }
  // forward stock and index returns for each call, stored while the page's history still covers them
  const IDX = meta.index_closes || null;
  const CAL = Scoring.calendar(stocks.map(s => s.chart_dates || []).concat(IDX ? [IDX.dates] : []));
  function scoreCalls() {
    let changed = false;
    for (const c of calls) {
      const st = BY[c.symbol]; if (!st) continue;
      c.rets = c.rets || {}; c.irets = c.irets || {};
      for (const h of [1, 3, 5]) {
        const f = Scoring.fwd(st.chart_dates, st.chart_closes, c.as_of, h); if (!f) continue;
        if (c.rets[h] == null) { c.rets[h] = +f.ret.toFixed(2); changed = true; }
        if (c.irets[h] == null) { const ir = Scoring.indexReturn(IDX, c.as_of, f.to); if (ir != null) { c.irets[h] = +ir.toFixed(2); changed = true; } }
      }
    }
    if (changed) saveCalls();
  }
  // market-adjusted move in %, or null while unknown; raw when this build has no index
  const moveOf = (c, h) => {
    const r = c.rets && c.rets[h]; if (r == null) return null;
    if (!IDX) return r;
    const ir = c.irets && c.irets[h]; return ir == null ? null : +(r - ir).toFixed(2);
  };
  function scoreStats() {
    const h = scoreCfg.horizon, th = scoreCfg.threshold;
    const as = key => calls.map(c => ({ symbol: c.symbol, as_of: c.as_of, dir: c[key], move: moveOf(c, h), c }));
    const snaps = (meta.live_snapshots || []).map(x => {
      const st = BY[x.symbol];
      return { symbol: x.symbol, as_of: x.date, dir: LEAN[x.label] || null,
               move: st ? Scoring.adjusted(st.chart_dates, st.chart_closes, IDX, x.date, h) : null };
    });
    return { you: Scoring.score(as("call"), CAL, th), sys: Scoring.score(as("system"), CAL, th),
             snap: Scoring.score(snaps, CAL, th), snapDays: new Set((meta.live_snapshots || []).map(x => x.date)).size,
             base: Scoring.score(Scoring.baseline(stocks, CAL, IDX, h), CAL, th),
             agree: calls.filter(c => c.system && c.system === c.call).length, total: calls.length };
  }
  function renderScoreboard() {
    const el = $("#scoreboard"); el.hidden = !showScore; if (!showScore) return;
    scoreCalls(); const st = scoreStats(), h = scoreCfg.horizon, th = scoreCfg.threshold;
    const pctOf = (a, b) => b ? Math.round(100 * a / b) + "%" : "—";
    const need = s => !s.n ? "—" : s.needed > s.n ? "N too small" : s.needed + "/" + s.n;
    const line = (name, s) => `<tr><td>${name}</td><td>${s.n}</td><td>${s.hits}</td><td>${pctOf(s.hits, s.n)}</td><td>${need(s)}</td><td class="${s.clears ? "ok" : s.n ? "bad" : ""}">${s.n ? (s.clears ? "yes" : "no") : "—"}</td></tr>`;
    const STATUS = { hit: "scored: hit", miss: "scored: miss", dup: "duplicate: within 3 sessions of an earlier call", small: `move within ±${th}%`, nodir: "neutral: no direction", pending: "waiting for data" };
    const yours = new Map(st.you.rows.map(r => [r.c, r])), sys = new Map(st.sys.rows.map(r => [r.c, r]));
    const cls = r => r && r.status === "hit" ? "ok" : r && r.status === "miss" ? "bad" : "";

    const up = css("--bull-soft").replace(/[\d.]+\)$/, ".5)"), dn = css("--bear-soft").replace(/[\d.]+\)$/, ".5)");
    vs.setData(bars.filter(b => b.volume != null).map(b => ({ time: b.time, value: b.volume, color: b.close >= b.open ? up : dn })));
    as.setData(tf === "D" ? [] : bars.filter(b => b.atp != null).map(b => ({ time: b.time, value: b.atp })));
    ls.setData(line || []);
    plines.forEach(p => cs.removePriceLine(p)); plines = [];
    const q = LIVE.quotes[sel];
    if (leg === "stock" && tf !== "D" && q && q.prev_close) plines.push(cs.createPriceLine({ price: q.prev_close, color: css("--muted"), lineWidth: 1, lineStyle: 1, axisLabelVisible: true, title: "prev close" }));
    if (leg === "stock" || leg === "fut")
      alerts.filter(a => a.sym === sel && a.leg === leg && !a.fired).forEach(a => plines.push(cs.createPriceLine({ price: a.level, color: css("--unc"), lineWidth: 1, lineStyle: 2, axisLabelVisible: true, title: "alert" })));
    if (fit) chart.timeScale().fitContent();
    $("#cstat").textContent = stat; chartMsg(msg); legendAt(null);
  }

  // ---- side tabs
  const TABS = [["overview", "Overview"], ["options", "Options"], ["news", "News"], ["results", "Results"], ["signals", "Signals"]];
  if (!TABS.some(t => t[0] === tab)) tab = "overview";
  function renderTabs() {
    $("#tabs").innerHTML = TABS.map(([k, n], i) => `<button class="tab" type="button" role="tab" data-tab="${k}" aria-selected="${k === tab}" title="${n} (${i + 1})">${n}</button>`).join("");
  }
  $("#tabs").addEventListener("click", e => { const b = e.target.closest("[data-tab]"); if (!b) return; setTab(b.dataset.tab); });
  function setTab(k) { tab = k; store.set("fos_tab", k); renderTabs(); renderTab(); $("#tbody").scrollTop = 0; }
  function renderTab() {
    const s = BY[sel], el = $("#tbody"); if (!s) { el.innerHTML = ""; return; }
    if (tab === "overview") el.innerHTML = overviewHtml(s);
    else if (tab === "options") { el.innerHTML = optionsHtml(s, CHAIN[s.symbol] || s.chain); if (SERVER.live && s.chain && !CHAIN[s.symbol]) fetchChain(s); }
    else if (tab === "news") { el.innerHTML = newsHtml(s); if (SERVER.live && !NEWS[s.symbol]) fetchNews(s); }
    else if (tab === "results") el.innerHTML = resultsHtml(s);
    else if (tab === "signals") el.innerHTML = signalsHtml(s);
    wireTab(s, el);
  }
  function wireTab(s, el) {
    $$("[data-explain]", el).forEach(b => b.addEventListener("click", () => explain(s, b)));
    $$("[data-verdict]", el).forEach(b => b.addEventListener("click", () => verdict(s, b, false)));
    $$("[data-trade]", el).forEach(b => b.addEventListener("click", () => openSheet(s, b.dataset.trade, b.dataset.strike != null ? Number(b.dataset.strike) : null)));
    $$("[data-leg]", el).forEach(b => b.addEventListener("click", () => { leg = b.dataset.leg; if (tf === "D" && SERVER.live) tf = "5"; renderLegs(); loadChart(true); if (isPhone()) scrollTo({ top: 0, behavior: "smooth" }); }));
    const nr = $("[data-newsrefresh]", el); if (nr) nr.addEventListener("click", () => { delete NEWS[s.symbol]; renderTab(); });
  }
  function kvCell(label, value, sub = "", cls = "") { return `<div><small>${label}</small><b class="${cls}">${value}</b>${sub ? `<em>${sub}</em>` : ""}</div>`; }
  function overviewHtml(s) {
    const v = view(s), q = v.q;
    let h = "";
    if (q) {
      const tot = (q.buy_qty || 0) + (q.sell_qty || 0), bp = tot ? Math.round(100 * (q.buy_qty || 0) / tot) : null;
      const atpGap = q.atp && q.ltp ? (q.ltp / q.atp - 1) * 100 : null;
      const rng = q.wk52_high && q.wk52_low && q.wk52_high > q.wk52_low ? Math.min(100, Math.max(0, 100 * (q.ltp - q.wk52_low) / (q.wk52_high - q.wk52_low))) : null;
      h += `<h3>Live · ${esc(v.time)} IST</h3><div class="kvg">
        ${kvCell("LTP", fmtPx(q.ltp), `${signed(v.chg)} (${pct(q.chg_pct)})`, dirClass(q.chg_pct))}
        ${kvCell("Avg traded price", fmtPx(q.atp), atpGap != null ? `LTP ${atpGap >= 0 ? "above" : "below"} ATP by ${Math.abs(atpGap).toFixed(2)}%` : "", "")}
        ${kvCell("Open", fmtPx(q.open))}${kvCell("Prev close", fmtPx(q.prev_close))}
        ${kvCell("High", fmtPx(q.high), "", "up")}${kvCell("Low", fmtPx(q.low), "", "down")}
        ${kvCell("Volume today", compact(q.volume), q.live_volume_ratio != null ? `${ratio(q.live_volume_ratio)} the 20-day average, pro rata to the time of day` : "")}
        ${kvCell("Last traded qty", inr(q.ltq))}
        ${kvCell("Total buy qty", compact(q.buy_qty))}${kvCell("Total sell qty", compact(q.sell_qty))}
      </div>`;
      if (bp != null) h += `<div class="meter split" title="buy ${bp}% / sell ${100 - bp}%"><i style="width:${bp}%"></i></div><p class="count" style="margin:3px 0 0">Order book: ${bp}% buy · ${100 - bp}% sell quantity</p>`;
      if (rng != null) h += `<h3>52-week range</h3><div class="range"><i style="left:${rng}%"></i></div><div style="display:flex;justify-content:space-between" class="count mono"><span>${fmtPx(q.wk52_low)}</span><span>${fmtPx(q.wk52_high)}</span></div>`;
      if (q.lower_circuit || q.upper_circuit) h += `<p class="count">Circuit band ${fmtPx(q.lower_circuit)} – ${fmtPx(q.upper_circuit)}</p>`;
      if (q.fut_ltp != null) {
        const basis = q.fut_ltp - q.ltp;
        h += `<h3>Future · ${esc(q.fut_tradingsymbol || "")}</h3><div class="kvg">
          ${kvCell("Fut LTP", fmtPx(q.fut_ltp), `${pct(q.fut_chg_pct)} · basis ${signed(basis)}`, dirClass(q.fut_chg_pct))}
          ${kvCell("Fut avg price", fmtPx(q.fut_atp))}
          ${kvCell("Fut OI (all expiries)", compact(q.fut_oi), q.fut_oi_chg_pct != null ? `${pct(q.fut_oi_chg_pct)} vs close` : "", dirClass(q.fut_oi_chg_pct))}
          ${kvCell("Fut volume", compact(q.fut_volume))}
          ${kvCell("PCR", num(q.live_pcr != null ? q.live_pcr : s.pcr), q.live_pcr != null ? `live${q.pcr_ts ? " · " + esc(q.pcr_ts) : ""}` : "last close")}
          ${kvCell("Live label", q.live_label ? esc(q.live_label) : "—", "same rule as the EOD label, on live inputs")}</div>`;
      }
      const dp = q.depth;
      if (dp && (dp.bid || []).length) {
        const mx = Math.max(1, ...dp.bid.map(x => x[1]), ...(dp.ask || []).map(x => x[1]));
        const rows = Array.from({ length: 5 }, (_, i) => { const b = dp.bid[i], a = (dp.ask || [])[i];
          return `<tr><td class="bq" style="--w:${b ? Math.round(100 * b[1] / mx) : 0}%">${b ? inr(b[1]) : ""}</td><td class="up">${b ? fmtPx(b[0]) : ""}</td><td class="down">${a ? fmtPx(a[0]) : ""}</td><td class="aq" style="--w:${a ? Math.round(100 * a[1] / mx) : 0}%">${a ? inr(a[1]) : ""}</td></tr>`; }).join("");
        h += `<h3>Market depth</h3><table class="depth"><thead><tr><th>Bid qty</th><th>Bid</th><th>Ask</th><th>Ask qty</th></tr></thead><tbody>${rows}</tbody></table>`;
      }
    } else if (SERVER.live) h += `<p class="count">Live quotes start at 09:15 IST; below are the last session's closing numbers.</p>`;
    h += `<h3>Closing data · ${esc(meta.as_of_label)}</h3><div class="kvg">
      ${kvCell("Close", fmtPx(s.close), "prev " + fmtPx(s.prev_close) + " (" + esc(s.prev_date || "") + ")")}
      ${kvCell("Price change", pct(s.price_change_pct), "close vs previous close", dirClass(s.price_change_pct))}
      ${kvCell("Volume", compact(s.volume), "20-day avg " + compact(s.avg_volume_20d))}
      ${kvCell("Volume ratio", ratio(s.volume_ratio), "volume ÷ its 20-day average")}
      ${kvCell("Futures OI", compact(s.fut_oi), s.fut_oi_prev != null ? "prev " + compact(s.fut_oi_prev) : "")}
      ${kvCell("OI change", pct(s.oi_change_pct), "all expiries combined", dirClass(s.oi_change_pct))}
      ${kvCell("Call OI / Put OI", `${compact(s.call_oi)} / ${compact(s.put_oi)}`)}
      ${kvCell("PCR", num(s.pcr), "put OI ÷ call OI")}</div>`;
    h += blindFor(s) ? `<h3>Label hidden</h3><p class="count">Make your call above the chart first; the label and its reasons appear after.</p>`
      : `<h3>Why “${esc(s.label)}”</h3><div class="why"><ul>${(s.reasons || []).map(r => "<li>" + esc(r) + "</li>").join("")}</ul></div>`;
    return h;
  }

  function optionsHtml(s, chain) {
    if (!chain) return `<p class="levels">${s.chain_problem ? "Strike table unavailable for this stock: " + esc(s.chain_problem) + "." : meta.chain_available === false ? "Strike tables could not be built for this session (" + esc(meta.chain_status || "") + "); OI, PCR and labels are unaffected." : meta.fo_available ? "No options data for this stock." : "Strike-level data needs the F&O bhavcopy, which is not in this build."}</p>`;
    const live = !!chain.live_at, spot = view(s).ltp;
    const val = (r, t, k) => r[`${t}_live_${k}`] != null ? r[`${t}_live_${k}`] : null;
    const leg1 = (r, t) => {
      const px = val(r, t, "ltp") ?? r[`${t}_close`], ch = val(r, t, "chg_pct"), oi = val(r, t, "oi") ?? r[`${t}_oi`];
      const doi = live ? val(r, t, "oi_chg") : r[`${t}_oi_chg`], vol = val(r, t, "vol") ?? r[`${t}_vol`];
      return { px, ch, oi, doi, vol };
    };
    const rows = chain.strikes.map(r => {
      const c = leg1(r, "ce"), p = leg1(r, "pe"), k = r.strike;
      const hiC = k === chain.max_call_oi_strike, hiP = k === chain.max_put_oi_strike;
      return `<tr class="${k === chain.atm ? "atm" : ""} ${spot != null && k < spot ? "itm-c" : ""} ${spot != null && k > spot ? "itm-p" : ""}">
        <td class="c${hiC ? " hi" : ""}">${compact(c.oi)}<small>${c.doi != null ? signedCompact(c.doi) : ""}</small></td>
        <td class="c">${compact(c.vol)}</td>
        <td class="c"><span class="lp" data-leg="CE:${k}" title="Chart ${fmtStrike(k)} CE">${fmtPx(c.px)}</span><small class="${dirClass(c.ch)}">${c.ch != null ? pct(c.ch) : ""}</small></td>
        <td class="k${SERVER.orders ? " ok-k" : ""}"${SERVER.orders ? ` data-trade="CE" data-strike="${k}" title="Order at strike ${fmtStrike(k)} (call or put)" role="button" tabindex="0"` : ""}>${fmtStrike(k)}</td>
        <td class="p"><span class="lp" data-leg="PE:${k}" title="Chart ${fmtStrike(k)} PE">${fmtPx(p.px)}</span><small class="${dirClass(p.ch)}">${p.ch != null ? pct(p.ch) : ""}</small></td>
        <td class="p">${compact(p.vol)}</td>
        <td class="p${hiP ? " hi" : ""}">${compact(p.oi)}<small>${p.doi != null ? signedCompact(p.doi) : ""}</small></td></tr>`;
    }).join("");
    const note = chain.one_sided_strikes ? `<p class="levels">${chain.one_sided_strikes} strike${chain.one_sided_strikes === 1 ? " is" : "s are"} listed on one side only in NSE's file; the missing side shows 0 OI and no price.</p>` : "";
    return `<p class="levels">Expiry <b>${esc(chain.expiry)}</b> · ${live ? `live <b>${esc(chain.live_at)}</b>` : "closing prices"} · highest call OI <b>${fmtStrike(chain.max_call_oi_strike)}</b> (read as resistance) · highest put OI <b>${fmtStrike(chain.max_put_oi_strike)}</b> (support) · max pain <b>${fmtStrike(chain.max_pain)}</b> · ATM <b>${fmtStrike(chain.atm)}</b>. Tap a price to chart that option${SERVER.orders ? "; tap a strike to prepare an order" : ""}.</p>${note}
      ${chain.live_error ? `<p class="err">Live option prices unavailable: ${esc(chain.live_error)}</p>` : ""}
      <div class="oc-wrap"><table class="oc"><thead><tr><th>Call OI<small>Δ OI</small></th><th>Vol</th><th>Call LTP<small>% chg</small></th><th class="k">Strike</th><th>Put LTP<small>% chg</small></th><th>Vol</th><th>Put OI<small>Δ OI</small></th></tr></thead><tbody>${rows}</tbody></table></div>
      <p class="count">Shaded: in the money. ${live ? "Δ OI vs the last close; % change vs each option's previous close." : "Δ OI as reported in the closing bhavcopy."}</p>`;
  }
  async function fetchChain(s) {
    try {
      CHAIN[s.symbol] = await getJson(`/api/chain/${encodeURIComponent(s.symbol)}`);
      if (sel === s.symbol) { renderLegs(); if (tab === "options") renderTab(); }
    } catch (e) { /* keep the EOD chain */ }
  }

  function ago(ts) {
    if (!ts) return "";
    const m = Math.round((Date.now() / 1000 - ts) / 60);
    return m < 1 ? "just now" : m < 60 ? m + " min ago" : m < 1440 ? Math.round(m / 60) + " h ago" : Math.round(m / 1440) + " d ago";
  }
  function newsHtml(s) {
    const ev = s.events || { last_10: [], upcoming: [], analyst_view: [] };
    let h = "";
    if (SERVER.live) {
      const n = NEWS[s.symbol];
      h += `<h3>Headlines</h3>`;
      if (!n) h += `<p class="count">Loading headlines…</p>`;
      else if (n.error) h += `<p class="err">News unavailable: ${esc(n.error)}</p>`;
      else if (!n.items.length) h += `<p class="count">No headlines in the last 7 days.</p>`;
      else h += `<ul class="nl">${n.items.map(i => `<li><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title)}</a><small>${esc(i.source)} · ${esc(ago(i.ts))}</small></li>`).join("")}</ul>
        <p class="count">News headlines (Google News, last 7 days, fetched ${esc(n.fetched_at)}). News is not a filing and feeds no label. <button class="chip" type="button" data-newsrefresh>Refresh</button></p>`;
    } else h += `<p class="count">Live headlines appear on the live server. Exchange filings for this stock are below.</p>`;
    const up = (ev.upcoming || []).map(u => `<li>${esc(u.type)} in ${u.sessions} session${u.sessions === 1 ? "" : "s"} · ${esc(u.date)}${u.subject ? `<small>${esc(u.subject.slice(0, 140))}</small>` : ""}</li>`).join("");
    if (up) h += `<h3>Coming up</h3><ul class="nl">${up}</ul>`;
    const fl = (ev.last_10 || []).map(e => `<li>${e.url ? `<a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.subject || e.type)}</a>` : esc(e.subject || e.type)}<small>${esc(e.type)}${e.subtype ? " / " + esc(e.subtype) : ""} · ${esc(e.event_date)}${e.value_cr ? " · ₹" + inr(e.value_cr) + " cr" : ""} · ${esc(e.source || "")}</small></li>`).join("");
    h += `<h3>Exchange filings, last 10 sessions</h3>${fl ? `<ul class="nl">${fl}</ul>` : `<p class="count">None classified in the last 10 sessions.</p>`}`;
    const an = (ev.analyst_view || []).map(a => `<li><a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.subject)}</a><small>${esc(a.label)}</small></li>`).join("");
    if (an) h += `<h3>Analyst views</h3><ul class="nl">${an}</ul>`;
    if (SERVER.verdict) h += `<h3>AI news check</h3><p class="count">"Weigh the evidence" (Signals tab) has Claude search the last 10 days of news and weigh it against the numbers.</p>`;
    return h;
  }
  async function fetchNews(s) {
    try { NEWS[s.symbol] = await getJson(`/api/news/${encodeURIComponent(s.symbol)}`); }
    catch (e) { NEWS[s.symbol] = { error: e.message, items: [] }; }
    if (sel === s.symbol && tab === "news") renderTab();
  }

  function resultsHtml(s) {
    const f = s.financials, up = ((s.events || {}).upcoming || []).find(u => u.type === "results" || u.type === "results_date");
    let h = up ? `<p class="levels">Next results: <b>${esc(up.date)}</b> (in ${up.sessions} session${up.sessions === 1 ? "" : "s"})</p>` : "";
    if (!f || !f.quarters || !f.quarters.length) return h + `<p class="count">No quarterly numbers for this stock in this build yet (they come from NSE's XBRL filings, refreshed nightly).</p>`;
    const qn = p => { const d = new Date(p + "T00:00:00Z"), m = d.getUTCMonth() + 1, y = d.getUTCFullYear(); const fq = m === 6 ? 1 : m === 9 ? 2 : m === 12 ? 3 : 4; return `Q${fq} FY${String(m <= 3 ? y : y + 1).slice(2)}`; };
    const chg = (v, lbl) => v == null ? `<em class="flat">${lbl} —</em>` : typeof v === "string" ? `<em class="flat" title="the earlier figure is zero or a loss">${lbl} n/m</em>`
      : `<em><span class="chgc ${dirClass(v)}">${lbl} ${Math.abs(v) > 999 ? (v > 0 ? ">+999" : "<−999") : (v > 0 ? "+" : "") + v.toFixed(1)}%</span></em>`;
    const row = (name, key, unit) => `<tr><td>${name}<em class="muted">${unit}</em></td>${f.quarters.map(q => `<td>${q[key] == null ? "—" : key === "eps" ? q[key].toFixed(2) : inr(Math.round(q[key]))}${chg(q[key + "_qoq"], "QoQ")}${chg(q[key + "_yoy"], "YoY")}</td>`).join("")}</tr>`;
    h += `<h3>Last ${f.quarters.length} quarters · ${esc(f.basis)}</h3>
      <div style="overflow-x:auto"><table class="res"><thead><tr><th></th>${f.quarters.map(q => `<th>${qn(q.period)}<br><small>${esc(q.period)}</small></th>`).join("")}</tr></thead>
      <tbody>${row("Revenue", "revenue", "₹ crore")}${row("Net profit", "net_profit", "₹ crore")}${row("EPS", "eps", "₹ basic")}</tbody></table></div>
      <p class="count">From NSE's XBRL results filings (${esc(f.basis)}). Revenue is revenue from operations (banks: interest earned). QoQ vs the quarter before, YoY vs the same quarter a year earlier. EPS is not adjusted for bonus issues or splits, so its change can jump when the share count changes. Updated ${esc(f.updated || "—")}.</p>`;
    return h;
  }

  function signalsHtml(s) {
    if (blindFor(s)) return `<h3>Label hidden</h3><p class="count">Make your call above the chart first; the verdict and its votes appear after.</p>`;
    return `${verdictCard(s)}
      ${SERVER.commentary ? `<div class="section"><h3>Plain-language reading</h3><button class="btn" type="button" data-explain="${s.symbol}">Explain these numbers</button><div class="commentary" id="c-${s.symbol}"></div></div>` : ""}
      ${SERVER.verdict ? `<div class="section"><h3>Evidence verdict (numbers + news)</h3><button class="btn" type="button" data-verdict="${s.symbol}">Weigh the evidence</button><div class="commentary verdict" id="v-${s.symbol}"></div></div>` : ""}
      ${SERVER.orders && s.chain ? `<div class="actions"><button class="btn" type="button" data-trade="FUT">Order: ${esc(s.symbol)} future</button></div>` : ""}`;
  }

  // ---- verdict card: deterministic, computed at build time (scanner/verdict_rules.py); identical
  //      with or without any AI. The optional "Weigh the evidence" AI summary renders BELOW it.
  function verdictCard(s) {
    const v = s.verdict; if (!v) return "";
    const ev = s.events || { today: [], last_10: [], upcoming: [], analyst_view: [], flags: {} };
    const pat = meta.event_patterns || {};
    const cls = v.lean === "bullish" ? "b" : v.lean === "bearish" ? "r" : "n";
    const patLine = t => {
      const p = pat[t]; if (!p || !p.count) return "";
      return ` <small>pattern over ${p.count} cases: pre ${sgnpct(p.pre)}, day ${sgnpct(p.day)}, post ${sgnpct(p.post)}</small>`;
    };
    const evLines = [];
    for (const u of ev.upcoming) evLines.push(`<li>${esc(u.type)} in ${u.sessions} session${u.sessions === 1 ? "" : "s"} (${esc(u.date)})${patLine(u.type)}</li>`);
    for (const e of ev.last_10) evLines.push(`<li>${esc(e.type)}${e.subtype ? " / " + esc(e.subtype) : ""} [${esc(e.bucket)}] ${esc(e.event_date)}${e.value_cr ? " · ₹" + inr(e.value_cr) + " cr" : ""}${patLine(e.type)}</li>`);
    const analyst = ev.analyst_view.map(a => `<li><a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.subject.slice(0, 90))}</a> <small>${esc(a.label)}</small></li>`).join("");
    const filings = ev.last_10.filter(e => e.url).slice(0, 6).map(e => `<a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.type)} ${esc(e.event_date)}</a>`).join(" · ");
    const m = s.model;
    return `<div class="section verdictcard"><h3>Verdict (computed by fixed rules, not advice)</h3>
      <p class="vhead"><span class="pill ${cls}">Lean: ${esc(v.lean)}</span> <b>confidence ${esc(v.confidence)}</b>
        <small>votes — data ${sgn0(v.votes.data)}, model ${sgn0(v.votes.model)}, events ${sgn0(v.votes.events)} (score ${v.events_score})</small></p>
      <div class="vrows">
        <div><b>Data</b><span>${esc(s.label)} · price ${pct(s.price_change_pct)} · vol ${ratio(s.volume_ratio)} · OI ${pct(s.oi_change_pct)} · PCR ${num(s.pcr)}</span></div>
        <div><b>Events</b><span>${evLines.length ? `<ul class="vlist">${evLines.join("")}</ul>` : "none in the last 10 sessions"}</span></div>
        <div><b>Model</b><span>${m ? `p(up) ${num(m.p_up)} · p(down) ${num(m.p_down)} · p(flat) ${num(m.p_flat)} <small>out-of-sample Brier ${num(m.oos_brier)} vs base rate ${m.base_brier != null ? num(m.base_brier) : "—"} (lower is better; the base rate always predicts the class shares) · vote weight ${v.votes.model_weight != null ? v.votes.model_weight : 1}${v.votes.model_weight === 0 ? ` (would have voted ${sgn0(v.votes.model_raw)})` : ""} · trained through ${esc(m.trained_through)}</small>${s.model_top_decile ? ` <small class="topdec">top decile of today's p(${s.model_top_decile === "both" ? "up) and p(down" : esc(s.model_top_decile)}) · display only, not a vote</small>` : ""}` : "no model in this build"}</span></div>
        <div><b>Analyst</b><span>${analyst ? `<ul class="vlist">${analyst}</ul>` : "no analyst views (tier-3 news) in the last 5 sessions"}</span></div>
        <div><b>News</b><span>${filings || "no filing links in the window"}</span></div>
      </div></div>`;
  }

  function moversHtml() {
    const all = stocks.map(s => ({ s, v: view(s) }));

    const card = (title, sub, rows, col) => `<div class="card"><h4>${title}<small>${sub}</small></h4><table class="mt"><tbody>${rows.length ? rows.map(({ s, v }) =>
        `<tr data-go="${esc(s.symbol)}"><td>${esc(s.symbol)}</td><td>${fmtPx(v.ltp)}</td><td class="${dirClass(v.pct)}">${pct(v.pct)}</td><td>${col(v)}</td></tr>`).join("") : `<tr><td colspan="4" class="muted">None right now</td></tr>`}</tbody></table></div>`;
    const by = (k, d = -1) => (a, b) => (a.v[k] == null) - (b.v[k] == null) || d * ((a.v[k] ?? 0) - (b.v[k] ?? 0));
    const oiCol = v => `<span class="${dirClass(v.oi)}">OI ${pct(v.oi)}</span>`;
    const has = x => x.v.pct != null && x.v.oi != null;
    return `<div class="bh"><h2>Top movers</h2><span class="count">${live ? "live, " + esc(LIVE.updated_at || "") + " IST" : "closing data of " + esc(meta.as_of_label)} · price vs previous close; OI = futures OI vs last close</span><button class="btn x" type="button" data-closeboard>Close</button></div>
      <div class="mv">

        ${card("Volume spikes", "× 20-day avg" + (live ? " (pro rata)" : ""), top(all.filter(x => x.v.vr != null), by("vr")), v => ratio(v.vr))}
        ${card("Long build-up", "price ↑ · OI ↑", top(all.filter(x => has(x) && x.v.pct > 0 && x.v.oi > 0), by("oi")), oiCol)}
        ${card("Short build-up", "price ↓ · OI ↑", top(all.filter(x => has(x) && x.v.pct < 0 && x.v.oi > 0), by("oi")), oiCol)}
        ${card("Short covering", "price ↑ · OI ↓", top(all.filter(x => has(x) && x.v.pct > 0 && x.v.oi < 0), by("oi", 1)), oiCol)}
        ${card("Long unwinding", "price ↓ · OI ↓", top(all.filter(x => has(x) && x.v.pct < 0 && x.v.oi < 0), by("oi", 1)), oiCol)}
      </div><p class="count">Build-up names are the conventional readings of price and futures OI together; descriptive, not signals.</p>`;
  }
  function heatmapHtml() {
    const M = { pct: ["% change", v => v.pct, 3], oi: ["Fut OI change %", v => v.oi, 8], vr: ["Volume × avg", v => v.vr != null ? v.vr - 1 : null, 1.5] };
    const [mname, fn, scale] = M[heatMetric];
    const all = stocks.map(s => ({ s, v: view(s) }));
    const weight = x => Math.sqrt(Math.max(1, (x.v.vol || 0) * (x.v.ltp || 0)));
    const wmax = Math.max(...all.map(weight));
    const groups = {};
    all.forEach(x => { const g = sectorName(x.s.sector) || "Other"; (groups[g] = groups[g] || []).push(x); });
    const color = val => {
      if (val == null) return "background:var(--surface)";
      const k = Math.min(1, Math.abs(val) / scale), p = Math.round(12 + 70 * k);
      return `background:color-mix(in srgb, var(${val >= 0 ? "--bull" : "--bear"}) ${p}%, var(--surface))`;
    };
    const fmtV = val => heatMetric === "vr" ? (val == null ? "—" : ratio(val + 1)) : pct(val);
    const secs = Object.entries(groups).map(([name, xs]) => {
      const vals = xs.map(x => fn(x.v)).filter(v => v != null), avg = vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
      return { name, xs: xs.sort((a, b) => weight(b) - weight(a)), avg, w: xs.reduce((a, x) => a + weight(x), 0) };
    }).sort((a, b) => b.w - a.w);
    return `<div class="bh"><h2>Heatmap</h2>
      <span class="seg">${Object.entries(M).map(([k, [n]]) => `<button type="button" data-metric="${k}" aria-pressed="${k === heatMetric}">${n}</button>`).join("")}</span>
      <span class="legendbar"><span>${heatMetric === "vr" ? "below avg" : "−" + scale + "%"}</span><i></i><span>${heatMetric === "vr" ? "above avg" : "+" + scale + "%"}</span></span>
      <span class="count">tile size: traded value</span><button class="btn x" type="button" data-closeboard>Close</button></div>
      ${secs.map(g => `<div class="hm-sec"><h4>${esc(g.name)} <span class="${dirClass(g.avg)} mono">${heatMetric === "vr" ? "" : pct(g.avg != null ? +g.avg.toFixed(2) : null)}</span></h4><div class="hm-tiles">${g.xs.map(x => {
        const val = fn(x.v), w = weight(x) / wmax;
        return `<div class="hm-t" data-go="${esc(x.s.symbol)}" style="${color(val)};flex:${(0.6 + 3 * w).toFixed(2)} 1 ${Math.round(70 + 150 * w)}px" title="${esc(x.s.name || x.s.symbol)} · ${fmtPx(x.v.ltp)}"><b>${esc(x.s.symbol)}</b><span>${fmtV(val)}</span></div>`; }).join("")}</div></div>`).join("")}`;
  }

  // ---- price alerts (stock / future LTP; checked on every live poll while this page is open)

  function openAlerts(sym) {

      sheet.innerHTML = `<h2>Price alerts</h2><p class="sub">Checked on every live poll (${SERVER.poll_seconds}s) while this page is open: a sound, and a browser notification when allowed. They live in this browser only.</p>
        ${s && SERVER.live ? `<div class="field"><label>${esc(s.symbol)} · now ${fmtPx(q ? q.ltp : s.close)}${q && q.fut_ltp ? " · future " + fmtPx(q.fut_ltp) : ""}</label>
          <div style="display:flex;gap:6px"><select id="alLeg" class="num" style="max-width:130px"><option value="stock">Stock</option><option value="fut">Future</option></select>
          <input class="num" id="alLv" type="number" step="0.05" inputmode="decimal" placeholder="Alert price" value="${q ? q.ltp : s.close}"><button class="btn primary" type="button" id="alAdd">Add</button></div></div>` : `<p class="count">Alerts need the live server.</p>`}

      const add = $("#alAdd", sheet);

        if (!(lv > 0)) return;
        alerts.push({ id: Date.now(), sym: s.symbol, leg: lg, level: lv, dir: now != null && lv < now ? "below" : "above", created: new Date().toISOString(), fired: null });
        saveAlerts(); draw(); loadChart(false);
        if ("Notification" in window && Notification.permission === "default") Notification.requestPermission();
      });
    }

  function beep() {
    try { const c = new (window.AudioContext || window.webkitAudioContext)(), o = c.createOscillator(), g = c.createGain();
      o.connect(g); g.connect(c.destination); o.frequency.value = 880; g.gain.setValueAtTime(0.15, c.currentTime); g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.6); o.start(); o.stop(c.currentTime + 0.6); } catch (e) { /* no audio */ }
  }

        const msg = `${a.sym}${a.leg === "fut" ? " future" : ""} ${a.dir === "above" ? "rose to" : "fell to"} ${fmtPx(px)} (alert ${fmtPx(a.level)})`;

        ${kv("Slippage vs mid", f.slippage_vs_mid != null ? `₹${inr(f.slippage_vs_mid)} a unit (${f.slippage_pct}%), ${money(f.slippage_value)} in all` : "—")}${kv("Fill rule", FILL_RULE[f.mode] || esc(f.mode))}</div>
