<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>F&amp;O Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<link rel="stylesheet" href="/tokens.css">
<style>
:root { --top:44px; --disc:28px; --nav:0px; --rail:68px; --pw:440px; --rowh:28px; }
*, *::before, *::after { box-sizing:border-box; }
html, body { height:100%; }
body { margin:0; background:var(--bg); color:var(--ink); font:13px/1.4 Inter,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  font-variant-numeric:tabular-nums; -webkit-text-size-adjust:100%; overflow:hidden; }
button, input, select { font:inherit; color:inherit; }
button { cursor:pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible { outline:2px solid var(--focus); outline-offset:1px; }
.mono, .px, .num-c { font-family:"JetBrains Mono",ui-monospace,Consolas,monospace; }
.up { color:var(--bull); } .down { color:var(--bear); } .flat { color:var(--muted); }
small, .muted { color:var(--muted); }
a { color:var(--accent); }
[hidden] { display:none !important; }

/* ---------- shell: top bar, navigation rail, workspace */
body { display:flex; flex-direction:column; height:100dvh; }
.top { height:var(--top); flex:0 0 auto; display:flex; align-items:center; gap:12px; padding:0 10px 0 0; background:var(--panel); border-bottom:1px solid var(--line); position:relative; z-index:12; }
.brand { width:var(--rail); align-self:stretch; flex:0 0 auto; display:flex; align-items:center; justify-content:center; border-right:1px solid var(--line); color:var(--accent); }
.brand svg { width:22px; height:22px; }
.bname { font-weight:700; font-size:14px; letter-spacing:.01em; white-space:nowrap; color:var(--ink); text-decoration:none; }
.bname i { font-style:normal; color:var(--accent); }
.mkt { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); white-space:nowrap; }
.dot { width:8px; height:8px; border-radius:50%; background:var(--neutral); flex:0 0 auto; }
.dot.on { background:var(--bull); box-shadow:0 0 0 3px var(--bull-soft); }
.dot.err { background:var(--bear); }
.dot.stale { background:var(--unc); }
.clock { font-family:"JetBrains Mono",monospace; color:var(--ink); }
.dsrc { display:inline-flex; align-items:center; gap:5px; height:22px; padding:0 7px; border:1px solid var(--line-strong); border-radius:3px; font-size:11px; color:var(--muted); white-space:nowrap; }
.dsrc b { color:var(--ink); font-weight:600; }
.dsrc.live { border-color:color-mix(in srgb, var(--bull) 55%, transparent); } .dsrc.live b { color:var(--bull); }
.dsrc.stale { border-color:var(--unc); } .dsrc.stale b { color:var(--unc); }
.dsrc.err { border-color:var(--bear); } .dsrc.err b { color:var(--bear); }
.tsearch { position:relative; flex:1; max-width:360px; margin-left:auto; }
.tsearch input { width:100%; height:30px; padding:0 34px 0 30px; border-radius:4px; border:1px solid var(--line-strong); background:var(--surface); }
.tsearch > svg { position:absolute; left:9px; top:8px; width:14px; height:14px; color:var(--muted); pointer-events:none; }
.tsearch kbd { position:absolute; right:7px; top:6px; font:11px "JetBrains Mono",monospace; color:var(--muted); border:1px solid var(--line-strong); border-radius:3px; padding:0 5px; }
.sugg { position:absolute; top:34px; left:0; right:0; background:var(--panel); border:1px solid var(--line-strong); border-radius:4px; box-shadow:0 12px 32px rgba(0,0,0,.35); max-height:340px; overflow:auto; z-index:30; }
.sugg button { display:grid; grid-template-columns:96px minmax(0,1fr) auto; gap:8px; width:100%; padding:6px 10px; border:0; background:none; text-align:left; font-size:12px; align-items:center; }
.sugg button small { color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sugg button[aria-selected="true"], .sugg button:hover { background:var(--raise); }
.tbtns { display:flex; gap:6px; }
.tb { height:30px; padding:0 10px; border-radius:4px; border:1px solid var(--line-strong); background:var(--surface); white-space:nowrap; display:inline-flex; align-items:center; gap:6px; }
.tb:hover { border-color:var(--muted); }
.tb .n { font:11px "JetBrains Mono",monospace; background:var(--bear); color:var(--on-signal); border-radius:9px; padding:0 5px; }
.pbar { font-size:12px; color:var(--muted); white-space:nowrap; display:flex; gap:6px; align-items:center; }
.pbar b { color:var(--ink); } .pbar b.up { color:var(--bull); } .pbar b.down { color:var(--bear); }
.notice { border:1px solid var(--unc); background:var(--unc-soft); border-radius:4px; padding:6px 12px; font-size:12px; margin:6px 10px 0 calc(var(--rail) + 10px); flex:0 0 auto; }
.notice b { color:var(--unc); }

.app { flex:1; min-height:0; display:grid; grid-template-columns:var(--rail) minmax(0,1fr); }
.rail { background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; padding:4px 0; overflow-y:auto; scrollbar-width:none; }
.rail::-webkit-scrollbar { display:none; }
.rail a, .rail button { position:relative; display:flex; flex-direction:column; align-items:center; gap:3px; padding:8px 2px 7px; border:0; background:none; color:var(--muted); font-size:10px; line-height:1.2; text-align:center; text-decoration:none; }
.rail a:hover, .rail button:hover { color:var(--ink); background:var(--raise); }
.rail svg { width:18px; height:18px; flex:0 0 auto; }
.rail [aria-current="page"] { color:var(--ink); background:var(--raise); }
.rail [aria-current="page"]::before { content:""; position:absolute; left:0; top:5px; bottom:5px; width:2px; background:var(--accent); }
.rail .n { position:absolute; top:4px; right:12px; font:600 9px "JetBrains Mono",monospace; background:var(--bear); color:var(--on-signal); border-radius:7px; padding:0 4px; }
.rail .sep { height:1px; background:var(--line); margin:5px 12px; flex:0 0 auto; }
.rail .end { margin-top:auto; }
.views { min-width:0; min-height:0; position:relative; }
.view { display:none; height:100%; min-height:0; min-width:0; }
.view.on { display:flex; flex-direction:column; }
#v-scanner.on { display:grid; grid-template-columns:minmax(0,1fr) var(--pw); }
body[data-panel="closed"] #v-scanner.on { grid-template-columns:minmax(0,1fr) 0; }
body[data-panel="wide"] #v-scanner.on { --pw:min(62%, 1040px); }

/* ---------- scanner workspace: toolbar, filter builder, results table */
.work { display:flex; flex-direction:column; min-width:0; min-height:0; border-right:1px solid var(--line); background:var(--panel); }
.sbar { display:flex; gap:6px; align-items:center; padding:6px 10px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
.sbar .grow { flex:1; }
.lbl-s { font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; font-weight:600; }
.inp, .sel { height:28px; border-radius:4px; border:1px solid var(--line-strong); background:var(--surface); padding:0 8px; font-size:12px; }
.sel { padding:0 4px 0 6px; max-width:240px; }
.inp.sym { width:150px; }
.ib, .chip { height:28px; padding:0 9px; border-radius:4px; border:1px solid var(--line-strong); background:var(--surface); font-size:12px; display:inline-flex; align-items:center; gap:5px; white-space:nowrap; }
.ib:hover, .chip:hover { border-color:var(--muted); }
.ib.on { color:var(--star); border-color:var(--star); }
.ib.go { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
.ib.go.pe { background:var(--bear); border-color:var(--bear); color:var(--on-signal); }
.ib.ghost { border-color:transparent; background:none; color:var(--muted); } .ib.ghost:hover { color:var(--ink); border-color:var(--line-strong); }
.chip[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
.seg { display:inline-flex; border:1px solid var(--line-strong); border-radius:4px; overflow:hidden; flex:0 0 auto; }
.seg button { border:0; background:var(--surface); padding:0 10px; height:26px; font-size:12px; color:var(--muted); white-space:nowrap; }
.seg button + button { border-left:1px solid var(--line-strong); }
.seg button[aria-pressed="true"] { background:var(--raise); color:var(--ink); box-shadow:inset 0 -2px 0 var(--accent); }
.seg button b { font:500 11px "JetBrains Mono",monospace; margin-left:4px; color:var(--muted); }
.fbar { display:flex; flex-wrap:wrap; gap:6px; padding:6px 10px; border-bottom:1px solid var(--line); align-items:center; background:var(--bg); }
.cond { display:inline-flex; align-items:center; height:28px; border:1px solid var(--line-strong); border-radius:4px; background:var(--surface); overflow:hidden; font-size:12px; }
.cond > b { padding:0 6px 0 8px; font-weight:600; white-space:nowrap; }
.cond select, .cond input { border:0; background:transparent; height:26px; font-size:12px; padding:0 3px; }
.cond select { max-width:150px; }
.cond input { width:58px; text-align:right; font-family:"JetBrains Mono",monospace; border-left:1px dotted var(--line-strong); }
.cond input.wide { width:150px; text-align:left; font-family:inherit; }
.cond input:focus-visible, .cond select:focus-visible { outline:2px solid var(--focus); outline-offset:-2px; }
.cond .u { color:var(--muted); padding:0 4px 0 1px; font-size:11px; }
.cond .tally { font:11px "JetBrains Mono",monospace; color:var(--muted); padding:0 7px; border-left:1px solid var(--line); height:100%; display:flex; align-items:center; }
.cond .x { border:0; border-left:1px solid var(--line); background:none; width:24px; height:100%; color:var(--muted); font-size:14px; }
.cond .x:hover { color:var(--bear); background:var(--bear-soft); }
.cond.bad { border-color:var(--bear); }
.join { font:600 10px Inter,sans-serif; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
.qrule { position:relative; flex:1 1 220px; min-width:200px; max-width:380px; }
.qrule input { width:100%; }
.qrule .hint { position:absolute; left:0; top:31px; z-index:25; background:var(--panel); border:1px solid var(--line-strong); border-radius:4px; padding:6px 9px; font-size:11.5px; color:var(--muted); width:max(100%, 340px); box-shadow:0 10px 26px rgba(0,0,0,.3); }
.qrule .hint b { color:var(--ink); }
.qrule .hint.err { color:var(--bear); }
.rbar { display:flex; gap:12px; align-items:center; padding:4px 10px; border-bottom:1px solid var(--line); font-size:11.5px; color:var(--muted); white-space:nowrap; overflow-x:auto; scrollbar-width:none; }
.rbar b { color:var(--ink); font-weight:600; }
.rbar .stale { color:var(--unc); }
.tbl-wrap { flex:1; overflow:auto; min-height:0; }
table.st { width:100%; border-collapse:separate; border-spacing:0; font-size:12px; }
.st th { position:sticky; top:0; z-index:2; background:var(--panel); font:600 10.5px Inter,sans-serif; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); padding:0; border-bottom:1px solid var(--line-strong); text-align:right; white-space:nowrap; }
.st th button { all:unset; box-sizing:border-box; display:block; width:100%; padding:7px 8px; cursor:pointer; }
.st th button:hover { color:var(--ink); }
.st th button:focus-visible { outline:2px solid var(--focus); outline-offset:-2px; }
.st th[aria-sort] button { color:var(--ink); }
.st th[aria-sort="descending"] button::after { content:" ▼"; font-size:8px; color:var(--accent); }
.st th[aria-sort="ascending"] button::after { content:" ▲"; font-size:8px; color:var(--accent); }
.st th.fc button { box-shadow:inset 0 -2px 0 var(--unc); }
.st td { height:var(--rowh); padding:0 8px; border-bottom:1px solid var(--line); text-align:right; white-space:nowrap; font-family:"JetBrains Mono",monospace; font-size:12px; }
.st .l { text-align:left; }
.st td.l { font-family:Inter,sans-serif; }
.st td.fc { background:color-mix(in srgb, var(--unc) 6%, transparent); }
.st tbody tr { cursor:pointer; }
.st tbody tr:hover td { background:var(--raise); }
.st tbody tr.sel td { background:color-mix(in srgb, var(--accent) 13%, var(--panel)); }
.st tbody tr.sel td:first-child { box-shadow:inset 2px 0 0 var(--accent); }
.st tbody tr.nomatch td { opacity:.55; }
.st td.sym { display:flex; align-items:center; gap:6px; }
.st td.sym b { font-weight:600; font-size:12.5px; }
.st td.sym small { color:var(--muted); font-size:11px; max-width:150px; overflow:hidden; text-overflow:ellipsis; }
.st .px { border-radius:2px; padding:0 2px; }
.lab { font:600 11px Inter,sans-serif; white-space:nowrap; }
.lab.b { color:var(--bull); } .lab.r { color:var(--bear); } .lab.n { color:var(--neutral); } .lab.u { color:var(--unc); }
.dots { display:inline-flex; gap:3px; vertical-align:middle; }
.dots i { width:7px; height:7px; border-radius:50%; background:var(--line-strong); }
.dots i.ok { background:var(--bull); } .dots i.no { background:color-mix(in srgb, var(--bear) 60%, transparent); }
.star { border:0; background:none; padding:0; width:16px; height:16px; color:var(--line-strong); font-size:12px; line-height:16px; flex:0 0 auto; }
.star:hover { color:var(--muted); } .star.on { color:var(--star); }
.armb { font:700 9.5px Inter,sans-serif; border-radius:3px; padding:0 4px; margin-left:2px; border:1px solid currentColor; vertical-align:1px; white-space:nowrap; }
.armb.a { color:#4C8DFF; } .armb.b { color:#B07CFF; }
.fl-up { animation:flu .9s ease-out; } .fl-dn { animation:fld .9s ease-out; }
@keyframes flu { from { background:var(--bull-soft); } to { background:transparent; } }
@keyframes fld { from { background:var(--bear-soft); } to { background:transparent; } }
.empty { text-align:center; color:var(--muted); padding:28px 10px; font-family:Inter,sans-serif; }
.empty .btn { margin-top:8px; }
.st td.empty { text-align:center; height:auto; padding:28px 10px; white-space:normal; font-family:Inter,sans-serif; }
.pop { position:absolute; z-index:40; background:var(--panel); border:1px solid var(--line-strong); border-radius:4px; box-shadow:0 14px 36px rgba(0,0,0,.4); padding:8px; min-width:220px; font-size:12px; }
.pop h4 { margin:2px 4px 6px; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
.pop label { display:flex; gap:8px; align-items:center; padding:4px; border-radius:3px; cursor:pointer; }
.pop label:hover { background:var(--raise); }
.pop .row { display:flex; gap:6px; margin-top:6px; }

/* ---------- instrument panel (beside the table) */
.panel { display:flex; flex-direction:column; min-width:0; min-height:0; background:var(--panel); overflow:hidden; }
body[data-panel="closed"] .panel { visibility:hidden; }
.phead { display:flex; align-items:center; gap:4px; padding:4px 6px 4px 12px; border-bottom:1px solid var(--line); font-size:11px; color:var(--muted); }
.phead .grow { flex:1; }
.phead .ib { height:24px; padding:0 7px; }
.panel .chart-box { flex:0 0 230px; }
body[data-panel="wide"] .panel .chart-box { flex:0 0 44%; }

/* ---------- stock header */
.sh { display:flex; gap:10px 14px; align-items:flex-start; padding:8px 12px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
.sh h2 { margin:0; font-size:16px; font-weight:700; display:flex; gap:8px; align-items:center; }
.sh h2 small { font-size:12px; font-weight:400; }
.sh .sub { font-size:12px; color:var(--muted); margin-top:2px; }
.sh .price { margin-left:auto; text-align:right; }
.sh .big { font:600 19px/1.1 "JetBrains Mono",monospace; }
.sh .chg { font:500 13px "JetBrains Mono",monospace; margin-left:8px; }
.sh .tick { font-size:11px; color:var(--muted); margin-top:3px; }
.sh .acts { display:flex; gap:6px; align-items:center; flex-wrap:wrap; width:100%; }
.pill { display:inline-block; border-radius:999px; padding:1px 8px; font-size:11px; font-weight:600; line-height:1.7; white-space:nowrap; }
.pill.b { background:var(--bull-soft); color:var(--bull); } .pill.r { background:var(--bear-soft); color:var(--bear); }
.pill.n { background:var(--neutral-soft); color:var(--neutral); } .pill.u { background:var(--unc-soft); color:var(--unc); }
.pill.live { margin-left:4px; border:1px dashed currentColor; background:transparent; }
.strip { display:flex; gap:0; border-bottom:1px solid var(--line); overflow-x:auto; scrollbar-width:none; }
.strip::-webkit-scrollbar { display:none; }
.strip div { padding:6px 12px; border-right:1px solid var(--line); white-space:nowrap; }
.strip small { display:block; font-size:10px; text-transform:uppercase; letter-spacing:.04em; }
.strip b { font:500 12px "JetBrains Mono",monospace; }
.strip .atp b { color:var(--atp); }

/* ---------- chart */
.ctb { display:flex; gap:6px; align-items:center; padding:4px 10px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
.ctb select { height:26px; border-radius:4px; border:1px solid var(--line-strong); background:var(--surface); padding:0 6px; font-size:12px; max-width:190px; }
.cstat { font-size:11px; color:var(--muted); margin-left:auto; }
.chart-box { position:relative; flex:1; min-height:160px; }
#chart { position:absolute; inset:0; }
.legend { position:absolute; left:10px; top:6px; z-index:3; font:11px "JetBrains Mono",monospace; color:var(--muted); pointer-events:none; display:flex; gap:10px; flex-wrap:wrap; }
.legend b { color:var(--ink); font-weight:500; }
.legend .atp b { color:var(--atp); }
.cmsg { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; padding:20px; color:var(--muted); z-index:4; pointer-events:none; }
.cmsg div { background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:12px 16px; max-width:420px; pointer-events:auto; }

/* ---------- side tabs */
.tabs { display:flex; border-bottom:1px solid var(--line); overflow-x:auto; scrollbar-width:none; }
.tabs::-webkit-scrollbar { display:none; }
.tab { flex:1 0 auto; border:0; background:none; padding:8px 10px; font-size:12px; font-weight:600; color:var(--muted); border-bottom:2px solid transparent; }
.tab[aria-selected="true"] { color:var(--ink); border-bottom-color:var(--accent); }
.tbody { overflow-y:auto; flex:1; min-height:0; padding:10px 12px 20px; }
.tbody h3 { font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:16px 0 8px; font-weight:600; }
.tbody h3:first-child { margin-top:0; }
.kvg { display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--line); border:1px solid var(--line); border-radius:4px; overflow:hidden; }
.kvg div { background:var(--surface); padding:6px 9px; }
.kvg small { display:block; font-size:10px; text-transform:uppercase; letter-spacing:.04em; }
.kvg b { font:500 13px "JetBrains Mono",monospace; }
.kvg em { font-style:normal; font-size:11px; color:var(--muted); display:block; }
.meter { height:6px; border-radius:3px; background:var(--raise); position:relative; margin-top:5px; overflow:hidden; }
.meter i { position:absolute; top:0; bottom:0; left:0; background:var(--bull); }
.meter.split i { background:var(--bull); } .meter.split { background:var(--bear); }
.range { position:relative; height:6px; border-radius:3px; background:linear-gradient(90deg,var(--bear),var(--neutral),var(--bull)); margin:8px 0 3px; opacity:.6; }
.range i { position:absolute; top:-4px; width:3px; height:14px; background:var(--ink); border-radius:2px; transform:translateX(-1px); }
.depth { width:100%; border-collapse:collapse; font:12px "JetBrains Mono",monospace; }
.depth th { font:600 10px Inter,sans-serif; text-transform:uppercase; color:var(--muted); padding:4px 6px; text-align:right; border-bottom:1px solid var(--line); }
.depth td { padding:3px 6px; text-align:right; position:relative; }
.depth td.bq { background:linear-gradient(270deg,var(--bull-soft) var(--w),transparent var(--w)); }
.depth td.aq { background:linear-gradient(90deg,var(--bear-soft) var(--w),transparent var(--w)); }
.why ul { margin:0; padding-left:18px; } .why li { margin:3px 0; }

/* option chain */
.oc-wrap { overflow-x:auto; margin:0 -14px; }
table.oc { width:100%; border-collapse:collapse; font:11.5px "JetBrains Mono",monospace; }
.oc th { font:600 10px Inter,sans-serif; color:var(--muted); text-transform:uppercase; padding:5px 4px; border-bottom:1px solid var(--line); text-align:right; position:sticky; top:0; background:var(--panel); white-space:nowrap; }
.oc td { padding:4px; text-align:right; border-bottom:1px solid var(--line); white-space:nowrap; }
.oc td.k, .oc th.k { text-align:center; background:var(--raise); font-weight:600; color:var(--ink); }
.oc tr.atm td.k { box-shadow:inset 0 0 0 1px var(--accent); }
.oc tr.itm-c td.c, .oc tr.itm-p td.p { background:var(--unc-soft); }
.oc .lp { cursor:pointer; text-decoration:underline dotted; text-underline-offset:3px; }
.oc .lp:hover { color:var(--accent); }
.oc td.ok-k { cursor:pointer; } .oc td.ok-k:hover { color:var(--accent); }
.oc .hi { color:var(--unc); font-weight:600; }
.oc small { display:block; font-size:10px; color:var(--muted); }
.levels { font-size:12px; color:var(--muted); margin:0 0 8px; line-height:1.55; }
.levels b { color:var(--ink); font-weight:600; }

/* news, results */
.nl { list-style:none; margin:0; padding:0; }
.nl li { padding:8px 0; border-bottom:1px solid var(--line); }

/* boards: movers, heatmap, scoreboard */
.mv { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:12px; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:4px; overflow:hidden; }

.hm-sec { margin:0 0 12px; }

.count { font-size:12px; color:var(--muted); margin:6px 0; }

/* sheets (orders, alerts) */
.btn { border:1px solid var(--line-strong); background:var(--surface); border-radius:4px; padding:5px 12px; font-size:12.5px; min-height:30px; }
.btn:hover { border-color:var(--muted); }

.sheet { background:var(--panel); color:var(--ink); width:100%; max-width:560px; border:1px solid var(--line-strong); border-radius:6px; padding:16px; max-height:calc(100dvh - 24px); overflow:auto; box-shadow:0 20px 60px rgba(0,0,0,.4); }

.stepper { display:flex; align-items:center; gap:10px; }

.err { color:var(--bear); font-size:12px; margin:6px 0; }
.ok { color:var(--bull); }
.chk { display:flex; gap:8px; align-items:flex-start; font-size:12px; margin:8px 0; }

.oh { font-size:12px; color:var(--muted); margin:14px 0 4px; }

.toasts { position:fixed; right:14px; bottom:calc(var(--disc) + var(--nav) + 12px); z-index:40; display:flex; flex-direction:column; gap:8px; }
.toast { background:var(--surface); border:1px solid var(--line-strong); border-left:3px solid var(--accent); border-radius:8px; padding:10px 12px; font-size:12px; max-width:320px; box-shadow:0 8px 24px rgba(0,0,0,.35); }

/* ---------- explainable scanner (Why tab) */
.whyhead { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:0 0 8px; font-size:12px; }
.verdict-ok, .verdict-no { display:inline-flex; align-items:center; gap:6px; font-weight:600; font-size:12.5px; border-radius:3px; padding:2px 8px; }
.verdict-ok { background:var(--bull-soft); color:var(--bull); } .verdict-no { background:var(--neutral-soft); color:var(--ink); }
.whysum { font-size:12.5px; line-height:1.55; margin:0 0 10px; }
table.ct { width:100%; border-collapse:collapse; font-size:12px; }
.ct th { font:600 10px Inter,sans-serif; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); text-align:right; padding:5px 6px; border-bottom:1px solid var(--line-strong); white-space:nowrap; }
.ct td { padding:6px; border-bottom:1px solid var(--line); text-align:right; vertical-align:top; font-family:"JetBrains Mono",monospace; white-space:nowrap; }
.ct .l { text-align:left; font-family:Inter,sans-serif; white-space:normal; }
.ct td small { display:block; color:var(--muted); font:10.5px Inter,sans-serif; margin-top:1px; }
.ct td b { font-weight:600; }
.ct .res { font:700 11px Inter,sans-serif; }
.ct .res.ok { color:var(--bull); } .ct .res.no { color:var(--bear); } .ct .res.na { color:var(--unc); }
.gauge { position:relative; height:4px; background:var(--raise); border-radius:2px; margin-top:5px; min-width:90px; }
.gauge i { position:absolute; top:0; bottom:0; left:0; border-radius:2px; background:var(--muted); }
.gauge i.ok { background:var(--bull); } .gauge i.no { background:var(--bear); }
.gauge b { position:absolute; top:-3px; width:2px; height:10px; background:var(--ink); }
.src { font-size:11px; color:var(--muted); margin:4px 0 0; line-height:1.5; }
.src b { color:var(--ink); font-weight:600; }
.fresh { display:inline-flex; align-items:center; gap:6px; font-size:11.5px; }
.fresh.stale { color:var(--unc); }

/* ---------- options chain view */
.ocsum { display:flex; border-bottom:1px solid var(--line); overflow-x:auto; scrollbar-width:none; flex:0 0 auto; }
.ocsum div { padding:6px 14px; border-right:1px solid var(--line); white-space:nowrap; }

table.oc2 { width:100%; border-collapse:separate; border-spacing:0; font:12px "JetBrains Mono",monospace; }
.oc2 thead th { position:sticky; top:0; z-index:2; background:var(--panel); font:600 10.5px Inter,sans-serif; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); padding:6px 8px; border-bottom:1px solid var(--line-strong); text-align:right; white-space:nowrap; }
.oc2 thead tr.side th { top:0; text-align:center; font-size:11px; color:var(--ink); border-bottom:1px solid var(--line); }
.oc2 thead tr.side + tr th { top:27px; }
.oc2 td { height:var(--rowh); padding:0 8px; border-bottom:1px solid var(--line); text-align:right; white-space:nowrap; position:relative; }

.oc2 td.itm { background:color-mix(in srgb, var(--unc) 7%, transparent); }
.oc2 td.bar-c { background:linear-gradient(270deg, color-mix(in srgb, var(--c, var(--bear)) 26%, transparent) var(--w), transparent var(--w)); }
.oc2 td.bar-p { background:linear-gradient(90deg, color-mix(in srgb, var(--c, var(--bull)) 26%, transparent) var(--w), transparent var(--w)); }
.oc2 td.neg { --c:var(--neutral); }
@media (min-width:1100px) { #backBtn { display:none; } }
@media (max-width:1099px) { #expandBtn { display:none; } }
.oc2 td.hi { color:var(--unc); font-weight:600; }
.oc2 .lp { cursor:pointer; text-decoration:underline dotted; text-underline-offset:3px; }
.oc2 .lp:hover { color:var(--accent); }
.oc2 td.ok-k { cursor:pointer; } .oc2 td.ok-k:hover { color:var(--accent); }
.oc2 tbody tr:hover td:not(.k) { box-shadow:inset 0 0 0 999px color-mix(in srgb, var(--ink) 4%, transparent); }
.ocfoot { padding:6px 12px 10px; font-size:11.5px; color:var(--muted); line-height:1.55; border-top:1px solid var(--line); }
.ocfoot b { color:var(--ink); font-weight:600; }

/* ---------- full-page views (analytics, saved scans, alerts, settings, scoreboard) */
.page { overflow:auto; padding:12px 16px 24px; background:var(--bg); height:100%; }
.ph { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:0 0 10px; }

table.lt { width:100%; border-collapse:collapse; font-size:12px; }
.lt th { font:600 10px Inter,sans-serif; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); text-align:left; padding:6px 12px; border-bottom:1px solid var(--line); }
.lt td { padding:6px 12px; border-bottom:1px solid var(--line); vertical-align:middle; }

.setg { display:grid; grid-template-columns:200px minmax(0,1fr); gap:10px 16px; align-items:center; font-size:12.5px; }
.setg > span { color:var(--muted); }
.setg p { margin:0; }
.toggle { display:inline-flex; gap:8px; align-items:center; cursor:pointer; }
kbd.k { font:11px "JetBrains Mono",monospace; border:1px solid var(--line-strong); border-bottom-width:2px; border-radius:3px; padding:0 5px; background:var(--surface); }

/* permanent disclaimer */
.disclaimer { flex:0 0 auto; z-index:20; background:var(--panel); border-top:2px solid var(--bear); padding:5px 14px calc(5px + env(safe-area-inset-bottom,0px)); font-size:11px; line-height:1.4; color:var(--ink); }
.disclaimer b { color:var(--bear); }

@media (max-width:1399px) { :root { --pw:380px; } .st td.sym small { display:none; } }
/* ---------- phone / tablet: one column, the rail becomes a bottom bar, the panel a full screen */
@media (max-width:1099px) {

  .rail { position:fixed; left:0; right:0; bottom:0; height:calc(var(--nav) + env(safe-area-inset-bottom,0px)); flex-direction:row; padding:0 0 env(safe-area-inset-bottom,0px); border:0; border-top:1px solid var(--line); z-index:19; overflow-x:auto; }

<script id="scoring">
// Honest scoring rules as pure functions, used by the scoreboard below and by tests/test_step8_scoreboard.py (node).
//  - move: the stock's return over h sessions minus the index's over the same sessions (market-adjusted)
//  - a bullish/bearish call is a hit when |move| > threshold and the move is in its direction;
//    smaller moves and neutral calls are shown but not scored
//  - only the first call on a stock in any 3 sessions is scored; later ones are duplicates
//  - beating a coin at N scored calls needs N/2 + 1.645·√N/2 hits (31/50, 59/100, 112/200, 217/400)
const Scoring = (() => {
  const needed = n => n > 0 ? Math.ceil(n / 2 + 1.645 * Math.sqrt(n) / 2) : null;
  const refLine = () => "Hits needed to beat a coin at this N: " + [50, 100, 200, 400].map(n => `${needed(n)}/${n}`).join(", ");
  const weekdaysBetween = (a, b) => {
    const d = new Date(a + "T00:00:00Z"), e = new Date(b + "T00:00:00Z"); let n = 0;
    while (d < e) { d.setUTCDate(d.getUTCDate() + 1); const w = d.getUTCDay(); if (w > 0 && w < 6) n++; }
    return n;
  };
  // sessions the page knows (every stock's chart dates and the index's); weekdays for anything outside them
  function calendar(dateLists) {
    const dates = [...new Set([].concat(...dateLists))].sort(), pos = new Map(dates.map((d, i) => [d, i]));
    return { dates, between: (a, b) => pos.has(a) && pos.has(b) ? pos.get(b) - pos.get(a) : (a <= b ? weekdaysBetween(a, b) : -weekdaysBetween(b, a)) };
  }
  function fwd(dates, closes, d, h) {
    const i = dates.indexOf(d);
    return i < 0 || i + h >= closes.length ? null : { ret: (closes[i + h] / closes[i] - 1) * 100, to: dates[i + h] };
  }
  function indexReturn(index, from, to) {
    if (!index) return null;
    const a = index.dates.indexOf(from), b = index.dates.indexOf(to);
    return a < 0 || b < 0 ? null : (index.closes[b] / index.closes[a] - 1) * 100;
  }
  function adjusted(dates, closes, index, d, h) {
    const f = fwd(dates, closes, d, h); if (!f) return null;
    if (!index) return +f.ret.toFixed(2);
    const ir = indexReturn(index, d, f.to);
    return ir == null ? null : +(f.ret - ir).toFixed(2);
  }
  // items: [{symbol, as_of, dir: "bullish" | "bearish" | anything else, move: adjusted % or null}]
  function score(items, cal, threshold, gap = 3) {
    const last = {}, counts = { dup: 0, small: 0, nodir: 0, pending: 0 };
    let n = 0, hits = 0;
    const rows = items.slice().sort((a, b) => a.as_of.localeCompare(b.as_of) || a.symbol.localeCompare(b.symbol)).map(it => {
      let status;
      if (last[it.symbol] != null && cal.between(last[it.symbol], it.as_of) < gap) status = "dup";
      else {
        last[it.symbol] = it.as_of;
        if (it.dir !== "bullish" && it.dir !== "bearish") status = "nodir";
        else if (it.move == null) status = "pending";
        else if (Math.abs(it.move) <= threshold) status = "small";
        else { n++; const hit = (it.move > 0) === (it.dir === "bullish"); if (hit) hits++; status = hit ? "hit" : "miss"; }
      }
      if (status in counts) counts[status]++;
      return { ...it, status };
    });
    const need = needed(n);
    return { n, hits, accuracy: n ? hits / n : null, needed: need, clears: n ? hits >= need : null, ...counts, rows };
  }
  // naive baseline: "always bullish on the top-k volume-ratio stocks" on every session the page has
  function baseline(stocks, cal, index, h, k = 10) {
    const items = [];
    for (const d of cal.dates) {
      const ranked = [];
      for (const s of stocks) {
        const i = (s.chart_dates || []).indexOf(d);
        const v = i >= 0 && s.chart_volume_ratios ? s.chart_volume_ratios[i] : null;
        if (v != null) ranked.push([v, s]);
      }
      ranked.sort((a, b) => b[0] - a[0] || a[1].symbol.localeCompare(b[1].symbol));
      for (const [, s] of ranked.slice(0, k))
        items.push({ symbol: s.symbol, as_of: d, dir: "bullish", move: adjusted(s.chart_dates, s.chart_closes, index, d, h) });
    }
    return items;
  }
  return { needed, refLine, calendar, fwd, indexReturn, adjusted, score, baseline };
})();
</script>
<script>
const SCAN = /*__SCAN_DATA__*/;
const SERVER = Object.assign({ live: false, orders: false, paper: true, commentary: false, broker: "none", max_lots: 5, poll_seconds: 30 }, /*__SERVER__*/{});
(function () {
  const $ = (s, el = document) => el.querySelector(s);
  const $$ = (s, el = document) => [...el.querySelectorAll(s)];
  const meta = SCAN.meta, stocks = SCAN.stocks, sum = SCAN.summary;
  const BY = Object.fromEntries(stocks.map(s => [s.symbol, s]));
  let LIVE = { quotes: {}, updated_at: null, market_open: false };
  const auth = { credentials: "same-origin" };
  const LABELS = { "Bullish setup": "b", "Bearish setup": "r", "Neutral": "n", "Unclassified": "u" };
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* private mode: in-memory only */ } },
  };
  const isPhone = () => matchMedia("(max-width:1099px)").matches;

  // ---- theme, disclaimer (always rendered, never dismissible), notices
  const theme = store.get("fos_theme", "dark");
  document.documentElement.dataset.theme = theme;
  $("#themeBtn").addEventListener("click", () => {
    const t = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = t; store.set("fos_theme", t); applyChartTheme();
  });
  $("#disc").innerHTML = "<b>Read before using.</b> " + esc(meta.disclaimer);
  const fitDisc = () => document.documentElement.style.setProperty("--disc", $("#discbar").offsetHeight + "px");
  addEventListener("resize", fitDisc); fitDisc();
  if (meta.demo) {
    document.title = "F&O Terminal — DEMO (synthetic OI)";
    const n = $("#notice"); n.hidden = false;
    n.innerHTML = "<b>Demo data.</b> OI, PCR and strikes on this page are synthetic, generated for testing the interface and the order flow. Prices and volumes are real.";
  } else if (meta.fo_available && meta.chain_available === false) {
    const n = $("#notice"); n.hidden = false;
    n.innerHTML = "<b>Strike tables are not in this build</b> (" + esc(meta.chain_status) + "). OI, PCR and the labels are complete and unaffected.";
  } else if (!meta.fo_available) {
    const n = $("#notice"); n.hidden = false;
    n.innerHTML = "<b>OI and PCR are not in this build.</b> Price change and volume ratio are complete for every stock, but NSE's F&O bhavcopy could not be fetched from the build machine (" + esc(meta.fo_status) + "), so no stock is given a setup label: all are Unclassified rather than guessed.";
  }

  // ---- state
  let sel = BY[store.get("fos_sel", "")] ? store.get("fos_sel", "") : (stocks[0] || {}).symbol;
  let tab = store.get("fos_tab2", "why"), curView = store.get("fos_view", "scanner"), anTab = store.get("fos_antab", "movers");
  const prefs = Object.assign({ density: "compact", panel: "open", sound: true }, store.get("fos_prefs_v1", {}));
  const applyPrefs = () => { document.documentElement.style.setProperty("--rowh", prefs.density === "comfortable" ? "34px" : "28px"); };
  applyPrefs(); document.body.dataset.panel = prefs.panel === "wide" ? "wide" : "open";
  let tf = store.get("fos_tf", SERVER.live ? "5" : "D"), leg = "stock";
  let pins = new Set(store.get("fos_pins_v1", []));
  let alerts = store.get("fos_alerts_v1", []).filter(a => a.leg !== "fut");      // options-only site: stock alerts
  const CHAIN = {}, NEWS = {}, lastPx = {};

  // ---- numbers as displayed: live when the feed has the stock, else the EOD scan
  function view(s) {
    const q = LIVE.quotes && LIVE.quotes[s.symbol];
    if (q && q.ltp != null)
      return { ltp: q.ltp, chg: q.chg != null ? q.chg : (q.prev_close ? q.ltp - q.prev_close : null), pct: q.chg_pct, vol: q.volume, vr: q.live_volume_ratio,
               oi: q.fut_oi_chg_pct, pcr: q.live_pcr != null ? q.live_pcr : s.pcr, time: (q.ts || "").slice(11, 19), live: true, q };
    return { ltp: s.close, chg: s.close != null && s.prev_close != null ? s.close - s.prev_close : null, pct: s.price_change_pct, vol: s.volume,
             vr: s.volume_ratio, oi: s.oi_change_pct, pcr: s.pcr, time: s.date, live: false, q: null };
  }
  const blindFor = s => callMode && !callFor(s.symbol);

  // ---- clock and market status (IST)
  function istNow() { return new Date(new Date().toLocaleString("en-US", { timeZone: "Asia/Kolkata" })); }
  function istDate() { return new Date().toLocaleDateString("en-CA", { timeZone: "Asia/Kolkata" }); }
  function marketOpenGuess() { const n = istNow(), d = n.getDay(), m = n.getHours() * 60 + n.getMinutes(); return d > 0 && d < 6 && m >= 555 && m <= 930; }
  function tickClock() {
    $("#clock").textContent = new Date().toLocaleTimeString("en-GB", { timeZone: "Asia/Kolkata", hour12: false }) + " IST";
    const open = SERVER.live ? !!LIVE.market_open : marketOpenGuess();
    $("#mktlbl").textContent = SERVER.live ? (LIVE.error ? "Feed error" : open ? "Market open" : "Market closed") : "EOD · " + meta.as_of_label;
    $("#livedot").className = "dot" + (SERVER.live && LIVE.error ? " err" : SERVER.live && open && LIVE.updated_at ? " on" : "");
    // data source: live feed (and whether its polls are current) or the nightly closing scan (and how old it is)
    if (typeof freshness !== "function" || !$("#dsrc")) return;
    const f = freshness(), err = SERVER.live && LIVE.error, d = $("#dsrc");
    d.className = "dsrc" + (err ? " err" : f.stale ? " stale" : f.live ? " live" : "");
    d.innerHTML = `<span class="lbl">Data</span> <b>${err ? "Feed error" : f.live ? (f.stale ? "Live · stale" : f.open ? "Live" : "Last poll") : f.stale ? "EOD · stale" : "EOD"}</b>${f.live ? ` <span class="lbl">${esc(SERVER.live_source || "")} ${esc(LIVE.updated_at || "")}</span>` : ` <span class="lbl">${esc(meta.as_of)}</span>`}`;
    d.title = (err ? "Live feed error: " + LIVE.error + ". " : "") + f.text + (f.why ? " · " + f.why : "") + (SERVER.live && !f.live ? " · live quotes from 09:15 IST" : "");
  }
  tickClock(); setInterval(tickClock, 1000);

  // ---- call tracking: your own bullish/bearish/neutral call, made before the label is shown,
  //      scored later against what the price actually did, alongside the system's label.
  const CALLS_KEY = "fos_calls_v1", SETTINGS_KEY = "fos_calls_settings";
  let callMode = false, showScore = false, storageOk = true;
  let calls = [], scoreCfg = { horizon: 3, threshold: 1.0 };
  try { calls = JSON.parse(localStorage.getItem(CALLS_KEY) || "[]"); scoreCfg = Object.assign(scoreCfg, JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}")); }
  catch (e) { storageOk = false; }
  const LEAN = { "Bullish setup": "bullish", "Bearish setup": "bearish", "Neutral": "neutral" };
  const saveCalls = () => { try { localStorage.setItem(CALLS_KEY, JSON.stringify(calls)); localStorage.setItem(SETTINGS_KEY, JSON.stringify(scoreCfg)); } catch (e) { storageOk = false; } };
  const callFor = sym => calls.find(c => c.symbol === sym && c.as_of === meta.as_of);
  function recordCall(s, call) {
    if (callFor(s.symbol)) return;
    calls.push({ symbol: s.symbol, as_of: meta.as_of, call, system: LEAN[s.label] || null, close: s.close, made_at: new Date().toISOString(), rets: {} });
    saveCalls(); render(); renderScoreboard();
  }
  // forward stock and index returns for each call, stored while the page's history still covers them
  const IDX = meta.index_closes || null;
  const CAL = Scoring.calendar(stocks.map(s => s.chart_dates || []).concat(IDX ? [IDX.dates] : []));
  function scoreCalls() {
    let changed = false;
    for (const c of calls) {
      const st = BY[c.symbol]; if (!st) continue;
      c.rets = c.rets || {}; c.irets = c.irets || {};
      for (const h of [1, 3, 5]) {
        const f = Scoring.fwd(st.chart_dates, st.chart_closes, c.as_of, h); if (!f) continue;
        if (c.rets[h] == null) { c.rets[h] = +f.ret.toFixed(2); changed = true; }
        if (c.irets[h] == null) { const ir = Scoring.indexReturn(IDX, c.as_of, f.to); if (ir != null) { c.irets[h] = +ir.toFixed(2); changed = true; } }
      }
    }
    if (changed) saveCalls();
  }
  // market-adjusted move in %, or null while unknown; raw when this build has no index
  const moveOf = (c, h) => {
    const r = c.rets && c.rets[h]; if (r == null) return null;
    if (!IDX) return r;
    const ir = c.irets && c.irets[h]; return ir == null ? null : +(r - ir).toFixed(2);
  };
  function scoreStats() {
    const h = scoreCfg.horizon, th = scoreCfg.threshold;
    const as = key => calls.map(c => ({ symbol: c.symbol, as_of: c.as_of, dir: c[key], move: moveOf(c, h), c }));
    const snaps = (meta.live_snapshots || []).map(x => {
      const st = BY[x.symbol];
      return { symbol: x.symbol, as_of: x.date, dir: LEAN[x.label] || null,
               move: st ? Scoring.adjusted(st.chart_dates, st.chart_closes, IDX, x.date, h) : null };
    });
    return { you: Scoring.score(as("call"), CAL, th), sys: Scoring.score(as("system"), CAL, th),
             snap: Scoring.score(snaps, CAL, th), snapDays: new Set((meta.live_snapshots || []).map(x => x.date)).size,
             base: Scoring.score(Scoring.baseline(stocks, CAL, IDX, h), CAL, th),
             agree: calls.filter(c => c.system && c.system === c.call).length, total: calls.length };
  }
  function renderScoreboard() {
    const el = $("#scoreboard"); el.hidden = !showScore; if (!showScore) return;
    scoreCalls(); const st = scoreStats(), h = scoreCfg.horizon, th = scoreCfg.threshold;

    const need = s => !s.n ? "—" : s.needed > s.n ? "N too small" : s.needed + "/" + s.n;
    const line = (name, s) => `<tr><td>${name}</td><td>${s.n}</td><td>${s.hits}</td><td>${pctOf(s.hits, s.n)}</td><td>${need(s)}</td><td class="${s.clears ? "ok" : s.n ? "bad" : ""}">${s.n ? (s.clears ? "yes" : "no") : "—"}</td></tr>`;
    const STATUS = { hit: "scored: hit", miss: "scored: miss", dup: "duplicate: within 3 sessions of an earlier call", small: `move within ±${th}%`, nodir: "neutral: no direction", pending: "waiting for data" };
    const yours = new Map(st.you.rows.map(r => [r.c, r])), sys = new Map(st.sys.rows.map(r => [r.c, r]));
    const cls = r => r && r.status === "hit" ? "ok" : r && r.status === "miss" ? "bad" : "";
    const rows = calls.slice().reverse().slice(0, 30).map(c => {
      const m = moveOf(c, h), y = yours.get(c), s = sys.get(c);
      return `<tr><td>${esc(c.symbol)}</td><td>${esc(c.as_of.slice(5))}</td><td class="${cls(y)}">${esc(c.call)}</td><td class="${cls(s)}">${esc(c.system || "—")}</td><td>${m == null ? "pending" : (m > 0 ? "+" : "") + m + "%"}</td><td>${esc(STATUS[y.status])}</td></tr>`;
    }).join("");
    el.innerHTML = `<div class="ph"><h1>Scoreboard: your calls vs the system</h1></div>
      <p class="count" style="margin:0">Scored on the ${IDX ? "market-adjusted" : "raw"} move ${h} session${h === 1 ? "" : "s"} later: the stock's return ${IDX ? "minus " + esc(IDX.name) + "'s over the same sessions" : "(this build has no index, so moves are not market-adjusted)"}. A bullish or bearish call is a hit when the move goes its way by more than ±${th}%. Smaller moves and neutral calls are shown but not scored, and only the first call on a stock in any 3 sessions counts. The system's label and the baseline are scored by the same rules.${storageOk ? "" : " Storage is unavailable in this browser, so calls last only for this visit."}</p>
      <div style="overflow-x:auto"><table><thead><tr><th></th><th>Scored</th><th>Hits</th><th>Accuracy</th><th>Needed</th><th>Beats a coin</th></tr></thead><tbody>
        ${line("You", st.you)}${line("System labels", st.sys)}${line(`09:30 live labels (${st.snapDays} opening snapshot${st.snapDays === 1 ? "" : "s"})`, st.snap)}${line("Baseline: always bullish on the top-10 volume-ratio stocks", st.base)}</tbody></table></div>
      <p class="count" style="margin:6px 0 0">${Scoring.refLine()} (N/2 + 1.645·√N/2).</p>
      <p class="count" style="margin:4px 0 0">Calls made ${st.total} · waiting for data ${st.you.pending} · duplicates ${st.you.dup} · moves within ±${th}% ${st.you.small} · neutral ${st.you.nodir} · you agreed with the label on ${pctOf(st.agree, st.total)} of calls, before seeing it. The baseline runs over the ${CAL.dates.length} sessions in this page's history.</p>
      <div id="paperScore"></div>
      <div class="tools"><label>Horizon <select id="hz">${[1,3,5].map(v => `<option value="${v}" ${v === h ? "selected" : ""}>${v} session${v === 1 ? "" : "s"}</option>`).join("")}</select></label>
        <label>Threshold <select id="th">${[0.5,1,2].map(v => `<option value="${v}" ${v === th ? "selected" : ""}>±${v}%</option>`).join("")}</select></label>
        <button class="chip" type="button" id="exportCalls">Export</button><label class="chip" style="cursor:pointer">Import<input type="file" id="importCalls" accept="application/json" hidden></label>
        <button class="chip" type="button" id="clearCalls">Clear all</button></div>
      ${rows ? `<div style="overflow-x:auto"><table><thead><tr><th>Stock</th><th>Date</th><th>You</th><th>System</th><th>Move</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></div>` : "<p class=\"count\">No calls yet. Turn on Call mode in the scanner toolbar, judge a stock from its numbers, then tap Bull, Bear or Neutral in its panel header.</p>"}`;
    $("#hz").addEventListener("change", e => { scoreCfg.horizon = +e.target.value; saveCalls(); renderScoreboard(); });
    $("#th").addEventListener("change", e => { scoreCfg.threshold = +e.target.value; saveCalls(); renderScoreboard(); });
    $("#exportCalls").addEventListener("click", () => { const a = document.createElement("a"); a.href = "data:application/json," + encodeURIComponent(JSON.stringify({ calls, scoreCfg }, null, 1)); a.download = "fo-scanner-calls.json"; a.click(); });
    $("#importCalls").addEventListener("change", async e => { try { const j = JSON.parse(await e.target.files[0].text()); const inc = j.calls || j; const have = new Set(calls.map(c => c.symbol + c.as_of)); for (const c of inc) if (!have.has(c.symbol + c.as_of)) calls.push(c); saveCalls(); renderScoreboard(); render(); } catch (err) { alert("Could not read that file"); } });
    $("#clearCalls").addEventListener("click", () => { if (confirm("Delete all recorded calls?")) { calls = []; saveCalls(); renderScoreboard(); render(); } });
    if (SERVER.orders && SERVER.paper) renderPaperScore();
  }
  // second score, from the paper ledger: what the trades made after real fills and charges (one group)
  async function renderPaperScore() {
    const box = $("#paperScore"); if (!box) return;
    try {
      const S = (await getJson("/api/paper/trades")).stats;
      const need = s => !s.trades ? "—" : s.hits_needed > s.trades ? "N too small" : s.hits_needed + "/" + s.trades;
      const row = (name, s) => `<tr><td>${name}</td><td>${s.trades}</td><td>${s.wins}</td><td>${s.win_rate != null ? s.win_rate + "%" : "—"}</td><td>${money(s.mean_net_pnl)}</td><td>${s.mean_return_pct != null ? pct(s.mean_return_pct) : "—"}</td><td>${money(s.total_net_pnl)}</td><td>${need(s)}</td></tr>`;
      box.innerHTML = `<h2 style="margin-top:12px">Paper trades, realistic net</h2>
        <p class="count" style="margin:0">Each closed paper trade after its fills (book walk, spread, ticks) and both legs' charges. Return is on the capital committed: the premium for a long option, the margin otherwise. Won = net P&L above zero; Needed = wins to beat a coin at that N.</p>
        <div style="overflow-x:auto"><table><thead><tr><th></th><th>Trades</th><th>Won</th><th>Win rate</th><th>Mean net</th><th>Mean return</th><th>Total net</th><th>Needed</th></tr></thead>
        <tbody>${row("All paper trades", S.all)}</tbody></table></div>`;
    } catch (e) { box.innerHTML = ""; }
  }
  scoreCalls();

  // ---- S1 rule trades: which arm a stock is in (the forward test's lists, and the live paper account's rule trades)
  const ARMS = {};                                    // symbol -> {A: "buy next session" | "open" | "paper", B: ...}
  function markArms(sym, arm, what) { (ARMS[sym] = ARMS[sym] || {})[arm] = ARMS[sym][arm] || what; }
  ((meta.forward || {}).arms ? Object.entries(meta.forward.arms) : []).forEach(([arm, st]) => {
    (st.pending || []).forEach(x => markArms(x.symbol, arm, "buy next session"));
    (st.open || []).forEach(x => markArms(x.symbol, arm, "open in the forward test"));
  });
  function armBadges(sym) {
    const a = ARMS[sym]; if (!a) return "";
    return ["A", "B"].filter(k => a[k]).map(k => `<span class="armb ${k.toLowerCase()}" title="S1 arm ${k}: ${esc(a[k])}">Arm ${k}</span>`).join("");
  }

  // ---- scanner: conditions on the numbers this build carries, presets, saved scans and the results table.
  //      Every value comes from view(s): the live quote when the feed has the stock, else the closing scan.
  //      Implied volatility and Greeks are not in either source, so they are not offered as filters.
  const TH = meta.thresholds || {};
  const PCR_LO = TH.pcr_low ?? 0.7, PCR_HI = TH.pcr_high ?? 1.3;
  const chainOf = s => CHAIN[s.symbol] || s.chain;
  const nextResults = s => { const u = ((s.events || {}).upcoming || []).find(u => u.type === "results" || u.type === "results_date"); return u ? u.sessions : null; };
  const crore = v => v == null ? "—" : v >= 100 ? Math.round(v).toLocaleString("en-IN") : v.toFixed(1);
  const SECTORS = [...new Set(stocks.map(s => sectorName(s.sector) || "Other"))].sort();
  const EXPIRIES = [...new Set(stocks.map(s => (s.chain || {}).expiry).filter(Boolean))].sort();
  const LABEL_OPTS = ["Bullish setup", "Bearish setup", "Neutral", "Unclassified"];
  // kind num: compared with a threshold · enum: one value of a list · bool: yes / no · list: symbols typed in
  const METRICS = {
    pct:    { name: "Price change", unit: "%", kind: "num", live: 1, get: (s, v) => v.pct, fmt: pct, about: "last price vs the previous close" },
    vr:     { name: "Volume vs 20-day avg", unit: "×", kind: "num", live: 1, get: (s, v) => v.vr, fmt: ratio, about: "volume ÷ its 20-day average; live: pro rata to the time of day" },
    oi:     { name: "OI change", unit: "%", kind: "num", live: 1, get: (s, v) => v.oi, fmt: pct, about: "futures open interest, all expiries, vs the previous close" },
    pcr:    { name: "PCR", unit: "", kind: "num", live: 1, get: (s, v) => v.pcr, fmt: num, about: "put open interest ÷ call open interest" },
    ltp:    { name: "Price", unit: "₹", kind: "num", live: 1, get: (s, v) => v.ltp, fmt: fmtPx, about: "last traded price" },
    value:  { name: "Traded value", unit: "₹ cr", kind: "num", live: 1, get: (s, v) => v.vol != null && v.ltp != null ? v.vol * v.ltp / 1e7 : null, fmt: v => v == null ? "—" : "₹" + crore(v) + " cr", about: "volume × price, in ₹ crore" },
    mp:     { name: "Price vs max pain", unit: "%", kind: "num", live: 1, get: (s, v) => { const c = chainOf(s); return c && c.max_pain && v.ltp != null ? +((v.ltp / c.max_pain - 1) * 100).toFixed(2) : null; }, fmt: pct, about: "distance of the price from the nearest expiry's max-pain strike" },
    res:    { name: "Results in", unit: "sessions", kind: "num", get: s => nextResults(s), fmt: v => v == null ? "none due" : v + " session" + (v === 1 ? "" : "s"), about: "sessions to the next results date on the exchange calendar" },
    label:  { name: "Setup label", kind: "enum", opts: () => LABEL_OPTS, get: s => s.label || "Unclassified", fmt: x => x, about: "this scanner's own label from price, volume, OI and PCR" },
    sector: { name: "Sector", kind: "enum", opts: () => SECTORS, get: s => sectorName(s.sector) || "Other", fmt: x => x },
    expiry: { name: "Expiry", kind: "enum", opts: () => EXPIRIES, get: s => (chainOf(s) || {}).expiry || "none", fmt: x => x, about: "the nearest expiry in this build's strike table" },
    sym:    { name: "Symbol", kind: "list", get: s => s.symbol, fmt: x => x, about: "symbols you type, separated by commas" },
    wl:     { name: "In watchlist", kind: "bool", get: s => pins.has(s.symbol), fmt: x => x ? "yes" : "no" },
    arm:    { name: "In an S1 arm", kind: "bool", get: s => !!ARMS[s.symbol], fmt: x => x ? "yes" : "no", about: "a pending or open S1 forward-test or paper rule trade" },
  };
  const OPS = { num: [[">", ">"], [">=", "≥"], ["<", "<"], ["<=", "≤"], ["between", "between"], ["absge", "|x| ≥"], ["absle", "|x| ≤"]],
                enum: [["is", "is"], ["not", "is not"]], bool: [["yes", "yes"], ["no", "no"]], list: [["in", "is one of"], ["notin", "is none of"]] };
  const blank = x => x === "" || x == null || !isFinite(+x);
  const listOf = t => String(t || "").toUpperCase().split(/[\s,]+/).filter(Boolean);
  function testCond(c, s, v) {
    const M = METRICS[c.m]; if (!M) return { ok: false, val: null, missing: true };
    const x = M.get(s, v);
    if (M.kind === "bool") return { ok: c.op === "no" ? !x : !!x, val: x };
    if (M.kind === "enum") return { ok: c.op === "not" ? x !== c.a : x === c.a, val: x };
    if (M.kind === "list") { const set = listOf(c.a), hit = set.includes(x); return { ok: !set.length || (c.op === "notin" ? !hit : hit), val: x, idle: !set.length }; }
    if (blank(c.a) || (c.op === "between" && blank(c.b))) return { ok: true, val: x, idle: true };    // a half-typed rule filters nothing
    if (x == null) return { ok: false, val: null, missing: true };
    const a = +c.a, b = +c.b;
    const ok = c.op === ">" ? x > a : c.op === ">=" ? x >= a : c.op === "<" ? x < a : c.op === "<=" ? x <= a
      : c.op === "between" ? x >= Math.min(a, b) && x <= Math.max(a, b) : c.op === "absge" ? Math.abs(x) >= a : Math.abs(x) <= a;
    return { ok, val: x };
  }
  function evalScan(s, v = view(s), sc = scan) {
    const rs = sc.conds.map(c => ({ c, ...testCond(c, s, v) }));
    const act = rs.filter(r => !r.idle);
    return { ok: !act.length || (sc.logic === "any" ? act.some(r => r.ok) : act.every(r => r.ok)), rs, act };
  }
  function ruleText(c) {
    const M = METRICS[c.m]; if (!M) return "";
    const op = (OPS[M.kind].find(o => o[0] === c.op) || [, c.op])[1], u = !M.unit || M.unit === "₹" ? "" : M.unit === "%" || M.unit === "×" ? M.unit : " " + M.unit;
    if (M.kind === "bool") return op;
    if (M.kind === "enum") return `${op} ${c.a}`;
    if (M.kind === "list") return `${op} ${listOf(c.a).join(", ") || "(none typed)"}`;
    if (c.op === "between") return `between ${c.a} and ${c.b}${u}`;
    return `${op} ${M.unit === "₹" ? "₹" : ""}${c.a}${u}`;
  }
  const condText = c => `${METRICS[c.m] ? METRICS[c.m].name : c.m} ${ruleText(c)}`;

  const C = (m, op, a = "", b = "") => ({ m, op, a: String(a), b: String(b) });
  const PRESETS = [
    { id: "all", name: "All F&O stocks", conds: [], sort: ["pct", -1], about: "every stock in the F&O universe" },
    { id: "longbu", name: "Long build-up", conds: [C("pct", ">", 0), C("oi", ">", 0)], sort: ["oi", -1], about: "price up, futures OI up" },
    { id: "shortbu", name: "Short build-up", conds: [C("pct", "<", 0), C("oi", ">", 0)], sort: ["oi", -1], about: "price down, futures OI up" },
    { id: "cover", name: "Short covering", conds: [C("pct", ">", 0), C("oi", "<", 0)], sort: ["oi", 1], about: "price up, futures OI down" },
    { id: "unwind", name: "Long unwinding", conds: [C("pct", "<", 0), C("oi", "<", 0)], sort: ["oi", 1], about: "price down, futures OI down" },
    { id: "volspike", name: "Volume spike (≥ 2× avg)", conds: [C("vr", ">=", 2)], sort: ["vr", -1], about: "volume at least twice its 20-day average" },
    { id: "oivol", name: "OI surge on volume", conds: [C("oi", ">=", 5), C("vr", ">=", 1.5)], sort: ["oi", -1], about: "OI up 5% or more with volume 1.5× average" },
    { id: "bull", name: "Bullish setups", conds: [C("label", "is", "Bullish setup")], sort: ["pct", -1], about: "the scanner's Bullish label" },
    { id: "bear", name: "Bearish setups", conds: [C("label", "is", "Bearish setup")], sort: ["pct", 1], about: "the scanner's Bearish label" },
    { id: "pcrlow", name: `PCR below ${PCR_LO}`, conds: [C("pcr", "<", PCR_LO)], sort: ["pcr", 1], about: "low put-call ratio" },
    { id: "pcrhigh", name: `PCR above ${PCR_HI}`, conds: [C("pcr", ">", PCR_HI)], sort: ["pcr", -1], about: "high put-call ratio" },
    { id: "results", name: "Results within 5 sessions", conds: [C("res", "<=", 5)], sort: ["res", 1], about: "results due soon" },
    { id: "maxpain", name: "Within 1% of max pain", conds: [C("mp", "absle", 1)], sort: ["mp", 1], about: "price close to the max-pain strike" },
  ];
  const DEFAULT_COLS = ["sym", "ltp", "pct", "vol", "vr", "value", "oi", "pcr", "label", "match"];
  const COLS = {
    sym:    { name: "Symbol", l: 1, fixed: 1, sort: r => r.s.symbol },
    ltp:    { name: "LTP", m: "ltp" },
    chg:    { name: "Chg", sort: r => r.v.chg, tip: "change vs the previous close, ₹" },
    pct:    { name: "Chg %", m: "pct" },
    vol:    { name: "Volume", sort: r => r.v.vol, tip: "shares traded" },
    vr:     { name: "Vol × avg", m: "vr" },
    value:  { name: "Value ₹ cr", m: "value" },
    foi:    { name: "Fut OI", sort: r => futOi(r), tip: "futures open interest, all expiries" },
    oi:     { name: "OI chg %", m: "oi" },
    pcr:    { name: "PCR", m: "pcr" },
    mp:     { name: "vs max pain", m: "mp" },
    res:    { name: "Results in", m: "res" },
    label:  { name: "Label", l: 1, m: "label", sort: r => LABEL_OPTS.indexOf(r.s.label) },
    sector: { name: "Sector", l: 1, m: "sector" },
    exp:    { name: "Expiry", m: "expiry" },
    match:  { name: "Match", sort: r => r.e.act.filter(x => x.ok).length, tip: "one dot per condition: green passes, red fails" },
  };
  const futOi = r => r.v.q && r.v.q.fut_oi != null ? r.v.q.fut_oi : r.s.fut_oi;
  const colVal = (k, r) => { const c = COLS[k]; return c.sort ? c.sort(r) : METRICS[c.m].get(r.s, r.v); };

  // state: the scan being edited, its universe and the visible columns; saved scans live in this browser
  const SAVED_KEY = "fos_scans_v1";
  let saved = store.get(SAVED_KEY, []);
  const fromPreset = p => ({ src: p.id, name: p.name, logic: "all", conds: p.conds.map(c => ({ ...c })), sort: p.sort.slice(), dirty: false });
  let scan = store.get("fos_scan_v1", null);
  if (!scan || !Array.isArray(scan.conds)) scan = fromPreset(PRESETS[0]);
  scan.conds = scan.conds.filter(c => METRICS[c.m]);
  let uni = store.get("fos_uni", "all"), symQ = "", ROWS = [];
  let cols = store.get("fos_cols_v1", DEFAULT_COLS).filter(k => COLS[k]);
  if (!cols.includes("sym")) cols.unshift("sym");
  const saveScanState = () => store.set("fos_scan_v1", scan);
  const universe = () => uni === "watchlist" ? stocks.filter(s => pins.has(s.symbol)) : stocks;
  const scanTitle = () => scan.name + (scan.dirty ? " (edited)" : "");

  function visibleRows() {
    const q = symQ;
    const rows = universe().filter(s => !q || s.symbol.includes(q) || (s.name || "").toUpperCase().includes(q))
      .map(s => { const v = view(s); return { s, v, e: evalScan(s, v) }; }).filter(r => r.e.ok);
    const [k, d] = COLS[scan.sort[0]] ? scan.sort : ["pct", -1];
    rows.sort((a, b) => {
      const x = colVal(k, a), y = colVal(k, b);
      if (x == null && y == null) return a.s.symbol.localeCompare(b.s.symbol);
      if (x == null) return 1; if (y == null) return -1;                              // missing values sink
      if (typeof x === "string" || typeof y === "string") return d * String(x).localeCompare(String(y)) || a.s.symbol.localeCompare(b.s.symbol);
      return d * (x - y) || a.s.symbol.localeCompare(b.s.symbol);
    });
    return rows;
  }

  // freshness of what the table shows: live polls go stale after 3 missed polls; a close is stale once a newer one exists
  function secsSinceIst(hms) {
    const m = /^(\d\d):(\d\d):(\d\d)/.exec(hms || ""); if (!m) return null;
    const n = istNow(); return (n.getHours() * 3600 + n.getMinutes() * 60 + n.getSeconds()) - (+m[1] * 3600 + +m[2] * 60 + +m[3]);
  }
  function weekdaysAfter(d) {
    if (!/^\d{4}-\d\d-\d\d$/.test(d || "")) return null;
    const today = istDate(), n = istNow(), closed = n.getHours() * 60 + n.getMinutes() >= 930;
    const x = new Date(d + "T00:00:00Z"), end = new Date(today + "T00:00:00Z"); let k = 0;
    while (true) { x.setUTCDate(x.getUTCDate() + 1); if (x > end) break; const w = x.getUTCDay(); if (w > 0 && w < 6 && (x < end || closed)) k++; }
    return k;
  }
  function freshness() {
    if (SERVER.live && LIVE.updated_at && Object.keys(LIVE.quotes || {}).length) {          // the table shows these quotes
      const open = !!LIVE.market_open, age = secsSinceIst(LIVE.updated_at);
      const stale = LIVE.error || (open && age != null && age > 3 * Math.max(10, SERVER.poll_seconds));
      return { live: true, open, stale: !!stale, text: open ? `live quotes · polled ${LIVE.updated_at} IST` : `last poll ${LIVE.updated_at} IST · market closed`,
               why: stale ? (LIVE.error ? "the feed reports an error: " + LIVE.error : `no poll for ${Math.round(age)} s`) : "" };
    }
    const k = weekdaysAfter(meta.as_of);
    return { live: false, stale: k != null && k > 0, text: `closing data · ${meta.as_of_label}`,
             why: k ? `${k} weekday session${k === 1 ? " has" : "s have"} closed since (holidays not counted); the next nightly build brings them in` : "" };
  }

  // ---- toolbar: presets and saved scans, universe, symbol filter
  function renderPresetSel() {
    const sv = saved.map(x => `<option value="saved:${x.id}">${esc(x.name)}</option>`).join("");
    $("#presetSel").innerHTML = `<optgroup label="Presets">${PRESETS.map(p => `<option value="${p.id}" title="${esc(p.about)}">${esc(p.name)}</option>`).join("")}</optgroup>`
      + (sv ? `<optgroup label="Saved scans">${sv}</optgroup>` : "") + (scan.dirty ? `<option value="__edited">${esc(scanTitle())}</option>` : "");
    $("#presetSel").value = scan.dirty ? "__edited" : scan.src;
  }
  function loadScan(id) {
    if (id.startsWith("saved:")) {
      const x = saved.find(y => "saved:" + y.id === id); if (!x) return;
      scan = { src: id, name: x.name, logic: x.logic || "all", conds: x.conds.map(c => ({ ...c })), sort: (x.sort || ["pct", -1]).slice(), dirty: false };
      if (x.cols) { cols = x.cols.filter(k => COLS[k]); store.set("fos_cols_v1", cols); }
      if (x.uni) setUni(x.uni, true);
    } else { const p = PRESETS.find(y => y.id === id); if (!p) return; scan = fromPreset(p); }
    saveScanState(); renderScan(); if (tab === "why") renderTab();
  }
  $("#presetSel").addEventListener("change", e => { if (e.target.value !== "__edited") loadScan(e.target.value); });
  function edited() { if (!scan.dirty) { scan.dirty = true; renderPresetSel(); } saveScanState(); }
  function renderUni() {
    $("#uniSeg").innerHTML = [["all", "All F&O", stocks.length], ["watchlist", "★ Watchlist", pins.size]]
      .map(([k, n, c]) => `<button type="button" data-uni="${k}" aria-pressed="${k === uni}">${n}<b>${c}</b></button>`).join("");
  }
  function setUni(u, quiet) { uni = u; store.set("fos_uni", u); renderUni(); if (!quiet) { renderList(); renderFbar(); railState(); if (tab === "why") renderTab(); } }
  $("#uniSeg").addEventListener("click", e => { const b = e.target.closest("[data-uni]"); if (b) setUni(b.dataset.uni); });
  $("#symFilter").addEventListener("input", e => { symQ = e.target.value.trim().toUpperCase(); renderList(); if (tab === "why") renderTab(); });

  // ---- filter builder: one chip per condition, editable in place; AND / OR; a typed quick rule
  function condChip(c, i, tally) {
    const M = METRICS[c.m], ops = OPS[M.kind];
    const opSel = `<select data-f="op" aria-label="${esc(M.name)} comparison">${ops.map(([k, n]) => `<option value="${k}" ${k === c.op ? "selected" : ""}>${n}</option>`).join("")}</select>`;
    let val = "";
    if (M.kind === "num") {
      const bad = x => blank(x) ? " bad" : "";
      val = `<input data-f="a" inputmode="decimal" value="${esc(c.a)}" aria-label="${esc(M.name)} threshold" class="${bad(c.a)}">`
        + (c.op === "between" ? `<span class="u">and</span><input data-f="b" inputmode="decimal" value="${esc(c.b)}" aria-label="${esc(M.name)} upper threshold">` : "")
        + (M.unit ? `<span class="u">${esc(M.unit)}</span>` : "");
    } else if (M.kind === "enum") {
      const opts = M.opts(); if (!opts.includes(c.a)) c.a = opts[0] || "";
      val = `<select data-f="a" aria-label="${esc(M.name)} value">${opts.map(o => `<option ${o === c.a ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>`;
    } else if (M.kind === "list") val = `<input data-f="a" class="wide" value="${esc(c.a)}" placeholder="RELIANCE, TCS" aria-label="Symbols">`;
    const idle = M.kind === "num" && (blank(c.a) || (c.op === "between" && blank(c.b)));
    return `<span class="cond${idle ? " bad" : ""}" data-i="${i}" title="${esc(M.about || "")}${idle ? " · type a number to apply this condition" : ""}"><b>${esc(M.name)}</b>${opSel}${val}
      <span class="tally" title="stocks in this universe that pass this condition on its own">${tally}</span><button class="x" type="button" data-del aria-label="Remove ${esc(M.name)} condition">×</button></span>`;
  }
  function tallies() { const u = universe().map(s => [s, view(s)]); return scan.conds.map(c => u.filter(([s, v]) => testCond(c, s, v).ok).length); }
  function renderFbar() {
    const t = tallies(), n = scan.conds.length;
    const logic = n > 1 ? `<span class="seg" role="group" aria-label="Combine conditions"><button type="button" data-logic="all" aria-pressed="${scan.logic !== "any"}" title="every condition must hold">All · AND</button><button type="button" data-logic="any" aria-pressed="${scan.logic === "any"}" title="any one condition is enough">Any · OR</button></span>` : "";
    const chips = scan.conds.map((c, i) => (i ? `<span class="join">${scan.logic === "any" ? "or" : "and"}</span>` : "") + condChip(c, i, t[i])).join("");

  async function loadChart(fit) {
    const s = BY[sel]; if (!s) return;
    if (!SERVER.live && tf !== "D") tf = "D";
    if (!ensureChart()) { chartMsg("The chart library could not load (offline?). The numbers on the right are complete."); return; }
    chart.applyOptions({ timeScale: { timeVisible: tf !== "D" } });

      else if (s.daily && s.daily.d && s.daily.d.length) {
        const d = s.daily;

        const q = LIVE.quotes[s.symbol], today = istDate();

          bars.push({ time: today, open: q.open, high: Math.max(q.high || q.ltp, q.ltp), low: Math.min(q.low || q.ltp, q.ltp), close: q.ltp, volume: q.volume, live: true });
        stat = `${bars.length} sessions · daily${bars.length && bars[bars.length - 1].live ? " · today live" : ""}`;

      } catch (e) { msg = "Intraday data unavailable: " + esc(e.message); }

  // ---- side tabs
