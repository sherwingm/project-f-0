<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>F&amp;O Live Results</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/tokens.css">
<style>
/* Design tokens: one system for every workspace. A strategy changes what is shown, never how it looks. */
:root { --disc:44px; }
*, *::before, *::after { box-sizing:border-box; }
html, body { overflow-x:hidden; }
body { margin:0; background:var(--bg); color:var(--ink); font:13px/1.45 Inter,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  font-variant-numeric:tabular-nums; -webkit-text-size-adjust:100%; padding-bottom:calc(var(--disc) + 16px); }
button { font:inherit; color:inherit; cursor:pointer; }
button:focus-visible, a:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline:2px solid var(--focus); outline-offset:1px; }
.mono { font-family:"JetBrains Mono",ui-monospace,Consolas,monospace; }
.up { color:var(--bull); } .down { color:var(--bear); } .flat { color:var(--muted); }
small, .muted { color:var(--muted); }
a { color:var(--accent); }
[hidden] { display:none !important; }

/* top bar */
.top { position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:8px 16px; background:var(--panel); border-bottom:1px solid var(--line); }
.brand { font-weight:700; font-size:15px; white-space:nowrap; }
.brand i { font-style:normal; color:var(--accent); }
.mkt { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); white-space:nowrap; }
.dot { width:8px; height:8px; border-radius:50%; background:var(--muted); }
.dot.on { background:var(--bull); box-shadow:0 0 0 3px var(--bull-soft); }
.clock { font-family:"JetBrains Mono",monospace; color:var(--ink); }
.tabs { display:flex; gap:4px; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:3px; margin-left:auto; }
.tabs button { border:0; background:none; padding:6px 12px; border-radius:7px; font-weight:600; color:var(--muted); white-space:nowrap; display:flex; align-items:center; gap:6px; }
.tabs button i { width:7px; height:7px; border-radius:50%; background:var(--c); }
.tabs button[aria-selected="true"] { background:var(--raise); color:var(--ink); box-shadow:inset 0 -2px 0 var(--c); }
.tlink { height:34px; padding:0 12px; border-radius:var(--r-sm); border:1px solid var(--line-strong); background:var(--surface); display:inline-flex; align-items:center; text-decoration:none; color:var(--ink); white-space:nowrap; }
.tbtn { height:34px; min-width:34px; border-radius:var(--r-sm); border:1px solid var(--line-strong); background:var(--surface); display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:0 8px; }
.tbtn kbd { font:600 10px Inter,sans-serif; color:var(--muted); border:1px solid var(--line-strong); border-radius:4px; padding:0 4px; }

main { max-width:none; margin:0 auto; padding:16px 24px; }   /* full screen width: the wide trade tables need it */
/* workspace header */
.ws { display:flex; gap:12px; align-items:flex-start; margin:2px 0 14px; }
.ws .bar { width:4px; align-self:stretch; border-radius:2px; background:var(--c); }
.ws h1 { font-size:19px; margin:0 0 2px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.ws p { color:var(--muted); margin:0; font-size:12.5px; max-width:900px; }
h2 { font-size:14px; margin:0; display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
h2 small { font-weight:400; font-size:12px; }

/* the one panel component */
.panels { display:flex; flex-direction:column; gap:14px; }
.panel { background:var(--panel); border:1px solid var(--line); border-radius:var(--r-lg); padding:var(--sp-3) var(--sp-4) var(--sp-4); min-width:0; }
.panel > header { display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; margin:0 0 10px; }
.panel > header .rt { margin-left:auto; font-size:12px; color:var(--muted); }
.panel.flat { background:none; border:0; padding:0; }
.row2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:14px; }
.skel { height:54px; border-radius:var(--r-md); background:linear-gradient(90deg,var(--surface),var(--raise),var(--surface)); background-size:200% 100%; animation:sk 1.2s infinite linear; }
@keyframes sk { to { background-position:-200% 0; } }

/* tiles */
.tiles { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; }
.tile { background:var(--surface); border:1px solid var(--line); border-radius:var(--r-md); padding:10px 12px; }
.tile small { display:block; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; }
.tile b { font:600 18px "JetBrains Mono",monospace; }
.spark { display:flex; flex-wrap:wrap; align-items:center; gap:4px 10px; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-md); padding:8px 12px; margin-top:8px; }
.spark svg { flex:1 1 160px; height:44px; min-width:0; }
.spark small { white-space:nowrap; }

/* position cards */
.cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:12px; }
.pc { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px 16px; display:flex; flex-direction:column; gap:10px; border-top:3px solid var(--c, var(--line)); }
.pc .hd { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.pc .nm { font-size:16px; font-weight:700; flex:1; min-width:0; }
.pc .nm span { font-weight:600; color:var(--muted); }
.tag { font:600 11px Inter,sans-serif; border-radius:999px; padding:2px 9px; white-space:nowrap; }
.tag.ce { background:var(--bull-soft); color:var(--bull); } .tag.pe { background:var(--bear-soft); color:var(--bear); }
.pc .sub { font-size:12px; color:var(--muted); margin-top:-6px; }
.chips { display:flex; gap:6px; flex-wrap:wrap; }
.pfbar .museg { margin:0; }
.pfbar { display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin:0 0 10px; }
.pfbar select { font:600 12px Inter,sans-serif; background:var(--raise); color:var(--ink); border:1px solid var(--line-strong); border-radius:8px; padding:5px 8px; }
tr.dayrow td { background:var(--raise); text-align:left; padding:8px 10px; border-top:2px solid var(--line-strong); font-size:12.5px; }
tr.dayrow small { color:var(--muted); margin-left:8px; }
.chip { font:600 11px Inter,sans-serif; border-radius:999px; padding:2px 9px; background:var(--raise); border:1px solid var(--line-strong); color:var(--ink); white-space:nowrap; }
.chip.in { border-color:var(--bull); color:var(--bull); } .chip.out { border-color:var(--unc); color:var(--unc); }
.px { display:grid; grid-template-columns:1fr auto 1fr; align-items:end; gap:8px; }
.px small { display:block; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; }
.px .entry b { font:700 26px "JetBrains Mono",monospace; }
.px .now { text-align:right; }
.px .now b { font:600 20px "JetBrains Mono",monospace; }
.px .now em { display:block; font:600 13px "JetBrains Mono",monospace; font-style:normal; }
.px .arr { color:var(--muted); font-size:18px; padding-bottom:4px; }
.val, .pl2, .ex { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.val > div { border:1px solid var(--line); border-radius:9px; padding:7px 10px; }
.val small, .pl2 small, .ex small { display:block; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; }
.val b, .pl2 b { font:700 16px "JetBrains Mono",monospace; }
.val em, .pl2 em, .ex em { display:block; font-style:normal; font-size:11px; color:var(--muted); }
.val .r, .pl2 .r { text-align:right; }
.pl2 { border-top:1px solid var(--line); padding-top:8px; }
.arm { white-space:nowrap; font:700 10.5px Inter,sans-serif; border-radius:6px; padding:2px 7px; background:var(--raise); border:1px solid var(--line-strong); }
.arm.a { color:var(--arm-a); border-color:var(--arm-a); } .arm.b { color:var(--arm-b); border-color:var(--arm-b); } .arm.f { color:var(--arm-f); border-color:var(--arm-f); }
.mode { font:600 10.5px Inter,sans-serif; color:var(--muted); }
.sb { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:12px; }
.sb .tw table td, .sb .tw table th { padding:7px 10px; }
.sb h3 { margin:0 0 6px; font-size:13px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.gap { margin:0; font-size:11.5px; color:var(--unc); background:var(--unc-soft); border-radius:8px; padding:6px 9px; }
.ex > div { background:var(--raise); border-radius:9px; padding:7px 10px; }
.ex b { font:600 15px "JetBrains Mono",monospace; }
.rail { position:relative; height:26px; margin:2px 4px 0; }
.rail .ln { position:absolute; left:0; right:0; top:11px; height:4px; border-radius:2px; background:linear-gradient(90deg,var(--bear-soft),var(--line),var(--bull-soft)); }
.rail i { position:absolute; top:5px; width:2px; height:16px; border-radius:1px; transform:translateX(-1px); }
.rail i.e { background:var(--ink); } .rail i.n { background:var(--accent); width:4px; transform:translateX(-2px); }
.rail i.s { background:var(--bear); } .rail i.p { background:var(--bull); }
.rail span { position:absolute; top:-9px; font-size:9.5px; color:var(--muted); transform:translateX(-50%); white-space:nowrap; }
.ft { display:flex; align-items:center; gap:10px; font-size:12px; color:var(--muted); flex-wrap:wrap; }
.ft .btn { margin-left:auto; }
.btn { height:32px; padding:0 14px; border-radius:var(--r-sm); border:1px solid var(--line-strong); background:var(--surface); font-weight:600; }
.btn.sell { border-color:var(--bear); color:var(--bear); }
.btn.ghost { border-color:var(--line); color:var(--muted); }
.btn:disabled { opacity:.5; cursor:default; }
.err { color:var(--bear); font-size:12px; }
[data-why] { cursor:pointer; }
.pc[data-why]:hover, tr[data-why]:hover td { background:var(--raise); }

/* tables */
.tw { overflow-x:auto; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-md); }
table { width:100%; border-collapse:collapse; font:12.5px "JetBrains Mono",monospace; white-space:nowrap; }
th { font:600 10.5px Inter,sans-serif; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); text-align:right; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:bottom; }
th.g { text-align:center; color:var(--ink); border-left:1px solid var(--line); }
td { padding:8px 10px; border-bottom:1px solid var(--line); text-align:right; }
td.gl { border-left:1px solid var(--line); }
th:first-child, td:first-child { text-align:left; font-family:Inter,sans-serif; }
td:first-child b { font-weight:700; }
td small { font-size:10.5px; }
td.l, th.l { text-align:left; white-space:normal; font-family:Inter,sans-serif; }
tr:last-child td { border-bottom:0; }
td.entry { font-weight:700; }
.empty { color:var(--muted); background:var(--surface); border:1px dashed var(--line-strong); border-radius:var(--r-md); padding:14px 16px; margin:0; }
details summary { cursor:pointer; color:var(--muted); margin:10px 0 6px; }
.note { font-size:12px; color:var(--muted); margin:10px 0 0; }
.museg { display:inline-flex; border:1px solid var(--line); border-radius:var(--r-md); overflow:hidden; margin:0 0 8px; }
.museg button { border:0; background:var(--surface); color:var(--muted); padding:6px 12px; font:inherit; font-size:12px; cursor:pointer; }
.museg button + button { border-left:1px solid var(--line); }
.museg button[aria-pressed="true"] { color:var(--ink); background:var(--raise, var(--surface)); box-shadow:inset 0 -2px 0 var(--arm-p); }
.mu-hero { display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr); gap:12px; margin:0 0 12px; }
.mu-ladder, .mu-cmp > div { background:var(--surface); border:1px solid var(--line); border-radius:var(--r-md); }
.mu-ladder { padding:12px 14px; }
.mu-ladder h4 { margin:0 0 10px; font:600 10.5px Inter,sans-serif; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
.mu-row { display:grid; grid-template-columns:86px minmax(0,1fr) 44px 64px; align-items:center; gap:10px; padding:4px 0; }
.mu-lbl { font-size:12px; color:var(--muted); }
.mu-track { height:10px; border-radius:5px; background:var(--line); overflow:hidden; }
.mu-track i { display:block; height:100%; border-radius:5px; background:var(--bull); }
.mu-row b { font:600 13px "JetBrains Mono",monospace; text-align:right; }
.mu-row small { font:11px "JetBrains Mono",monospace; color:var(--muted); }
.mu-cmp { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.mu-cmp > div { padding:10px 12px; }
.mu-cmp small { display:block; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
.mu-cmp b { display:block; font:600 20px "JetBrains Mono",monospace; margin:2px 0; }
.mu-cmp em { font-style:normal; font-size:11px; color:var(--muted); }
.mu-tbl td b { font-weight:600; }
.mu-n { display:block; color:var(--muted); font-size:10.5px; }
td.mu-g { white-space:nowrap; font-weight:600; }
.mu-dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:8px; vertical-align:1px; }
@media (max-width:760px) { .mu-hero { grid-template-columns:1fr; } }
.mubar { display:inline-block; vertical-align:middle; width:70px; height:6px; margin-right:8px; border-radius:3px; background:linear-gradient(90deg, var(--bull) var(--w), var(--line) var(--w)); }
.prog { height:8px; border-radius:4px; background:var(--raise); overflow:hidden; margin:6px 0 2px; }
.prog i { display:block; height:100%; background:var(--arm-f); }
.facts { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:8px; }
.facts > div { background:var(--surface); border:1px solid var(--line); border-radius:var(--r-md); padding:9px 12px; }
.facts b { display:block; font:600 15px "JetBrains Mono",monospace; }
.facts small { display:block; }

/* the "why" drawer and the search palette */
.scrim { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:20; }
.sheet { position:fixed; z-index:21; left:50%; transform:translateX(-50%); bottom:0; width:min(560px,100%); max-height:86vh; overflow:auto;
  background:var(--panel); border:1px solid var(--line-strong); border-bottom:0; border-radius:18px 18px 0 0; box-shadow:var(--shadow); padding:10px 18px 24px; }
.sheet .grab { width:44px; height:4px; border-radius:2px; background:var(--line-strong); margin:0 auto 10px; }
.sheet h3 { margin:0 0 4px; font-size:17px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.sheet .kv { display:grid; grid-template-columns:auto 1fr; gap:6px 14px; margin:12px 0; }
.sheet .kv dt { color:var(--muted); font-size:12px; }
.sheet .kv dd { margin:0; font:500 13px "JetBrains Mono",monospace; text-align:right; }
.sheet .why { background:var(--surface); border:1px solid var(--line); border-left:3px solid var(--c, var(--accent)); border-radius:var(--r-sm); padding:9px 12px; font-size:12.5px; }
.sheet .x { float:right; }
.pal { position:fixed; z-index:21; left:50%; top:10vh; transform:translateX(-50%); width:min(560px,calc(100% - 24px)); background:var(--panel);
  border:1px solid var(--line-strong); border-radius:var(--r-lg); box-shadow:var(--shadow); overflow:hidden; }
.pal input { width:100%; border:0; border-bottom:1px solid var(--line); background:none; color:var(--ink); font:500 15px Inter,sans-serif; padding:14px 16px; outline:none; }
.pal ul { list-style:none; margin:0; padding:6px; max-height:56vh; overflow:auto; }
.pal li { padding:8px 10px; border-radius:var(--r-sm); display:flex; gap:8px; align-items:center; cursor:pointer; }
.pal li[aria-selected="true"], .pal li:hover { background:var(--raise); }
.pal li small { margin-left:auto; }

.disclaimer { position:fixed; left:0; right:0; bottom:0; min-height:var(--disc); background:var(--panel); border-top:1px solid var(--bear); padding:6px 16px; font-size:11.5px; z-index:6; display:flex; align-items:center; }
.disclaimer b { color:var(--bear); }

@media (max-width:760px) {
  .top { padding:8px 10px; }
  .tabs { order:3; width:100%; margin-left:0; justify-content:space-between; }
  .tabs button { flex:1; padding:7px 2px; justify-content:center; }
  .mkt .lbl, .tbtn kbd, .brand i { display:none; }
  main { padding:12px 10px; }
  .panel { padding:var(--sp-3); }
  .cards { grid-template-columns:1fr; }
  .px .entry b { font-size:23px; }
  :root { --disc:64px; }
}

/* ===== design pass (7 Nov 2026): look only, no content or data change. From the dashboard-design skill: one clear
   hierarchy, quiet colour (a hue only where the number is good or bad), tables that scan, width that grows with the
   screen. Every colour is a token from /tokens.css, so light and dark both work; delete this block to undo it. */
:root { --pad:clamp(14px,2.2vw,40px); --edge:color-mix(in srgb, var(--line) 55%, var(--line-strong) 45%); }
body { letter-spacing:.003em; }
main { padding:20px var(--pad) 28px; }
::-webkit-scrollbar { height:10px; width:10px; } ::-webkit-scrollbar-thumb { background:var(--line-strong); border-radius:6px; border:2px solid transparent; background-clip:content-box; }
::-webkit-scrollbar-track { background:transparent; }

/* top bar: glass, clearer brand, tabs that read as the main navigation */
.top { background:color-mix(in srgb, var(--panel) 86%, transparent); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); padding:10px var(--pad); gap:12px; }
.brand { font-size:16px; letter-spacing:-.01em; }
.tabs { padding:4px; border-radius:12px; background:var(--surface); }
.tabs button { padding:7px 16px; border-radius:9px; font-size:13px; transition:background .15s, color .15s; }
.tabs button:hover { color:var(--ink); }
.tabs button[aria-selected="true"] { background:var(--raise); box-shadow:inset 0 -2px 0 var(--c), 0 1px 2px rgba(0,0,0,.25); }
.tlink, .tbtn { transition:border-color .15s, background .15s; } .tlink:hover, .tbtn:hover { border-color:var(--accent); background:var(--raise); }

/* header and panels: the title leads, the explanation steps back */
.ws h1 { font-size:22px; letter-spacing:-.015em; }
.ws p, .note { color:var(--muted); line-height:1.6; max-width:120ch; }
.ws p { font-size:13px; }
.panels { gap:18px; }
.panel { padding:16px 20px 20px; border-color:var(--edge); box-shadow:0 1px 0 rgba(255,255,255,.025) inset, 0 10px 28px -14px rgba(0,0,0,.55); }
.panel > header { margin:0 0 14px; padding-bottom:12px; border-bottom:1px solid var(--line); }
h2 { font-size:15.5px; font-weight:650; letter-spacing:-.005em; }
h2 small { font-size:12.5px; color:var(--muted); }
.panel.flat > header { border-bottom:0; padding-bottom:0; }

/* tables: calmer rules, a header that anchors, rows that light up under the pointer */
.tw { border-color:var(--edge); border-radius:var(--r-md); background:color-mix(in srgb, var(--surface) 70%, var(--panel)); }
th { background:color-mix(in srgb, var(--raise) 55%, transparent); color:var(--muted); font-size:10.5px; letter-spacing:.06em; padding:10px 12px; border-bottom:1px solid var(--edge); }
td { padding:10px 12px; border-bottom:1px solid color-mix(in srgb, var(--line) 80%, transparent); }
tbody tr { transition:background .12s; } tbody tr:hover td { background:color-mix(in srgb, var(--raise) 70%, transparent); }
td.up, td.down, .up b, .down b, td .up, td .down { font-weight:600; }
td small { color:var(--muted); }
/* the grey detail under a number (time, price) stacks under it instead of beside it: the wide tables then fit a wide
   screen without sideways scrolling. The first column keeps its own layout. */
@media (min-width:1600px) {
  .tw td:not(:first-child) small { display:block; white-space:normal; line-height:1.3; margin-top:2px; }
  .tw td:last-child:not(.l) { white-space:normal; min-width:130px; }
}
.tw table { --cellx:9px; } .tw th, .tw td { padding-left:var(--cellx); padding-right:var(--cellx); }
.tw th { white-space:normal; line-height:1.25; }
.tw table:has(tbody td:nth-child(18)) { --cellx:6px; }              /* the 18-19 column fade tables */
.sb .tw table { --cellx:7px; } .sb .tw th { padding:9px 7px; } .sb .tw td:first-child { white-space:normal; min-width:96px; }
tr.dayrow td { background:var(--raise); border-top:1px solid var(--edge); border-bottom:1px solid var(--edge); padding:9px 12px; font-size:13px; letter-spacing:.005em; }
tr.dayrow:hover td { background:var(--raise); }
th.g { border-left:1px solid var(--edge); } td.gl { border-left:1px solid var(--edge); }
td:first-child b { letter-spacing:.01em; }

/* tags and chips: a tinted fill instead of a hard outline */
.arm { border:0; font-size:10.5px; padding:3px 8px; border-radius:7px; background:var(--raise); }
.arm.a { background:color-mix(in srgb, var(--arm-a) 16%, transparent); } .arm.b { background:color-mix(in srgb, var(--arm-b) 16%, transparent); }
.arm.f { background:color-mix(in srgb, var(--arm-f) 16%, transparent); }
.chip { border:0; padding:3px 10px; background:var(--raise); }
.chip.in { background:var(--bull-soft); } .chip.out { background:var(--unc-soft); }
.tag { padding:3px 10px; }

/* the Max up panel: big numbers, thick bars */
.mu-ladder, .mu-cmp > div { border-color:var(--edge); background:color-mix(in srgb, var(--surface) 75%, var(--panel)); }
.mu-ladder { padding:16px 18px; }
.mu-ladder h4, .mu-cmp small { font-size:10.5px; letter-spacing:.07em; }

/* ===== motion (7 Nov 2026, the visualize skill's `animate` rules for dashboards): motion only where it says
   something. A redraw flashes each live cell whose number moved (green up, red down) and ticks the big numbers to
   their new value; a tab switch cross-fades; the Max up bars grow once per page load; the live dot breathes while the
   market is open; buttons answer a press; the drawer and search slide in; sections open smoothly. No entrance on
   the frame, no stagger on lists, transform / opacity only. Reduced motion: values change at once, nothing moves. */
:root { --m-fast:160ms; --m-base:260ms; --ease-out:cubic-bezier(0.16, 1, 0.3, 1); --ease-std:cubic-bezier(0.4, 0, 0.2, 1); }
.dot.on { animation:live 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite alternate; }
@keyframes live { from { opacity:.55; } to { opacity:1; } }
.btn, .tbtn, .tlink, .museg button, .tabs button, .pfbar button {
  transition:transform 80ms var(--ease-std), background-color var(--m-fast) var(--ease-std), border-color var(--m-fast) var(--ease-std), color var(--m-fast) var(--ease-std), box-shadow var(--m-base) var(--ease-std); }
.btn:active, .tbtn:active, .tlink:active, .museg button:active, .tabs button:active, .pfbar button:active { transform:scale(.97); }
tbody tr { transition:background-color 100ms var(--ease-std); }
tr[data-why]:active td { background:var(--raise); }
td.fx-up { animation:fx-up 1.4s var(--ease-std); } td.fx-down { animation:fx-down 1.4s var(--ease-std); }
@keyframes fx-up { from { background-color:var(--bull-soft); box-shadow:inset 0 -2px 0 var(--bull); } to { background-color:transparent; box-shadow:inset 0 -2px 0 transparent; } }

#main.fx-in { animation:fx-in 200ms var(--ease-std); }
@keyframes fx-in { from { opacity:0; } to { opacity:1; } }
.fx-hero .mu-track i { transform-origin:left center; animation:fx-grow 700ms var(--ease-out) both; }
@keyframes fx-grow { from { transform:scaleX(0); } to { transform:scaleX(1); } }
.scrim { transition:opacity var(--m-base) var(--ease-std); }
.sheet { transition:transform var(--m-base) var(--ease-out), opacity var(--m-fast) var(--ease-std); }
.pal { transition:transform 220ms var(--ease-out), opacity var(--m-fast) var(--ease-std); }
@starting-style {
  .scrim { opacity:0; }
  .sheet { opacity:0; transform:translate(-50%, 28px); }

/* ===== the trade page (#view/<trade>, opened in a new tab from any row) */

@media (prefers-reduced-motion:reduce) {
  .btn, .tbtn, .tlink, .museg button, .tabs button, .pfbar button, tbody tr, .scrim, .sheet, .pal { transition-duration:0.01ms !important; }

}

<body>
<header class="top">

  <nav class="tabs" role="tablist" aria-label="Workspaces" id="tabs"></nav>
  <button class="tbtn" type="button" id="find" title="Find a stock (Ctrl+K)" aria-label="Find a stock">🔍<kbd>Ctrl K</kbd></button>
  <a class="tlink" href="/s2" id="s2Link">S2 →</a>
  <a class="tlink" href="/index" id="idxLink">Index →</a>
  <a class="tlink" href="/terminal" id="termLink">Terminal →</a>
  <button class="tbtn" type="button" id="theme" title="Light / dark" aria-label="Switch light or dark theme">◐</button>
</header>
<main id="main"></main>
<div id="overlay"></div>
<footer class="disclaimer" role="note"><div><b>Read before using.</b> Paper trading results for testing a strategy — not trade recommendations, entry/exit signals or predictions. F&amp;O trading carries high risk including potential loss beyond capital invested.</div></footer>

<script>

  "use strict";
  const SERVER = Object.assign({ live: false, orders: false, paper: true, poll_seconds: 30 }, /*__SERVER__*/{});

  if (!SERVER.orders) { $("#termLink").href = "index.html"; $("#s2Link").href = "s2.html"; $("#idxLink").hidden = true; }      // the static GitHub Pages copy

  // ---- theme, clock

  // ---- formatting

  const dir = v => v == null || v === 0 ? "flat" : v > 0 ? "up" : "down";
  const chg = (px, ref) => px == null || !ref ? null : (px / ref - 1) * 100;
  const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const day = d => d ? `${+d.slice(8, 10)} ${MON[+d.slice(5, 7) - 1]}` : "—";
  const when = t => !t ? "" : t.length > 10 ? `${day(t.slice(0, 10))} ${t.slice(11, 19)}` : day(t);
  const optName = (sym, strike, typ) => `${esc(sym)} <span>${num(strike, Number.isInteger(+strike) ? 0 : 2)} ${typ === "PE" ? "PUT" : "CALL"}</span>`;
  const tile = (k, v, c = "") => `<div class="tile"><small>${k}</small><b class="${c}">${v}</b></div>`;
  const todayIso = () => new Date().toLocaleDateString("en-CA", { timeZone: "Asia/Kolkata" });

  async function getJson(url, opts) {
    const r = await fetch(url, { ...auth, ...(opts || {}) }), txt = await r.text();
    let j = null; try { j = JSON.parse(txt); } catch (e) { /* not JSON */ }
    if (!r.ok) throw new Error((j && (j.error || j.detail)) || `HTTP ${r.status}`);

  // ---- the one panel component: same header, loading and empty states everywhere

    `<section class="panel ${cls}"><header><h2>${title}${sub ? ` <small>${sub}</small>` : ""}</h2>${rt ? `<span class="rt">${rt}</span>` : ""}</header>${body}</section>`;
  const empty = t => `<p class="empty">${t}</p>`;
  const loading = () => `<div class="skel"></div>`;

  // ---- S1 v10 fade helpers (strategies/S1_v10_np25_shadow_track.md)

  const inShadow = (side, np) => side === "CE" ? true : np == null ? null : np > 25;
  const shadowChip = (side, np) => { const s = inShadow(side, np);
    return s == null ? "" : s ? `<span class="chip in" title="In the NP YoY > 25 % shadow track">in shadow</span>` : `<span class="chip out" title="A put with NP YoY of 10-25 %: v10 takes it, the shadow track would not">left out by shadow</span>`; };
  const numbersChip = r => r && r.why ? `<span class="chip">${esc(String(r.why).replace("net profit", "NP").replace("revenue", "rev"))}</span>` : "";

  // the bar under each card: stop · entry · max dip · max up · now, on one scale
  function rail(entry, now, peak, trough, stop) {
    const pts = [entry, now, peak, trough, stop].filter(v => v != null && isFinite(v));
    const lo = Math.min(...pts), hi = Math.max(...pts), span = hi - lo || 1;

  }

  // a small equity line: cumulative booked net ₹ by close date (no intraday, no ticks)
  function spark(points, label) {
    if (points.length < 2) return `<div class="spark"><small>${label}</small><small style="margin-left:auto">the line starts after 2 closed trades</small></div>`;
    let cum = 0; const ys = [0, ...points.map(p => (cum += p))];
    const lo = Math.min(0, ...ys), hi = Math.max(0, ...ys), span = hi - lo || 1, W = 300, H = 44;
    const xy = ys.map((y, i) => `${(i * W / (ys.length - 1)).toFixed(1)},${(H - 4 - (y - lo) / span * (H - 8)).toFixed(1)}`).join(" ");
    const zero = (H - 4 - (0 - lo) / span * (H - 8)).toFixed(1), last = ys[ys.length - 1];
    return `<div class="spark"><small>${label}</small><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${label}: ${srs(last)} after ${points.length} trades">
      <line x1="0" y1="${zero}" x2="${W}" y2="${zero}" stroke="var(--line-strong)" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/>
      <polyline points="${xy}" fill="none" stroke="${last >= 0 ? "var(--bull)" : "var(--bear)"}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>
      <b class="mono ${dir(last)}">${srs(last)}</b></div>`;
  }

  // ---- paper account (live server)
  let P = { summary: null, positions: [], trades: [], err: "", loaded: false };
  async function loadPaper() {
    if (!SERVER.orders) return;
    try {
      const [s, p, t, rf, ords, ru] = await Promise.all([getJson("/api/paper/summary"), getJson("/api/paper/positions"), getJson("/api/paper/trades"),
        getJson("/api/paper/refusals"), getJson("/api/orders"), getJson("/api/paper/rules").catch(() => null)]);
      const since = (ru && ru.started) || "";

            orders: (ords || []).filter(o => !since || (o.placed_at || o.filled_at || "") >= since), rules: ru, err: "", loaded: true };
    } catch (e) { P.err = e.message; P.loaded = true; }

    $("#dot").className = "dot" + (open ? " on" : ""); $("#mkt").textContent = open ? "Market open" : "Market closed";

  }
  const armTags = arms => (arms || []).map(a => `<span class="arm ${a.toLowerCase()}">${a === "F" ? "Arm F · fade" : "Arm " + a}</span>`).join(" ");

  const waitsToday =(w, today, arms) => Object.entries(w || {}).filter(([k]) => k.startsWith(today + ":"))
    .map(([k, v]) => ({ symbol: k.slice(today.length + 1), reason: v.reason, at: v.at, arms: arms || v.arms || [] }));
  const armColor = r => !r ? "var(--line)" : (r.arms || []).includes("F") ? "var(--arm-f)" : (r.arms || []).includes("A") ? "var(--arm-a)" : "var(--arm-b)";
  const MODE = { open: "bought at the open (09:15)", close: "bought at the close (15:20, day's average price)", fade: "results-day fade: bought on the results day, sold at the −20 % stop or at 15:20" };
  function tMinus1(exp) { const d = new Date(exp + "T00:00:00"); do { d.setDate(d.getDate() - 1); } while (d.getDay() === 0 || d.getDay() === 6); return d.toLocaleDateString("en-CA"); }
  const ofArm = (rows, arm) => rows.filter(x => x.rule && (x.rule.arms || []).includes(arm));

  // per-trade shadow exits (S1 v11): v10 = held to 15:20; trail = -20 % stop + trail (on at +10 %, sells 5 % below the peak bid)
  function trailText(r, e, net) {
    const t = r && r.shadow_trail; if (!t) return null;
    if (t.status === "open") return `waiting: switches on at a bid of ${rs(t.start)} (+10 %)`;
    if (t.status === "active") return `on since ${when(t.started_at)} · peak bid ${rs(t.peak)} · would sell at ${rs(t.peak * 0.95)} or below`;
    if (t.status === "done") return `sold at ${rs(t.fill)} · ${when(t.at)} · ${srs(t.net, 2)}${net != null ? ` (real ${srs(net, 2)})` : ""}`;

  }

    return null;
  }
  const shadowNet = (sh, net) => !sh ? null : sh.status === "done" ? sh.net : sh.status === "same" ? net : null;

  function positionCard(p) {
    const e = p.entry.price, m = p.mark || {}, now = m.ltp ?? m.price, bid = m.bid ?? m.price;

      const s = P.summary || {};
      return panel("Account", `<div class="tiles">${tile("Equity", rs(s.equity, 0))}${tile("Today", srs(s.day_pnl), dir(s.day_pnl))}${tile("This week", srs(s.week_pnl), dir(s.week_pnl))}
        ${tile("Open P&amp;L", srs(s.unrealised_total), dir(s.unrealised_total))}${tile("Booked P&amp;L", srs(s.realised_total), dir(s.realised_total))}
        ${tile("Drawdown", (s.drawdown_pct ?? 0).toFixed(2) + "%")}${tile("Open positions", s.open_positions ?? 0)}</div>
        ${spark(byClose(P.trades.filter(x => !oldFade(x))), "Booked trades (fade from v11's day 0)")}
        ${P.trades.some(oldFade) ? `<p class="note">Equity and booked P&amp;L include the ${P.trades.filter(oldFade).length} v10 fade trades before 21 Oct (side record, ${srs(P.trades.filter(oldFade).reduce((a, c) => a + (c.net_pnl || 0), 0))}); the account's cash cannot be split.</p>` : ""}
        ${s.drawdown_review ? `<p class="err">${esc(s.drawdown_review_message)}</p>` : ""}

    },
    scoreboards() {
      if (paperWait("")) return "";
      return panel("Scoreboard", `<div class="sb">${sbCard("A", "every results beat", ["open", "close", null])}${sbCard("B", "results beat in a strong sector", ["open", "close", null])}${sbCard("F", "results-day fade", ["fade"])}</div>`,
        { sub: "rule trades only, 1 lot each, net of charges · a signal in both arms counts in both" });
    },
    // the session's plan in one place: every rule trade the server will try to buy today, how the strike is chosen,
    // how it exits, and (from /api/paper/rules) whether it has been bought, refused or is still being tried
    todayPlan() {
      const today = todayIso(), ru = (P.rules || {}).rules || {}, k = sym => `${today}:${sym}`;
      const boughtToday = (sym, arm) => P.positions.concat(P.trades).filter(x => x.symbol === sym && String(x.opened_at || "").slice(0, 10) === today
        && (!arm || ((x.rule || {}).arms || []).includes(arm)));
      const leg = x => `<b>${num(x.strike, 0)} ${x.instrument}</b> at ${rs(x.entry.price)} <small>${x.lots} lot · ${rs(x.entry.price * x.qty, 0)}</small>`;
      const state = (book, waitBook, sym, mode) => {
        const st = (book || {})[k(sym)], w = (waitBook || {})[k(sym)];
        if (st === "bought") return `<span class="chip in">bought</span>`;
        if (st === "refused") { const r = (ru.refused || []).filter(x => x.date === today && x.symbol === sym && (!mode || x.mode === mode)).pop();
          return `<span class="chip out">refused</span>${r ? ` <small>${esc(r.reason)}</small>` : ""}`; }
        if (w) return `<span class="chip">trying</span> <small>${esc(w.reason)} · ${esc(String(w.at).slice(11, 19))}</small>`;
        return `<span class="chip">waiting</span>`;
      };
      const rows = [];
      if (FD && FD.session === today) (FD.signals || []).forEach(s => {
        const got = boughtToday(s.symbol, "F");
        rows.push(`<tr data-why="sig:${esc(s.symbol)}" tabindex="0"><td><b>${esc(s.symbol)}</b> ${armTags(["F"])}</td>
          <td><span class="tag ${s.side === "PE" ? "pe" : "ce"}">${s.side === "PE" ? "PUT" : "CALL"}</span></td>
          <td class="l">${esc(s.why || "")}<br><small>${s.side === "PE" ? "strong numbers: bet the jump fades" : "weak numbers: bet the drop recovers"} · stock ${rs(s.spot)} · expiry ${day(s.expiry)}</small></td>
          <td class="l">${got.length ? got.map(leg).join("<br>") : `picked live from 09:15<br><small>first strike from the price outward with a lot of ₹600–8,000 and a premium of ₹2 or more</small>`}</td>
          <td class="l"><small>−20 % stop · trail from +10 %, sells 2 % below the peak bid · else 15:20 today</small></td>
          <td class="l">${got.length ? `<span class="chip in">bought</span>` : state(ru.fade, ru.fade_wait, s.symbol, "fade")}</td></tr>`);
      });
      (FW && FW.arms && FW.for_today !== false ? Object.entries(FW.arms) : []).forEach(([arm, st]) => (st.pending || []).forEach(p => {
        if (rows.some(r => r.includes(`data-plan="${p.symbol}"`))) return;            // one row for a stock in both arms
        const arms = Object.entries(FW.arms).filter(([, s2]) => (s2.pending || []).some(q => q.symbol === p.symbol)).map(([a]) => a);
        const got = boughtToday(p.symbol, arm);
        rows.push(`<tr data-plan="${esc(p.symbol)}"><td><b>${esc(p.symbol)}</b> ${armTags(arms)}</td><td><span class="tag ce">CALL</span></td>
          <td class="l">results beat ${pct(p.beat)} vs its sector, day move ${pct(p.move)}<br><small>stock ${rs(p.spot)} · expiry ${day(p.expiry)}</small></td>
          <td class="l">${got.length ? got.map(leg).join("<br>") : p.open_strike ? `09:15: <b>${num(p.open_strike, 0)} CE</b> near ${rs(p.open_ref)} <small>(${rs(p.open_ref * (p.open_lot || 0), 0)} a lot, last close)</small><br><small>and a second lot at 15:20, strike picked then</small>` : "picked at 09:15 and 15:20"}</td>
          <td class="l"><small>50 % stop at a close · 5 sessions without a new closing high · T-1</small></td>
          <td class="l">open ${state(ru.open, ru.open_wait, p.symbol, "open")}<br>close ${state(ru.close, null, p.symbol, "close")}</td></tr>`);
      }));
      const stale = (FD && FD.session && FD.session !== today ? `<p class="note">The fade list on the server is for ${day(FD.session)}, not today: tonight's build has not run yet.</p>` : "")
        + (FW && FW.for_today === false ? `<p class="note">The Arm A / B list is not for today (it was made after the ${day(FW.last_session)} session): no Arm A / B trades are planned until a fresh list arrives.</p>` : "");
      return panel(`Today's trades · ${day(today)}`, (rows.length ? `<div class="tw"><table><thead><tr><th>Stock</th><th>Buys</th><th class="l">Why</th><th class="l">Strike and price</th><th class="l">Exit</th><th class="l">Now</th></tr></thead><tbody>${rows.join("")}</tbody></table></div>`
        : empty("No rule trades for today: no strong or weak results and no results beats yesterday.")) + stale
        + `<p class="note">Paper only, 1 lot each. Fade strikes are chosen at the live ask when the market opens, so the strike shown here appears once bought. Arm A / B strikes come from last night's closing prices; the 09:15 order uses the live price.${FD && (FD.ban || []).length ? ` In the F&amp;O ban today (not traded): ${FD.ban.map(esc).join(", ")}.` : ""}</p>`,
        { sub: "what the paper account will try to buy this session", rt: FD && FD.made_at ? "list made " + when(FD.made_at) : "" });
    },
    // how high every live trade went above its entry: the best price it reached, against what was booked
    maxUp(arm) {
      if (paperWait("")) return "";
      const anyTime = muMode === "any";
      const rows = P.trades.map(c => {
        const e = c.entry.price, held = c.held_peak && c.held_peak.price, after = c.after && c.after.peak && c.after.peak.price;
        const best = [held, anyTime ? after : null].filter(v => v != null);
        return { x: c, open: false, e, held: chg(held, e), after: chg(after, e), up: best.length ? chg(Math.max(...best), e) : null, got: c.return_pct,
                 heldAt: c.held_peak && c.held_peak.at, afterAt: c.after && c.after.peak && c.after.peak.at };
      }).concat(P.positions.map(p => {
        const e = p.entry.price, pk = p.peak && p.peak.price, m = p.mark || {}, now = m.bid ?? m.price;
        return { x: p, open: true, e, held: chg(pk, e), after: null, up: chg(pk, e), got: chg(now, e), heldAt: p.peak && p.peak.at };
      })).filter(r => !arm || ((r.x.rule || {}).arms || []).includes(arm));
      if (!rows.length) return "";
      // one group's numbers: share of trades whose max up reached each level, median max up, average booked
      const stats = f => {
        const g = rows.filter(f), v = g.map(r => r.up).filter(u => u != null).sort((x, y) => x - y), n = v.length;
        const reach = t => ({ k: v.filter(u => u >= t).length, n });
        const med = n ? (n % 2 ? v[(n - 1) / 2] : (v[n / 2 - 1] + v[n / 2]) / 2) : null;
        const gotV = g.map(r => r.got).filter(u => u != null);
        return { g, n, reach, med, best: n ? v[n - 1] : null, open: g.filter(r => r.open).length, got: gotV.length ? gotV.reduce((x, y) => x + y, 0) / gotV.length : null };
      };
      const share = r => r.n ? Math.round(100 * r.k / r.n) : 0;
      const isF = r => (r.x.rule || {}).strategy === "fade", hasArm = a2 => r => ((r.x.rule || {}).arms || []).includes(a2);
      const all = stats(() => true);
      // headline: the ladder of levels reached, and what the median trade reached against what was booked
      const ladder = [[0.0001, "Above entry"], [10, "+10 %"], [20, "+20 %"], [50, "+50 %"], [100, "+100 %"]].map(([t, lbl]) => {
        const r = all.reach(t), s = share(r);
        return `<div class="mu-row"><span class="mu-lbl">${lbl}</span><span class="mu-track"><i style="width:${s}%"></i></span><b>${s}%</b><small>${r.k} of ${r.n}</small></div>`;
      }).join("");
      const gap = all.med != null && all.got != null ? all.med - all.got : null;
      const hero = `<div class="mu-hero">
        <div class="mu-ladder"><h4>Trades that reached each level</h4>${ladder}</div>
        <div class="mu-cmp">
          <div><small>Median max up</small><b class="${dir(all.med)}">${all.med == null ? "—" : pct(all.med)}</b><em>half the trades went at least this high</em></div>
          <div><small>Average booked / now</small><b class="${dir(all.got)}">${all.got == null ? "—" : pct(all.got)}</b><em>what the trades actually gave</em></div>
          <div><small>Left on the table</small><b>${gap == null ? "—" : (gap < 0 ? "−" : "") + Math.abs(gap).toFixed(1) + " pts"}</b><em>median max up minus average booked</em></div>
          <div><small>Best trade</small><b class="${dir(all.best)}">${all.best == null ? "—" : pct(all.best)}</b><em>${all.g.length} trades · ${all.open} still open</em></div>
        </div></div>`;
      // the same numbers by group
      const groupRow = (name, f) => {
        const s = stats(f); if (!s.g.length) return "";
        const cell = t => { const r = s.reach(t); return `<td><b>${share(r)}%</b><small class="mu-n">${r.k}/${r.n}</small></td>`; };
        return `<tr><td class="mu-g">${name}</td><td>${s.g.length}${s.open ? `<small class="mu-n">${s.open} open</small>` : ""}</td>${cell(20)}${cell(50)}${cell(100)}
          <td class="${dir(s.med)}">${s.med == null ? "—" : pct(s.med)}</td><td class="${dir(s.got)}">${s.got == null ? "—" : pct(s.got)}</td></tr>`;
      };
      const dot = a2 => `<i class="mu-dot" style="background:var(--arm-${a2.toLowerCase()})"></i>`;
      const groups = (arm === "F" ? [groupRow(`${dot("F")}Live (from 21 Oct)`, r => !oldFade(r.x)), groupRow(`${dot("F")}v10 (before 21 Oct)`, r => oldFade(r.x))]
        : arm ? [] : [groupRow(`${dot("F")}Arm F · live`, r => isF(r) && !oldFade(r.x)), groupRow(`${dot("F")}Arm F · v10 record`, r => oldFade(r.x)),
          groupRow(`${dot("A")}Arm A`, hasArm("A")), groupRow(`${dot("B")}Arm B`, hasArm("B")), groupRow("Manual", r => !r.x.rule)]).filter(Boolean);
      const list = rows.slice().sort((x, y) => (y.up ?? -1e9) - (x.up ?? -1e9)).map(r => {
        const x = r.x, w = r.up == null ? 0 : Math.max(2, Math.min(100, r.up / 3));
        return `<tr data-why="${r.open ? "pos" : "trade"}:${esc(x.id)}" tabindex="0"><td class="l"><b>${esc(x.symbol)}</b> <small>${num(x.strike, 0)} ${x.instrument}</small> ${x.rule ? armTags(x.rule.arms) : ""}</td>
          <td>${when(x.opened_at)}</td><td>${r.open ? "open" : "closed"}</td><td class="entry">${rs(r.e)}</td>
          <td class="gl ${dir(r.held)}">${r.held == null ? "—" : pct(r.held)}${r.held != null && r.heldAt ? `<br><small>${when(r.heldAt)}</small>` : ""}</td><td class="${dir(r.after)}">${r.open ? "<small>still held</small>" : r.after == null ? "—" : pct(r.after) + (r.afterAt ? `<br><small>${when(r.afterAt)}</small>` : "")}</td>
          <td class="l"><span class="mubar" style="--w:${w}%"></span><b class="${dir(r.up)}">${r.up == null ? "—" : pct(r.up)}</b></td>
          <td class="${dir(r.got)}">${r.got == null ? "—" : pct(r.got)}<small>${r.open ? " now" : " booked"}</small></td></tr>`;
      }).join("");
      const seg = `<span class="museg" role="group" aria-label="Which peak">${[["held", "While held"], ["any", "Any time, incl. after the sale"]].map(([k, n]) => `<button type="button" data-mu="${k}" aria-pressed="${k === muMode}">${n}</button>`).join("")}</span>`;
      return panel("Max up", `${seg}${hero}
        ${groups.length ? `<div class="tw mu-tbl"><table><thead><tr><th class="l">Group</th><th>Trades</th><th>Reached +20 %</th><th>Reached +50 %</th><th>Reached +100 %</th><th>Median max up</th><th>Avg booked / now</th></tr></thead><tbody>${groups.join("")}</tbody></table></div>` : ""}
        <details><summary>Every trade, highest first (${rows.length})</summary><div class="tw"><table><thead><tr><th class="l">Option</th><th>Bought</th><th>Status</th><th>Entry</th><th class="g">Max up while held</th><th>Max up after the sale</th><th class="l">Counted max up</th><th>Booked / now</th></tr></thead><tbody>${list}</tbody></table></div></details>
        <p class="note">Max up = the highest traded price the option reached, as % above our entry, from the live polls. <b>While held</b> counts only the time we owned it; <b>any time</b> adds the follow-up after the sale (to the T-2 day). Open positions count their peak so far. A peak is the last traded price at a poll; the bid then could have been lower. Booked = net % after charges; open positions: % at the current bid.</p>`,
        { sub: anyTime ? "highest price at any time after the entry" : "highest price while we held the option" });
    },
    refusedToday() {
      if (paperWait("")) return "";
      const ru = (P.rules || {}).rules || {}, today = todayIso();
      const rr = (ru.refused || []).filter(x => x.date === today);
      const ww = [...waitsToday(ru.open_wait, today, null), ...waitsToday(ru.fade_wait, today, ["F"])];
      const late = pastEntries();                      // a row left after 15:20: the server missed its 15:20 check

          `<b>${esc(x.symbol)}</b> ${armTags(x.arms)} (${esc(x.reason)} · checked ${esc(String(x.at).slice(11, 19))})`).join(" · ")}</p>` : "")

  // the paper account's two entries of a forward-test signal today (/api/paper/rules + positions + trades)
  function paperToday(sym, today) {
    const ru = (P.rules || {}).rules || {}, key = `${today}:${sym}`;
    const one = (mode, label, later) => {
      const st = (ru[mode] || {})[key];
      if (st === "bought") {
        const p = P.positions.concat(P.trades).find(x => x.symbol === sym && (x.rule || {}).entry_mode === mode && String(x.opened_at || "").startsWith(today));
        return `${label}: <span class="chip in">bought</span>${p ? ` <small>${num(p.strike, Number.isInteger(+p.strike) ? 0 : 2)} ${p.instrument === "PE" ? "PUT" : "CALL"} at ${rs((p.entry || {}).price)}</small>` : ""}`;
      }
      if (st === "refused") {
        const r = (ru.refused || []).filter(x => x.mode === mode && x.date === today && x.symbol === sym).pop();
        return `${label}: <span class="chip out">refused</span>${r ? ` <small>${esc(r.reason)}</small>` : ""}`;
      }
      const w = mode === "open" ? (ru.open_wait || {})[key] : null;
      if (w) return `${label}: <span class="chip${pastEntries() ? " out" : ""}">${pastEntries() ? "not bought" : "waiting"}</span> <small>${esc(w.reason)} · checked ${esc(String(w.at).slice(11, 19))}</small>`;
      return `${label}: <small>${later}</small>`;
    };
    return `${one("open", "Open", "from 09:15")}<br>${one("close", "15:20", "not yet")}`;
  }

    const st = FW.arms[A], days = (FW.sessions || []).filter(x => x.session > FW.first_session).length;
    const closed = st.closed.filter(t => !t.excluded), wins = closed.filter(t => t.net > 0).length;
    const avg = closed.length ? closed.reduce((s, t) => s + t.net_pct, 0) / closed.length : null;
    const tot = closed.reduce((s, t) => s + t.net, 0);
    const out = [];
    out.push(panel("Scoreboard", `<div class="tiles">${tile("Buy next session", st.pending.length)}${tile("Open", st.open.length)}${tile("Closed", closed.length)}
      ${tile("Win rate", closed.length ? Math.round(100 * wins / closed.length) + "%" : "—")}${tile("Average net", avg == null ? "—" : pct(avg), dir(avg))}${tile("Booked net", closed.length ? srs(tot) : "—", dir(tot))}</div>
      ${spark(closed.slice().sort((a, b) => (a.exit_date || "").localeCompare(b.exit_date || "")).map(t => t.net), "Booked net, trade by trade")}`,

    const ys = pts.map(r => r.bid).concat([L.e, L.stop, L.trail, L.pk, L.now].filter(v => v > 0));
    let lo = Math.min(...ys), hi = Math.max(...ys); const pad = (hi - lo) * 0.08 || 0.5; lo -= pad; hi += pad;
    const W = 1000, H = 300, sx = x => (x - x0) / xr * W, sy = v => H - (v - lo) / (hi - lo) * H, topPct = v => (sy(v) / H * 100).toFixed(2) + "%";
    const poly = list => list.map(r => `${sx(X(r)).toFixed(1)},${sy(r.bid).toFixed(1)}`).join(" ");
    const heldRows = rec.filter(r => r.phase !== "after_exit"), afterRows = rec.filter(r => r.phase === "after_exit");
    const afterLine = sold ? [sold].concat(afterRows) : afterRows;          // the recorded path
    const labels = [], lv = (v, cls, lab, side) => { if (!(v > 0 && v >= lo && v <= hi)) return ""; labels.push({ v, cls, side, text: `${lab} ${rs(v)}` });
      return `<div class="lv ${cls}" style="top:${topPct(v)}"></div>`; };
    const marks = days.slice(1).map((d, k) => { const x = (k + 1) * 390; return x > x0 && x < x0 + xr ? `<div class="dm" style="left:${(sx(x) / W * 100).toFixed(2)}%"><span>${day(d)}</span></div>` : ""; }).join("");
    const soldMark = sold ? `<div class="dm sold" style="left:${(sx(X(sold)) / W * 100).toFixed(2)}%"><span>sold ${when(sold.t).slice(-8)}</span></div>` : "";
    box.innerHTML = `<div class="plot">${soldMark}<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="best bid from ${rs(rec[0].bid)} to ${rs(rec[rec.length - 1].bid)}">
        <polyline class="pl held" points="${poly(heldRows)}"/>${afterLine.length > 1 ? `<polyline class="pl after" points="${poly(afterLine)}"/>` : ""}</svg>
        ${lv(L.stop, "stop", "stop", "l")}${lv(L.trail, "trail", "trail on", "r")}${lv(L.e, "entry", "entry", "l")}${lv(L.pk, "peak", "peak", "r")}${lv(L.now, L.closed ? "exit" : "now", L.closed ? "exit" : "now", "r")}
        ${marks}<div class="xh" hidden><i></i><div class="tip"></div></div></div>
      <div class="ax"><span>${when(rec[0].t)}</span><span>${rec.length} quotes</span><span>${when(pts.reduce((m, r) => r.t > m ? r.t : m, rec[0].t))}</span></div>`;
    const plotEl = $(".plot", box), xh = $(".xh", box);
    // price labels: stacked so none sits on another (each side keeps 16 px between labels; the dashed line stays at its true price)
    const place = () => {
      $$(".lb", plotEl).forEach(n => n.remove());
      const h = plotEl.clientHeight, GAP = 16;
      ["l", "r"].forEach(side => {
        const g = labels.filter(l => l.side === side).map(l => ({ ...l, y: (hi - l.v) / (hi - lo) * h })).sort((a1, b1) => a1.y - b1.y);
        let prev = -Infinity; g.forEach(l => { l.top = Math.max(l.y - 8, prev + GAP); prev = l.top; });
        let next = Infinity; for (let i = g.length - 1; i >= 0; i--) { g[i].top = Math.min(g[i].top, next - GAP, h - 14); next = g[i].top; }
        g.forEach(l => { const e = document.createElement("div"); e.className = `lb ${l.cls} ${side}`; e.textContent = l.text; e.style.top = Math.max(0, l.top) + "px";
          if (Math.abs(l.top + 8 - l.y) > 3) e.title = "label moved to avoid overlap; the dashed line is at the true price"; plotEl.appendChild(e); });
      });
    };
    place();
    if (window.ResizeObserver) new ResizeObserver(place).observe(plotEl);
    const all = pts.map((r, i) => ({ r, x: xs[i] })).sort((u, v) => u.x - v.x);
    const read = ev => {
      const b = plotEl.getBoundingClientRect(), fx = Math.min(1, Math.max(0, (ev.clientX - b.left) / b.width)), want = x0 + fx * xr;
      let i = all.findIndex(o => o.x >= want); if (i < 0) i = all.length - 1; if (i > 0 && want - all[i - 1].x < all[i].x - want) i--;
      const r = all[i].r, f = sx(all[i].x) / W;
      xh.hidden = false; xh.style.left = (f * 100).toFixed(2) + "%"; xh.classList.toggle("flip", f > 0.7);
      $("i", xh).style.top = topPct(r.bid);
      $(".tip", xh).innerHTML = `<b>${when(r.t)}</b><br>bid ${rs(r.bid)} <span class="${dir(chg(r.bid, L.e))}">${pct(chg(r.bid, L.e))}</span><br><small>ask ${rs(r.ask)}${r.phase === "after_exit" ? " · after the sale" : ""}</small>`;
    };
    plotEl.addEventListener("pointermove", read); plotEl.addEventListener("pointerdown", read);
    plotEl.addEventListener("pointerleave", () => { xh.hidden = true; });
  }
  const closeOverlay = () => { $("#overlay").innerHTML = ""; };

  // ---- search palette (Ctrl+K / 🔍): jump to any stock in any workspace
  function index() {
    const out = [], add = (sym, tab, label, why) => out.push({ sym, tab, label, why });
    P.positions.forEach(p => add(p.symbol, (p.rule && (p.rule.arms || []).includes("F")) ? "armf" : "paper", `open ${p.instrument} ${num(p.strike, 0)}`, "pos:" + p.id));
    P.trades.forEach(c => add(c.symbol, (c.rule && (c.rule.arms || []).includes("F")) ? "armf" : "paper", `closed ${day((c.closed_at || "").slice(0, 10))} · ${srs(c.net_pnl)}`, "trade:" + c.id));
    ((FD || {}).signals || []).forEach(s => add(s.symbol, "armf", `fade list ${day(FD.session)} · ${s.side === "PE" ? "put" : "call"}`, "sig:" + s.symbol));
    if (FW && FW.arms) for (const A of ["A", "B"]) { const st = FW.arms[A];
      (st.pending || []).forEach(t => add(t.symbol, "arm" + A.toLowerCase(), `Arm ${A} · buy next session`, null));
      (st.open || []).forEach(t => add(t.symbol, "arm" + A.toLowerCase(), `Arm ${A} · open`, null));
      (st.closed || []).forEach(t => add(t.symbol, "arm" + A.toLowerCase(), `Arm ${A} · closed ${day(t.exit_date)}`, null)); }
    return out;
  }
  function openPalette() {
    const all = index(); let sel = 0, list = [];
    $("#overlay").innerHTML = `<div class="scrim" data-dismiss></div><div class="pal" role="dialog" aria-modal="true" aria-label="Find a stock">
      <input id="q" type="search" placeholder="Find a stock… (e.g. POLYCAB)" autocomplete="off" aria-label="Stock"><ul id="ql" role="listbox"></ul></div>`;
    const q = $("#q"), ul = $("#ql");
    const draw = () => { const t = q.value.trim().toUpperCase();
      list = all.filter(x => !t || x.sym.toUpperCase().includes(t)).slice(0, 40); sel = Math.min(sel, Math.max(0, list.length - 1));
      ul.innerHTML = list.length ? list.map((x, i) => `<li role="option" data-i="${i}" aria-selected="${i === sel}"><b>${esc(x.sym)}</b> <span class="muted">${esc(x.label)}</span><small>${WORKSPACES[x.tab].tab}</small></li>`).join("")
        : `<li class="muted">${all.length ? "No match" : "Nothing to search yet"}</li>`; };
    const go = i => { const x = list[i]; if (!x) return; closeOverlay();
      if (x.why) location.hash = "#view/" + encodeURIComponent(x.why); else setTab(x.tab, x.sym); };
    q.addEventListener("input", () => { sel = 0; draw(); });
    q.addEventListener("keydown", e => { if (e.key === "ArrowDown") { sel = Math.min(sel + 1, list.length - 1); draw(); e.preventDefault(); }
      else if (e.key === "ArrowUp") { sel = Math.max(sel - 1, 0); draw(); e.preventDefault(); } else if (e.key === "Enter") go(sel); });
    ul.addEventListener("click", e => { const li = e.target.closest("[data-i]"); if (li) go(+li.dataset.i); });
    draw(); q.focus();
  }
  $("#find").addEventListener("click", openPalette);
  addEventListener("keydown", e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); openPalette(); }
    else if (e.key === "Escape" && $("#overlay").innerHTML) closeOverlay();
  });
  $("#overlay").addEventListener("click", e => { if (e.target.closest("[data-dismiss]")) closeOverlay(); });

  // ---- tabs and shareable state in the URL: #armf, #armf/POLYCAB
  const parseHash = () => { const [t, s] = location.hash.slice(1).split("/"); return { t: (t || "").toLowerCase(), s: s ? decodeURIComponent(s).toUpperCase() : "" }; };
  const setHash = (t, s) => { try { history.replaceState(null, "", "#" + t + (s ? "/" + encodeURIComponent(s) : "")); } catch (e) { /* file:// */ } };
  let tab = parseHash().t;
  if (!TABS.includes(tab)) tab = SERVER.orders ? "paper" : "armf";
  function setTab(t, focusSym) {
    tab = t; VIEW = null; document.title = "F&O Live Results"; setHash(t, null);
    $$("#tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === t));
    render();
    if (focusSym) { const el = $$("#main td:first-child b, #main .nm").find(n => n.textContent.trim().toUpperCase().startsWith(focusSym));
      if (el) { el.scrollIntoView({ behavior: "smooth", block: "center" }); (el.closest("tr,article") || el).animate([{ background: "var(--unc-soft)" }, { background: "transparent" }], 1600); } }
  }
  $("#tabs").addEventListener("click", e => { const b = e.target.closest("[data-tab]"); if (b) setTab(b.dataset.tab); });
  addEventListener("hashchange", () => {
    if (location.hash.startsWith("#view/")) { VIEW = decodeURIComponent(location.hash.slice(6)); render(); scrollTo(0, 0); return; }
    const h = parseHash(); if (TABS.includes(h.t) && (h.t !== tab || VIEW)) setTab(h.t);
  });
  function openFromHash() {                                          // an old #paper/POLYCAB link opens that trade's page
    if (VIEW) return;
    const h = parseHash(); if (!h.s) return;
    const x = index().find(i => i.tab === tab && i.sym.toUpperCase() === h.s && i.why);
    if (x) location.hash = "#view/" + encodeURIComponent(x.why); else setTab(tab, h.s);
  }

  // ---- motion on data updates (see the motion block in the styles): a redraw of the same tab flashes each row cell
  // whose number moved and ticks the big numbers from the old value to the new; a tab switch cross-fades; the Max up
  // bars grow once per page load. Reduced motion: nothing moves.
  const calm = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
  const NUM = /[+−-]?\d[\d,]*(?:\.\d+)?/;
  const numIn = t => { const m = NUM.exec(t || ""); return m ? parseFloat(m[0].replace(/,/g, "").replace("−", "-")) : null; };
  const BIG = ".mu-cmp b, .mu-row b, .tile b";
  const ptitle = p => ((p.querySelector("h2") || {}).textContent || "").replace(/\d+/g, "#").slice(0, 30);
  let heroDone = false;
  function snapshot() {
    const s = new Map();
    $$("#main section.panel").forEach(p => {                         // keyed by panel too: one trade sits in several tables
      const pt = ptitle(p);
      $$("tr[data-why]", p).forEach(tr => [...tr.cells].forEach((td, i) => s.set(`${pt}|${tr.dataset.why}|${i}`, td.textContent)));
      $$(BIG, p).forEach((b, i) => s.set(`${pt}#${i}`, b.textContent));
    });
    return s;
  }
  function tickTo(el, from) {                                        // keeps the element's own sign, grouping, decimals and unit
    const txt = el.textContent, m = NUM.exec(txt), to = numIn(txt);
    if (!m || from == null || to == null || from === to || el.children.length) return;
    const dp = (m[0].split(".")[1] || "").length, grp = m[0].includes(","), plus = m[0].startsWith("+"), minus = txt.includes("−") ? "−" : "-";
    const pre = txt.slice(0, m.index), post = txt.slice(m.index + m[0].length);
    const fmt = v => (v < 0 ? minus : v > 0 && plus ? "+" : "") + Math.abs(v).toLocaleString("en-IN", { minimumFractionDigits: dp, maximumFractionDigits: dp, useGrouping: grp });
    const t0 = performance.now(), ease = k => 1 - Math.pow(1 - k, 3);
    const step = now => { const k = Math.min(1, (now - t0) / 500); el.textContent = k < 1 ? pre + fmt(from + (to - from) * ease(k)) + post : txt; if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  }
  function motion(prev, switched) {
    if (calm()) return;
    const m = $("#main");
    if (switched) { m.classList.remove("fx-in"); void m.offsetWidth; m.classList.add("fx-in"); }
    if (!heroDone && $("#main .mu-track i")) { heroDone = true; m.classList.add("fx-hero"); setTimeout(() => m.classList.remove("fx-hero"), 900); }
    if (!prev) return;
    $$("#main section.panel").forEach(p => {
      const pt = ptitle(p);
      $$("tr[data-why]", p).forEach(tr => [...tr.cells].forEach((td, i) => {
        const o = prev.get(`${pt}|${tr.dataset.why}|${i}`); if (o == null || o === td.textContent) return;
        const a = numIn(o), b = numIn(td.textContent); if (a != null && b != null && a !== b) td.classList.add(b > a ? "fx-up" : "fx-down");
      }));
      $$(BIG, p).forEach((b, i) => { const o = prev.get(`${pt}#${i}`); if (o != null && o !== b.textContent) tickTo(b, numIn(o)); });
    });
  }

  let drawn = "";                                                    // the tab on screen, so a redraw keeps its open <details>
  function render() {
    if (VIEW) {                                                      // the trade page
      $("#main").innerHTML = viewHtml(VIEW); drawn = "view"; drawView();
      $$("#tabs button").forEach(b => b.setAttribute("aria-selected", "false"));
      const p = tradeOf(VIEW); if (p) document.title = `${p.symbol} ${num(p.strike, 0)} ${p.instrument === "PE" ? "PUT" : "CALL"} · F&O`;
      return;
    }
    const w = WORKSPACES[tab], sum = d => ((d.querySelector("summary") || {}).textContent || "").replace(/\d+/g, "#");
    const prev = drawn === tab ? snapshot() : null, switched = !!drawn && drawn !== tab;
    const keep = drawn === tab ? $$("#main details").filter(d => d.open).map(sum) : [];
    const sx = drawn === tab ? $$("#main .tw").map(t => t.scrollLeft) : [];   // and each table's sideways scroll
    $("#main").innerHTML = `<div class="ws" style="--c:${w.color}"><div class="bar"></div><div><h1>${w.title}</h1><p>${w.desc}</p></div></div>
      <div class="panels">${w.panels().filter(Boolean).join("")}</div>`;
    drawn = tab;
    if (keep.length) $$("#main details").forEach(d => { if (keep.includes(sum(d))) d.open = true; });
    if (sx.some(Boolean)) $$("#main .tw").forEach((t, i) => { if (sx[i]) t.scrollLeft = sx[i]; });
    $$("[data-close]").forEach(b => b.addEventListener("click", e => { e.stopPropagation(); closePos(b.dataset.close, b); }));
    motion(prev, switched);
  }
  $("#main").addEventListener("click", e => {
    const mu = e.target.closest("[data-mu]");
    if (mu) { muMode = mu.dataset.mu; try { localStorage.setItem("fo_mu", muMode); } catch (err) { /* private mode */ } render(); return; }
    const pf = e.target.closest("[data-pf]");
    if (pf) { const [k, v] = pf.dataset.pf.split(":");
      PF = k === "reset" ? { ...PF0, group: PF.group } : { ...PF, [k]: v, ...(k === "group" ? { day: "all" } : {}) };
      ls.set("fo_pf", PF); render(); return; }
    if (e.target.closest("button, a, summary, input")) return;
    const el = e.target.closest("[data-why]"); if (!el) return;
    const key = el.dataset.why;
    if (whyHtml(key)) window.open(viewUrl(key), "_blank", "noopener");  // the trade's own page, in a new tab
  });
  $("#main").addEventListener("change", e => {
    if (e.target.matches("[data-pfday]")) { PF = { ...PF, day: e.target.value }; ls.set("fo_pf", PF); render(); }
    else if (e.target.matches("[data-pfgap]")) { PF = { ...PF, gap: +e.target.value }; ls.set("fo_pf", PF); render(); }
  });
  $("#main").addEventListener("keydown", e => { if (e.key === "Enter" && e.target.matches("[data-why]")) e.target.click(); });

  async function closePos(id, btn) {
    const p = P.positions.find(x => x.id === id); if (!p) return;
    const err = $(`[data-cerr="${CSS.escape(id)}"]`);
    const bid = (p.mark || {}).bid ?? (p.mark || {}).price;
    if (!confirm(`Sell ${p.symbol} ${p.strike} ${p.instrument} (${p.lots} lot) now at the best bid (last seen ${rs(bid)})?\nEntry was ${rs(p.entry.price)}. Paper trade.`)) return;
    btn.disabled = true; btn.textContent = "Selling…"; err.hidden = true;
    try {
      await getJson("/api/paper/close/" + encodeURIComponent(id), { method: "POST" });
      await loadPaper(); render();
    } catch (e) { err.textContent = "Not closed: " + e.message; err.hidden = false; btn.disabled = false; btn.textContent = "Close"; }
  }

  // ---- refresh: paper every poll while the market is open, the forward test and the fade list every 10 min
  const busy = () => !!$("#overlay").innerHTML;                    // never redraw under an open drawer or search
  let firstLoad = true;
  async function refresh() {
    await loadPaper();
    if (!busy()) render();                                         // every tab shows the paper account's live state
    if (firstLoad) { firstLoad = false; openFromHash(); }
    const open = P.summary && P.summary.market_open;
    setTimeout(refresh, (open ? SERVER.poll_seconds || 30 : 300) * 1000);
  }
  async function refreshSlow() {
    if (SERVER.orders) {
      try { FW = await getJson("/api/forward"); } catch (e) { /* keep the embedded copy */ }
      try { FD = await getJson("/api/fade") || FD; } catch (e) { /* keep the embedded copy */ }
      if (tab !== "paper" && !busy()) render();
    }
    setTimeout(refreshSlow, 600000);
  }
  if (VIEW) render(); else setTab(tab);                             // a #view/<trade> link opens straight on the trade page
  refresh();
  setTimeout(refreshSlow, 600000);
})();
</script>
</body>
</html>
