<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>F&amp;O Live Results</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0B0F14; --panel:#10151C; --surface:#151B23; --raise:#1B232D; --ink:#E6EDF3; --muted:#8B98A5; --line:#222B36; --line-strong:#33404F;
  --bull:#26A69A; --bull-soft:rgba(38,166,154,.16); --bear:#EF5350; --bear-soft:rgba(239,83,80,.16);
  --unc:#E0B341; --unc-soft:rgba(224,179,65,.16); --accent:#4C8DFF; --accent-ink:#FFFFFF; --focus:#4C8DFF;
  --disc:44px; color-scheme:dark;
}
:root[data-theme="light"] {
  --bg:#EEF1F5; --panel:#FFFFFF; --surface:#FFFFFF; --raise:#F4F6F9; --ink:#141A21; --muted:#5E6B78; --line:#E1E6EC; --line-strong:#C7D0DA;
  --bull:#0F9D76; --bull-soft:rgba(15,157,118,.12); --bear:#D93A3A; --bear-soft:rgba(217,58,58,.10);
  --unc:#A47A12; --unc-soft:rgba(164,122,18,.12); --accent:#2563EB; --focus:#2563EB; color-scheme:light;
}
*, *::before, *::after { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:13px/1.45 Inter,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  font-variant-numeric:tabular-nums; -webkit-text-size-adjust:100%; padding-bottom:calc(var(--disc) + 16px); }
button { font:inherit; color:inherit; cursor:pointer; }
button:focus-visible, a:focus-visible { outline:2px solid var(--focus); outline-offset:1px; }
.mono { font-family:"JetBrains Mono",ui-monospace,Consolas,monospace; }
.up { color:var(--bull); } .down { color:var(--bear); } .flat { color:var(--muted); }
small, .muted { color:var(--muted); }
a { color:var(--accent); }
[hidden] { display:none !important; }

/* top bar */
.top { position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:8px 16px; background:var(--panel); border-bottom:1px solid var(--line); }
.brand { font-weight:700; font-size:15px; white-space:nowrap; }
.brand i { font-style:normal; color:var(--accent); }
.mkt { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); white-space:nowrap; }
.dot { width:8px; height:8px; border-radius:50%; background:var(--muted); }
.dot.on { background:var(--bull); box-shadow:0 0 0 3px var(--bull-soft); }
.clock { font-family:"JetBrains Mono",monospace; color:var(--ink); }
.tabs { display:flex; gap:4px; background:var(--surface); border:1px solid var(--line); border-radius:9px; padding:3px; margin-left:auto; }
.tabs button { border:0; background:none; padding:6px 12px; border-radius:7px; font-weight:600; color:var(--muted); white-space:nowrap; }
.tabs button[aria-selected="true"] { background:var(--accent); color:var(--accent-ink); }
.tlink { height:34px; padding:0 12px; border-radius:8px; border:1px solid var(--line-strong); background:var(--surface); display:inline-flex; align-items:center; text-decoration:none; color:var(--ink); white-space:nowrap; }
.tbtn { height:34px; width:34px; border-radius:8px; border:1px solid var(--line-strong); background:var(--surface); }

main { max-width:1240px; margin:0 auto; padding:16px; }
h1 { font-size:19px; margin:2px 0 4px; }
.lead { color:var(--muted); margin:0 0 14px; font-size:12.5px; }
h2 { font-size:14px; margin:22px 0 8px; display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
h2 small { font-weight:400; font-size:12px; }

/* tiles */
.tiles { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; }
.tile { background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
.tile small { display:block; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; }
.tile b { font:600 18px "JetBrains Mono",monospace; }

/* position cards */
.cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:12px; }
.pc { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px 16px; display:flex; flex-direction:column; gap:10px; }
.pc .hd { display:flex; align-items:center; gap:8px; }
.pc .nm { font-size:16px; font-weight:700; }
.pc .nm span { font-weight:600; color:var(--muted); }
.tag { margin-left:auto; font:600 11px Inter,sans-serif; border-radius:999px; padding:2px 9px; }
.tag.ce { background:var(--bull-soft); color:var(--bull); } .tag.pe { background:var(--bear-soft); color:var(--bear); }
.pc .sub { font-size:12px; color:var(--muted); margin-top:-6px; }
.px { display:grid; grid-template-columns:1fr auto 1fr; align-items:end; gap:8px; }
.px small { display:block; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; }
.px .entry b { font:700 26px "JetBrains Mono",monospace; }
.px .now { text-align:right; }
.px .now b { font:600 20px "JetBrains Mono",monospace; }
.px .now em { display:block; font:600 13px "JetBrains Mono",monospace; font-style:normal; }
.px .arr { color:var(--muted); font-size:18px; padding-bottom:4px; }
.pnl { font:700 15px "JetBrains Mono",monospace; display:flex; justify-content:space-between; align-items:baseline; border-top:1px solid var(--line); padding-top:8px; }
.pnl small { font:400 11px Inter,sans-serif; }
.val { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.val > div { border:1px solid var(--line); border-radius:9px; padding:7px 10px; }
.val small { display:block; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; }
.val b { font:700 16px "JetBrains Mono",monospace; }
.val em { display:block; font-style:normal; font-size:11px; color:var(--muted); }
.val .r { text-align:right; }
.pl2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; border-top:1px solid var(--line); padding-top:8px; }
.pl2 small { display:block; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; }
.pl2 b { font:700 16px "JetBrains Mono",monospace; }
.pl2 em { display:block; font-style:normal; font-size:11px; color:var(--muted); }
.pl2 .r { text-align:right; }
.pc .nm { flex:1; min-width:0; }
.pc .hd .tag { margin-left:0; white-space:nowrap; }
.arm { white-space:nowrap; font:700 10.5px Inter,sans-serif; border-radius:6px; padding:2px 7px; background:var(--raise); border:1px solid var(--line-strong); }
.arm.a { color:#4C8DFF; border-color:#4C8DFF; } .arm.b { color:#B07CFF; border-color:#B07CFF; }
.mode { font:600 10.5px Inter,sans-serif; color:var(--muted); }
.sb { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:12px; }
.sb .tw table td, .sb .tw table th { padding:7px 10px; }
.sb h3 { margin:0 0 6px; font-size:13px; display:flex; gap:8px; align-items:center; }
.gap { margin:0; font-size:11.5px; color:var(--unc); background:var(--unc-soft); border-radius:8px; padding:6px 9px; }
.ex { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.ex > div { background:var(--raise); border-radius:9px; padding:7px 10px; }
.ex small { display:block; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; }
.ex b { font:600 15px "JetBrains Mono",monospace; }
.ex em { display:block; font-style:normal; font-size:11px; color:var(--muted); }
.ex .after { grid-column:1 / -1; display:flex; justify-content:space-between; gap:8px; }
.rail { position:relative; height:26px; margin:2px 4px 0; }
.rail .ln { position:absolute; left:0; right:0; top:11px; height:4px; border-radius:2px; background:linear-gradient(90deg,var(--bear-soft),var(--line),var(--bull-soft)); }
.rail i { position:absolute; top:5px; width:2px; height:16px; border-radius:1px; transform:translateX(-1px); }
.rail i.e { background:var(--ink); } .rail i.n { background:var(--accent); width:4px; transform:translateX(-2px); }
.rail i.s { background:var(--bear); } .rail i.p { background:var(--bull); }
.rail span { position:absolute; top:-9px; font-size:9.5px; color:var(--muted); transform:translateX(-50%); white-space:nowrap; }
.ft { display:flex; align-items:center; gap:10px; font-size:12px; color:var(--muted); flex-wrap:wrap; }
.ft .btn { margin-left:auto; }
.btn { height:32px; padding:0 14px; border-radius:8px; border:1px solid var(--line-strong); background:var(--surface); font-weight:600; }
.btn.sell { border-color:var(--bear); color:var(--bear); }
.btn:disabled { opacity:.5; cursor:default; }
.err { color:var(--bear); font-size:12px; }

/* tables */
.tw { overflow-x:auto; background:var(--surface); border:1px solid var(--line); border-radius:12px; }
table { width:100%; border-collapse:collapse; font:12.5px "JetBrains Mono",monospace; white-space:nowrap; }
th { font:600 10.5px Inter,sans-serif; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); text-align:right; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:bottom; }
th.g { text-align:center; color:var(--ink); border-left:1px solid var(--line); }
td { padding:8px 10px; border-bottom:1px solid var(--line); text-align:right; }
td.gl { border-left:1px solid var(--line); }
th:first-child, td:first-child { text-align:left; font-family:Inter,sans-serif; }
td:first-child b { font-weight:700; }
td small { font-size:10.5px; }
tr:last-child td { border-bottom:0; }
td.entry { font-weight:700; }
.empty { color:var(--muted); background:var(--surface); border:1px dashed var(--line-strong); border-radius:12px; padding:14px 16px; }
details summary { cursor:pointer; color:var(--muted); margin:16px 0 6px; }
.note { font-size:12px; color:var(--muted); margin-top:18px; }

.disclaimer { position:fixed; left:0; right:0; bottom:0; min-height:var(--disc); background:var(--panel); border-top:1px solid var(--bear); padding:6px 16px; font-size:11.5px; z-index:6; display:flex; align-items:center; }
.disclaimer b { color:var(--bear); }

@media (max-width:760px) {
  .top { padding:8px 10px; }
  .tabs { order:3; width:100%; margin-left:0; justify-content:space-between; }
  .tabs button { flex:1; padding:7px 4px; }
  .mkt .lbl { display:none; }
  main { padding:12px 10px; }
  .cards { grid-template-columns:1fr; }
  .px .entry b { font-size:23px; }
  :root { --disc:64px; }
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">F&amp;O <i>Live Results</i></div>
  <div class="mkt"><span class="dot" id="dot"></span><span class="lbl" id="mkt">—</span><span class="clock" id="clock"></span></div>
  <nav class="tabs" role="tablist" aria-label="Results">
    <button type="button" role="tab" data-tab="paper">Paper account</button>
    <button type="button" role="tab" data-tab="arma">Arm A</button>
    <button type="button" role="tab" data-tab="armb">Arm B</button>
  </nav>
  <a class="tlink" href="/terminal" id="termLink">Terminal →</a>
  <button class="tbtn" type="button" id="theme" title="Light / dark" aria-label="Switch light or dark theme">◐</button>
</header>
<main id="main"></main>
<footer class="disclaimer" role="note"><div><b>Read before using.</b> Paper trading results for testing a strategy — not trade recommendations, entry/exit signals or predictions. F&amp;O trading carries high risk including potential loss beyond capital invested.</div></footer>

<script>
(() => {
  "use strict";
  const SERVER = Object.assign({ live: false, orders: false, paper: true, poll_seconds: 30 }, /*__SERVER__*/{});
  let FW = /*__FORWARD__*/null;
  const auth = { credentials: "same-origin" };
  const $ = (s, el = document) => el.querySelector(s), $$ = (s, el = document) => [...el.querySelectorAll(s)];
  const ls = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
               set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* private mode */ } } };
  if (!SERVER.orders) $("#termLink").href = "index.html";      // the static GitHub Pages copy

  // ---- theme, clock
  const setTheme = t => { document.documentElement.dataset.theme = t; ls.set("fos_theme", t); };
  setTheme(ls.get("fos_theme", "dark"));
  $("#theme").addEventListener("click", () => setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark"));
  const tick = () => { $("#clock").textContent = new Date().toLocaleTimeString("en-GB", { timeZone: "Asia/Kolkata" }) + " IST"; };
  tick(); setInterval(tick, 1000);

  // ---- formatting
  const esc = t => String(t ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const num = (v, dp = 2) => Number(v).toLocaleString("en-IN", { minimumFractionDigits: dp, maximumFractionDigits: dp });
  const rs = (v, dp = 2) => v == null ? "—" : "₹" + num(v, dp);
  const srs = (v, dp = 0) => v == null ? "—" : (v > 0 ? "+" : v < 0 ? "−" : "") + "₹" + num(Math.abs(v), dp);
  const pct = v => v == null ? "—" : (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toFixed(1) + "%";
  const dir = v => v == null || v === 0 ? "flat" : v > 0 ? "up" : "down";
  const chg = (px, ref) => px == null || !ref ? null : (px / ref - 1) * 100;
  const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const day = d => d ? `${+d.slice(8, 10)} ${MON[+d.slice(5, 7) - 1]}` : "—";
  const when = t => !t ? "" : t.length > 10 ? `${day(t.slice(0, 10))} ${t.slice(11, 16)}` : day(t);
  const optName = (sym, strike, typ) => `${esc(sym)} <span>${num(strike, Number.isInteger(+strike) ? 0 : 2)} ${typ === "PE" ? "PUT" : "CALL"}</span>`;
  const tile = (k, v, c = "") => `<div class="tile"><small>${k}</small><b class="${c}">${v}</b></div>`;

  async function getJson(url, opts) {
    const r = await fetch(url, { ...auth, ...(opts || {}) }), txt = await r.text();
    let j = null; try { j = JSON.parse(txt); } catch (e) { /* not JSON */ }
    if (!r.ok) throw new Error((j && (j.error || j.detail)) || `HTTP ${r.status}`);
    if (j === null && txt.trim() !== "null") throw new Error("the server is waking up; try again in a minute");
    return j;
  }

  // the bar under each card: stop · entry · max dip · max up · now, on one scale
  function rail(entry, now, peak, trough, stop) {
    const pts = [entry, now, peak, trough, stop].filter(v => v != null && isFinite(v));
    const lo = Math.min(...pts), hi = Math.max(...pts), span = hi - lo || 1;
    const x = v => (100 * (v - lo) / span).toFixed(1) + "%";
    const m = (v, cls, lbl) => v == null ? "" : `<i class="${cls}" style="left:${x(v)}"></i>${lbl ? `<span style="left:${x(v)}">${lbl}</span>` : ""}`;
    return `<div class="rail" aria-hidden="true"><div class="ln"></div>${m(stop, "s", "stop")}${m(trough, "s", "")}${m(peak, "p", "")}${m(entry, "e", "entry")}${m(now, "n", "now")}</div>`;
  }

  // ---- tabs
  const TABS = ["paper", "arma", "armb"];
  let tab = (location.hash.slice(1) || "").toLowerCase();
  if (!TABS.includes(tab)) tab = SERVER.orders ? "paper" : "arma";
  function setTab(t) {
    tab = t; try { history.replaceState(null, "", "#" + t); } catch (e) { /* file:// */ }
    $$(".tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === t));
    render();
  }
  $(".tabs").addEventListener("click", e => { const b = e.target.closest("[data-tab]"); if (b) setTab(b.dataset.tab); });
  addEventListener("hashchange", () => { const t = location.hash.slice(1).toLowerCase(); if (TABS.includes(t) && t !== tab) setTab(t); });

  // ---- paper account (live server)
  let P = { summary: null, positions: [], trades: [], err: "", loaded: false };
  async function loadPaper() {
    if (!SERVER.orders) return;
    try {
      const [s, p, t, rf, ords, ru] = await Promise.all([getJson("/api/paper/summary"), getJson("/api/paper/positions"), getJson("/api/paper/trades"),
        getJson("/api/paper/refusals"), getJson("/api/orders"), getJson("/api/paper/rules").catch(() => null)]);
      const since = (ru && ru.started) || "";
      P = { summary: s, positions: p || [], trades: (t && t.trades) || [], stats: t && t.stats, refusals: rf || { count: 0, refusals: [] },
            orders: (ords || []).filter(o => !since || (o.placed_at || o.filled_at || "") >= since), rules: ru, err: "", loaded: true };
    } catch (e) { P.err = e.message; P.loaded = true; }
    const open = P.summary && P.summary.market_open;
    $("#dot").className = "dot" + (open ? " on" : ""); $("#mkt").textContent = open ? "Market open" : "Market closed";
  }
  const armTags = arms => (arms || []).map(a => `<span class="arm ${a.toLowerCase()}">Arm ${a}</span>`).join(" ");
  const MODE = { open: "bought at the open (09:15)", close: "bought at the close (15:20, day's average price)" };
  function tMinus1(exp) { const d = new Date(exp + "T00:00:00"); do { d.setDate(d.getDate() - 1); } while (d.getDay() === 0 || d.getDay() === 6); return d.toLocaleDateString("en-CA"); }
  function positionCard(p) {
    const e = p.entry.price, m = p.mark || {}, now = m.ltp ?? m.price, bid = m.bid ?? m.price;
    const ltpPnl = now != null ? (now - e) * p.qty * (p.side === "BUY" ? 1 : -1) : null;
    const spread = now && bid != null ? (1 - bid / now) * 100 : null;
    const pk = p.peak && p.peak.price, tr = p.trough && p.trough.price;
    const up = chg(pk, e), dn = chg(tr, e);
    const lots = `${p.lots} lot${p.lots === 1 ? "" : "s"} × ${p.lot_size}`;
    const r = p.rule;
    const exitLine = r
      ? `<span>Stop <b class="mono">${rs(e / 2)}</b> (50% at a close)</span><span>No new closing high: <b>${r.stall || 0} of 5</b></span><span>Exit by <b>${day(tMinus1(p.expiry))}</b> (T-1)</span>`
      : `<span>Stop <b class="mono">${rs(p.stop)}</b></span><span>Auto-exit <b>${day(p.t2_date)}</b> (T-2)</span>`;
    return `<article class="pc">
      <div class="hd"><div class="nm">${optName(p.symbol, p.strike, p.instrument)}</div>${r ? armTags(r.arms) : ""}<span class="tag ${p.instrument === "PE" ? "pe" : "ce"}">${p.side === "BUY" ? "Bought" : "Sold"} ${p.instrument}</span></div>
      <div class="sub">Expiry ${day(p.expiry)} · ${lots} · bought ${when(p.opened_at)}${r ? ` · <span class="mode">${MODE[r.entry_mode] || ""}</span>` : ""}</div>
      <div class="px"><div class="entry"><small>Entry price</small><b>${rs(e)}</b></div><div class="arr">→</div>
        <div class="now"><small>Now${m.at ? " · " + when(m.at) : ""}</small><b>${rs(now)}</b><em class="${dir(chg(now, e))}">${pct(chg(now, e))}</em></div></div>
      <div class="val"><div><small>Buy value</small><b>${rs(e * p.qty)}</b><em>${rs(e)} × ${num(p.qty, 0)} qty</em></div>
        <div class="r"><small>Value at last price</small><b class="${dir(chg(now, e))}">${now != null ? rs(now * p.qty) : "—"}</b><em>${now != null ? rs(now) + " × " + num(p.qty, 0) + " qty" : ""}</em></div></div>
      <div class="ex"><div><small>Max up</small><b class="${dir(up)}">${pk != null ? pct(up) : "—"}</b><em>${pk != null ? rs(pk) + " · " + when(p.peak.at) : "from the next market poll"}</em></div>
        <div><small>Max dip</small><b class="${dir(dn)}">${tr != null ? pct(dn) : "—"}</b><em>${tr != null ? rs(tr) + " · " + when(p.trough.at) : "from the next market poll"}</em></div></div>
      ${rail(e, now, pk, tr, r ? e / 2 : p.stop)}
      <div class="pl2">
        <div><small>P&amp;L at last price</small><b class="${dir(ltpPnl)}">${srs(ltpPnl, 2)}</b><em>(${rs(now)} − ${rs(e)}) × ${num(p.qty, 0)}, before charges</em></div>
        <div class="r"><small>If sold now (MTM)</small><b class="${dir(p.unrealised)}">${srs(p.unrealised, 2)}</b><em>at the best bid ${rs(bid)} · MTM, net of charges</em></div></div>
      ${spread != null && spread > 3 ? `<p class="gap">Thin option: the best bid ${rs(bid)} is ${spread.toFixed(1)}% below the last traded price ${rs(now)}, so selling now would get less than the last price shows.</p>` : ""}
      <div class="ft">${exitLine}${p.stop_triggered_at ? `<span class="down">stop hit · exits next poll</span>` : ""}
        <button class="btn sell" type="button" data-close="${esc(p.id)}">Close</button></div>
      <p class="err" data-cerr="${esc(p.id)}" hidden></p>
    </article>`;
  }
  const REASON = { stop: "Stop", forced_t2: "T-2 auto-exit", manual: "Closed by you", expired_no_quote: "Expired", exit: "Closed by you",
                   rule_stop: "Rule: 50% stop", rule_decay: "Rule: 5 days no new high", rule_t1: "Rule: T-1" };
  function closedTable(rows) {
    return `<div class="tw"><table><thead><tr>${["Option", "Bought", "Sold", "Entry", "Buy value", "Exit", "Net ₹", "Net %"].map(h => `<th rowspan="2">${h}</th>`).join("")}
      <th class="g" colspan="2">While held</th><th class="g" colspan="3">After we sold (to T-2)</th><th rowspan="2">Why sold</th></tr>
      <tr><th class="g">Max up</th><th>Max dip</th><th class="g">Max up</th><th>Max dip</th><th>Last</th></tr></thead><tbody>${rows.map(c => {
        const e = c.entry.price, a = c.after || {}, hp = c.held_peak, ht = c.held_trough;
        const ap = a.peak && a.peak.price, at = a.trough && a.trough.price, al = a.last && a.last.price;
        const following = a.until && new Date().toLocaleDateString("en-CA", { timeZone: "Asia/Kolkata" }) <= a.until;
        return `<tr><td><b>${esc(c.symbol)}</b> <small>${num(c.strike, 0)} ${c.instrument} · ${day(c.expiry)}</small> ${c.rule ? armTags(c.rule.arms) + ` <small>${c.rule.entry_mode === "open" ? "open" : "close"}</small>` : ""}</td><td>${when(c.opened_at)}</td><td>${when(c.closed_at)}</td>
          <td class="entry">${rs(e)}</td><td>${rs(e * c.qty, 0)}</td><td>${rs(c.exit.price)}</td><td class="${dir(c.net_pnl)}">${srs(c.net_pnl, 2)}</td><td class="${dir(c.return_pct)}">${pct(c.return_pct)}</td>
          <td class="gl ${dir(chg(hp && hp.price, e))}">${hp ? pct(chg(hp.price, e)) + ` <small>${rs(hp.price)}</small>` : "—"}</td><td class="${dir(chg(ht && ht.price, e))}">${ht ? pct(chg(ht.price, e)) + ` <small>${rs(ht.price)}</small>` : "—"}</td>
          <td class="gl ${dir(chg(ap, e))}">${ap != null ? pct(chg(ap, e)) + ` <small>${when(a.peak.at)}</small>` : (following ? "following…" : "—")}</td>
          <td class="${dir(chg(at, e))}">${at != null ? pct(chg(at, e)) + ` <small>${when(a.trough.at)}</small>` : "—"}</td>
          <td>${al != null ? rs(al) : "—"}${following ? ` <small>until ${day(a.until)}</small>` : ""}</td>
          <td>${esc(REASON[c.reason] || c.reason || "")}</td></tr>`; }).join("")}</tbody></table></div>`;
  }
  function paperHtml() {
    if (!SERVER.orders) return `<h1>Paper account</h1><p class="empty">The paper account lives on the live server: open <a href="https://fo-scanner.onrender.com/">fo-scanner.onrender.com</a>. This copy shows the forward test (Arm A / Arm B).</p>`;
    if (!P.loaded) return `<h1>Paper account</h1><p class="empty">Loading…</p>`;
    if (P.err && !P.summary) return `<h1>Paper account</h1><p class="empty">Could not load the paper account: ${esc(P.err)}</p>`;
    const s = P.summary || {};
    let h = `<h1>Paper account</h1><p class="lead">Live paper trades, marked at every live poll (${SERVER.poll_seconds}s) while the market is open${s.as_of ? " · updated " + when(s.as_of) : ""}. Max up / max dip are the highest and lowest traded price since the entry.</p>
      <div class="tiles">${tile("Equity", rs(s.equity, 0))}${tile("Today", srs(s.day_pnl), dir(s.day_pnl))}${tile("This week", srs(s.week_pnl), dir(s.week_pnl))}
      ${tile("Open P&amp;L", srs(s.unrealised_total), dir(s.unrealised_total))}${tile("Booked P&amp;L", srs(s.realised_total), dir(s.realised_total))}
      ${tile("Drawdown", (s.drawdown_pct ?? 0).toFixed(2) + "%")}${tile("Open positions", s.open_positions ?? 0)}
      ${s.kill_switch ? tile("Kill switch", s.kill_switch.active ? "ON" : "off", s.kill_switch.active ? "down" : "") : ""}</div>
      ${s.kill_switch && s.kill_switch.active ? `<p class="err">${esc(s.kill_switch.reason)}</p>` : ""}
      ${s.drawdown_review ? `<p class="err">${esc(s.drawdown_review_message)}</p>` : ""}
      ${s.queued_orders ? `<p class="lead">${s.queued_orders} order(s) queued for the next session's 09:20 poll.</p>` : ""}`;
    h += scoreboards();
    const rr = ((P.rules || {}).rules || {}).refused || [];
    const todayIso = new Date().toLocaleDateString("en-CA", { timeZone: "Asia/Kolkata" });
    const rToday = rr.filter(x => x.date === todayIso);
    if (rToday.length) h += `<p class="lead">Rule signals not bought today: ${rToday.map(x => `<b>${esc(x.symbol)}</b> ${armTags(x.arms)} (${x.mode}: ${esc(x.reason)})`).join(" · ")}</p>`;
    h += `<h2>Open positions <small>${P.positions.length ? "entry price first; the bar shows stop · entry · max dip · max up · now" : ""}</small></h2>`;
    h += P.positions.length ? `<div class="cards">${P.positions.map(positionCard).join("")}</div>` : `<p class="empty">No open positions. The rule trades of the next session are bought at 09:15 and at 15:20 automatically.</p>`;
    h += `<h2>Closed trades <small>net of fills and charges · after the sale the option is followed until its T-2 day</small></h2>`;
    h += P.trades.length ? closedTable(P.trades) : `<p class="empty">None yet.</p>`;
    const rf = P.refusals || { count: 0, refusals: [] };
    h += `<h2>Refusals: ${rf.count} <small>orders the paper engine would not fill</small></h2>` + (rf.count
      ? `<details><summary>Show the reasons</summary><div class="tw"><table><thead><tr><th>Contract</th><th>When</th><th style="text-align:left">Reasons</th></tr></thead><tbody>${rf.refusals.map(x =>
          `<tr><td><b>${esc(x.contract || x.symbol)}</b> <small>${esc(x.side || "")} ${x.qty ?? ""}</small></td><td>${when(x.time)}</td><td style="text-align:left;white-space:normal">${(x.reasons || []).map(esc).join("; ")}</td></tr>`).join("")}</tbody></table></div></details>`
      : `<p class="empty">None: every order so far found enough liquidity.</p>`);
    const ords = (P.orders || []).slice(0, 40);
    if (ords.length) h += `<details><summary>Order log (${ords.length})</summary><div class="tw"><table><thead><tr><th>Contract</th><th>Side</th><th>Qty</th><th>Status</th><th>Fill</th><th>Time</th></tr></thead><tbody>${ords.map(x =>
      `<tr><td><b>${esc(x.tradingsymbol)}</b>${x.auto ? ` <small>auto ${esc(x.auto)}</small>` : ""}</td><td>${esc(x.side)}</td><td>${x.quantity ?? ""}</td><td>${esc(x.status)}</td><td>${x.fill_price != null ? rs(x.fill_price) : "—"}</td><td>${when(x.filled_at || x.placed_at)}</td></tr>`).join("")}</tbody></table></div></details>`;
    const arch = ((P.rules || {}).archive || []);
    if (arch.length) h += `<p class="note">Earlier test account archived (${arch.map(a => `${esc(a.epoch)}: ${a.open} open, ${a.closed} closed trades, archived ${when(a.archived_at)}`).join("; ")}). This account started ${when((P.rules || {}).started)} with the rule trades only.</p>`;
    if (P.err) h += `<p class="err">Refresh failed: ${esc(P.err)} (showing the last numbers).</p>`;
    return h;
  }
  // One scoreboard per arm: closed trades (net of charges) and open positions, by entry time.
  function scoreboards() {
    const rows = (arm, mode) => {
      const cl = P.trades.filter(c => c.rule && c.rule.arms.includes(arm) && (!mode || c.rule.entry_mode === mode));
      const op = P.positions.filter(x => x.rule && x.rule.arms.includes(arm) && (!mode || x.rule.entry_mode === mode));
      const wins = cl.filter(c => c.net_pnl > 0).length, net = cl.reduce((a, c) => a + c.net_pnl, 0);
      const avg = cl.length ? cl.reduce((a, c) => a + (c.return_pct || 0), 0) / cl.length : null;
      const mtm = op.reduce((a, x) => a + (x.unrealised || 0), 0);
      return `<tr><td>${mode === "open" ? "Open entry (09:15)" : mode === "close" ? "Close entry (15:20)" : "<b>Both</b>"}</td><td>${cl.length}</td><td>${cl.length ? Math.round(100 * wins / cl.length) + "%" : "—"}</td>
        <td class="${dir(avg)}">${avg == null ? "—" : pct(avg)}</td><td class="${dir(net)}">${cl.length ? srs(net) : "—"}</td><td>${op.length}</td><td class="${dir(mtm)}">${op.length ? srs(mtm) : "—"}</td></tr>`;
    };
    const board = (arm, title) => `<div><h3>${armTags([arm])} ${title}</h3><div class="tw"><table><thead><tr><th>Entry</th><th>Closed</th><th>Win rate</th><th>Average net</th><th>Booked net</th><th>Open</th><th>Open MTM</th></tr></thead>
      <tbody>${rows(arm, "open")}${rows(arm, "close")}${rows(arm, null)}</tbody></table></div></div>`;
    return `<h2>Scoreboard <small>rule trades only, 1 lot each, net of charges · a signal in both arms counts in both</small></h2>
      <div class="sb">${board("A", "every results beat")}${board("B", "results beat in a strong sector")}</div>`;
  }
  async function closePos(id, btn) {
    const p = P.positions.find(x => x.id === id); if (!p) return;
    const err = $(`[data-cerr="${CSS.escape(id)}"]`);
    const bid = (p.mark || {}).bid ?? (p.mark || {}).price;
    if (!confirm(`Sell ${p.symbol} ${p.strike} ${p.instrument} (${p.lots} lot) now at the best bid (last seen ${rs(bid)})?\nEntry was ${rs(p.entry.price)}. Paper trade.`)) return;
    btn.disabled = true; btn.textContent = "Selling…"; err.hidden = true;
    try {
      await getJson("/api/paper/close/" + encodeURIComponent(id), { method: "POST" });
      await loadPaper(); render();
    } catch (e) { err.textContent = "Not closed: " + e.message; err.hidden = false; btn.disabled = false; btn.textContent = "Close"; }
  }

  // ---- forward test (scanner/forward_s1.py, nightly)
  const ARM = { a: ["A", "Arm A · every results beat"], b: ["B", "Arm B · results beat in a strong sector"] };
  const EXIT = { "0_stop": "Stop 50%", "1_decay": "5 days no new high", "2_t_minus_1": "T-1 (day before expiry)" };
  function armHtml(k) {
    const [A, title] = ARM[k];
    let h = `<h1>${title}</h1>`;
    if (!FW || !FW.arms) return h + `<p class="empty">The forward test fills in each night from NSE's closing files: signals show here the morning after, and are bought on the next session.</p>`;
    const st = FW.arms[A], days = (FW.sessions || []).filter(x => x.session > FW.first_session).length;
    const closed = st.closed.filter(t => !t.excluded), wins = closed.filter(t => t.net > 0).length;
    const avg = closed.length ? closed.reduce((s, t) => s + t.net_pct, 0) / closed.length : null;
    const tot = closed.reduce((s, t) => s + t.net, 0);
    h += `<p class="lead">Forward paper test, day ${days} · last NSE session ${day(FW.last_session)} · bought at the session's average price, marked at each close · exits: 50% stop, 5 sessions without a new closing high, T-1. These rules failed the 2021–24 backtest; this tests them on new days.</p>
      <div class="tiles">${tile("Buy next session", st.pending.length)}${tile("Open", st.open.length)}${tile("Closed", closed.length)}
      ${tile("Win rate", closed.length ? Math.round(100 * wins / closed.length) + "%" : "—")}${tile("Average net", avg == null ? "—" : pct(avg), dir(avg))}${tile("Booked net", closed.length ? srs(tot) : "—", dir(tot))}</div>`;
    h += `<h2>Buy next session <small>results beats from the last session</small></h2>`;
    h += st.pending.length ? `<div class="tw"><table><thead><tr><th>Stock</th><th>Results day</th><th>Beat vs sector</th><th>Day move</th><th>Expiry</th><th>Stock price</th></tr></thead><tbody>${st.pending.map(p =>
      `<tr><td><b>${esc(p.symbol)}</b></td><td>${day(p.signal_date)}</td><td class="up">${pct(p.beat)}</td><td class="${dir(p.move)}">${pct(p.move)}</td><td>${day(p.expiry)}</td><td>${rs(p.spot)}</td></tr>`).join("")}</tbody></table></div>` : `<p class="empty">None from the last session.</p>`;
    h += `<h2>Open</h2>`;
    h += st.open.length ? `<div class="cards">${st.open.map(t => { const x = t.stats || {}, e = t.entry_price;
      const pkp = x.h_peak_date ? e * (1 + x.h_peak / 100) : null, dpp = x.h_dip_date ? e * (1 + x.h_dip / 100) : null;
      return `<article class="pc"><div class="hd"><div class="nm">${optName(t.symbol, t.strike, "CE")}</div><span class="tag ce">Bought CE</span></div>
        <div class="sub">Expiry ${day(t.expiry)} · 1 lot × ${t.lot} · bought ${day(t.entry_date)} · results ${day(t.signal_date)} (beat ${pct(t.beat)})</div>
        <div class="px"><div class="entry"><small>Entry price</small><b>${rs(e)}</b></div><div class="arr">→</div>
          <div class="now"><small>Last close · ${day(x.last_date)}</small><b>${rs(x.last_close)}</b><em class="${dir(x.mark_pct)}">${pct(x.mark_pct)}</em></div></div>
        <div class="val"><div><small>Buy value</small><b>${rs(e * t.lot)}</b><em>${rs(e)} × ${num(t.lot, 0)} qty</em></div>
          <div class="r"><small>Value at last close</small><b class="${dir(x.mark_pct)}">${x.last_close != null ? rs(x.last_close * t.lot) : "—"}</b><em>${x.last_close != null ? rs(x.last_close) + " × " + num(t.lot, 0) + " qty" : ""}</em></div></div>
        <div class="ex"><div><small>Max up</small><b class="${dir(x.h_peak)}">${pct(x.h_peak)}</b><em>${pkp ? rs(pkp) + " · " + day(x.h_peak_date) : "not above entry yet"}</em></div>
          <div><small>Max dip</small><b class="${dir(x.h_dip)}">${pct(x.h_dip)}</b><em>${dpp ? rs(dpp) + " · " + day(x.h_dip_date) : "not below entry yet"}</em></div></div>
        ${rail(e, x.last_close, pkp, dpp, e / 2)}
        <div class="ft"><span>Stop <b class="mono">${rs(e / 2)}</b></span><span>Day ${(t.path || []).length}</span></div></article>`; }).join("")}</div>` : `<p class="empty">No open trades.</p>`;
    h += `<h2>Closed <small>after the exit the option is followed until T-1</small></h2>`;
    const cl = st.closed.slice().reverse();
    h += cl.length ? `<div class="tw"><table><thead><tr>${["Option", "Bought", "Sold", "Entry", "Buy value", "Exit", "Net ₹", "Net %"].map(x => `<th rowspan="2">${x}</th>`).join("")}
      <th class="g" colspan="2">While held</th><th class="g" colspan="2">After we sold (to T-1)</th><th rowspan="2">Why sold</th></tr>
      <tr><th class="g">Max up</th><th>Max dip</th><th class="g">Max up</th><th>Max dip</th></tr></thead><tbody>${cl.map(t => { const x = t.stats || {};
        const why = t.excluded ? (t.excluded === "price_adjusted" ? "Excluded: corporate action" : "Excluded: contract missing") : (EXIT[t.exit_reason] || t.exit_reason || "");
        return `<tr><td><b>${esc(t.symbol)}</b> <small>${num(t.strike, 0)} CE · ${day(t.expiry)}</small></td><td>${day(t.entry_date)}</td><td>${day(t.exit_date)}</td>
          <td class="entry">${rs(t.entry_price)}</td><td>${rs(t.cost, 0)}</td><td>${rs(t.exit_price)}</td><td class="${dir(t.net)}">${srs(t.net)}</td><td class="${dir(t.net_pct)}">${pct(t.net_pct)}</td>
          <td class="gl ${dir(x.h_peak)}">${pct(x.h_peak)} <small>${day(x.h_peak_date)}</small></td><td class="${dir(x.h_dip)}">${pct(x.h_dip)} <small>${day(x.h_dip_date)}</small></td>
          <td class="gl ${dir(x.a_peak)}">${x.a_peak == null ? (t.tracking ? "following…" : "—") : pct(x.a_peak) + ` <small>${day(x.a_peak_date)}</small>`}</td>
          <td class="${dir(x.a_dip)}">${x.a_dip == null ? "—" : pct(x.a_dip) + ` <small>${day(x.a_dip_date)}</small>`}</td><td>${esc(why)}</td></tr>`; }).join("")}</tbody></table></div>` : `<p class="empty">No closed trades yet.</p>`;
    const rf = st.refused.slice().reverse();
    if (rf.length) h += `<details><summary>Signals not taken (${rf.length})</summary><div class="tw"><table><thead><tr><th>Stock</th><th>Results day</th><th>Beat</th><th style="text-align:left">Why not</th></tr></thead><tbody>${rf.map(r =>
      `<tr><td><b>${esc(r.symbol)}</b></td><td>${day(r.signal_date)}</td><td>${pct(r.beat)}</td><td style="text-align:left">${esc(r.reason)}</td></tr>`).join("")}</tbody></table></div></details>`;
    h += `<p class="note">Max up = how far above the entry price the option closed at its highest (0% = never above); max dip = how far below. Daily closing prices from NSE. Net is after charges and slippage.</p>`;
    return h;
  }

  function render() {
    $("#main").innerHTML = tab === "paper" ? paperHtml() : armHtml(tab.slice(3));
    $$("[data-close]").forEach(b => b.addEventListener("click", () => closePos(b.dataset.close, b)));
  }

  // ---- refresh: paper every poll while the market is open, the forward test every 10 min
  async function refresh() {
    await loadPaper();
    if (tab === "paper") render();
    const open = P.summary && P.summary.market_open;
    setTimeout(refresh, (open ? SERVER.poll_seconds || 30 : 300) * 1000);
  }
  async function refreshForward() {
    if (SERVER.orders) { try { FW = await getJson("/api/forward"); if (tab !== "paper") render(); } catch (e) { /* keep the embedded copy */ } }
    setTimeout(refreshForward, 600000);
  }
  setTab(tab);
  refresh();
  setTimeout(refreshForward, 600000);
})();
</script>
</body>
</html>
