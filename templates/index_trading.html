<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>F&amp;O Index options</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/tokens.css">
<style>
:root { --disc:44px; }
*, *::before, *::after { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:13px/1.45 Inter,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  font-variant-numeric:tabular-nums; -webkit-text-size-adjust:100%; padding-bottom:calc(var(--disc) + 16px); }
button { font:inherit; color:inherit; cursor:pointer; }
a { color:var(--accent); }
.up { color:var(--bull); } .down { color:var(--bear); } .flat { color:var(--muted); }
small, .muted { color:var(--muted); }
.top { position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:8px 16px; background:var(--panel); border-bottom:1px solid var(--line); }
.brand { font-weight:700; font-size:15px; white-space:nowrap; }
.brand i { font-style:normal; color:var(--bear); }
.clock { font-family:"JetBrains Mono",monospace; font-size:12px; }
.sp { margin-left:auto; }
.tlink { height:34px; padding:0 12px; border-radius:8px; border:1px solid var(--line-strong); background:var(--surface); display:inline-flex; align-items:center; text-decoration:none; color:var(--ink); white-space:nowrap; }
.tbtn { height:34px; width:34px; border-radius:8px; border:1px solid var(--line-strong); background:var(--surface); }
main { max-width:1240px; margin:0 auto; padding:16px; }
h1 { font-size:19px; margin:2px 0 4px; }
.lead { color:var(--muted); margin:0 0 14px; font-size:12.5px; }
h2 { font-size:14px; margin:24px 0 8px; display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
h2 small { font-weight:400; font-size:12px; }
.banner { border:1px solid var(--unc); background:var(--unc-soft); border-radius:10px; padding:9px 12px; font-size:12.5px; margin:8px 0 4px; }
.banner b { color:var(--unc); }
.rule { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 14px; display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px; }
.rule div small { display:block; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; }
.rule div b { font:600 15px "JetBrains Mono",monospace; }
.tw { overflow-x:auto; background:var(--surface); border:1px solid var(--line); border-radius:12px; }
table { width:100%; border-collapse:collapse; font:12.5px "JetBrains Mono",monospace; white-space:nowrap; }
th { font:600 10.5px Inter,sans-serif; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); text-align:right; padding:8px 10px; border-bottom:1px solid var(--line); }
td { padding:8px 10px; border-bottom:1px solid var(--line); text-align:right; }
th:first-child, td:first-child { text-align:left; font-family:Inter,sans-serif; }
tr:last-child td { border-bottom:0; }
tr.hl td { background:var(--bull-soft); }
td small { font-size:10.5px; }
.empty { color:var(--muted); background:var(--surface); border:1px dashed var(--line-strong); border-radius:12px; padding:14px 16px; }
.pill { font:700 10.5px Inter,sans-serif; border-radius:6px; padding:2px 7px; }
.pill.pass { background:var(--bull-soft); color:var(--bull); } .pill.fail { background:var(--bear-soft); color:var(--bear); }
.hist { display:flex; flex-wrap:wrap; gap:6px; }
.hist span { background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:4px 8px; font-size:12px; }
.note { font-size:12px; color:var(--muted); margin-top:16px; }
.disclaimer { position:fixed; left:0; right:0; bottom:0; min-height:var(--disc); background:var(--panel); border-top:1px solid var(--bear); padding:6px 16px; font-size:11.5px; z-index:6; display:flex; align-items:center; }
.disclaimer b { color:var(--bear); }
@media (max-width:760px) { main { padding:12px 10px; } :root { --disc:64px; } .top { padding:8px 10px; } }
.kv { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
.kv div small { display:block; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
.kv div b { font:600 15px "JetBrains Mono",monospace; }
.exp { display:flex; flex-wrap:wrap; gap:8px; }
.exp span { background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:6px 10px; font-size:12.5px; }
code { font-family:"JetBrains Mono",monospace; font-size:12px; }
.sb { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
.sb .big { font:700 30px "JetBrains Mono",monospace; }
.sb .bar { display:flex; gap:3px; margin:8px 0 10px; }
.sb .bar i { flex:1; height:8px; border-radius:2px; background:var(--line-strong); }
.sb .bar i.on { background:var(--bull); }
.sb .stat { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:8px; margin-bottom:10px; }
.sb .stat div small { display:block; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; }
.sb .stat div b { font:600 15px "JetBrains Mono",monospace; }
.sb .pts { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:6px; }
.sb .pt { border:1px solid var(--line); border-radius:8px; padding:6px 9px; font-size:12px; }
.sb .pt.on { border-color:var(--bull); background:var(--bull-soft); }
.sb .pt.off { color:var(--muted); }
.sb .pt b { display:block; font-size:12.5px; }
.chip { display:inline-block; background:var(--bull-soft); color:var(--bull); border-radius:6px; padding:1px 6px; margin:1px 2px 1px 0; font:600 10.5px Inter,sans-serif; }
.pill.band { background:var(--surface); border:1px solid var(--line-strong); color:var(--ink); }
</style>
</head>
<body>
<header class="top">
  <div class="brand">F&amp;O <i style="color:var(--arm-f)">Index options</i></div>
  <span class="clock" id="clock"></span>
  <span class="sp"></span>
  <a class="tlink" href="/" id="homeLink">← Results</a>
  <a class="tlink" href="/s2" id="s2Link">S2 →</a>
  <button class="tbtn" type="button" id="theme" title="Light / dark" aria-label="Switch light or dark theme">◐</button>
</header>
<main id="main"></main>
<footer class="disclaimer" role="note"><div><b>Read before using.</b> Data collection and research. The G1, XP and Near Tighty pods are <b>paper only</b> (no real order is ever sent), and nothing on this page can place an order. F&amp;O trading carries high risk including potential loss beyond capital invested.</div></footer>
<script>
(() => {
  "use strict";
  const SERVER = Object.assign({ orders: false }, /*__SERVER__*/{});
  const $ = s => document.querySelector(s);
  const ls = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
               set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* private mode */ } } };
  const setTheme = t => { document.documentElement.dataset.theme = t; ls.set("fos_theme", t); };
  setTheme(ls.get("fos_theme", "dark"));
  $("#theme").addEventListener("click", () => setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark"));
  const tick = () => { $("#clock").textContent = new Date().toLocaleTimeString("en-GB", { timeZone: "Asia/Kolkata" }) + " IST"; };
  tick(); setInterval(tick, 1000);
  const esc = t => String(t ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const num = (v, dp = 0) => v == null ? "—" : Number(v).toLocaleString("en-IN", { minimumFractionDigits: dp, maximumFractionDigits: dp });
  const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const day = d => !d ? "—" : /^\d{8}$/.test(d) ? `${+d.slice(6, 8)} ${MON[+d.slice(4, 6) - 1]} ${d.slice(0, 4)}`
    : /^\d{4}-\d{2}$/.test(d) ? `${MON[+d.slice(5, 7) - 1]} ${d.slice(0, 4)}`
    : /^\d{4}$/.test(d) ? d : `${+d.slice(8, 10)} ${MON[+d.slice(5, 7) - 1]} ${d.slice(0, 4)}`;
  const get = u => fetch(u, { credentials: "same-origin" }).then(r => r.ok ? r.json() : null).catch(() => null);
  let D = { loaded: false };
  const pc = (v, dp = 1) => v == null ? "—" : `${num(v, dp)} %`;
  const sg = v => v == null ? "—" : `<span class="${v < 0 ? "down" : "up"}">${v > 0 ? "+" : ""}${num(v, 1)} %</span>`;
  const hm = s => s ? `${day(s.slice(0, 10))} ${s.slice(11, 19)}` : "—";

  const INPUT_FMT = { depth: v => num(v, 3) + " %", time: v => num(v, 0) + " min", width: v => num(v, 2) + " %", gap: v => (v > 0 ? "+" : "") + num(v, 2) + " %",
    vix: v => num(v, 2), prev5: v => (v > 0 ? "+" : "") + num(v, 2) + " %", ema20: v => (v > 0 ? "+" : "") + num(v, 2) + " %" };
  const chips = (r, meta) => r && r.score != null ? (r.score_items || []).map(k => `<span class="chip">${esc(((meta || []).find(m => m.key === k) || {}).short || k)}</span>`).join("") || `<small>none</small>` : "—";
  function scoreBoard(r, meta, title) {
    if (!r || r.score == null) return "";
    const on = new Set(r.score_items || []), miss = new Set(r.score_missing || []), inp = r.score_inputs || {};
    const strong = (meta || []).filter(m => on.has(m.key)).map(m => m.label);
    return `<h2>Score board <small>${esc(title)} · record only, it changes no rule</small></h2><div class="sb">
      <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap"><span class="big">${num(r.score)}/7</span><span>${pc(r.score_pct, 0)}</span><span class="pill band">${esc(r.score_band)}</span></div>
      <div class="bar">${[0, 1, 2, 3, 4, 5, 6].map(i => `<i class="${i < r.score ? "on" : ""}"></i>`).join("")}</div>
      <div class="stat"><div><small>Percentile vs history</small><b>${r.score_pctile == null ? "—" : num(r.score_pctile, 0)}</b></div><div><small>Running average</small><b>${pc(r.score_avg_pct, 0)}</b></div><div><small>Strong points</small><b>${num(on.size)} of 7</b></div></div>
      <p style="margin:0 0 8px;font-size:12.5px"><b>Strong:</b> ${strong.length ? esc(strong.join(" · ")) : "none"}</p>
      <div class="pts">${(meta || []).map(m => { const v = inp[m.key]; const s = on.has(m.key);
        return `<div class="pt ${s ? "on" : "off"}"><b>${s ? "✓" : "✗"} ${esc(m.label)}</b>${esc(m.rule)}<br><small>now: ${miss.has(m.key) || v == null ? "no data" : esc((INPUT_FMT[m.key] || String)(v))}</small></div>`; }).join("")}</div></div>`;
  }
  function bandTable(tracks) {
    const rows = (tracks || []).filter(t => (t.bands || []).some(b => b.n));
    if (!rows.length) return `<p class="note">Score by band: shown here once closed trades carry a score. Judged at 30 trades, max up first.</p>`;
    return `<h2>Max up by score band <small>closed trades · max up first, then booked · judged at 30 trades · record only</small></h2><div class="tw"><table><thead><tr><th>Track · band</th><th>Trades</th><th>Max up ≥ +100 %</th><th>Max up avg</th><th>Max up median</th><th>Booked avg</th></tr></thead><tbody>${rows.map(t => t.bands.map(b =>
      `<tr><td>${esc(t.pod.split(" ")[0])} · ${esc(b.band)}</td><td>${num(b.n)}</td><td>${b.up100 == null ? "—" : pc(b.up100 * 100, 0)}</td><td>${sg(b.mean)}</td><td>${sg(b.median)}</td><td>${sg(b.booked)}</td></tr>`).join("")).join("")}</tbody></table></div>`;
  }

  function g1Section() {
    const g = D.g1;
    let h = `<h2>G1-F (main) · NIFTY downside ORB put, held overnight <small>G1 = same trade without the skip filters · paper · rules: ${esc((g || {}).page || "strategies/S3_G1_put_overnight.md")}</small></h2>`;
    if (!D.loaded) return h + `<p class="empty">Loading…</p>`;
    if (!g || g.error) return h + `<p class="empty">${esc((g || {}).error || "Not reporting.")}</p>`;
    h += `<p class="note">Opening range 09:15-09:29 · first close outside it from 09:30 to 13:00 · only a close below the low trades · ATM put of the nearest weekly, 1 lot (${num(g.lot)}), bought at the ask the minute after · sold at the bid at 50 % of the price paid, else at the next session's close (15:29). <b>G1-F</b> counts the same trade only when the day-1 gap is under +0.3 %, the range is not 0.5-0.8 % wide and VIX is under 17.</p>`;
    const td = g.today;
    h += `<div class="kv"><div><small>Today</small><b>${esc(td ? td.status : "no session yet")}</b></div>${td && td.hi ? `<div><small>Opening range</small><b>${num(td.lo, 2)} – ${num(td.hi, 2)}</b></div>` : ""}${td && td.signal ? `<div><small>Signal</small><b>${esc(td.signal)} · gap ${td.gap_pct == null ? "—" : num(td.gap_pct, 2) + " %"} · width ${num(td.width_pct, 2)} % · VIX ${td.vix == null ? "—" : num(td.vix, 2)}</b></div>` : ""}</div>`;
    const o = g.open;
    const sbSrc = td && td.score != null ? td : (o && o.score != null ? o : null);
    h += scoreBoard(sbSrc, g.score_meta, sbSrc ? `signal ${sbSrc.signal || ""}${sbSrc.day ? " on " + day(sbSrc.day) : ""}` : "");
    h += `<h2>Open position</h2>` + (o ? `<div class="tw"><table><thead><tr><th>Bought</th><th>Contract</th><th>Paid (ask)</th><th>Bid now</th><th>Best bid</th><th>Unrealised</th><th>Stop at</th><th>G1-F</th></tr></thead><tbody>
      <tr><td>${hm(o.bought_at)}</td><td><b>NIFTY ${day(o.expiry)} ${num(o.strike)} PE</b> × ${num(o.qty)}</td><td>₹${num(o.paid, 2)}</td><td>₹${num(o.mark, 2)}</td><td>₹${num(o.max_bid, 2)}</td><td class="${o.unrealised_rs < 0 ? "down" : "up"}">₹${num(o.unrealised_rs)}</td><td>₹${num(o.paid * 0.5, 2)}</td><td>${o.g1f_skip ? `<small>skips: ${esc(o.g1f_skip)}</small>` : "counts"}</td></tr></tbody></table></div>`
      : `<p class="empty">None.</p>`);
    const tr = g.trades || [];
    h += `<h2>Trades <small>${tr.length} closed</small></h2>` + (tr.length ? `<div class="tw"><table><thead><tr><th>Day</th><th>Contract</th><th>Paid</th><th>Sold</th><th>Exit</th><th>Net ₹</th><th>Net %</th><th>Max up</th><th>Score</th><th>Strong points</th><th>G1-F</th></tr></thead><tbody>${tr.map(t =>
      `<tr><td>${day(t.day)} ${esc(t.signal)}</td><td>${day(t.expiry)} ${num(t.strike)} PE</td><td>₹${num(t.paid, 2)}</td><td>₹${num(t.sold, 2)}</td><td>${hm(t.sold_at)} <small>${esc(t.reason)}</small></td><td class="${t.net_rs < 0 ? "down" : "up"}">₹${num(t.net_rs)}</td><td>${sg(t.net_pct)}</td><td>${sg(t.max_up_pct)}</td><td>${t.score == null ? "—" : `<b>${num(t.score)}/7</b> <small>${esc(t.score_band)}</small>`}</td><td style="text-align:left;white-space:normal;min-width:150px">${chips(t, g.score_meta)}</td><td>${t.g1f_skip ? `<small>skips</small>` : "counts"}</td></tr>`).join("")}</tbody></table></div>`
      : `<p class="empty">No closed trade yet. The first possible entry is the first session the server runs this code.</p>`);
    h += bandTable(g.tracks);
    return h;
  }

  function xpSection() {
    const x = D.xp;
    let h = `<h2>XP · NIFTY expiry-day straddle <small>forward log · rules: ${esc((x || {}).page || "expiry_research/FORWARD_TEST.md")}</small></h2>`;
    if (!D.loaded) return h;
    if (!x || x.error) return h + `<p class="empty">${esc((x || {}).error || "Not reporting.")}</p>`;
    h += `<p class="note">NIFTY expiry days only · ATM CE + PE of today's expiry (strike from the first print at 09:15), 1 lot each (${num(x.lot)}), bought at the asks of the 09:16 minute · sold at the bids at +20 % on the pair, else at 15:15 · hold-to-15:15 logged alongside · verdict at 40 expiry days. A log only: no order is sent.</p>`;
    const td = x.today, s = x.summary || {};
    h += `<div class="kv"><div><small>Today</small><b>${esc(td ? td.status : "no session yet")}</b></div><div><small>Days logged</small><b>${num(s.days)} / ${num(s.gate_at)}</b></div><div><small>+20 % exit avg</small><b>${sg(s.primary_mean_pct)}</b></div><div><small>Hold 15:15 avg</small><b>${sg(s.hold_mean_pct)}</b></div><div><small>Max up mean / median</small><b>${sg(s.max_up_mean)} / ${sg(s.max_up_median)}</b></div><div><small>≥ +100 %</small><b>${pc(s.max_up_100_share == null ? null : s.max_up_100_share * 100, 0)}</b></div></div>`;
    const o = x.open;
    if (o) h += `<div class="tw" style="margin-top:8px"><table><thead><tr><th>Bought</th><th>Straddle</th><th>Paid</th><th>Bids now</th><th>Best</th><th>Unrealised</th><th>Target</th></tr></thead><tbody>
      <tr><td>${hm(o.bought_at)}</td><td><b>${day(o.expiry)} ${num(o.strike)}</b> × ${num(o.qty)}</td><td>₹${num(o.paid_sum, 2)}</td><td>₹${num(o.mark, 2)}</td><td>₹${num(o.max_bid, 2)}</td><td class="${o.unrealised_rs < 0 ? "down" : "up"}">₹${num(o.unrealised_rs)}</td><td>${o.target ? "hit " + hm(o.target.at) : "₹" + num(o.paid_sum * 1.2, 2)}</td></tr></tbody></table></div>`;
    const tr = (x.trades || []).filter(t => t.primary);
    h += tr.length ? `<div class="tw" style="margin-top:8px"><table><thead><tr><th>Expiry</th><th>Paid</th><th>+20 % exit</th><th>Net %</th><th>Hold 15:15</th><th>Max up</th></tr></thead><tbody>${tr.map(t =>
      `<tr><td>${day(t.day)} ${num(t.strike)}</td><td>₹${num(t.paid_sum, 2)}</td><td>${esc(t.primary.exit)} ${hm(t.primary.at)}</td><td>${sg(t.primary.net_pct)}</td><td>${sg(t.hold_1515.net_pct)}</td><td>${sg(t.max_up_pct)}</td></tr>`).join("")}</tbody></table></div>`
      : `<p class="empty">No expiry day logged yet. The first is the next NIFTY expiry.</p>`;
    return h;
  }

  // Near Tighty (strategies/NT_near_tighty.md): G1's downside ORB put only 1-3 sessions before expiry; NIFTY and SENSEX tracks
  function ntSection(g, name) {
    let h = `<h2>Near Tighty · ${name} <small>downside breakout put, 1-3 sessions to expiry · paper · rules: ${esc((g || {}).page || "strategies/NT_near_tighty.md")}</small></h2>`;
    if (!D.loaded) return h;
    if (!g || g.error) return h + `<p class="empty">${esc((g || {}).error || "Not reporting.")}</p>`;
    const nr = g.near || [1, 3], idx = esc(g.index || name);
    h += `<p class="note">Opening range 09:15-09:29 · first close outside it from 09:30 to 13:00 · only a close below the low trades · <b>only when the nearest weekly expiry is ${nr[0]}-${nr[1]} sessions away</b> · ATM put, 1 lot (${num(g.lot)}), bought at the ask the minute after · sold at the bid at 50 % of the price paid, else at the next session's 09:16. No target, no other filter. Its own 30-trade verdict, never pooled with NIFTY or SENSEX.</p>`;
    const td = g.today;
    h += `<div class="kv"><div><small>Today</small><b>${esc(td ? td.status : "no session yet")}</b></div>${td && td.hi ? `<div><small>Opening range</small><b>${num(td.lo, 2)} – ${num(td.hi, 2)}</b></div>` : ""}${td && td.signal ? `<div><small>Signal</small><b>${esc(td.signal)}</b></div>` : ""}</div>`;
    const o = g.open;
    h += `<div class="tw" style="margin-top:8px">` + (o ? `<table><thead><tr><th>Open position</th><th>Bought</th><th>Paid (ask)</th><th>Bid now</th><th>Best bid</th><th>Unrealised</th><th>Stop at</th></tr></thead><tbody>
      <tr><td><b>${idx} ${day(o.expiry)} ${num(o.strike)} PE</b> × ${num(o.qty)}</td><td>${hm(o.bought_at)}</td><td>₹${num(o.paid, 2)}</td><td>₹${num(o.mark, 2)}</td><td>₹${num(o.max_bid, 2)}</td><td class="${o.unrealised_rs < 0 ? "down" : "up"}">₹${num(o.unrealised_rs)}</td><td>₹${num(o.paid * 0.5, 2)}</td></tr></tbody></table>`
      : `<p class="empty" style="margin:0;border:0">No open position.</p>`) + `</div>`;
    const tr = g.trades || [];
    h += tr.length ? `<div class="tw" style="margin-top:8px"><table><thead><tr><th>Closed trades (${tr.length})</th><th>Contract</th><th>Paid</th><th>Sold</th><th>Exit</th><th>Net ₹</th><th>Net %</th><th>Max up</th></tr></thead><tbody>${tr.map(t =>
      `<tr><td>${day(t.day)} ${esc(t.signal)}</td><td>${day(t.expiry)} ${num(t.strike)} PE</td><td>₹${num(t.paid, 2)}</td><td>₹${num(t.sold, 2)}</td><td>${hm(t.sold_at)} <small>${esc(t.reason)}</small></td><td class="${t.net_rs < 0 ? "down" : "up"}">₹${num(t.net_rs)}</td><td>${sg(t.net_pct)}</td><td>${sg(t.max_up_pct)}</td></tr>`).join("")}</tbody></table></div>`
      : `<p class="empty" style="margin-top:8px">No closed trade yet. It trades only on days whose nearest weekly expiry is 1-3 sessions away, about 6-7 a month.</p>`;
    return h;
  }

  function render() {
    const st = (D.status || {}).status || {}, rec = st.recorder;
    let h = `<h1>Index options · data</h1>
      <p class="lead">Minute and daily data for NIFTY, SENSEX and BANKNIFTY options, index spot and India VIX, and the index pods' paper trades. Main: <b>G1-F</b>, the NIFTY downside opening-range put held overnight with three skip filters (G1 is the same trade without them, kept as the baseline). Also: <b>XP</b>, a forward log of the NIFTY expiry-day straddle, and <b>Near Tighty</b> (NIFTY and SENSEX), the same downside put traded only 1-3 sessions before expiry.</p>
      <div class="banner"><b>Paper only.</b> G1 and Near Tighty trade on the live bid / ask, each in its own paper ledger; no real order is sent, and the S1 account is separate. Large data files live on the repository's <code>index-data</code> branch.</div>`;
    h += g1Section();
    h += xpSection();
    h += ntSection(D.nt, "NIFTY");
    h += ntSection(D.nts, "SENSEX");
    if (!D.loaded) { $("#main").innerHTML = h + `<p class="empty">Loading…</p>`; return; }
    const tk = [...(((D.g1 || {}).tracks) || []), ...(((D.xp || {}).tracks) || []), ...(((D.nt || {}).tracks) || []), ...(((D.nts || {}).tracks) || [])];
    h += `<h2>Pods <small>index strategies, paper results</small></h2>
      <div class="tw"><table><thead><tr><th>Pod</th><th>Status</th><th>Trades</th><th>Max up avg</th><th>Max up median</th><th>Max up ≥ +100 %</th><th>Won</th><th>Booked avg</th><th>Booked median</th><th>t</th><th>Total ₹</th></tr></thead>
      <tbody>${tk.length ? tk.map(p => `<tr><td><b>${esc(p.pod)}</b></td><td>${esc(p.status)}</td><td>${num(p.trades)} / ${num(p.gate_at)}</td><td>${sg(p.max_up_mean)}</td><td>${sg(p.max_up_median)}</td><td>${pc(p.max_up_100 == null ? null : p.max_up_100 * 100, 0)}</td><td>${pc(p.won == null ? null : p.won * 100, 0)}</td><td>${sg(p.mean_pct)}</td><td>${sg(p.median_pct)}</td><td>${p.t == null ? "—" : num(p.t, 2)}</td><td class="${p.total_rs < 0 ? "down" : "up"}">₹${num(p.total_rs)}</td></tr>`).join("")
        : `<tr><td colspan="11" style="text-align:left"><span class="muted">${esc((D.g1 || {}).error || "G1 paper is not reporting yet.")}</span></td></tr>`}</tbody></table></div>`;
    h += `<h2>Recorder health <small>nightly at 19:30 IST, GitHub Actions</small></h2>`;
    if (!rec) h += `<p class="empty">No recorder run yet.</p>`;
    else {
      const u = rec.underlyings || {};
      h += `<div class="kv"><div><small>Last run</small><b>${esc((rec.run_at || "").replace("T", " ").slice(0, 16))}</b></div><div><small>Session</small><b>${day(rec.session)}</b></div>
        <div><small>Contracts</small><b>${num(rec.contracts)}</b></div><div><small>API calls</small><b>${num(rec.calls)}</b></div>
        <div><small>Runtime</small><b>${num((rec.runtime_s || 0) / 60, 1)} min</b></div><div><small>Failures</small><b class="${(rec.failures || []).length ? "down" : "up"}">${(rec.failures || []).length}</b></div></div>
        <div class="tw" style="margin-top:8px"><table><thead><tr><th>Underlying</th><th>Spot close</th><th>Contracts</th><th>Rows</th><th>Expiries</th></tr></thead><tbody>${Object.entries(u).map(([k, v]) =>
          `<tr><td><b>${esc(k)}</b></td><td>${num(v.spot, 2)}</td><td>${num(v.contracts)}</td><td>${num(v.rows)}</td><td>${(v.expiries || []).map(day).join(", ") || "—"}</td></tr>`).join("")}</tbody></table></div>
        ${(rec.failures || []).length ? `<details><summary>Failures (${rec.failures.length})</summary><p class="note">${rec.failures.slice(0, 20).map(esc).join("<br>")}</p></details>` : ""}`;
    }
    $("#main").innerHTML = h;
  }
  render();
  const load = () => Promise.all([get("/api/index/status"), get("/api/index/g1"), get("/api/index/xp"), get("/api/index/nt"), get("/api/index/nt_sensex")])
    .then(([s, g, x, n, ns]) => { D = { loaded: true, status: s, g1: g, xp: x, nt: n, nts: ns }; render(); });
  load(); setInterval(() => { if (!document.hidden) Promise.all([get("/api/index/g1"), get("/api/index/xp"), get("/api/index/nt"), get("/api/index/nt_sensex")]).then(([g, x, n, ns]) => { if (g) D.g1 = g; if (x) D.xp = x; if (n) D.nt = n; if (ns) D.nts = ns; render(); }); }, 15000);
})();
</script>
</body>
</html>
