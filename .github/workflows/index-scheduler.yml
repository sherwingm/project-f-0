name: Index job scheduler
# Backup for the index-data job queue (data/index/job_queue.json on main): every index-jobs and recorder run starts the
# next queued job when it ends (scripts/index_handoff.sh), because GitHub's cron is unreliable (2026-10-20: this hourly
# schedule fired once in 8 hours). This hourly run only catches a hand-off that was skipped.
# Every hour: if no index-data run is active (index-jobs.yml or the recorder; they share a concurrency group, where a
# second waiting run would cancel the first), pop one job and dispatch it to index-jobs.yml. On weekdays from 19:15 IST
# until that day's recorder run has started, it waits, so the recorder (whose cron can start hours late) never queues
# behind a five-hour backfill or gets cancelled. A backfill that stops on its time budget re-queues itself (index-jobs.yml).
on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: index-scheduler
  cancel-in-progress: false
jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Start the next queued job if index-data is free (backup for the hand-off at the end of each run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/index_handoff.sh 0
