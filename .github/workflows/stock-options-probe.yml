name: stock-options-probe
# Manual, read-only: Upstox expired stock options. probe_stock_expired prints what exists; fetch_band_minutes pulls the
# S1 v10 Rs 0.50-1 contracts' day-0 1-minute candles as a run artifact. Commits nothing; separate from the index-data queue.
on:
  workflow_dispatch:
    inputs:
      script:
        description: "index_data module to run (probe_stock_expired or fetch_band_minutes)"
        required: true
        default: probe_stock_expired
        type: choice
        options: [probe_stock_expired, fetch_band_minutes, probe_old_options, fetch_results_minutes]
      args:
        description: "arguments for the script (fetch_band_minutes: 050 or 12)"
        required: false
        default: ""
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-server.txt pyarrow
      - name: Probe
        env:
          UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
          KOTAK_CONSUMER_KEY: ${{ secrets.KOTAK_CONSUMER_KEY }}
        run: python -m index_data.${{ inputs.script }} ${{ inputs.args }}
      - if: inputs.script == 'fetch_band_minutes' || inputs.script == 'fetch_results_minutes'
        uses: actions/upload-artifact@v4
        with:
          name: band050-minutes
          path: |
            data/results/S1_v10_band*_minutes.csv
            data/results/S1_intraday_minutes.csv
