name: stock-options-probe
# Manual, read-only: Upstox expired stock options. probe_stock_expired prints what exists; fetch_band_minutes pulls the
# S1 v10 Rs 0.50-1 contracts' day-0 1-minute candles as a run artifact. Commits nothing; separate from the index-data queue.
on:
  workflow_dispatch:
    inputs:
      script:
        description: "index_data module to run (probe_stock_expired or fetch_band_minutes)"
        required: true
        default: probe_stock_expired
        type: choice
        options: [probe_stock_expired, fetch_band_minutes]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas pyarrow
      - name: Probe
        env:
          UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
        run: python -m index_data.${{ inputs.script }}
      - if: inputs.script == 'fetch_band_minutes'
        uses: actions/upload-artifact@v4
        with:
          name: band050-minutes
          path: data/results/S1_v10_band050_minutes.csv
