name: Daily F&O scan
# Runs after NSE publishes the F&O bhavcopy and eod2_data has synced (≈ 20:30 IST, Mon–Fri): fetches the day's
# exchange events, rebuilds the scan and commits docs/index.html + data/scan.json, so GitHub Pages serves the
# fresh page and the live server (SCAN_URL) picks it up at 21:00 IST.
# The event store (data/events.sqlite, too big to commit daily) lives in the Actions cache; the very first run
# seeds it from the `state-seed` release.
# If NSE refuses the runner and the scan has no F&O data, the job fails before committing: yesterday's page stays
# up and GitHub emails you.
on:
  schedule:
    - cron: "0 15 * * 1-5"      # 15:00 UTC = 20:30 IST
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-scan
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04               # pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt scikit-learn    # scikit-learn: the scan's model block reads data/model.pkl

      - name: Restore the event store
        id: events
        uses: actions/cache/restore@v6
        with:
          path: data/events.sqlite
          key: events-${{ github.run_id }}
          restore-keys: events-
      - name: First run only - seed the event store from the state-seed release
        if: steps.events.outputs.cache-matched-key == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download state-seed --pattern events.sqlite --dir data || echo "no seed release; starting with an empty event store"

      - name: Fetch the day's exchange events (never blocks the build; NSE may refuse runner IPs)
        run: python -m scanner.events.run || true
      - name: Save the event store
        if: always()
        uses: actions/cache/save@v6
        with:
          path: data/events.sqlite
          key: events-${{ github.run_id }}

      - name: Forward paper test, S1 arms A and B (scanner/forward_s1.py; never blocks the build)
        timeout-minutes: 20
        continue-on-error: true
        run: python -m scanner.forward_s1 || true
      - name: S2 short build-up signals of the last session (scanner/s2_live.py; never blocks the build)
        timeout-minutes: 15
        continue-on-error: true
        run: python -m scanner.s2_live || true

      - name: Opening snapshots recorded by the live server (branch paper-state, server/durable.py)
        run: |
          git fetch --depth=1 origin paper-state 2>/dev/null || { echo "no paper-state branch yet"; exit 0; }
          git checkout FETCH_HEAD -- data/live_snapshots 2>/dev/null || echo "no snapshots on paper-state yet"
          git reset -q                                    # keep them as working-tree files; staged below
      - name: Quarterly results numbers for stocks that just reported (never blocks the build)
        timeout-minutes: 20
        continue-on-error: true
        run: python -m scanner.financials --limit 40 || true
      - name: S1 v10 results-day fade signals for the next session (scanner/fade_live.py; never blocks the build)
        timeout-minutes: 15
        continue-on-error: true
        run: python -m scanner.fade_live || true
      - name: Fade shadow tag fd2 (own venv, so the job's pandas is untouched; never blocks the build)
        timeout-minutes: 8
        continue-on-error: true
        env:
          KOTAK_CONSUMER_KEY: ${{ secrets.KOTAK_CONSUMER_KEY }}     # data calls only: the filing day's 1-minute history
        run: |
          python -m venv /tmp/fd2 && /tmp/fd2/bin/pip install -q "kotakneoapi>=3.0.7" pyarrow || exit 0
          /tmp/fd2/bin/python -m scanner.fade_live --fd2 || true
      - name: Build scan (universe + eod2 prices + NSE F&O bhavcopy)
        run: python -m scanner.build
      - name: Refuse a scan without F&O data
        run: |
          python - <<'EOF'
          import json, sys
          m = json.load(open("data/scan.json", encoding="utf-8"))["meta"]
          print("as_of", m.get("as_of"), "| F&O:", m.get("fo_status"), "| strike tables:", m.get("chain_status"))
          sys.exit(0 if m.get("fo_status") == "ok" else "F&O data unavailable (NSE refused the runner?): not committing")
          EOF

      - name: Commit refreshed page
        run: |
          git config user.name "fo-scanner-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/index.html docs/results.html data/scan.json data/event_patterns.json data/cache/fo_universe.txt data/cache/events_status.json
          git add data/financials.json 2>/dev/null || true
          git add data/nse_holidays.json 2>/dev/null || true
          git add data/live_snapshots 2>/dev/null || true
          git add data/forward 2>/dev/null || true
          git add data/s2 docs/s2.html 2>/dev/null || true
          git diff --cached --quiet || git commit -m "scan: $(python -c "import json;print(json.load(open('data/scan.json'))['meta']['as_of'])")"
          git push
