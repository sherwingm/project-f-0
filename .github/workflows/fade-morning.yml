name: Results-day fade signals before the open
# S1 v10 (paper only, strategies/S1_v10_results_day_fade_paper.md): results filed after the nightly scan (late evening,
# early morning) are fetched, and scanner/fade_live.py writes the day's signals into the committed data/scan.json
# (meta.fade), which the live server pulls at 08:40 and 09:05 IST. The run keeps every signal the nightly made (an NSE
# refusal never empties the list). A push restarts the server on Render, so the job never pushes after 08:50 IST.
on:
  schedule:
    - cron: "47 1 * * 1-5"      # 01:47 UTC = 07:17 IST (scheduled runs often start late)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-scan
  cancel-in-progress: false
jobs:
  fade:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt

      - name: Restore the event store
        id: events
        uses: actions/cache/restore@v6
        with:
          path: data/events.sqlite
          key: events-${{ github.run_id }}
          restore-keys: events-
      - name: Cache miss only - seed the event store from the state-seed release
        if: steps.events.outputs.cache-matched-key == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download state-seed --pattern events.sqlite --dir data || echo "no seed release"
      - name: Fetch the latest exchange events (overnight results filings)
        timeout-minutes: 10
        continue-on-error: true
        run: python -m scanner.events.run || true
      - name: Save the event store (only after a cache hit; on a miss the nightly job seeds its own)
        if: always() && steps.events.outputs.cache-matched-key != ''
        uses: actions/cache/save@v6
        with:
          path: data/events.sqlite
          key: events-${{ github.run_id }}

      - name: Fade signals for today, written into data/scan.json
        timeout-minutes: 10
        run: python -m scanner.fade_live --patch-scan
      - name: Fade shadow tag fd2 (own venv; skipped after 08:35 IST; never blocks the push)
        timeout-minutes: 5
        continue-on-error: true
        env:
          KOTAK_CONSUMER_KEY: ${{ secrets.KOTAK_CONSUMER_KEY }}     # data calls only: the filing day's 1-minute history
        run: |
          now=$(TZ=Asia/Kolkata date +%H%M)
          if [ "$now" -ge 0835 ]; then echo "IST $now: too close to the open, fd2 skipped"; exit 0; fi
          python -m venv /tmp/fd2 && /tmp/fd2/bin/pip install -q "kotakneoapi>=3.0.7" pyarrow requests || exit 0
          /tmp/fd2/bin/python -m scanner.fade_live --fd2 --patch-scan || true

      - name: Commit and push (only before 08:50 IST)
        run: |
          now=$(TZ=Asia/Kolkata date +%H%M)
          if [ "$now" -ge 0850 ]; then echo "::warning::IST $now: too close to the open, fade signals NOT pushed"; exit 0; fi
          git config user.name "fo-scanner-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/forward/fade.json data/scan.json data/financials.json data/nse_holidays.json
          git add data/cache/events_status.json data/cache/fo_universe.txt 2>/dev/null || true
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "fade: signals for $(python -c "import json;print(json.load(open('data/forward/fade.json'))['session'])")"
          pushed=0
          for i in 1 2 3 4 5; do
            git pull -q --rebase --autostash origin main && git push -q && { pushed=1; break; }
            git rebase --abort 2>/dev/null || true
            echo "push attempt $i failed (another job pushed meanwhile); retrying"; sleep $((i * 5))
          done
          [ "$pushed" = 1 ] || { echo "push failed after 5 attempts"; exit 1; }
